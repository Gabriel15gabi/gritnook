/* la letra de la hoja: la de la app o una escrita a mano, con el tamaño que le va a cada una */
.hoja-texto{--tam:15px; font-family:var(--letra, var(--sans)); font-size:var(--tam)}
.letra-caveat{--letra:'Caveat', cursive; --tam:23px}
.letra-kalam{--letra:'Kalam', cursive; --tam:16.5px}
.letra-patrick{--letra:'Patrick Hand', cursive; --tam:19px}
.letra-lapiz{--letra:'Shadows Into Light', cursive; --tam:19px}
.hoja-texto.letra-caveat, .hoja-texto.letra-kalam, .hoja-texto.letra-patrick, .hoja-texto.letra-lapiz{padding-top:27px; color:#1F2433}
.hoja-texto.letra-caveat b, .hoja-texto.letra-kalam b{font-weight:700}
.hoja-texto.letra-caveat div[data-b="t1"], .hoja-texto.letra-lapiz div[data-b="t1"]{letter-spacing:0}
.hoja-texto.letra-kalam div[data-b="t1"]{font-size:calc(var(--tam) * 1.4)}
.lb-letra-op{justify-content:space-between; min-width:210px}
/* los desplegables se abren hacia dentro de la hoja: el del papel, a la izquierda; el resto, a la derecha */
.lb-rel:not(.lb-derecha) .lb-pop{left:0; right:auto}
.lb-letra-muestra{font-family:var(--letra, var(--sans)); font-size:calc(var(--tam, 15px) * .95); line-height:1; color:var(--ink)}
.lb-letra-nombre{font:500 12px/1 var(--sans); color:var(--ink-3)}
/* borrar el apunte: arriba a la derecha y en rojo, para que se vea sin buscarlo */
.editor-cab{display:flex; align-items:center; gap:12px}
.editor-cab .editor-titulo{flex:1; min-width:0}
.btn.btn-rojo{flex:0 0 auto; color:var(--riesgo-txt); background:transparent; border-color:color-mix(in srgb, var(--riesgo) 50%, transparent)}
.btn.btn-rojo:hover{background:color-mix(in srgb, var(--riesgo) 12%, transparent); border-color:var(--riesgo); color:var(--riesgo-txt)}
.btn.btn-rojo svg.i{width:14px; height:14px; flex:0 0 14px}
@media (max-width:560px){ .btn.btn-rojo span{display:none} .btn.btn-rojo{width:34px; padding:0} }
/* ══════════════ la bola de papel y la papelera ══════════════ */
.bp-capa{position:fixed; inset:0; z-index:300; background:rgba(8,10,20,.42); backdrop-filter:blur(1.5px); touch-action:none; user-select:none; overflow:hidden}
.bp-hoja{position:fixed; overflow:hidden; border-radius:3px; background:var(--papel-libreta); box-shadow:0 18px 40px -12px rgba(0,0,0,.5); will-change:transform}
.bp-arrugas{position:absolute; inset:0; opacity:0; pointer-events:none;
  background:repeating-linear-gradient(33deg, transparent 0 22px, rgba(0,0,0,.08) 22px 24px, transparent 24px 46px),
             repeating-linear-gradient(-57deg, transparent 0 30px, rgba(255,255,255,.25) 30px 32px, transparent 32px 60px),
             radial-gradient(circle at 40% 35%, transparent 30%, rgba(0,0,0,.18) 100%)}
.bp-bola{position:absolute; left:0; top:0; z-index:2; cursor:grab; touch-action:none; filter:drop-shadow(0 10px 12px rgba(0,0,0,.35)); will-change:transform}
.bp-bola svg{width:100%; height:100%; display:block}
.bp-bola.cogida{cursor:grabbing; filter:drop-shadow(0 22px 20px rgba(0,0,0,.4))}
.bp-bola:focus-visible{outline:3px solid var(--acento); outline-offset:4px; border-radius:50%}
.bp-bola.dentro{z-index:2}
.bp-papelera{position:absolute; pointer-events:none; transform-origin:50% 100%}
.bp-papelera svg{width:100%; height:100%; display:block; overflow:visible}
.bp-papelera.atras{z-index:1}
.bp-papelera.delante{z-index:3}
.bp-pista{position:absolute; left:50%; top:22px; transform:translateX(-50%); z-index:4; padding:10px 16px; border-radius:99px;
  background:var(--surface); color:var(--ink); font:500 14px/1.2 var(--sans); box-shadow:var(--sombra-modal); transition:opacity .2s}
.bp-pista.oculta{opacity:0}
.bp-btns{position:absolute; right:18px; top:18px; z-index:4; display:flex; gap:8px}
.bp-btns .btn{background:var(--surface)}
.bp-canasta{position:absolute; left:50%; top:40%; transform:translate(-50%, -50%); z-index:5; padding:16px 26px; border-radius:18px;
  background:var(--surface); color:var(--ink); font:600 24px/1.1 var(--sans); box-shadow:var(--sombra-modal); animation:bpSale .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bpSale{from{transform:translate(-50%, -50%) scale(.6); opacity:0}}
@media (max-width:640px){ .bp-pista{top:66px; max-width:82vw; text-align:center} .bp-btns{top:14px; right:12px} }

/* el «−» de cada apunte en la lista: solo aparece al pasar por encima */
.pn-item{position:relative}
.pn-item[hidden]{display:none}
.pn-item .pn-fila{padding-right:34px}
.pn-quitar{position:absolute; right:6px; top:50%; transform:translateY(-50%) scale(.8); width:24px; height:24px; display:grid; place-items:center;
  padding:0; border:0; border-radius:50%; background:transparent; color:var(--riesgo-txt); cursor:pointer; opacity:0; transition:opacity .15s, transform .15s, background .15s}
.pn-quitar svg{width:14px; height:14px}
.pn-item:hover .pn-quitar, .pn-quitar:focus-visible{opacity:1; transform:translateY(-50%) scale(1)}
.pn-quitar:hover{background:color-mix(in srgb, var(--riesgo) 16%, transparent)}
.pn-quitar:focus-visible{outline:2px solid var(--riesgo); outline-offset:1px}
/* ── los papeles: privacidad, términos y compañía ── */
.lg-lista{display:grid; gap:8px}
.lg-item{display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; text-align:left; cursor:pointer;
  padding:14px 16px; border:0; border-radius:var(--r-l); background:var(--surface-2); color:var(--ink); transition:background .12s, transform .12s}
.lg-item:hover{background:var(--surface-3); transform:translateX(2px)}
.lg-item svg{flex:0 0 auto; color:var(--ink-4)}
.lg-item-txt{display:grid; gap:3px; min-width:0}
.lg-nombre{font:600 14px/1.25 var(--sans)}
.lg-res{font:400 12.5px/1.4 var(--sans); color:var(--ink-3)}
.lg-volver{margin-bottom:16px}
.lg-titulo{font:600 23px/1.2 var(--sans); letter-spacing:-.015em; color:var(--ink); margin:0 0 4px}
.lg-texto{max-width:66ch; color:var(--ink-2); font:400 14px/1.65 var(--sans)}
.lg-texto h3{font:600 15.5px/1.3 var(--sans); color:var(--ink); letter-spacing:-.01em; margin:26px 0 8px}
.lg-texto h3:first-child{margin-top:14px}
.lg-texto p{margin:0 0 12px}
.lg-texto strong{color:var(--ink); font-weight:600}
.lg-texto ul{margin:0 0 12px; padding-left:18px; display:grid; gap:6px}
.lg-texto li{padding-left:2px}
.lg-texto li::marker{color:var(--ink-4)}
.lg-tabla{overflow-x:auto; margin:0 0 16px; border:1px solid var(--line); border-radius:var(--r-m)}
.lg-texto table{border-collapse:collapse; width:100%; font-size:13px}
.lg-texto th{text-align:left; font-weight:600; color:var(--ink); background:var(--surface-2); padding:9px 12px; white-space:nowrap}
.lg-texto td{padding:9px 12px; border-top:1px solid var(--line); vertical-align:top}
.lg-enlace{padding:0; border:0; background:none; cursor:pointer; font:inherit; color:var(--ink);
  text-decoration:underline; text-underline-offset:2px; text-decoration-color:var(--ink-4)}
.lg-enlace:hover{text-decoration-color:var(--ink)}
.lg-ref{color:var(--ink); font-weight:500}
.lg-falta{background:#FEF3C7; color:#92400E; padding:1px 6px; border-radius:4px; font-weight:500; font-size:.92em}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-falta{background:rgba(245,158,11,.18); color:#FBBF24}}
:root[data-theme="dark"] .lg-falta{background:rgba(245,158,11,.18); color:#FBBF24}
@media (max-width:700px){.lg-texto{font-size:14.5px}}
/* la ventana con un papel dentro, y las casillas de la pantalla de entrada */
dialog.dlg-legal{width:min(640px, calc(100vw - 32px)); max-height:min(84vh, 760px); padding:0; border:1px solid var(--line-2);
  border-radius:var(--r-l); background:var(--surface); color:var(--ink); box-shadow:var(--sombra-modal); overflow:hidden}
dialog.dlg-legal::backdrop{background:rgba(0,0,0,.45)}
.dlgl-cab{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px 12px; border-bottom:1px solid var(--line)}
.dlgl-cab h3{margin:0; font:600 16px/1.25 var(--sans); letter-spacing:-.01em}
.dlgl-cuerpo{padding:18px; overflow-y:auto; max-height:calc(min(84vh, 760px) - 58px)}
.ent-legal{margin-top:24px; padding:16px 18px; border-radius:var(--r-l); background:var(--surface-2); display:grid; gap:10px}
.ent-legal .meta{margin:4px 0 0}
.ia-mando .ent-linea span{font-size:14px}
/* la lista de fallos apuntados */
.err-fila{padding:10px 0; border-top:1px solid var(--line)}
.err-fila:first-of-type{border-top:0; padding-top:0}
.err-que{font:500 13.5px/1.45 var(--sans); color:var(--ink); margin-bottom:3px}
.err-pila{margin-top:5px; font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace; color:var(--ink-3); word-break:break-all}
/* ── oposiciones ── */
.opo-cuenta{display:flex; flex-direction:column; align-items:flex-end; gap:2px; text-align:right}
.opo-cuenta b{font:300 44px/1 var(--sans); letter-spacing:-.03em; font-variant-numeric:tabular-nums; color:var(--ink)}
.opo-cuenta span{font:500 12.5px/1.2 var(--sans); color:var(--ink-3)}
.opo-cab-sec{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.opo-montar{margin-bottom:16px}
.opo-pasos{list-style:none; margin:14px 0 0; padding:0; display:grid; gap:10px}
.opo-paso{display:grid; grid-template-columns:30px minmax(0,1fr) auto; align-items:center; gap:14px; padding:12px 14px;
  border-radius:var(--r-l); background:var(--surface-2)}
.opo-paso b{font:600 14px/1.3 var(--sans); color:var(--ink)}
.opo-paso .meta{margin-top:3px}
.opo-num{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font:600 13px/1 var(--sans);
  background:var(--surface); color:var(--ink-2); box-shadow:inset 0 0 0 1px var(--line-2)}
.opo-paso.hecho .opo-num{background:var(--verde); color:var(--on-verde); box-shadow:none}
.opo-paso.hecho b{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--ink-4)}

/* las filas de temas: hoy, se enfrían, flojos */
.opo-lista{display:grid; gap:2px}
.opo-fila{display:grid; grid-template-columns:minmax(0,1fr); grid-auto-flow:column; grid-auto-columns:auto; align-items:center; gap:12px; padding:6px 6px 6px 0;
  border-top:1px solid var(--line)}
.opo-fila:first-child{border-top:0}
.opo-fila-t{display:flex; align-items:center; gap:10px; min-width:0; padding:6px 8px; border:0; border-radius:var(--r-m);
  background:none; color:var(--ink); text-align:left; cursor:pointer; font:inherit}
.opo-fila-t:hover{background:var(--surface-2)}
.opo-n{flex:0 0 auto; min-width:28px; height:24px; padding:0 6px; border-radius:6px; display:grid; place-items:center;
  font:600 12px/1 var(--sans); font-variant-numeric:tabular-nums; background:var(--surface-2); color:var(--ink-2)}
.opo-titulo{font:500 14px/1.35 var(--sans); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.opo-fila-e{font:500 12.5px/1 var(--sans); color:var(--ink-3); white-space:nowrap}
.opo-fila-e.frio{color:#B45309}

/* el temario en rejilla, coloreado por vueltas */
.opo-grupo{font:600 12px/1.3 var(--sans); letter-spacing:.02em; color:var(--ink-3); margin:16px 0 8px}
.opo-grupo:first-of-type{margin-top:4px}
.opo-rejilla{display:grid; grid-template-columns:repeat(auto-fill, minmax(38px,1fr)); gap:6px}
.opo-celda{aspect-ratio:1; border-radius:8px; border:0; display:grid; place-items:center; cursor:pointer;
  font:600 12.5px/1 var(--sans); font-variant-numeric:tabular-nums; transition:transform .12s, box-shadow .12s; position:relative}
.opo-celda:hover{transform:translateY(-2px)}
.opo-celda:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.opo-e-nada{background:var(--surface-2); color:var(--ink-3); box-shadow:inset 0 0 0 1px var(--line)}
.opo-cuerpo{display:grid; gap:14px}
.opo-cuerpo > .resumen-mod{margin:0}
/* la 1.ª vuelta, un contorno; la 2.ª, relleno a medias; la 3.ª, lleno: se
   distinguen por la forma y no solo por un tono que en oscuro se confunde */
.opo-e-v1{background:color-mix(in srgb, var(--acento, #7C6CF0) 14%, var(--surface)); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--acento, #7C6CF0)}
.opo-e-v2{background:color-mix(in srgb, var(--acento, #7C6CF0) 55%, var(--surface)); color:var(--ink)}
.opo-e-v3{background:var(--acento, #7C6CF0); color:#fff}
.opo-e-dom{background:var(--verde); color:var(--on-verde)}
.opo-celda.frio::after{content:""; position:absolute; top:4px; right:4px; width:7px; height:7px; border-radius:50%;
  background:#F59E0B; box-shadow:0 0 0 2px var(--surface)}
.opo-leyenda{display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:16px; font:500 12.5px/1 var(--sans); color:var(--ink-3)}
.opo-leyenda i{display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:6px}
.opo-leyenda .opo-frio{border-radius:50%; background:#F59E0B; width:8px; height:8px; vertical-align:0}
.rm-barra .opo-e-dom, .rm-barra .opo-e-v1, .rm-barra .opo-e-v2, .rm-barra .opo-e-v3, .rm-barra .opo-e-nada{box-shadow:none}

/* la ficha del tema */
.opo-vueltas{list-style:none; margin:0; padding:0; display:grid; gap:4px}
.opo-vueltas li{display:flex; justify-content:space-between; gap:10px; padding:7px 10px; border-radius:var(--r-m); background:var(--surface-2);
  font:500 13.5px/1.2 var(--sans)}

/* formularios de la sección */
.opo-form{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px; align-items:end}
.opo-form .opo-ancho{grid-column:span 2}
.opo-boton{justify-content:flex-end}
.opo-calc{margin-top:14px; font:400 15px/1.5 var(--sans); color:var(--ink)}
.opo-calc b{font-weight:600}
.opo-err{color:#DC2626}

/* ¿contesto o la dejo en blanco? */
.opo-riesgo{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:10px}
.opo-r{display:grid; gap:4px; padding:12px 14px; border-radius:var(--r-l); background:var(--surface-2)}
.opo-r b{font:600 13px/1.3 var(--sans); color:var(--ink)}
.opo-r span{font:300 22px/1.1 var(--sans); letter-spacing:-.01em; font-variant-numeric:tabular-nums; color:var(--ink)}
.opo-r em{font:500 12.5px/1.2 var(--sans); font-style:normal; color:var(--ink-3)}
.opo-r.si{box-shadow:inset 0 0 0 1.5px var(--verde)}
.opo-r.si em{color:var(--verde-texto)}
.opo-r.no em{color:#DC2626}

/* simulacros */
.opo-graf{width:100%; height:auto; margin-top:10px; overflow:visible}
.opo-graf-eje{stroke:var(--line-2); stroke-width:1}
.opo-graf-corte{stroke:#F59E0B; stroke-width:1.5; stroke-dasharray:5 5}
.opo-graf-txt{font:500 11.5px var(--sans); fill:#D97706}
.opo-graf-eje-txt{font:500 11px var(--sans); fill:var(--ink-4)}
.opo-graf-linea{fill:none; stroke:var(--acento, #7C6CF0); stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round}
.opo-graf-punto{fill:var(--surface); stroke:var(--acento, #7C6CF0); stroke-width:2}
.opo-graf-punto.arriba{fill:var(--verde); stroke:var(--verde)}
.opo-tabla{display:grid; margin-top:10px}
.opo-tr{display:grid; grid-template-columns:minmax(90px,1.1fr) minmax(100px,1.6fr) minmax(90px,1fr) 70px 54px 34px; align-items:center; gap:10px;
  padding:9px 4px; border-top:1px solid var(--line); font:400 13.5px/1.3 var(--sans); color:var(--ink-2)}
.opo-tr span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-variant-numeric:tabular-nums}
.opo-tr b{color:var(--ink); font-weight:600}
.opo-th{border-top:0; font:500 12px/1 var(--sans); color:var(--ink-3)}

/* notas de corte de otros años */
.opo-cortes{display:flex; flex-wrap:wrap; gap:8px}
.opo-corte{display:inline-flex; align-items:center; gap:6px; padding:4px 4px 4px 10px; border-radius:999px; background:var(--surface-2);
  font:500 13px/1 var(--sans); color:var(--ink-2)}
.opo-corte b{color:var(--ink)}
.opo-corte .icono-btn{width:24px; height:24px}

/* la tarjeta en Inicio */
.opo-inicio{display:grid; grid-template-columns:auto minmax(0,1fr); gap:18px 24px; align-items:start; margin-bottom:16px}
.opo-inicio .opo-cuenta{align-items:flex-start; text-align:left}
.opo-inicio-hoy .etq{margin-bottom:8px}

/* en el móvil, la regla general deja la última tarjeta a todo lo ancho, que
   va bien con tres; con cuatro, mejor dos filas de dos */
@media (max-width:560px){ .resumen-mod.cuatro .rm-tile:last-child{grid-column:auto} }
@media (max-width:700px){
  /* la cuenta atrás, en una línea: «95 días para el examen» */
  .cab .opo-cuenta{flex-direction:row; align-items:baseline; gap:8px; text-align:left}
  .opo-cuenta b{font-size:34px}
  .opo-fila-e{display:none}
  .opo-form .opo-ancho{grid-column:1 / -1}
  .opo-tr{grid-template-columns:minmax(80px,1fr) minmax(0,1.2fr) 60px 28px}
  .opo-tr > :nth-child(3), .opo-tr > :nth-child(5){display:none}
  .opo-inicio{grid-template-columns:1fr}
  .opo-paso{grid-template-columns:30px minmax(0,1fr)}
  .opo-paso .btn{grid-column:2; justify-self:start}
}
/* segunda tanda: estudiar un tema, avisos, el reloj del simulacro, la semana y las bolas */
.opo-fila .icono-btn{width:30px; height:30px; color:var(--ink-3)}
.opo-fila .icono-btn:hover{color:var(--ink)}
.opo-hecho{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.banda{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 14px; border-radius:var(--r-l); background:var(--surface-2);
  font:500 14px/1.4 var(--sans); color:var(--ink)}
.banda > span{flex:1 1 220px}
.banda .i{flex:0 0 auto; width:18px; height:18px}
.banda.urgente{background:color-mix(in srgb, #DC2626 9%, var(--surface)); box-shadow:inset 0 0 0 1px color-mix(in srgb, #DC2626 40%, transparent)}
.banda.urgente .i{color:#DC2626}
.banda.pronto, .banda.pasado{background:color-mix(in srgb, #F59E0B 11%, var(--surface)); box-shadow:inset 0 0 0 1px color-mix(in srgb, #F59E0B 45%, transparent)}
.banda.pronto .i, .banda.pasado .i{color:#D97706}
.opo-inicio > .banda{grid-column:1 / -1}
.opo-marcha{display:inline-flex; align-items:center; gap:10px; margin-top:12px; padding:8px 14px; border:0; border-radius:999px; cursor:pointer;
  background:var(--surface-2); color:var(--ink); font:500 13.5px/1 var(--sans)}
.opo-marcha.vivo{background:color-mix(in srgb, var(--acento, #7C6CF0) 13%, var(--surface)); box-shadow:inset 0 0 0 1px var(--acento, #7C6CF0)}
.opo-marcha b{font-variant-numeric:tabular-nums; font-weight:600}
.opo-marcha .i{width:16px; height:16px}
/* dentro de la cuenta atrás de Inicio, que no herede sus números grandes */
.opo-cuenta .opo-marcha span{font:500 13.5px/1 var(--sans); color:var(--ink)}
.opo-cuenta .opo-marcha b{font:600 13.5px/1 var(--sans); letter-spacing:0; color:var(--ink)}
/* las cuatro cifras del resumen: en fila si caben, y si no, dos y dos; nunca tres y una suelta */
.opo-cuerpo{container-type:inline-size}
.resumen-mod.cuatro{grid-template-columns:repeat(4, minmax(0,1fr))}
@container (max-width:760px){ .resumen-mod.cuatro{grid-template-columns:repeat(2, minmax(0,1fr))} }
.opo-crono{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
.opo-crono > div:first-child{flex:1 1 300px; min-width:0}
.opo-crono.vivo{box-shadow:inset 0 0 0 1.5px var(--acento, #7C6CF0)}
.opo-reloj{font:300 64px/1 var(--sans); letter-spacing:-.04em; font-variant-numeric:tabular-nums; margin:10px 0 8px; color:var(--ink)}
.opo-semana{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px}
.opo-sem{display:grid; gap:3px; padding:12px 14px; border-radius:var(--r-l); background:var(--surface-2)}
.opo-sem b{font:300 26px/1.1 var(--sans); letter-spacing:-.02em; font-variant-numeric:tabular-nums; color:var(--ink)}
.opo-sem span{font:500 13px/1.2 var(--sans); color:var(--ink-2)}
.opo-sem em{font:500 12px/1.3 var(--sans); font-style:normal; color:var(--ink-3)}
.opo-bolas{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.opo-bolas:empty{display:none}
.opo-bolas .meta{flex-basis:100%; margin-top:4px}
.opo-bola{display:inline-flex; align-items:center; gap:8px; max-width:100%; padding:5px 12px 5px 5px; border-radius:999px; background:var(--surface-2);
  font:500 13px/1.2 var(--sans); color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.opo-bola b{flex:0 0 auto; min-width:26px; height:26px; padding:0 4px; border-radius:999px; display:grid; place-items:center; background:var(--surface);
  color:var(--ink); font-weight:600; box-shadow:inset 0 0 0 1px var(--line-2)}
.opo-bola.si b{background:var(--verde); color:var(--on-verde); box-shadow:none}
.opo-ficha-datos{display:flex; flex-wrap:wrap; gap:6px 14px; margin:0 0 14px; font:500 12.5px/1.3 var(--sans); color:var(--ink-3)}
.opo-tarj{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto; gap:10px; align-items:end}
.opo-check{align-self:end; min-height:40px}
.opo-pie-temario{margin-top:14px}
.opc{font-weight:400; color:var(--ink-4); margin-left:4px}
/* ── el Inicio en piezas ── */
.inicio-libre{container-type:inline-size; position:relative}
.il-editar{margin-top:12px}
.il-rejilla{display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); grid-auto-rows:8px; column-gap:16px; position:relative}
.il-w{grid-column:var(--x) / span var(--w); grid-row:var(--y) / span var(--h); display:flex; flex-direction:column; min-width:0; position:relative}
.il-w > .panel{flex:1 1 auto; min-height:0; margin:0 0 16px; overflow:auto}
/* editando: los paneles no se tocan por dentro, se mueven */
.inicio-libre.editando .il-w > .panel{pointer-events:none; user-select:none; outline:2px dashed var(--acento-borde); outline-offset:-1px; opacity:.9}
.inicio-libre.editando .il-w:hover > .panel{outline-color:var(--acento)}
.il-barra{position:sticky; top:8px; z-index:8; margin-bottom:14px}
.il-barra .banda{box-shadow:0 6px 24px rgba(0,0,0,.18), inset 0 0 0 1px var(--acento-borde); background:var(--surface)}
.il-ctrl{position:absolute; top:15px; left:17px; right:14px; z-index:3; display:flex; align-items:center; gap:6px; pointer-events:none}
/* el nombre arrastrable ocupa el sitio del título, que se esconde para no leerse doble */
.inicio-libre.editando .il-w > .panel > .panel-cab{visibility:hidden}
.il-ctrl > *{pointer-events:auto}
.il-grip{display:inline-flex; align-items:center; gap:8px; max-width:100%; padding:6px 12px 6px 9px; border-radius:999px; cursor:grab; touch-action:none;
  border:1px solid var(--acento-borde); background:var(--acento-suave); color:var(--acento-txt); font:600 12.5px/1.2 var(--sans);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.il-grip:active{cursor:grabbing}
.il-grip:focus-visible{outline:2px solid var(--acento); outline-offset:2px}
.il-puntos{font-size:15px; line-height:1; opacity:.8}
.il-flechas{display:none; gap:4px}
.il-flechas .icono-btn, .il-quitar{width:30px; height:30px; background:var(--surface); border:1px solid var(--line-2); font:600 14px/1 var(--sans); color:var(--ink-2)}
.il-quitar{margin-left:auto}
.il-quitar .i{width:14px; height:14px}
.il-estirar{position:absolute; right:4px; bottom:20px; z-index:3; width:24px; height:24px; cursor:nwse-resize; touch-action:none; border-radius:6px;
  background:linear-gradient(135deg, transparent 50%, var(--acento) 50%, var(--acento) 58%, transparent 58%, transparent 68%, var(--acento) 68%, var(--acento) 76%, transparent 76%)}
.il-estirar:hover{background-color:var(--acento-suave)}
.il-hueco{grid-column:var(--x) / span var(--w); grid-row:var(--y) / span var(--h); margin-bottom:16px; border-radius:var(--r-l);
  border:2px dashed var(--acento); background:color-mix(in srgb, var(--acento) 8%, transparent); pointer-events:none}
.il-w.arrastrando{z-index:6; cursor:grabbing}
.il-w.arrastrando > .panel{box-shadow:0 18px 48px rgba(0,0,0,.28); opacity:.96}
.il-w.estirando > .panel{outline-color:var(--acento)}
body.il-activo{user-select:none; cursor:grabbing}
.il-ocultos{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:4px}
/* estrecho: uno debajo de otro, en el orden de lectura; se suben, se bajan y se ocultan */
@container (max-width:640px){
  .il-rejilla{display:flex; flex-direction:column}
  .il-w{order:var(--o)}
  .il-w > .panel{flex:none; overflow:visible}
  .il-flechas{display:inline-flex}
  .il-estirar{display:none}
  .il-grip{cursor:default; touch-action:auto}
  .il-puntos{display:none}
}
.ent-caja > .banda{margin-bottom:18px}
/* los avisos del Inicio, con aire entre ellos y con lo de abajo */
#contenido > .banda{margin-bottom:12px}
/* ── entrar en tu cuenta ── */
.acceso{z-index:80}
.acc-caja{max-width:460px}
.acc-tabs{margin:4px 0 18px}
.acc-form{display:grid; gap:14px}
.acc-form .ent-linea{margin-top:2px}
.acc-enviar{justify-self:start; min-width:160px}
.acc-olvido{justify-self:start}
.acc-aviso{min-height:1.3em; margin:0; font:500 13.5px/1.45 var(--sans); color:var(--riesgo-txt)}
.acc-aviso.ok{color:var(--verde-texto)}
.acc-aviso:empty{display:none}
/* ── el panel del creador ── */
.pa-graf{width:100%; height:auto; margin-top:8px}
.pa-barra{fill:var(--acento, #7C6CF0); opacity:.85}
.pa-alta{fill:var(--verde)}
.pa-ley{display:inline-block; width:10px; height:10px; border-radius:3px; margin:0 5px 0 12px; vertical-align:-1px}
.pa-ley-barra{background:var(--acento, #7C6CF0)}
.pa-ley-alta{background:var(--verde); border-radius:50%}
.pa-tabla{display:grid; margin-top:6px; overflow-x:auto}
.pa-tr{display:grid; grid-template-columns:minmax(180px,2.2fr) minmax(90px,1fr) minmax(80px,.9fr) 56px 56px 56px minmax(90px,1fr) 64px; gap:10px; align-items:center;
  min-width:760px; padding:9px 4px; border-top:1px solid var(--line); font:400 13.5px/1.3 var(--sans); color:var(--ink-2)}
.pa-tr span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-variant-numeric:tabular-nums}
.pa-th{border-top:0; font:500 12px/1 var(--sans); color:var(--ink-3)}
.pa-correo{color:var(--ink); font-weight:500}
/* ── tú: tu foto dentro del aro morado de la «o» del logo ── */
.yo-av{--lado:32px; width:var(--lado); height:var(--lado); flex:0 0 var(--lado); box-sizing:border-box; border-radius:50%;
  border:calc(var(--lado) * .085) solid var(--acento-txt); background:var(--acento-suave); color:var(--acento-txt);
  display:grid; place-items:center; overflow:hidden; font:600 calc(var(--lado) * .4)/1 var(--sans); user-select:none}
.yo-av img{width:100%; height:100%; object-fit:cover; display:block}
.yo-av svg{width:58%; height:58%; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round}
.yo-av.peq{--lado:30px}
.yo-av.med{--lado:42px}
.yo-av.grande{--lado:116px}
.riel-yo{margin-top:4px}
.riel-yo[aria-expanded="true"]{color:var(--ink); background:var(--surface)}
.cab-yo{display:none}
@media (max-width:880px){
  .cab-yo{display:grid; place-items:center; width:40px; height:40px; padding:0; border:0; border-radius:50%; background:none; cursor:pointer}
  .cab-yo:focus-visible{outline:2px solid var(--acento); outline-offset:1px}
}
.yo-menu{position:fixed; z-index:75; width:264px; max-width:calc(100vw - 16px); box-sizing:border-box; padding:6px; border-radius:14px;
  background:var(--surface); border:1px solid var(--line-2); box-shadow:var(--sombra-modal); animation:ymEntra .14s ease-out}
.yo-menu[hidden]{display:none}
@keyframes ymEntra{from{opacity:0; transform:translateY(4px)}}
.ym-cab{display:flex; align-items:center; gap:11px; padding:10px 10px 12px; margin-bottom:4px; border-bottom:1px solid var(--line)}
.ym-quien{min-width:0; display:flex; flex-direction:column; gap:4px}
.ym-quien b{font:600 14px/1.2 var(--sans); color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ym-quien span{font:400 12.5px/1.2 var(--sans); color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ym-item{display:flex; align-items:center; gap:10px; width:100%; height:38px; padding:0 10px; border:0; border-radius:9px; background:none;
  color:var(--ink-2); font:500 13.5px/1 var(--sans); text-align:left; cursor:pointer}
.ym-item svg{width:16px; height:16px; flex:0 0 16px}
.ym-item:hover, .ym-item:focus-visible{background:var(--surface-2); color:var(--ink); outline:none}
.ym-item:focus-visible{box-shadow:inset 0 0 0 2px var(--acento)}
.ym-sep{height:1px; background:var(--line); margin:4px 6px}
.pf{display:grid; justify-items:center; gap:14px; text-align:center; padding:4px 0 2px}
.pf-foto{position:relative}
.pf-cam{position:absolute; right:0; bottom:2px; width:36px; height:36px; display:grid; place-items:center; padding:0; border-radius:50%;
  border:3px solid var(--surface); background:var(--acento); color:#FFFFFF; cursor:pointer}
.pf-cam svg{width:17px; height:17px}
.pf-cam:focus-visible{outline:2px solid var(--acento-txt); outline-offset:2px}
.pf-recorte{width:240px; height:240px; border-radius:50%; overflow:hidden; background:var(--surface-2);
  box-shadow:0 0 0 7px var(--acento-txt); margin:8px 0 4px}
.pf-recorte canvas{display:block; width:240px; height:240px; cursor:grab; touch-action:none}
.pf-recorte canvas:active{cursor:grabbing}
.pf-recorte canvas:focus-visible{outline:3px solid var(--acento); outline-offset:-3px; border-radius:50%}
.pf-zoom{width:min(260px,100%); text-align:left}
.pf-nombre{width:min(320px,100%); text-align:left}
.pf-btns{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.pf-nota{margin:0; max-width:38ch}
.aj-yo{display:flex; align-items:center; gap:14px; margin:0 0 18px; padding-bottom:18px; border-bottom:1px solid var(--line)}
.aj-yo > div{flex:1; min-width:0}
.aj-yo .meta{margin:4px 0 0}
.cf-info{margin:0; padding:12px 14px; border-radius:var(--r-m); background:var(--surface-2); color:var(--ink-2);
  font:400 12px/1.55 var(--mono, ui-monospace, monospace); white-space:pre-wrap; word-break:break-word; max-height:180px; overflow:auto}
.sel-tema{margin-top:8px}
@media (max-width:700px){
  .opo-semana{grid-template-columns:repeat(2, minmax(0,1fr))}
  .opo-reloj{font-size:52px}
  .opo-tarj{grid-template-columns:minmax(0,1fr)}
  .opo-tarj .btn{justify-self:start}
  /* en el móvil, «Vuelta hecha» se queda en «+»: el título del tema necesita el sitio */
  .opo-fila .opo-bt{display:none}
  .opo-fila .btn.mini{padding-inline:10px}
  .opo-sem b{font-size:22px}
}
/* ══════════════════ capa de pulido (lanzamiento) ══════════════════
   La paleta es la de siempre (Nocturne). Lo que cambia es la profundidad,
   el tacto y el movimiento: superficies con volumen, botones que se hunden
   al pulsar, secciones que entran en cascada. Todo el movimiento se apaga
   si el sistema pide «reducir movimiento». */
:root{
  --pronto:#C2410C; --pronto-suave:#FFEDD5; --pronto-borde:#FDBA74;
  --on-acento:#f3f5fe;
  --sombra-panel:inset 0 1px 0 rgba(255,255,255,.65), 0 14px 34px -26px rgba(41,43,49,.38);
  --ease:cubic-bezier(.2,.7,.2,1); --ease-salto:cubic-bezier(.3,1.35,.5,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --pronto:#FDBA74; --pronto-suave:rgba(251,146,60,.13); --pronto-borde:rgba(251,146,60,.4);
  --on-acento:#161826;
  --sombra-panel:inset 0 1px 0 rgba(255,255,255,.045), 0 18px 40px -28px rgba(0,0,0,.85);
}}
:root[data-theme="dark"]{
  --pronto:#FDBA74; --pronto-suave:rgba(251,146,60,.13); --pronto-borde:rgba(251,146,60,.4);
  --on-acento:#161826;
  --sombra-panel:inset 0 1px 0 rgba(255,255,255,.045), 0 18px 40px -28px rgba(0,0,0,.85);
}
::selection{background:color-mix(in srgb, var(--acento) 32%, transparent)}
html{scrollbar-width:thin; scrollbar-color:var(--line-2) transparent}
body{background-image:
  radial-gradient(1100px 680px at 105% -12%, color-mix(in srgb, var(--acento) 10%, transparent), transparent 62%),
  radial-gradient(900px 620px at -12% 108%, color-mix(in srgb, var(--mod-0, #3B82F6) 6%, transparent), transparent 60%),
  var(--fondo-luz, none)}

/* ── superficies ── */
.panel{border-radius:18px; border-color:color-mix(in srgb, var(--line-2) 82%, transparent);
  background:linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--surface) 90%, var(--bg))); box-shadow:var(--sombra-panel)}
.titulo{font-weight:600; letter-spacing:-.035em}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font:600 11.5px/1 var(--sans); letter-spacing:.08em; text-transform:uppercase; color:var(--acento-txt)}
.eyebrow::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--acento); box-shadow:0 0 0 4px color-mix(in srgb, var(--acento) 18%, transparent)}

/* ── botones: el principal, relleno del acento; todos, con tacto ── */
.btn{border-radius:10px; transition:transform .16s var(--ease), background .16s, border-color .16s, box-shadow .16s, color .16s}
.btn:hover{border-color:var(--acento-borde)}
.btn.pulsado, .riel-item.pulsado, .bm-item.pulsado, .cc-enviar.pulsado{transform:scale(.96)}
.btn.primario{background:linear-gradient(180deg, color-mix(in srgb, var(--acento) 86%, #fff), var(--acento)); border-color:transparent; color:var(--on-acento); font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24), 0 8px 18px -10px color-mix(in srgb, var(--acento) 85%, transparent)}
.btn.primario:hover{background:linear-gradient(180deg, color-mix(in srgb, var(--acento) 76%, #fff), color-mix(in srgb, var(--acento) 92%, #fff)); color:var(--on-acento); border-color:transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 12px 24px -10px color-mix(in srgb, var(--acento) 90%, transparent)}
.btn.primario:disabled{opacity:.6; cursor:default; transform:none}
.btn.primario.verde{box-shadow:none}
input[type=text],input[type=date],input[type=number],input[type=url],input[type=email],input[type=password],input[type=search],select,textarea{border-radius:10px}
input[type=search]{width:100%; height:36px; padding:0 11px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink); font:400 14px/1.4 var(--sans)}
input:focus,select:focus,textarea:focus{border-color:var(--acento); box-shadow:0 0 0 4px var(--ring)}

/* ── el riel y la barra del móvil ── */
@media (min-width:881px){
  .riel{background:color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter:blur(10px)}
  .riel-item svg{transition:transform .22s var(--ease-salto)}
  .riel-item:hover svg{transform:translateY(-1px) scale(1.05)}
  .riel-item[aria-current="page"]{background:linear-gradient(180deg, var(--acento-suave), color-mix(in srgb, var(--acento-suave) 55%, transparent)); box-shadow:inset 0 0 0 1px var(--acento-borde)}
  .riel-item[aria-current="page"]::before{animation:rielMarca .32s var(--ease)}
}
@keyframes rielMarca{from{transform:scaleY(0)}}
/* lo que viene: separado del resto, con su «Próximamente» en naranja */
.riel-pronto{display:flex; flex-direction:column; align-items:center; gap:2px; width:100%; margin-top:6px; padding-top:10px; border-top:1px solid var(--line)}
.riel-item.es-pronto .rt{color:var(--ink-2)}
.riel-item.es-pronto svg.ri, .riel-item.es-pronto svg.i{color:var(--ink-3)}
.riel-pronto-tag{display:block; max-width:100%; margin-top:-1px; font:600 9px/1 var(--sans); letter-spacing:.01em; color:var(--pronto); white-space:nowrap}
.pronto{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:99px; font:600 11px/1.2 var(--sans); color:var(--pronto);
  background:var(--pronto-suave); box-shadow:inset 0 0 0 1px var(--pronto-borde); white-space:nowrap}
.pronto::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--pronto); animation:latido 2.2s ease-in-out infinite}
.pronto.grande{font-size:12.5px; padding:5px 12px}
@keyframes latido{0%,100%{transform:scale(1); opacity:1} 50%{transform:scale(1.5); opacity:.55}}
.hm-grupo{margin:14px 4px 6px; font:600 11px/1 var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-4)}
.hm-m.es-pronto{color:var(--pronto); font-weight:600}
@media (max-width:880px){
  .barra-movil{background:color-mix(in srgb, var(--surface) 84%, transparent); backdrop-filter:saturate(1.5) blur(16px); -webkit-backdrop-filter:saturate(1.5) blur(16px)}
  .lateral{background:color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter:saturate(1.5) blur(16px); -webkit-backdrop-filter:saturate(1.5) blur(16px)}
  .bm-item svg{transition:transform .24s var(--ease-salto)}
  .bm-item[aria-current="page"] svg{transform:translateY(-2px) scale(1.07)}
  .hm-panel{animation:hmSube .28s var(--ease-salto)}
}

/* ── ventanas y avisos ── */
dialog[open]{animation:dlgEntra .24s var(--ease)}
dialog[open]::backdrop{backdrop-filter:blur(6px); animation:fondoEntra .24s ease-out}
@keyframes dlgEntra{from{opacity:0; transform:translateY(10px) scale(.98)}}
@keyframes fondoEntra{from{opacity:0}}
.toast{border-radius:12px; animation:toastEntra .34s var(--ease-salto)}
@keyframes toastEntra{from{opacity:0; transform:translateY(12px) scale(.96)}}

/* ── al entrar en una sección: en cascada ── */
@keyframes entra{from{opacity:0; transform:translateY(14px)}}
@keyframes crece{from{transform:scaleX(0)}}
#contenido.entrando > *{animation:entra .46s var(--ease) both}
#contenido.entrando > :nth-child(2){animation-delay:.05s}
#contenido.entrando > :nth-child(3){animation-delay:.1s}
#contenido.entrando > :nth-child(4){animation-delay:.15s}
#contenido.entrando > :nth-child(n+5){animation-delay:.2s}
#contenido.entrando :is(.rejilla-12, .pila, .hojas, .pr-puntos, .hd-datos) > *{animation:entra .5s var(--ease) both}
#contenido.entrando :is(.rejilla-12, .pila, .hojas, .pr-puntos, .hd-datos) > :nth-child(2){animation-delay:.07s}
#contenido.entrando :is(.rejilla-12, .pila, .hojas, .pr-puntos, .hd-datos) > :nth-child(3){animation-delay:.14s}
#contenido.entrando :is(.rejilla-12, .pila, .hojas, .pr-puntos, .hd-datos) > :nth-child(4){animation-delay:.21s}
#contenido.entrando :is(.rejilla-12, .pila, .hojas, .pr-puntos, .hd-datos) > :nth-child(n+5){animation-delay:.28s}
#contenido.entrando .medidor > i, #contenido.entrando .hd-progreso i::after{transform-origin:left; animation:crece .9s var(--ease) .2s both}

/* ══ Inicio: tu día ══ */
.hd{position:relative; isolation:isolate; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:28px; align-items:stretch; margin-bottom:14px;
  padding:28px 30px; border-radius:24px; overflow:hidden; border:1px solid color-mix(in srgb, var(--acento-borde) 70%, var(--line-2));
  background:radial-gradient(760px 320px at -6% -20%, color-mix(in srgb, var(--acento) 18%, transparent), transparent 62%),
    radial-gradient(520px 300px at 108% 120%, color-mix(in srgb, var(--mod-0, #3B82F6) 12%, transparent), transparent 60%),
    linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--surface) 88%, var(--bg)));
  box-shadow:var(--sombra-panel)}
/* la anilla del logo, grande y de fondo */
.hd::after{content:""; position:absolute; z-index:-1; right:-70px; top:-110px; width:280px; height:300px; border-radius:50%;
  border:34px solid color-mix(in srgb, var(--acento-txt) 9%, transparent); animation:flotaLento 16s ease-in-out infinite}
@keyframes flotaLento{0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(-10px,12px) rotate(6deg)}}
.hd-fecha{display:flex; align-items:center; gap:8px; font:500 13px/1 var(--sans); color:var(--ink-3)}
.hd-fecha time{font-variant-numeric:tabular-nums; color:var(--acento-txt); font-weight:600}
.hd-tit{margin:12px 0 10px; font:500 clamp(25px, 3vw, 36px)/1.15 var(--sans); letter-spacing:-.03em; text-wrap:balance}
.hd-tit b{font-weight:650; background:linear-gradient(92deg, var(--acento-txt), color-mix(in srgb, var(--acento-txt) 45%, var(--pronto))); -webkit-background-clip:text; background-clip:text; color:transparent}
.hd-sub{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:0; max-width:64ch; font:400 15px/1.55 var(--sans); color:var(--ink-2)}
.hd-motivo{color:var(--ink-3)}
.hd-libre{color:var(--acento-txt)}
.hd-vence{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:99px; font:500 12.5px/1.3 var(--sans); color:var(--aviso-txt);
  background:color-mix(in srgb, var(--aviso) 12%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--aviso) 30%, transparent)}
.hd-progreso{display:flex; align-items:center; gap:12px; margin-top:16px}
.hd-progreso .meta{white-space:nowrap}
.hd-progreso i{position:relative; flex:0 1 340px; height:8px; border-radius:99px; background:color-mix(in srgb, var(--surface-3) 80%, transparent); overflow:hidden}
.hd-progreso i::after{content:""; position:absolute; inset:0 auto 0 0; width:var(--p); border-radius:inherit; background:linear-gradient(90deg, var(--acento), var(--acento-txt))}
.hd-acc{display:flex; flex-wrap:wrap; gap:10px; margin-top:18px}
.hd-acc .il-editar{margin:0}
.hd-tiempo{position:relative; width:300px; display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:14px; padding:16px 18px 22px;
  border-radius:18px; border:1px solid color-mix(in srgb, var(--line-2) 80%, transparent);
  background:color-mix(in srgb, var(--surface-2) 62%, transparent); backdrop-filter:blur(8px)}
.hd-tiempo.vacio, .hd-tiempo.mal{grid-template-columns:auto minmax(0,1fr); align-content:center}
.hd-tiempo.vacio .btn, .hd-tiempo.mal .btn{grid-column:1 / -1; justify-self:start}
.hdt-txt{display:flex; flex-direction:column; gap:3px; min-width:0}
.hdt-fila{display:flex; align-items:baseline; gap:8px}
.hdt-temp{font:600 36px/1 var(--sans); letter-spacing:-.04em}
.hdt-desc{font:500 13.5px/1.2 var(--sans); color:var(--ink-2)}
.hdt-lugar{justify-self:start; align-self:flex-start; padding:0; border:0; background:none; font:600 13px/1.3 var(--sans); color:var(--acento-txt); cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px}
.hdt-consejo{margin-top:4px; font:400 12.5px/1.4 var(--sans); color:var(--ink-2)}
.hdt-fuente{position:absolute; right:12px; bottom:6px; font:400 10.5px/1 var(--sans); color:var(--ink-4); text-decoration:none}
.hdt-fuente:hover{color:var(--ink-3)}
.hdt-hueco{display:block; width:120px; height:12px; border-radius:6px; background:linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size:200% 100%; animation:brilloHueco 1.2s linear infinite}
.hdt-hueco.g{width:56px; height:56px; border-radius:50%}
.hdt-hueco.c{width:80px}
@keyframes brilloHueco{to{background-position:-200% 0}}
/* los dibujos del tiempo */
.t-ico{width:62px; height:62px; flex:0 0 62px; overflow:visible}
.t-sol circle{fill:#FBBF24}
.t-rayos path{stroke:#FBBF24; stroke-width:3.4; stroke-linecap:round}
.t-rayos{transform-origin:32px 32px; animation:gira 26s linear infinite}
.t-luna{fill:var(--acento-txt)}
.t-nube{fill:color-mix(in srgb, var(--ink) 10%, var(--surface)); stroke:color-mix(in srgb, var(--ink) 28%, transparent); stroke-width:1.4; animation:nubeFlota 7s ease-in-out infinite}
.t-nube.atras{opacity:.55; animation-delay:-3s}
.t-gotas path{stroke:#60A5FA; stroke-width:3; stroke-linecap:round; animation:gota 1.15s linear infinite; animation-delay:calc(var(--i) * .33s)}
.t-copos circle{fill:#BFDBFE; animation:copo 2.2s linear infinite; animation-delay:calc(var(--i) * .6s)}
.t-rayo{fill:#FACC15; animation:destello 3.4s ease-in-out infinite}
.t-niebla path{stroke:var(--ink-3); stroke-width:3; stroke-linecap:round; animation:niebla 5s ease-in-out infinite alternate}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes nubeFlota{0%,100%{transform:translateX(0)} 50%{transform:translateX(3px)}}
@keyframes gota{0%{transform:translateY(-5px); opacity:0} 25%{opacity:1} 100%{transform:translateY(9px); opacity:0}}
@keyframes copo{0%{transform:translateY(-6px); opacity:0} 30%{opacity:1} 100%{transform:translate(3px,8px); opacity:0}}
@keyframes destello{0%,70%,100%{opacity:1} 74%{opacity:.25} 78%{opacity:1} 82%{opacity:.4}}
@keyframes niebla{from{transform:translateX(-3px)} to{transform:translateX(3px)}}
/* los tres datos, debajo */
.hd-datos{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:22px}
.hd-dato{display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:16px; border:1px solid color-mix(in srgb, var(--line-2) 80%, transparent);
  background:linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--surface) 90%, var(--bg))); box-shadow:var(--sombra-panel)}
.hd-dato-ico{width:38px; height:38px; flex:0 0 38px; display:grid; place-items:center; border-radius:12px; color:var(--c); background:color-mix(in srgb, var(--c) 15%, transparent)}
.hd-dato-ico svg{width:19px; height:19px}
.hd-dato .cifra{font:600 26px/1 var(--sans); letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.hd-dato > span:last-child{display:flex; flex-direction:column; gap:3px}
@media (max-width:980px){
  .hd{grid-template-columns:minmax(0,1fr); padding:22px 20px; gap:18px}
  .hd-tiempo{width:auto}
}
@media (max-width:560px){
  .hd-datos{grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
  .hd-dato{flex-direction:column; align-items:flex-start; gap:8px; padding:12px}
  .hd-dato .meta{font-size:11.5px}
  .hd-tit{font-size:24px}
}

/* ══ casillero: libretas con anillas, a tu color ══ */
.estanteria{gap:58px 26px; padding:30px 12px 22px}
.lb-hueco{--w:148px; --h:204px; --d:30px; padding-top:18px}
/* la balda: de un hueco al siguiente, sin cortes */
.lb-hueco::before{content:""; position:absolute; z-index:0; left:-13px; right:-13px; bottom:-20px; height:15px; border-radius:3px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--surface-3) 70%, var(--surface)) 0 38%, color-mix(in srgb, var(--surface-3) 70%, #000) 39% 100%);
  box-shadow:0 12px 18px -10px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12)}
.lb-hueco::after{bottom:-10px; z-index:1; transition:transform .45s var(--ease), opacity .45s}
.lb-hueco:hover::after{transform:scaleX(.82); opacity:.65}
.libro{z-index:2}
.lb-cuerpo{transition:transform .5s var(--ease)}
.libro:hover .lb-cuerpo, .libro:focus-visible .lb-cuerpo{transform:rotateY(-8deg) rotateX(3deg) translateY(-11px)}
.lb-tapa{padding:18px 24px 14px 24px;
  background:
    linear-gradient(100deg, rgba(0,0,0,.30) 0 6.5%, rgba(255,255,255,.07) 8.5%, transparent 14%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.04) 0 2px, transparent 2px 4px),
    radial-gradient(130% 95% at 28% 8%, color-mix(in srgb, var(--c) 80%, #fff), var(--c) 52%, color-mix(in srgb, var(--c) 74%, #000));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12), inset -2px 0 0 rgba(0,0,0,.12), 10px 12px 26px rgba(0,0,0,.34);
  transition:transform .55s var(--ease), box-shadow .25s}
/* el lomo con las anillas de la «o» del logo */
.lb-lomo{width:14px; background:linear-gradient(90deg, rgba(0,0,0,.34), rgba(0,0,0,.08)); overflow:visible}
.lb-lomo i{position:absolute; left:-6px; width:15px; height:8px; border-radius:5px; border:2.2px solid rgba(232,232,242,.92); border-left-color:transparent;
  box-shadow:1px 1px 1px rgba(0,0,0,.35), inset 0 0 0 .5px rgba(0,0,0,.2)}
.lb-lomo i:nth-child(1){top:14%} .lb-lomo i:nth-child(2){top:36%} .lb-lomo i:nth-child(3){top:58%} .lb-lomo i:nth-child(4){top:80%}
.lb-sim{width:46px; height:46px; border-radius:13px; background:rgba(255,255,255,.18); box-shadow:inset 0 0 0 1px rgba(255,255,255,.26), 0 4px 10px -4px rgba(0,0,0,.35)}
.lb-sim svg.sim{width:27px; height:27px}
.lb-cod{margin:12px 0 6px; letter-spacing:.1em}
/* la etiqueta de papel: se lee con cualquier color de tapa */
.lb-nombre{display:block; align-self:stretch; padding:6px 8px; border-radius:5px; background:linear-gradient(180deg, #FBF9F3, #EFEBDF); color:#2A2A33; text-shadow:none;
  font:600 12.5px/1.22 var(--sans); box-shadow:0 1px 2px rgba(0,0,0,.28), inset 0 0 0 1px rgba(0,0,0,.06); -webkit-line-clamp:unset}
.lb-nombre > span{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; hyphens:auto}
.lb-cuenta{margin-top:10px; background:rgba(0,0,0,.26)}
.lb-goma{position:absolute; top:-1px; bottom:-1px; right:13px; width:7px; background:linear-gradient(90deg, rgba(0,0,0,.4), color-mix(in srgb, var(--c) 35%, #111) 45%, rgba(0,0,0,.45));
  box-shadow:1px 0 2px rgba(0,0,0,.35)}
.lb-brillo{position:absolute; inset:0; pointer-events:none; background:linear-gradient(105deg, transparent 32%, rgba(255,255,255,.26) 46%, transparent 60%); transform:translateX(-130%)}
.libro:hover .lb-brillo, .libro:focus-visible .lb-brillo{transform:translateX(130%); transition:transform 1s var(--ease)}
.libro.clara{color:#1F2330}
.libro.clara .lb-sim{background:rgba(0,0,0,.08); box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.libro.clara .lb-cuenta{background:rgba(0,0,0,.12)}
.libro.clara .lb-cod{opacity:.72}
/* abrir: la tapa gira del todo y las hojas se abren en abanico */
.libro.abriendo .lb-cuerpo{transform:rotateY(-2deg) translateY(-14px) scale(1.06)}
.libro.abriendo .lb-tapa{transform:translateZ(calc(var(--d) / 2)) rotateY(-155deg); box-shadow:none}
.libro.abriendo .lb-folio{transition:transform .5s var(--ease); transform:translateZ(calc(var(--i) * 5px - 5px)) translateY(-16px) rotate(calc(var(--i) * 14deg - 14deg))}
/* entrar en el casillero: las libretas llegan a la balda una tras otra */
#contenido.entrando .lb-hueco{animation:libroLlega .62s var(--ease) both; animation-delay:calc(var(--i) * 55ms)}
@keyframes libroLlega{from{opacity:0; transform:translateY(26px) rotate(-3deg)}}
/* pintar: un destello de color sobre la tapa */
.lb-hueco.pintada .lb-tapa::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:radial-gradient(circle at 60% 40%, rgba(255,255,255,.55), transparent 62%); animation:salpica .8s var(--ease) both}
.lb-hueco.pintada .lb-cuerpo{animation:sacude .6s var(--ease-salto)}
@keyframes salpica{from{opacity:1; transform:scale(.2)} to{opacity:0; transform:scale(1.6)}}
@keyframes sacude{30%{transform:rotateY(-14deg) translateY(-8px)} 60%{transform:rotateY(-20deg)}}
/* el botón del color y su paleta */
.lb-pintar{position:absolute; z-index:4; top:6px; left:calc(50% + var(--w) / 2 - 22px); width:32px; height:32px; display:grid; place-items:center; padding:0;
  border-radius:50%; border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2); cursor:pointer; box-shadow:0 6px 14px -6px rgba(0,0,0,.45);
  opacity:0; transform:scale(.8); transition:opacity .18s, transform .22s var(--ease-salto), color .15s}
.lb-hueco:hover .lb-pintar, .lb-hueco:focus-within .lb-pintar, .lb-pintar[aria-expanded="true"]{opacity:1; transform:none}
.lb-pintar:hover{color:var(--acento-txt); border-color:var(--acento-borde)}
@media (hover:none){ .lb-pintar{opacity:1; transform:none} }
.tapa-paleta{position:absolute; z-index:6; top:44px; left:50%; width:224px; padding:12px; border-radius:16px; background:var(--surface); border:1px solid var(--line-2);
  box-shadow:var(--sombra-modal); transform:translateX(-50%); animation:emerge .2s var(--ease-salto)}
@keyframes emerge{from{opacity:0; transform:translateX(-50%) translateY(6px) scale(.96)}}
.tapa-rej{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.tapa-color{width:100%; aspect-ratio:1; border-radius:50%; border:0; background:var(--c); cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15), inset 0 -3px 6px rgba(0,0,0,.2);
  transition:transform .16s var(--ease-salto)}
.tapa-color:hover, .tapa-color:focus-visible{transform:scale(1.12)}
.tapa-color.sel{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--acento-txt)}
.tapa-pie{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line)}
.tapa-propio{display:flex; align-items:center; gap:8px; font:500 12.5px/1 var(--sans); color:var(--ink-2); cursor:pointer}
.tapa-propio input{width:28px; height:28px; padding:0; border:0; border-radius:50%; background:none; cursor:pointer}
.lb-hueco.con-paleta{z-index:5}
@media (max-width:640px){
  .lb-hueco{--w:130px; --h:180px; --d:24px}
  .estanteria{gap:48px 12px}
  .lb-tapa{padding:14px 20px 12px 22px}
  .lb-sim{width:40px; height:40px}
  .lb-sim svg.sim{width:23px; height:23px}
  .lb-nombre{font-size:11.5px}
  .lb-pintar{left:calc(50% + var(--w) / 2 - 20px)}
}

/* ══ Próximamente: TutorIA y ChatClase ══ */
.pr{display:flex; flex-direction:column; gap:16px}
.pr-hero{position:relative; display:grid; grid-template-columns:220px minmax(0,1fr); gap:30px; align-items:center; padding:30px 34px; overflow:hidden;
  background:radial-gradient(620px 300px at 0% 50%, var(--pronto-suave), transparent 70%), linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--surface) 88%, var(--bg)))}
.pr-txt .titulo{margin:12px 0 6px}
.pr-lema{margin:0 0 10px; font:500 18px/1.4 var(--sans); color:var(--ink)}
.pr-arte-svg{width:210px; height:210px; overflow:visible}
.pr-halo{fill:color-mix(in srgb, var(--acento) 11%, transparent); transform-origin:100px 100px; animation:respira 4.5s ease-in-out infinite}
.pr-anilla{fill:none; stroke:var(--acento-txt); stroke-width:13}
.pr-orbita{transform-origin:100px 100px; animation:gira 16s linear infinite}
.pr-chispa{fill:var(--pronto); transform-box:fill-box; transform-origin:center; animation:titila 2.6s ease-in-out infinite}
.pr-chispa.p2{animation-delay:.9s} .pr-chispa.p3{animation-delay:1.7s}
.pr-rayo{fill:var(--acento-txt); animation:respira 3s ease-in-out infinite; transform-box:fill-box; transform-origin:center}
.pr-burbuja rect, .pr-burbuja > path{fill:var(--surface-2); stroke:var(--line-2); stroke-width:2}
.pr-burbuja{transform-box:fill-box; transform-origin:bottom left; animation:burbuja 6s var(--ease) infinite}
.pr-burbuja.b2{transform-origin:bottom right; animation-delay:1.2s}
.pr-punto{fill:var(--acento-txt); animation:escribe 1.3s ease-in-out infinite}
.pr-punto:nth-of-type(2){animation-delay:.18s} .pr-punto:nth-of-type(3){animation-delay:.36s}
.pr-linea{stroke:var(--ink-4); stroke-width:5; stroke-linecap:round; fill:none}
.pr-corazon path{fill:var(--pronto); transform-box:fill-box; transform-origin:center; animation:late 1.6s ease-in-out infinite}
@keyframes respira{0%,100%{transform:scale(1)} 50%{transform:scale(1.06)}}
@keyframes titila{0%,100%{transform:scale(1); opacity:1} 50%{transform:scale(.55); opacity:.5}}
@keyframes burbuja{0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)}}
@keyframes escribe{0%,100%{opacity:.3} 50%{opacity:1}}
@keyframes late{0%,100%{transform:scale(1)} 15%{transform:scale(1.18)} 30%{transform:scale(1)}}
.pr-puntos{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.pr-punto{display:flex; flex-direction:column; gap:6px; padding:18px}
.pr-punto strong{font:600 14.5px/1.3 var(--sans)}
.pr-idea{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
.pr-idea .meta{margin-top:4px}
.prc{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--surface)}
.prc-cab{display:flex; align-items:center; gap:8px; padding:11px 14px; border-bottom:1px solid var(--line); font-size:14px}
.prc-cab svg{width:15px; height:15px; color:var(--ink-3)}
.prc-msg{display:flex; gap:12px; padding:11px 14px}
.prc-quien{display:flex; align-items:baseline; gap:8px} .prc-quien time{font-size:11.5px; color:var(--ink-4)}
.prc-txt{margin-top:2px; font-size:14px; line-height:1.5; color:var(--ink)}
.pn-pronto{margin:-2px 2px 10px}
.pn-fila.estatica{cursor:default}
.pn-fila.estatica:hover{background:none}
@media (max-width:980px){ .pr-puntos{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){
  .pr-hero{grid-template-columns:minmax(0,1fr); justify-items:center; text-align:center; padding:24px 18px}
  .pr-arte-svg{width:160px; height:160px}
  .pr-puntos{grid-template-columns:minmax(0,1fr)}
}

/* ══ ChatClase ══ */
body.en-chat .principal{padding-top:14px; padding-bottom:14px}
body.en-chat .contenedor{max-width:1120px}
.cc{position:relative; display:flex; flex-direction:column; height:calc(100vh - 28px); min-height:440px; border-radius:20px; overflow:hidden;
  border:1px solid color-mix(in srgb, var(--line-2) 82%, transparent); background:var(--surface); box-shadow:var(--sombra-panel)}
.cc-cab{display:flex; align-items:center; gap:10px; padding:10px 14px 10px 18px; border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--surface) 88%, var(--bg))}
.cc-tit{display:flex; align-items:center; gap:8px; flex:1; min-width:0}
.cc-tit h1{margin:0; font:600 16px/1.2 var(--sans); white-space:nowrap}
.cc-hash svg, .cc-hash{width:17px; height:17px; color:var(--ink-3); flex:0 0 auto}
.cc-desc{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-left:10px; border-left:1px solid var(--line-2); font-size:13px; color:var(--ink-3)}
.cc-herr{display:flex; gap:2px}
.cc-boton{position:relative; width:34px; height:34px; flex:0 0 34px; display:grid; place-items:center; padding:0; border:0; border-radius:10px; background:none; color:var(--ink-3); cursor:pointer; transition:background .14s, color .14s}
.cc-boton:hover{background:var(--surface-2); color:var(--ink)}
.cc-boton[aria-expanded="true"]{background:var(--acento-suave); color:var(--acento-txt)}
.cc-boton svg{width:18px; height:18px}
.cc-solo-movil{display:none}
.cc-punto{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--pronto); box-shadow:0 0 0 2px var(--surface)}
.cc-boton .cc-punto{position:absolute; top:6px; right:6px}
.cc-aviso{padding:7px 18px; font:500 12.5px/1.3 var(--sans); color:var(--pronto); background:var(--pronto-suave)}
.cc-aviso[hidden]{display:none}
.cc-log{flex:1; min-height:0; overflow-y:auto; padding:8px 0 10px; overscroll-behavior:contain}
.cc-log:focus-visible{outline:2px solid var(--acento); outline-offset:-2px}
.cc-dia, .cc-nuevos{display:flex; align-items:center; gap:12px; margin:18px 18px 4px; font:600 11px/1 var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-4)}
.cc-dia::before, .cc-dia::after, .cc-nuevos::before, .cc-nuevos::after{content:""; flex:1; height:1px; background:var(--line)}
.cc-nuevos{color:var(--pronto)} .cc-nuevos::before, .cc-nuevos::after{background:var(--pronto-borde)}
.cc-inicio{margin:18px; font:500 13px/1.4 var(--sans); color:var(--ink-3); text-align:center}
.cc-mas{display:flex; justify-content:center; padding:10px}
.cc-vacio{display:flex; flex-direction:column; align-items:center; gap:8px; padding:70px 24px; text-align:center}
.cc-msg{position:relative; display:grid; grid-template-columns:40px minmax(0,1fr); column-gap:12px; margin-top:10px; padding:5px 18px 4px 16px; transition:background .12s}
.cc-msg.junto{margin-top:0; padding-top:1px}
.cc-msg:hover{background:color-mix(in srgb, var(--surface-2) 55%, transparent)}
.cc-av{width:38px; height:38px; flex:0 0 38px; display:grid; place-items:center; border-radius:50%; font:600 15px/1 var(--sans); color:#FFFFFF;
  background:linear-gradient(145deg, color-mix(in srgb, var(--c) 78%, #fff), var(--c)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.cc-msg > .cc-av{grid-column:1; grid-row:1 / span 3; margin-top:2px}

<script>
"use strict";
/* ══════════════════ utilidades ══════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/* El trozo de azar de los identificadores. Con cinco caracteres en base 36
   son 60 millones de combinaciones, que suena a mucho y no lo es: pidiendo
   cinco mil seguidos ya se repetía alguno, y dos apuntes con el mismo
   identificador son un apunte perdido, porque uno pisa al otro. Con ocho, y
   sacados del generador criptográfico del navegador, son billones. */
const azar = (n = 8) => {
  const abc = "0123456789abcdefghijklmnopqrstuvwxyz";
  let s = "";

/* ── un solo oído por cada tipo de evento ───────────────────────────
   Cada parte de la app apunta aquí su mano con alEvento("click", fn) y
   hay un único listener de verdad por tipo, que las llama a todas en el
   orden en que se registraron: exactamente lo que pasaba cuando cada
   una tenía su propio addEventListener, pero en un solo sitio.

   De paso, si una mano falla se apunta en el registro de errores en vez
   de morirse en silencio en la consola de alguien que nunca la mira. */
const MANOS = new Map();
function alEvento(tipo, mano, destino = document) {
  const llave = destino === document ? tipo : tipo + "@otro";
  let lista = MANOS.get(llave);
  if (!lista) {
    MANOS.set(llave, lista = []);
    destino.addEventListener(tipo, ev => {
      for (const fn of lista) {
        try {
          const r = fn(ev);
          if (r && typeof r.catch === "function") r.catch(err => apuntarError(err, "evento " + tipo));
        } catch (err) { apuntarError(err, "evento " + tipo); }
      }
    });
  }
  lista.push(mano);
}

function calcModulo(m) {
  const pesos = m.pesos || [];
  const evaluadas = pesos.filter(p => p.nota !== null && p.nota !== "" && p.nota !== undefined);
  const pesoEval = evaluadas.reduce((s, p) => s + num(p.peso), 0);
  const pesoTotal = pesos.reduce((s, p) => s + num(p.peso), 0) || 100;
  const acumulado = evaluadas.reduce((s, p) => s + num(p.nota) * num(p.peso), 0) / 100;
  const media = pesoEval > 0 ? (acumulado * 100) / pesoEval : null;
  const restante = Math.max(0, pesoTotal - pesoEval);
  const obj = num(m.objetivo, 5);
  let necesita = null, imposible = false, yaEsta = false;
  if (restante <= 0.001) yaEsta = acumulado >= obj;
  else {
    necesita = (obj * (pesoTotal / 100) - acumulado) * 100 / restante;
    if (necesita <= 0) { yaEsta = true; necesita = 0; }
    if (necesita > 10.0001) imposible = true;
  }
  const pct = num(m.pctFaltas === undefined ? S.config.pctFaltas : m.pctFaltas, 15);
  const faltasMax = Math.round(num(m.horas, 0) * pct / 100);
  const faltasPct = faltasMax > 0 ? num(m.faltas) / faltasMax : 0;

async function pedirAClaude(prompt, destino) {
  if (!sample) { destino.textContent = avisoIA(); return null; }
  destino.textContent = "Pensando…"; destino.classList.add("cargando");
  try {
    const r = await sample(prompt, { onText: ({ text }) => { destino.classList.remove("cargando"); destino.textContent = text; } });
    destino.classList.remove("cargando");
    destino.textContent = r.text + (r.truncated ? "\n\n[…cortado por longitud: pide menos de una vez]" : "");
    return r.text;
  } catch (e) {
    destino.classList.remove("cargando");
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) {
      destino.textContent = "Función no disponible en esta vista."; sample = sampleReal = null; pinta();
    } else if (e.code === "rate_limited") destino.textContent = "Has hecho muchas peticiones seguidas. Espera un poco y vuelve a darle.";
    else if (e.code === "cancelled") destino.textContent = "";
    else destino.textContent = (e.text ? e.text + "\n\n" : "") + "Se cortó la respuesta (" + e.code + "). Prueba otra vez.";
    return null;
  }
}

function evaluarObjetivos() {
  const lista = objetivosDeHoy(), hechos = lista.filter(o => o.hecho).length, total = lista.length;

  lista.forEach(o => { if (o.hecho) d.visto[o.id] = true; else delete d.visto[o.id]; });

  else if (nuevos.length === 1) aviso("Objetivo cumplido: " + nuevos[0].titulo + ".");
  else if (nuevos.length > 1) aviso(nuevos.length + " objetivos cumplidos.");
  /* solo se conservan diez semanas: el documento no puede crecer sin límite */
  const dias = S.objetivos.dias, claves = Object.keys(dias).sort();
  if (claves.length > 70) claves.slice(0, claves.length - 70).forEach(k => delete dias[k]);
  if (antes.n !== d.n || antes.total !== d.total || antes.completo !== d.completo || nuevos.length) guardar("objetivos");
}

      <div class="obj-nuevo">

      </div>
      ${ideas.length ? `<div class="barra-btns" style="margin-top:12px">${ideas.map(i =>
        `<button type="button" class="btn mini fantasma" data-idea="${esc(i)}">${icono("mas")}${esc(i)}</button>`).join("")}</div>` : ""}`;
  };
  const anadir = texto => {
    const O = normalizarObjetivos();
    texto = (texto || "").trim();
    if (!texto) { aviso("Escribe el objetivo primero."); return; }
    if (O.propios.length >= 8) { aviso("Con 8 objetivos propios ya tienes de sobra para un día."); return; }
    if (O.propios.some(o => o.texto.toLowerCase() === texto.toLowerCase())) { aviso("Ese ya lo tienes."); return; }
    O.propios.push({ id: "p" + uid(), texto }); guardar("objetivos"); dibuja();
    const n = $("#nuevoObj"); if (n) n.focus();
  };
  abrirDlg("Objetivos diarios", "", [{ txt: "Listo", clase: "btn primario", accion: () => pinta() }]);
  dibuja();
  const cuerpo = $("#dlgCuerpo");
  cuerpo.onchange = e => {
    const c = e.target.closest("[data-sug]");
    if (c) { normalizarObjetivos().activos[c.dataset.sug] = c.checked; guardar("objetivos"); }
  };
  cuerpo.onclick = e => {
    const q = e.target.closest("[data-quitar-obj]");
    if (q) { const O = normalizarObjetivos(); O.propios = O.propios.filter(o => o.id !== q.dataset.quitarObj); guardar("objetivos"); dibuja(); return; }

    if (e.target.closest("#btnAddObj")) anadir($("#nuevoObj").value);
  };
  cuerpo.onkeydown = e => { if (e.key === "Enter" && e.target.id === "nuevoObj") { e.preventDefault(); anadir(e.target.value); } };
}

   Una hoja de cuadrícula de verdad: se escribe con el teclado y se dibuja
   encima con bolígrafo, rotulador, subrayador, goma y formas. El dibujo se
   guarda como trazos (no como imagen): pesa poco, se ve nítido a cualquier
   tamaño y se deshace trazo a trazo. La hoja mide siempre 800 unidades de
   ancho y se escala entera, así el texto y el dibujo nunca se desalinean. */
const LB_ANCHO = 800, LB_CUADRO = 24, LB_MIN_ALTO = 1056;

function colorDePaleta(css, lista) {
  const s = String(css || "").trim(); if (!s || s === "transparent") return null;
  let c = s.match(/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)(?:[,\s/]+([\d.]+))?/i);
  if (c) { if (c[4] !== undefined && +c[4] === 0) return null; c = [+c[1], +c[2], +c[3]]; }
  else if (/^#[0-9a-f]{6}$/i.test(s)) c = hexRgb(s); else return null;
  let mejor = null, dist = Infinity;
  for (const [k, hex] of lista) { const q = hexRgb(hex), d = (q[0] - c[0]) ** 2 + (q[1] - c[1]) ** 2 + (q[2] - c[2]) ** 2; if (d < dist) { dist = d; mejor = k; } }
  return dist < 3 * 70 * 70 ? mejor : null;
}

  const cx = (vista.left + vista.right) / 2, cy = (vista.top + vista.bottom) / 2, esc = (R * 2) / Math.max(vista.right - vista.left, vista.bottom - vista.top);
  const anim = hoja.animate([
    { transform: "none", borderRadius: "3px", filter: "brightness(1)" },
    { transform: "scale(.72, .6) rotate(6deg) skewX(4deg)", borderRadius: "16%", filter: "brightness(.96)", offset: .3 },
    { transform: `translate(${(x - cx) * .5}px, ${(y - cy) * .5}px) scale(.3) rotate(-24deg) skewY(-6deg)`, borderRadius: "38%", filter: "brightness(.92)", offset: .65 },
    { transform: `translate(${x - cx}px, ${y - cy}px) scale(${esc}) rotate(38deg)`, borderRadius: "50%", filter: "brightness(.9)" }
  ], { duration: 780, easing: "cubic-bezier(.5,0,.3,1)", fill: "forwards" });
  hoja.querySelector(".bp-arrugas").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, fill: "forwards" });
  /* la bola queda lista al acabar la animación o, si el navegador no avisa (pestaña en segundo plano), a los 0,9 s */
  const lista = () => { if (fase !== "arrugando") return; hoja.remove(); bola.style.opacity = 1; bola.animate([{ transform: bola.style.transform + " scale(1.15)" }, { transform: bola.style.transform }], { duration: 180 }); fase = "espera"; bola.focus({ preventScroll: true }); };
  anim.onfinish = lista; setTimeout(lista, 900);

  /* 2. cogerla y lanzarla: la velocidad es la del gesto en sus últimos milisegundos */
  bola.addEventListener("pointerdown", e => {
    if (fase === "arrugando" || fin || dentro) return;
    e.preventDefault(); try { bola.setPointerCapture(e.pointerId); } catch (err) {}
    arrastre = { dx: e.clientX - x, dy: e.clientY - y }; muestras = [[performance.now(), e.clientX, e.clientY]];
    fase = "cogida"; bola.classList.add("cogida"); pista.classList.add("oculta");
  });
  bola.addEventListener("pointermove", e => {
    if (fase !== "cogida") return;
    x = e.clientX - arrastre.dx; y = e.clientY - arrastre.dy; colocar();
    muestras.push([performance.now(), e.clientX, e.clientY]); const t0 = performance.now() - 90; muestras = muestras.filter(m => m[0] >= t0);
  });
  const soltar = () => {
    if (fase !== "cogida") return;
    bola.classList.remove("cogida");
    const a = muestras[0], b = muestras[muestras.length - 1], dt = Math.max(16, b[0] - a[0]) / 1000;
    vx = Math.max(-4200, Math.min(4200, (b[1] - a[1]) / dt)); vy = Math.max(-4200, Math.min(4200, (b[2] - a[2]) / dt));
    fase = "vuela"; ultimo = performance.now(); requestAnimationFrame(paso);
  };
  bola.addEventListener("pointerup", soltar); bola.addEventListener("pointercancel", soltar);

  /* 3. el vuelo: gravedad, paredes, suelo, el borde de la papelera y la canasta */
  function paso(ahora) {
    if (fin || fase !== "vuela") return;
    const dt = Math.min(.032, (ahora - ultimo) / 1000); ultimo = ahora;
    const py0 = y;
    vy += G * dt; x += vx * dt; y += vy * dt;
    if (x < R) { x = R; vx = -vx * .6; } if (x > W - R) { x = W - R; vx = -vx * .6; }
    if (y < R) { y = R; vy = -vy * .4; }
    /* cae por la boca: canasta */
    if (!dentro && vy > 0 && py0 <= boca.y && y > boca.y && x > boca.x1 + R * .35 && x < boca.x2 - R * .35) {
      dentro = true; bola.classList.add("dentro"); canasta(); return;
    }
    /* da en el borde de la boca: rebota */
    if (!dentro && vy > 0 && py0 <= boca.y && y > boca.y && x > boca.x1 - R && x < boca.x2 + R) {
      y = boca.y - 1; vy = -vy * .45; vx += x < (boca.x1 + boca.x2) / 2 ? -260 : 260;
    }

    if (y > boca.y && x + R > px + pw * .06 && x - R < px + pw * .94) {
      if (x < px + pw / 2) { x = px + pw * .06 - R; vx = -Math.abs(vx) * .5; } else { x = px + pw * .94 + R; vx = Math.abs(vx) * .5; }
    }
    if (y > suelo - R) { y = suelo - R; vy = -vy * .42; vx *= .82; if (Math.abs(vy) < 90) vy = 0; }
    colocar();
    if (y >= suelo - R - .5 && Math.abs(vx) < 25 && vy === 0) { if ((quieto += dt) > .35) { fase = "espera"; pista.textContent = "Casi… ¡otra vez!"; pista.classList.remove("oculta"); quieto = 0; return; } } else quieto = 0;
    requestAnimationFrame(paso);
  }
  /* 4. canasta: la bola cae dentro, la papelera se mueve y se cierra */
  function canasta() {
    const fondo = py + ph * .72;
    bola.animate([{ transform: bola.style.transform }, { transform: `translate(${(boca.x1 + boca.x2) / 2 - R}px, ${fondo - R}px) rotate(200deg) scale(.9)` }],
      { duration: 380, easing: "cubic-bezier(.5,0,.8,.4)", fill: "forwards" });
    setTimeout(() => {
      capa.querySelectorAll(".bp-papelera").forEach(p => p.animate([{ transform: "rotate(0)" }, { transform: "rotate(-5deg)" }, { transform: "rotate(4deg)" }, { transform: "rotate(0)" }], { duration: 420, easing: "ease-out" }));
      capa.querySelector("#bpCanasta").hidden = false;
    }, 360);
    setTimeout(cerrar, 1500);
  }
  /* «Tírala por mí»: un tiro calculado que entra siempre */
  capa.querySelector("#bpAuto").onclick = () => {
    if (fin || dentro || fase === "arrugando") return;
    const tx = (boca.x1 + boca.x2) / 2, ty = boca.y + 4, T = .85;
    vx = (tx - x) / T; vy = (ty - y - .5 * G * T * T) / T;
    fase = "vuela"; pista.classList.add("oculta"); ultimo = performance.now(); requestAnimationFrame(paso);
  };
  function cerrar() {
    if (fin) return; fin = true;
    capa.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, fill: "forwards" }).onfinish = () => capa.remove();
    setTimeout(() => capa.remove(), 400);
    document.removeEventListener("keydown", tecla, true);
  }
  const tecla = e => { if (!capa.isConnected) { document.removeEventListener("keydown", tecla, true); return; }
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); cerrar(); } else if ((e.key === "Enter" || e.key === " ") && document.activeElement === bola) { e.preventDefault(); capa.querySelector("#bpAuto").click(); } };
  document.addEventListener("keydown", tecla, true);
  capa.querySelector("#bpSaltar").onclick = cerrar;
}
