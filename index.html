/* ── módulos, de un vistazo ──
   Arriba, cómo va el curso entero en tres datos. Debajo, una tarjeta por
   asignatura con lo único que importa: la nota que llevas en un anillo (con la
   marca de tu objetivo) y una frase que dice qué te toca. Las faltas y las horas
   de la semana, en pequeño. La lógica de riesgo no cambia: solo cómo se enseña. */
function anilloNota(c) {
  const R = 30, L = 2 * Math.PI * R, v = c.media === null ? 0 : clamp(c.media / 10, 0, 1);
  const a = (clamp(c.obj / 10, 0, 1) * 360 - 90) * Math.PI / 180;
  const p = r => (40 + r * Math.cos(a)).toFixed(1) + " " + (40 + r * Math.sin(a)).toFixed(1);
  const etq = (c.media === null ? "Sin notas todavía" : "Llevas un " + nota(c.media) + " de 10") + "; tu objetivo es un " + nota(c.obj);
  return `<div class="m2-anillo" role="img" aria-label="${esc(etq)}">
    <svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="${R}" class="an-fondo"/>
      ${c.media === null ? "" : `<circle cx="40" cy="40" r="${R}" class="an-valor" stroke-dasharray="${(v * L).toFixed(1)} ${L.toFixed(1)}" transform="rotate(-90 40 40)"/>`}
      <path d="M${p(R - 7.5)}L${p(R + 7.5)}" class="an-obj"/></svg>
    <span class="an-num${c.media === null ? " sin" : ""}">${c.media === null ? "—" : nota(c.media)}</span>
  </div>`;
}
function fraseModulo(c) {
  const f = (t, r) => `<strong>${t}</strong>${r}`;
  if (c.imposible) return f("Toca recuperación.", `Con lo que queda no llegas al ${nota(c.obj)}: habla con tu profesor y prepárala con tiempo.`);
  if (c.yaEsta && c.restante <= 0.001) return f(`Cerrado con un ${nota(c.acumulado)}.`, "Buen trabajo.");
  if (c.yaEsta) return f("¡Aprobado asegurado!", `Ya tienes el ${nota(c.obj)} aunque lo que queda salga mal.`);
  if (c.necesita === null) return f("Falta saber cómo te evalúan.", "Añádelo en «Notas y pesos» y te digo lo que necesitas.");
  if (c.media === null) return f("Todo por jugar.", `Con un ${nota(c.necesita)} de media llegas a tu ${nota(c.obj)}.`);
  const resto = ` de media en el ${nota(c.restante)} % que queda.`;
  if (c.necesita <= 5) return f("Vas bien.", `Te basta un ${nota(c.necesita)}${resto}`);
  if (c.necesita > 7) return f("Toca apretar.", `Necesitas un ${nota(c.necesita)}${resto}`);
  return f("A por ello.", `Necesitas un ${nota(c.necesita)}${resto}`);
}
const estadoModulo = c => c.media === null && !c.imposible && c.faltasPct < 0.7
  ? `<span class="estado neutro"><span class="dot"></span>Sin notas aún</span>` : estadoHTML(c);

function vistaModulos() {
  const abierta = modAbierto && modPorId(modAbierto);
  if (abierta) return vistaFichaModulo(abierta);
  const filas = S.modulos.map(m => ({ m, c: calcModulo(m), semana: minutosSemana(m.id), meta: num(m.metaSemanal) * 60 }));
  const conNota = filas.filter(f => f.c.media !== null);
  const media = conNota.length ? conNota.reduce((s, f) => s + f.c.media, 0) / conNota.length : null;
  const cuenta = est => filas.filter(f => f.c.media !== null && f.c.est === est).length;
  const n = { ok: cuenta("ok"), aviso: cuenta("aviso"), riesgo: filas.filter(f => f.c.est === "riesgo").length };
  n.vacio = filas.length - n.ok - n.aviso - n.riesgo;
  const hecho = filas.reduce((s, f) => s + f.semana, 0), metaT = filas.reduce((s, f) => s + f.meta, 0);
  const cods = l => l.map(f => f.m.cod).join(", ").replace(/, ([^,]*)$/, " y $1");

  let lead;
  if (!filas.length) lead = `Añade tus ${voc(true)} para empezar.`;
  else if (!conNota.length) lead = `Aún no hay notas. En cuanto pongas la primera, aquí verás lo que te hace falta para aprobar cada ${voc()}.`;
  else if (n.riesgo) lead = `Vas bien en ${n.ok} de ${filas.length}. Esta semana, prioridad: <strong>${esc(cods(filas.filter(f => f.c.est === "riesgo")))}</strong>.`;
  else if (n.aviso) lead = `Vas bien en ${n.ok} de ${filas.length}. Ojo con <strong>${esc(cods(filas.filter(f => f.c.media !== null && f.c.est === "aviso")))}</strong>.`;
  else lead = `Todo en verde. Sigue así.`;

  const trozo = (k, v) => v ? `<i class="rm-${k}" style="flex:${v}"></i>` : "";
  const leyenda = [["ok", n.ok, "bien"], ["aviso", n.aviso, "ojo"], ["riesgo", n.riesgo, "en riesgo"], ["vacio", n.vacio, "sin notas"]]
    .filter(x => x[1]).map(([k, v, t]) => `<span><i class="rm-${k}"></i>${v} ${t}</span>`).join("");

  return `
  <header class="cab">
    <div>
      <div class="eyebrow">${esc(S.config.curso)}</div>
      <h1 class="titulo">${voc(true, true)}</h1>
      <p class="lead">${lead}</p>
    </div>
    <button class="btn primario" id="btnNuevoMod">${icono("mas")}Añadir ${voc()}</button>
  </header>
  ${filas.length ? `<div class="resumen-mod">
    <div class="panel rm-tile"><div class="rm-etq">Media de tus notas</div>
      <div class="rm-cifra${media === null ? " vacia" : ""}">${media === null ? "—" : nota(media)}</div>
      <div class="rm-sub">${conNota.length ? conNota.length + " de " + filas.length + " con notas" : "Todavía sin notas"}</div></div>
    <div class="panel rm-tile"><div class="rm-etq">Cómo vas</div>
      <div class="rm-cifra">${n.ok}<small>de ${filas.length} van bien</small></div>
      <div class="rm-barra" aria-hidden="true">${trozo("ok", n.ok)}${trozo("aviso", n.aviso)}${trozo("riesgo", n.riesgo)}${trozo("vacio", n.vacio)}</div>
      <div class="rm-leyenda">${leyenda}</div></div>
    <div class="panel rm-tile"><div class="rm-etq">Estudio esta semana</div>
      <div class="rm-cifra">${horasTxt(hecho)}${metaT ? `<small>de ${horasTxt(metaT)}</small>` : ""}</div>
      ${metaT ? `<div class="medidor rm-medidor"><i style="width:${clamp(hecho / metaT * 100, 0, 100)}%"></i></div>` : ""}
      <div class="rm-sub">${!metaT ? "Ponte una meta en cada " + voc() : hecho >= metaT ? "¡Meta de la semana cumplida!" : "Te faltan " + horasTxt(metaT - hecho) + " para tu meta"}</div></div>
  </div>` : ""}
  <div class="rejilla-modulos">
  ${filas.map(({ m, c, semana, meta }) => {
    const faltas = c.faltasPct >= 1 ? ["limite", "Límite de faltas superado"] : c.faltasPct >= 0.7 ? ["ojo", "Faltas cerca del límite"]
      : ["", "Faltas: " + num(m.faltas) + " de " + c.faltasMax + " h"];
    return `<article class="panel modulo mod2" style="${colorMod(m)}">
      <div class="m2-cab">
        <button type="button" class="m2-nombre" data-editar-mod="${m.id}" aria-label="Abrir ${esc(m.nombre)}"><span class="codigo" style="${colorMod(m)}">${esc(m.cod)}</span><span class="m2-t">${esc(m.nombre)}</span></button>
        ${estadoModulo(c)}
      </div>
      <div class="m2-centro">${anilloNota(c)}<p class="m2-frase">${fraseModulo(c)}</p></div>
      <div class="m2-semana"><span>Esta semana</span><span class="num">${horasTxt(semana)}${meta ? " de " + num(m.metaSemanal) + " h" : ""}</span>
        ${meta ? `<div class="medidor"><i style="width:${clamp(semana / meta * 100, 0, 100)}%"></i></div>` : ""}</div>
      <div class="m2-pie"><span class="m2-faltas ${faltas[0]}" title="Pierdes la evaluación continua al pasar de ${c.faltasMax} h (${nota(c.pct)} % de ${num(m.horas)} h).">${faltas[1]}</span>
        <span class="m2-abrir" aria-hidden="true">Ver ficha<svg class="i" viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5"/></svg></span></div>
    </article>`;
  }).join("")}
  </div>`;
}

/* ══════════════════ ficha de una asignatura ══════════════════
   Al entrar en un módulo ya no se abre una ventana con todo junto: se abre su
   ficha, a pantalla completa y por partes. Arriba, cómo vas; en el centro, las
   notas de cada apartado (lo que más se toca); a un lado, faltas y estudio de
   la semana; y los datos de la asignatura, plegados al final. Todo se guarda
   solo mientras escribes. */
let modAbierto = null, fichaNueva = false, fichaT = null;
const guardaFicha = () => { clearTimeout(fichaT); fichaT = setTimeout(() => guardar("ajustes"), 350); };
function abrirFicha(id, nueva) {
  if (!modPorId(id)) return;
  if (seccion !== "modulos") irASeccion("modulos");
  modAbierto = id; fichaNueva = !!nueva; pinta(); window.scrollTo({ top: 0 });
  if (nueva) setTimeout(() => { const n = $("#mdNombreIn"); if (n) { n.focus(); n.select(); } }, 40);
  else $("#principal").focus({ preventScroll: true });
}
function nuevoModulo() {
  const m = { id: uid(), cod: "NUEVO", nombre: mayus(voc()) + " sin nombre", color: S.modulos.length % 7, horas: 100,
              faltas: 0, objetivo: num(S.config.objetivo, 5), metaSemanal: 2, pesos: PESOS_DEF() };
  S.modulos.push(m); guardar("ajustes"); abrirFicha(m.id, true);
}
const delMod = () => voc() === "asignatura" ? "de la asignatura" : "del " + voc();
const puntosDe = p => p.nota === null || p.nota === undefined || p.nota === "" ? null : num(p.nota) * num(p.peso) / 100;
const ICO_X = '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>';
const ICO_ATRAS = '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>';

function mdHero(m, c) {
  return `${anilloNota(c)}
    <div class="md-hero-txt"><p class="m2-frase md-frase">${fraseModulo(c)}</p>
      <dl class="md-cifras">
        <div><dt>Nota actual</dt><dd class="num">${c.media === null ? "—" : nota(c.media)}</dd></div>
        <div><dt>Evaluado</dt><dd class="num">${nota(c.pesoEval)} %</dd></div>
        <div><dt>Necesitas en lo que queda</dt><dd class="num">${c.necesita === null || c.yaEsta || c.imposible ? "—" : nota(c.necesita)}</dd></div>
        <div><dt>Tu objetivo</dt><dd class="num">${nota(c.obj)}</dd></div>
      </dl></div>`;
}
function mdTotal(m) {
  const suma = m.pesos.reduce((s, p) => s + num(p.peso), 0), ok = Math.round(suma) === 100;
  return `<span class="md-suma${ok ? "" : " mal"}">${ok ? "Los pesos suman 100 %" : "Los pesos suman " + nota(suma) + " %: deberían sumar 100 %"}</span>`;
}
function mdAporte(p) {

document.addEventListener("input", e => {

  if (t.dataset.campo) {
    const p = m.pesos.find(x => x.id === t.closest(".md-fila").dataset.p); if (!p) return;
    if (t.dataset.campo === "nombre") p.nombre = t.value;
    else if (t.dataset.campo === "peso") p.peso = clamp(num(t.value, 0), 0, 100);
    else p.nota = t.value === "" ? null : clamp(num(t.value, 0), 0, 10);
  } else if (t.dataset.mdDato) {
    const k = t.dataset.mdDato, v = t.value;
    if (k === "nombre") { m.nombre = v.trim() || m.nombre; $("#mdTit").textContent = m.nombre; $("#mdMiga").textContent = m.nombre; }
    else if (k === "cod") { m.cod = v.trim().toUpperCase() || m.cod; $("#mdCod").textContent = m.cod; }
    else if (k === "horas") m.horas = Math.max(0, num(v, m.horas));

    else if (k === "metaSemanal") m.metaSemanal = Math.max(0, num(v, 0));

  refrescaFicha(m); guardaFicha();
});

function simboloDe(m) {

}

async function comprimirImagen(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
    for (const [ancho, q] of [[1500, .72], [1200, .62], [900, .5], [700, .42]]) {
      const escala = Math.min(1, ancho / img.width);
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * escala); cv.height = Math.round(img.height * escala);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      const data = cv.toDataURL("image/jpeg", q);
      if (data.length < LIMITE_ARCHIVO * 1.34) return data;
    }
    return null;
  } finally { URL.revokeObjectURL(url); }
}
/* ── archivos grandes: el almacén de archivos de Claude ──
   Dentro de Claude, cada archivo va a su almacén (hasta 20 MB) y en la libreta
   solo se guarda la referencia; así se sincroniza igual y no llena los datos
   de la app. Fuera de Claude se sigue guardando dentro, hasta 180 KB. */
const LIMITE_NUBE = 20 * 1024 * 1024;
const TIPO_NUBE = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp", pdf: "application/pdf",
  txt: "text/plain", md: "text/markdown", csv: "text/csv", json: "application/json" };
/* el código y otros textos se guardan como texto plano */
["js", "ts", "java", "py", "sql", "html", "htm", "css", "xml", "c", "cpp", "h", "cs", "php", "sh", "yml", "yaml", "kt", "swift", "log", "ini", "dtd", "xsd"]
  .forEach(e => { TIPO_NUBE[e] = "text/plain"; });
const extDe = n => (String(n || "").match(/\.([a-z0-9]+)$/i) || [0, ""])[1].toLowerCase();
const srcDoc = d => d.datos || (d.asset ? "/_blob/" + d.asset : "");
const ACEPTA_ARCHIVOS = "image/*,.pdf," + Object.keys(TIPO_NUBE).filter(e => !["png", "jpg", "jpeg", "gif", "webp", "pdf"].includes(e)).map(e => "." + e).join(",");
let casUso = null;
async function refrescaUso() {
  if (!almacen) return;
  try { casUso = (await almacen.list()).usage; if (seccion === "casillero") pintaNav(); } catch (e) { /* el medidor es opcional */ }
}
const mb = b => b >= 1073741824 ? (b / 1073741824).toLocaleString("es-ES", { maximumFractionDigits: 1 }) + " GB"
  : (b / 1048576).toLocaleString("es-ES", { maximumFractionDigits: b < 10485760 ? 1 : 0 }) + " MB";
/* las fotos del móvil pesan mucho: se dejan a 2560 px, que se leen perfectas y ocupan una fracción */
async function reducirFoto(file) {
  try {
    const bm = await createImageBitmap(file), k = Math.min(1, 2560 / Math.max(bm.width, bm.height));
    const c = document.createElement("canvas"); c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k);
    c.getContext("2d").drawImage(bm, 0, 0, c.width, c.height);
    const b = await new Promise(ok => c.toBlob(ok, "image/jpeg", .86));
    return b && b.size < file.size ? b : null;
  } catch (e) { return null; }
}
async function guardarEnNube(file, modId) {
  const tipo = TIPO_NUBE[extDe(file.name)] || (Object.values(TIPO_NUBE).includes(file.type) ? file.type : "");
  if (!tipo) { aviso("«" + file.name + "»: ese tipo no se puede guardar. Los Word o PowerPoint, mejor como PDF o como enlace.", "mal"); return; }
  let blob = file, tipoSubida = tipo;
  if (/^image\/(jpeg|png|webp)$/.test(tipo) && file.size > 1.5 * 1048576) { const r = await reducirFoto(file); if (r) { blob = r; tipoSubida = "image/jpeg"; } }
  if (blob.size > LIMITE_NUBE) { aviso("«" + file.name + "» pesa " + mb(blob.size) + " y el máximo son 20 MB. Guárdalo en Drive y pega aquí el enlace.", "mal"); return; }
  aviso("Subiendo «" + file.name + "»…");
  const previa = previaDe(file, tipo, file.name);
  let r;
  try { r = await almacen.upload(blob, { type: tipoSubida }); }
  catch (e) {
    const por = { too_large: "pesa más de 20 MB", unsupported_type: "no es un tipo que se pueda guardar", quota_or_state: "el casillero está lleno: borra algo que ya no uses",
      rate_limited: "vas muy rápido, prueba en unos segundos", invalid_request: "no se ha podido leer (si es un texto, guárdalo en UTF-8)" }[e && e.code];
    aviso("«" + file.name + "»: " + (por || "no se ha podido subir") + ".", "mal"); return;
  }
  const id = uid();
  const doc = { id, titulo: file.name, modId, tipo: "archivo", mime: r.contentType || tipoSubida, tam: r.sizeBytes, creado: new Date().toISOString(), asset: r.id };
  Object.assign(doc, await previa);
  S.casillero[id] = doc; guardarLocal();
  if (db) db.doc("casillero/" + id).set(doc).catch(e => aviso("No se pudo sincronizar el archivo: " + e.code, "mal"));
  aviso("Guardado: " + file.name); pinta(); refrescaUso();
}

/* ── vista previa de las hojas ──
   Los PDF enseñan su primera página; los textos y el código, sus primeras
   líneas; los enlaces, la web a la que llevan. La miniatura se hace al subir y,
   para lo que ya estaba guardado, la primera vez que se ve. Los PDF se dibujan
   con PDF.js (Mozilla, Apache 2.0), que solo se carga cuando hace falta. */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfjsCarga = null;
function cargarPdfjs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfjsCarga) return pdfjsCarga;
  const script = src => new Promise((ok, mal) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = mal; document.head.appendChild(s); });
  /* el «worker» se carga como script normal: así PDF.js trabaja en la propia página y no necesita crear hilos */
  pdfjsCarga = script(PDFJS + "pdf.worker.min.js").then(() => script(PDFJS + "pdf.min.js"))
    .then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; return window.pdfjsLib; })
    .catch(e => { pdfjsCarga = null; throw e; });
  return pdfjsCarga;
}
async function abrirPdf(data) {

}

  const pdf = await abrirPdf(data), p = await pdf.getPage(1), v = p.getViewport({ scale: 1 }), vp = p.getViewport({ scale: 300 / v.width });
  const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);

}
const extracto = t => String(t).replace(/\r/g, "").replace(/\t/g, "  ").split("\n").slice(0, 16).map(l => l.slice(0, 80)).join("\n").slice(0, 900);
async function previaDe(blob, mime, nombre) {
  try {
    const m = mime || "", pdf = m.includes("pdf") || extDe(nombre) === "pdf";
    if (pdf) return await miniPdf(await blob.arrayBuffer());
    if (!m.startsWith("image/") && !m.startsWith("video/")) return { extracto: extracto(await blob.slice(0, 65536).text()) };
  } catch (e) { /* sin vista previa: se queda la etiqueta */ }

/* lo guardado antes de tener vista previa: se completa al verlo, de uno en uno */
const previaHecha = new Set();
let previasEnCurso = false;
async function completarPrevias() {
  if (previasEnCurso) return;
  previasEnCurso = true;
  try {
    for (;;) {

async function guardarArchivo(file, destino) {
  const modId = destino !== undefined ? destino

  if (almacen) return guardarEnNube(file, modId);
  let contenido = null, mime = file.type || "application/octet-stream";
  if (file.type.startsWith("image/")) {

  const id = uid();
  const doc = { id, titulo: file.name, modId, tipo: "archivo", mime, tam: contenido.length, creado: new Date().toISOString(), datos: contenido };
  Object.assign(doc, await previaDe(file, mime, file.name));

  if (db) db.doc("casillero/" + id).set(doc).catch(e => aviso("No se pudo sincronizar el archivo: " + e.code, "mal"));

}

  let i = 0, revelada = false;
  const pinta2 = () => {
    const v = cola[i];
    $("#dlgCuerpo").innerHTML = `
      <p class="meta num" style="text-align:center; margin-bottom:12px">${i + 1} de ${cola.length} · caja ${v.caja || 1} de 5</p>
      <div class="tarjeta-repaso">
        <div class="cara">${esc(v.en)}</div>
        ${revelada ? `<div class="reverso">${esc(v.es)}</div>` : `<button type="button" class="btn" id="btnRevelar">Ver la traducción</button>`}
      </div>
      ${revelada ? `<div class="barra-btns" style="margin-top:14px; justify-content:center">
        <button type="button" class="btn" id="btnMal">No me acordaba</button>
        <button type="button" class="btn primario" id="btnBien">Lo sabía</button></div>` : ""}`;
    if (!revelada) $("#btnRevelar").onclick = () => { revelada = true; pinta2(); };
    else {
      const avanzar = bien => {
        const dias = [1, 2, 4, 8, 16];
        v.caja = clamp((v.caja || 1) + (bien ? 1 : -1), 1, 5);
        const d = new Date(); d.setDate(d.getDate() + dias[v.caja - 1]);
        v.proximo = hoyISO(d); guardar("ingles");
        diaObj().repaso = true; guardar("objetivos");
        i++; revelada = false;
        if (i >= cola.length) { $("#dlg").close(); aviso("Repaso terminado: " + cola.length + " palabras."); pinta(); }
        else pinta2();
      };
      $("#btnBien").onclick = () => avanzar(true);
      $("#btnMal").onclick = () => avanzar(false);
    }
  };
  abrirDlg("Repaso", "", [{ txt: "Dejarlo aquí", clase: "btn", accion: () => pinta() }]);
  pinta2();
}

/* ══════════════════ diálogo ══════════════════ */
/* ── confirmar dentro de la app ──
   Nada de la ventanita del navegador: una tarjeta propia, con el botón de
   borrar en rojo y «Cancelar» como opción segura por defecto. Devuelve una
   promesa que se resuelve a true solo si se pulsa el botón de aceptar; Esc,
   «Cancelar» o un clic fuera de la tarjeta la resuelven a false. */
function confirmar(texto, { titulo = "¿Seguro?", si = "Aceptar", no = "Cancelar", peligro = true } = {}) {
  return new Promise(resolver => {
    const d = $("#dlgConfirmar");
    let hecho = false;
    const fin = v => { if (hecho) return; hecho = true; if (d.open) d.close(); resolver(v); };
    const icon = peligro
      ? '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.6 4.5l.7 8.3a1 1 0 0 0 1 .9h3.4a1 1 0 0 0 1-.9l.7-8.3"/>'
      : '<circle cx="8" cy="8" r="6"/><path d="M8 7.3v3.6M8 5.2v.1"/>';
    d.innerHTML = `<div class="cf">
      <div class="cf-icono${peligro ? " peligro" : ""}" aria-hidden="true"><svg class="i" viewBox="0 0 16 16">${icon}</svg></div>
      <h3 class="cf-tit" id="cfTit">${esc(titulo)}</h3>
      <p class="cf-txt" id="cfTxt">${esc(texto)}</p>
      <div class="cf-btns"><button type="button" class="btn" data-cf="no">${esc(no)}</button><button type="button" class="btn ${peligro ? "peligro" : "primario"}" data-cf="si">${esc(si)}</button></div>
    </div>`;
    d.onclick = e => { const b = e.target.closest("[data-cf]"); if (b) fin(b.dataset.cf === "si"); else if (e.target === d) fin(false); };
    d.oncancel = e => { e.preventDefault(); fin(false); };
    d.onclose = () => fin(false);
    d.showModal();
    d.querySelector('[data-cf="no"]').focus();
  });
}

/* ══════════════════ el profe ══════════════════
   Un tutor que se porta como un profesor de verdad: si el tema ya lo tienes
   en apuntes te da pistas y te hace pensar antes de soltarte la respuesta; si
   es nuevo, te lo explica de cero. Te escribe él cuando algo se acerca —una
   entrega, un repaso, un módulo flojo— y esos mensajes salen sin leer en el
   menú. Puede ponerte repasos, entregas y objetivos él solo, y cada cosa que
   toca queda escrita en la conversación. */
function tutorDef() { return { nombre: "Profe", chat: [], repasos: [], temas: [], avisos: {} }; }
const TUTOR_MAX = 60;      /* mensajes guardados: el documento tiene un tope de tamaño */
const TUTOR_SUG = ["¿Qué estudio hoy?", "Pregúntame de lo último que vimos", "No lo entiendo", "Ponme un ejercicio", "Dímelo ya"];
let tutorMod = "", tutorVivo = null, tutorCorta = null, tutorTools = null, tutorLim = null, tutorAdj = [], tutorBorrador = "";
/* lo que adjuntas se guarda entero solo mientras la página está abierta; a la conversación va una versión ligera */
const tutorCache = new Map();
const tutorElige = a => a[Math.floor(Math.random() * a.length)];

function normalizarTutor() {
  if (!S.tutor || typeof S.tutor !== "object") S.tutor = tutorDef();
  const P = S.tutor;
  if (typeof P.nombre !== "string" || !P.nombre.trim()) P.nombre = "Profe";
  ["chat", "repasos", "temas"].forEach(k => { if (!Array.isArray(P[k])) P[k] = []; });
  if (!P.avisos || typeof P.avisos !== "object") P.avisos = {};
  const av = Object.keys(P.avisos);
  if (av.length > 80) av.slice(0, av.length - 80).forEach(k => delete P.avisos[k]);
  return P;
}
const tutorNoLeidos = () => normalizarTutor().chat.filter(m => m.r === "profe" && m.nuevo).length;
function tutorApunta(m) {
  const P = normalizarTutor();
  P.chat.push(m);
  if (P.chat.length > TUTOR_MAX) P.chat.splice(0, P.chat.length - TUTOR_MAX);
  /* el documento tiene tope: si pesa mucho, las miniaturas y los archivos más viejos se quedan solo con su nombre */
  let tam = JSON.stringify(P).length;
  for (const v of P.chat) {
    if (tam < 190000) break;
    (v.adj || []).forEach(a => { delete a.mini; delete a.texto; });
    tam = JSON.stringify(P).length;
  }
  return m;
}
function tutorDice(txt, clave) {
  const P = normalizarTutor();
  tutorApunta({ id: uid(), r: "profe", t: txt, h: new Date().toISOString(), nuevo: seccion !== "tutor" });
  if (clave) P.avisos[clave] = hoyISO();
  guardar("tutor");
}

/* lo que le hace escribirte solo. Como mucho dos cosas al día y cada una una
   sola vez: un profesor pesado se acaba ignorando. */
function tutorMirar() {
  const P = normalizarTutor(), p = normalizarPerfil(), hoy = hoyISO();
  if (!p.listo) return;          /* antes de montar el curso no tiene nada que decir */
  let sitio = num(p.profe.avisos, 2) - Object.values(P.avisos).filter(f => f === hoy).length;
  if (sitio <= 0) return;
  const suelta = (clave, txt) => { if (sitio > 0 && !P.avisos[clave]) { tutorDice(txt, clave); sitio--; } };

  if (!P.chat.length) suelta("hola", "Hola" + (p.nombre ? ", " + p.nombre : "") + ". Soy " + p.profe.nombre + ", tu profe. Estoy aquí para cuando te atasques: te doy pistas antes que respuestas, porque así se queda. Cuéntame qué llevas entre manos o pregúntame de cualquier " + voc() + ".");

  P.repasos.filter(r => !r.hecho && r.fecha <= hoy).forEach(r => {
    const m = modPorId(r.modId);
    suelta("rep:" + r.id, tutorElige([
      "Toca repasar " + r.tema + (m ? " de " + m.cod : "") + ". ¿Te hago un par de preguntas, a ver qué queda?",
      "Acuérdate de " + r.tema + (m ? " (" + m.cod + ")" : "") + ": lo dejamos para hoy. ¿Lo miramos cinco minutos?"
    ]));
  });

  S.tareas.filter(t => !t.hecha && t.fecha).forEach(t => {
    const dd = diasEntre(t.fecha, hoy); if (dd < 0 || dd > 2) return;
    const m = modPorId(t.modId), cuando = dd === 0 ? "es para hoy" : dd === 1 ? "es para mañana" : "es pasado mañana";
    suelta("ent:" + t.id, "«" + t.titulo + "»" + (m ? " de " + m.cod : "") + " " + cuando + ". ¿Cómo lo llevas? Si te has atascado, dime en qué punto y lo vemos.");
  });

  /* un examen a tres días o menos: el profe pregunta cómo va */
  examenesPendientes().forEach(x => {
    const dd = diasEntre(x.fecha, hoy); if (dd > 3) return;
    const m = modPorId(x.modId), hechas = x.plan.filter(t => t.hecho).length;
    suelta("exa:" + x.id, "El examen de " + (m ? m.nombre : "«" + x.titulo + "»") + " es " + cuandoTxt(dd) + "." +
      (x.plan.length ? " Del plan llevas " + hechas + " de " + x.plan.length + "." : "") + " ¿Hacemos un simulacro rápido o repasamos lo que peor llevas?");
  });

  S.modulos.forEach(m => {
    const c = calcModulo(m); if (c.est !== "riesgo") return;
    suelta("rie:" + m.id + ":" + hoy, m.nombre + " va justa" +
      (c.necesita !== null && c.necesita !== undefined && !c.imposible ? ": necesitas un " + nota(c.necesita) + " en lo que queda" : "") +
      ". ¿Le metemos media hora hoy? Dime por dónde vais en clase.");
  });

  const dias = Object.values(S.horas || {}).flatMap(o => Object.keys(o || {}).filter(k => num(o[k]) > 0)).sort();
  const sin = dias.length ? -diasEntre(dias[dias.length - 1], hoy) : -1;
  if (sin >= 3) suelta("vuelta:" + hoy, "Llevas " + sin + " días sin estudiar por aquí. No pasa nada: empezamos suave, quince minutos de lo que menos pereza te dé. ¿Con qué módulo?");
}

/* ── lo que sabe de ti cada vez que le escribes ──

const ambitoTutor = () => ({ "ciclo-sup": "tu ciclo", "ciclo-medio": "tu ciclo", eso: "tu curso", bach: "tu curso", uni: "tu carrera",
  oposicion: "tu oposición", idioma: "tu curso de idioma" })[normalizarPerfil().etapa] || "tus estudios";
const esEscolar = () => ["eso", "bach"].includes(normalizarPerfil().etapa);
const fraseLimite = () => esEscolar() ? "Solo respondo dudas de tu curso o sobre qué estudiar después."
  : "Solo respondo dudas de " + ambitoTutor() + " o dudas profesionales de tu sector.";
function tutorInstrucciones() {
  const p = normalizarPerfil(), f = p.profe, e = etapaDe(p.etapa);
  const quien = [e.nombre, p.ciclo, p.rama, p.curso].filter(Boolean).join(" · ") || "sus estudios";
  const tono = f.tono === "exigente" ? "Exigente pero justo: le aprietas, le señalas sin rodeos lo que está mal y no le das coba."

    : f.cana === "mixto"

  const trabajo = p.trabaja === "completa"

    : p.trabaja === "parcial" ? "Trabaja a media jornada: cuenta con que tiene el día partido." : "Ahora mismo solo estudia.";
  const meta = p.meta === "matricula" ? "Va a por matrícula de honor." : p.meta === "buena" ? "Quiere buena media, no solo aprobar." : "Su objetivo es aprobar sin dramas.";
  const curso = S.config.curso || quien, asigs = S.modulos.map(m => m.nombre).join(", ");
  const menor = ["eso", "bach", "ciclo-medio"].includes(p.etapa);
  return `Eres el profesor particular de ${p.nombre || "un estudiante"}, que cursa ${quien} en España. Te llamas ${f.nombre} y le hablas por el chat de su app de estudio.

TU ESPECIALIDAD
Eres profesor especialista en ${curso}, y solo en eso.${asigs ? " Sus " + voc(true) + " son: " + asigs + "." : ""} Conoces ese curso por dentro: qué se da en cada ${voc()}, a qué nivel, cómo se evalúa y qué cae en los exámenes. Todo lo que expliques, al nivel de ese curso y con ejemplos de esas ${voc(true)}. Si te pregunta algo de otra materia o de otro nivel, se lo dices en una frase y lo llevas a lo suyo; si de verdad le sirve para una de sus ${voc(true)}, lo explicas desde ahí.${p.etapa === "eso" ? " Está en la ESO: háblale con palabras sencillas y adecuadas a su edad." : ""}

CÓMO ENSEÑAS

CÓMO HABLAS

- Sin markdown: ni asteriscos, ni almohadillas, ni viñetas salvo que sea una lista de verdad de dos o tres cosas.

CAPTURAS Y ARCHIVOS
Te puede pasar capturas (de sus apuntes, de un error, del enunciado) y archivos de texto o código. Léelos de verdad: cuando corrijas, cita el punto concreto y copia en tu mensaje el trozo del que hablas, porque las capturas no siempre se reenvían en los mensajes siguientes. Si una captura no se lee bien, díselo y pídele el texto pegado.

${f.puedeCrear ? `LO QUE PUEDES HACER TÚ

`LO QUE NO PUEDES HACER
Te ha pedido que no le pongas repasos, entregas ni objetivos por tu cuenta. Propónselos y que los ponga él.`}

/* la conversación entera viaja en cada llamada: Claude no recuerda nada entre una y otra.
   La plataforma admite unos 64 KB de texto por llamada: si no cabe, se cae lo más
   antiguo de la conversación antes que tu último mensaje, y solo si ni así cabe

const TUTOR_BYTES = 60000, TUTOR_TXT_GUARDA = 24000;

function cortarBytes(s, max) {

/* lo que le llega a Claude de un mensaje tuyo: el texto y, debajo, los archivos que adjuntaste */
function tutorContenido(m) {
  const cache = tutorCache.get(m.id), partes = [m.t || ""];
  (m.adj || []).forEach(a => {
    if (a.tipo !== "txt") return;

    const texto = lleno ? lleno.texto : a.texto;
    partes.push(texto
      ? "Archivo «" + a.nombre + "»" + (!lleno && a.cortado ? " (solo el principio)" : "") + ":\n\"\"\"\n" + texto + "\n\"\"\""
      : "[Te pasó el archivo «" + a.nombre + "», que ya no se conserva.]");
  });
  const n = (m.adj || []).filter(a => a.tipo === "img").length;
  if (n) partes.push("[Adjuntó " + (n === 1 ? "una captura" : n + " capturas") + ".]");

/* un recordatorio corto al final de cada mensaje: en conversaciones largas las instrucciones del principio pesan menos */
const tutorRecordatorio = () => "[Nota de la app, no la escribe el alumno: sigues siendo su profe de " + (S.config.curso || "su curso")
  + " y cumples tus normas. Si lo que te dice no es una duda de sus estudios ni " + (esEscolar() ? "de orientación" : "una duda profesional") + ", no lo contestes: responde «" + fraseLimite()
  + "» y propón seguir con algo concreto de lo suyo. Sin «jaja» ni emojis.]";
function tutorTurnos(nota) {
  const P = normalizarTutor(), cabecera = tutorInstrucciones() + "\n\n" + tutorContexto();
  const hist = P.chat.slice(-16).map(m => ({ role: m.r === "tu" ? "user" : "assistant", content: m.r === "tu" ? tutorContenido(m) : m.t }));
  if (nota && hist.length) hist[hist.length - 1].content += "\n\n" + nota;
  const montar = () => {
    const out = [];
    [{ role: "user", content: cabecera }, { role: "assistant", content: "Entendido. Sigo hablando con él." }].concat(hist).forEach(t => {
      const u = out[out.length - 1];
      if (u && u.role === t.role) u.content += "\n\n" + t.content; else out.push({ role: t.role, content: t.content });
    });
    if (out[out.length - 1].role !== "user") out.push({ role: "user", content: "(Sigue tú.)" });
    out[out.length - 1].content += "\n\n" + tutorRecordatorio();
    return out;
  };
  const peso = ts => ts.reduce((s, t) => s + bytesUtf8(t.content), 0);
  let turnos = montar();
  while (peso(turnos) > TUTOR_BYTES && hist.length > 1) { hist.shift(); turnos = montar(); }
  let recortado = false;
  if (peso(turnos) > TUTOR_BYTES) {
    const ult = turnos[turnos.length - 1];
    ult.content = cortarBytes(ult.content, bytesUtf8(ult.content) - (peso(turnos) - TUTOR_BYTES) - 120) + "\n\n[…recortado: no cabía entero en un mensaje]";
    recortado = true;
  }
  return { turnos, recortado };

/* ── adjuntar al profe: clip, pegar con Ctrl+V o arrastrar ──
   Las capturas se mandan tal cual (Claude las reduce a ~1,2 megapíxeles) y en
   la conversación se queda una miniatura. El código en archivo se lee entero y
   se guarda con la conversación hasta un tamaño razonable. */
const TUTOR_CODIGO = /\.(java|js|mjs|cjs|ts|jsx|tsx|html?|css|scss|sql|xml|xsd|dtd|xslt?|json|txt|md|py|c|h|cpp|cs|php|sh|bat|ps1|ya?ml|properties|kt|csv|log|ini)$/i;
async function tutorMiniatura(blob) {
  try {
    const bm = await createImageBitmap(blob), k = Math.min(1, 320 / bm.width);
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(bm.width * k)); c.height = Math.max(1, Math.round(bm.height * k));
    c.getContext("2d").drawImage(bm, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", .72);
  } catch (e) { return ""; }
}
async function tutorAnadir(lista) {
  const lim = sample ? await tutorLimites() : {};
  for (const f of Array.from(lista || [])) {
    const tipo = f.type || "";
    if (tipo.startsWith("image/")) {
      if (!lim.images) { aviso("Aquí no se pueden mandar capturas. Pega el código como texto.", "mal"); continue; }
      if (lim.images.mediaTypes && !lim.images.mediaTypes.includes(tipo)) { aviso("Ese formato de imagen no vale: PNG, JPG, WebP o GIF.", "mal"); continue; }
      if (lim.images.maxInputBytes && f.size > lim.images.maxInputBytes) { aviso("«" + (f.name || "La captura") + "» pesa demasiado.", "mal"); continue; }
      if (tutorAdj.filter(a => a.tipo === "img").length >= (lim.images.maxCount || 1)) { aviso("Como mucho " + (lim.images.maxCount || 1) + " capturas por mensaje.", "mal"); continue; }
      tutorAdj.push({ id: uid(), tipo: "img", nombre: f.name || "captura.png", blob: f, mini: await tutorMiniatura(f) });
    } else if (TUTOR_CODIGO.test(f.name || "") || tipo.startsWith("text/")) {
      if (f.size > 2000000) { aviso("«" + f.name + "» es demasiado grande para leerlo entero.", "mal"); continue; }
      const texto = await f.text();
      tutorAdj.push({ id: uid(), tipo: "txt", nombre: f.name, texto, lineas: texto.split("\n").length });
    } else aviso("«" + (f.name || "Ese archivo") + "»: solo capturas y archivos de código o de texto.", "mal");
  }
  pintaAdj();
}

  p.etapa = /DAW|DAM|ASIR|superior/i.test(curso) ? "ciclo-sup" : "otro";
  p.curso = /2/.test(curso) ? "2.º" : "1.º";
  p.ciclo = /DAW/i.test(curso) ? "DAW · Desarrollo de Aplicaciones Web" : "";
  p.objetivoNota = num(S.config.objetivo, 5);
  p.horasSemana = Math.max(4, Math.round((S.modulos || []).reduce((s, m) => s + num(m.metaSemanal), 0)) || 12);
  p.listo = true; p.creado = hoyISO();
  guardar("perfil");
}
/* las horas de estudio que se proponen, según si trabajas */
const horasPropuestas = (etapa, trabaja) => {
  const base = etapaDe(etapa).horas;
  return trabaja === "completa" ? Math.max(3, Math.round(base * .4)) : trabaja === "parcial" ? Math.max(4, Math.round(base * .65)) : base;
};
/* reparte esas horas entre las asignaturas, a más horas de clase más estudio */
function repartirMetas(horasSemana) {
  const mods = S.modulos || []; if (!mods.length) return;
  const total = mods.reduce((s, m) => s + Math.max(1, num(m.horas)), 0);
  mods.forEach(m => { m.metaSemanal = Math.max(1, Math.round(horasSemana * Math.max(1, num(m.horas)) / total)); });
}

/* y si tienes Claude, la lista de verdad de tu curso, con su temario */
async function bvPedirAClaude() {
  if (!sample) { BV.aviso = "Para esto hace falta abrir la página desde tu cuenta de Claude."; pintaEntrada(); return; }
  const p = BV.p, e = etapaDe(p.etapa);
  BV.cargando = true; BV.aviso = ""; pintaEntrada();
  const donde = [e.nombre, p.curso, p.rama, p.ciclo, p.centro].filter(Boolean).join(" · ");
  const unidad = porSemana(p.etapa) ? "horas de clase por semana (entre 1 y 8)" : "horas del curso completo (entre 40 y 300)";
  const q = `Eres orientador académico en España y conoces los planes de estudio.
Un estudiante te dice que cursa: ${donde}.
Devuelve SOLO este JSON, sin texto alrededor:
{"asignaturas":[{"cod":"ABC","nombre":"Nombre oficial de la asignatura","horas":4,"temario":"Los contenidos principales en una frase"}]}
Reglas: entre 4 y 14 asignaturas, las reales de ese curso en España; "cod" de 2 a 6 letras mayúsculas; "horas" son ${unidad}; "temario" en una sola frase con los bloques de contenido más importantes. Si no conoces el plan exacto, pon las asignaturas habituales de ese curso.`;
  try {
    const r = await sample.json(q, { modelTier: "default" });
    const lista = (r && Array.isArray(r.asignaturas) ? r.asignaturas : []).slice(0, 14)
      .map(a => ({ id: uid(), cod: String(a.cod || "").toUpperCase().replace(/[^A-ZÑ0-9]/g, "").slice(0, 6) || "ASI",
        nombre: String(a.nombre || "").trim().slice(0, 70), horas: clamp(num(a.horas, 3), 1, 400), temario: String(a.temario || "").trim().slice(0, 300), on: true }))
      .filter(a => a.nombre);
    if (!lista.length) throw new Error("vacío");
    BV.asigs = lista;
    BV.aviso = "Lista traída por el profe. Repásala: quita, añade o renombra lo que no cuadre.";
  } catch (err) {
    BV.aviso = err.code === "rate_limited" ? "Claude está saturado ahora mismo. Prueba en un minuto o sigue a mano."
      : "No he podido traer la lista. Sigue con la propuesta de abajo y la ajustas a mano.";
  }
  BV.cargando = false; pintaEntrada();
}

function bvPuedeSeguir() {
  const p = BV.p;
  if (BV.paso === 0) return !!p.etapa;
  if (BV.paso === 1) {
    if (p.etapa === "bach") return !!p.rama && !!p.curso;
    if (p.etapa === "ciclo-sup" || p.etapa === "ciclo-medio") return !!p.ciclo;
    if (["uni", "oposicion", "idioma", "otro"].includes(p.etapa)) return !!String(p.ciclo || "").trim();
    return !!p.curso;
  }
  if (BV.paso === 2) return BV.asigs.some(a => a.on);
  if (BV.paso === 4) return BV.pesos.length > 0;
  return true;
}

function bvLeerCampos() {
  const p = BV.p, v = id => { const el = $("#" + id); return el ? el.value : undefined; };
  if (v("bvNombre") !== undefined) p.nombre = v("bvNombre").trim().slice(0, 40);
  if (v("bvCiclo") !== undefined && v("bvCiclo").trim()) p.ciclo = v("bvCiclo").trim().slice(0, 80);
  if (v("bvCurso") !== undefined) p.curso = v("bvCurso").trim().slice(0, 30);
  if (v("bvCentro") !== undefined) p.centro = v("bvCentro").trim().slice(0, 60);
  if (v("bvRama") !== undefined && BV.paso === 1 && p.etapa === "uni") p.rama = v("bvRama").trim().slice(0, 40);
  if (v("bvHoras") !== undefined) p.horasSemana = clamp(num(v("bvHoras"), 10), 1, 60);
  if (v("bvNota") !== undefined) p.objetivoNota = clamp(num(v("bvNota"), 5), 1, 10);
  if (v("bvCuesta") !== undefined) p.cuestaMas = v("bvCuesta").trim().slice(0, 120);
  if (v("bvMotivo") !== undefined) p.motivo = v("bvMotivo").trim().slice(0, 120);
  if (v("bvProfeNombre") !== undefined) p.profe.nombre = v("bvProfeNombre").trim().slice(0, 20) || "Profe";
  const pc = $("#bvPuedeCrear"); if (pc) p.profe.puedeCrear = pc.checked;
  const rp = $("#bvReemplazar"); if (rp) BV.reemplazar = rp.checked;
}
function bvIr(d) {
  bvLeerCampos();
  const antes = BV.paso;
  BV.paso = clamp(BV.paso + d, 0, bvPasos().length - 1);
  /* al entrar en las asignaturas se carga la propuesta que toca */
  if (BV.paso === 2 && antes < 2 && !BV.asigs.length) bvCargarCatalogo();
  if (BV.paso === 3 && antes < 3) BV.p.horasSemana = horasPropuestas(BV.p.etapa, BV.p.trabaja);
  BV.aviso = "";
  pintaEntrada();
  const caja = $("#entrada"); if (caja) caja.scrollTop = 0;
}
function bvAplicar() {
  bvLeerCampos();
  const p = normalizarPerfil(), d = BV.p, marcadas = BV.asigs.filter(a => a.on);
  ["nombre", "etapa", "curso", "rama", "ciclo", "centro", "trabaja", "horasSemana", "diasFuertes", "meta", "objetivoNota", "motivo", "cuestaMas"]
    .forEach(k => { p[k] = d[k]; });
  p.profe = clonar(d.profe);
  p.listo = true; p.creado = p.creado || hoyISO();
  S.config.curso = [etapaDe(p.etapa).nombre, p.ciclo || p.rama, p.curso].filter(Boolean).join(" · ").slice(0, 60);
  S.config.objetivo = p.objetivoNota;
  const nuevo = a => ({
    id: uid(), cod: a.cod, nombre: a.nombre, color: 0,
    horas: porSemana(p.etapa) ? Math.round(clamp(num(a.horas, 3), 1, 12) * SEMANAS_CURSO) : clamp(num(a.horas, 100), 10, 600),
    faltas: 0, objetivo: p.objetivoNota, metaSemanal: 2, temario: a.temario || "",
    pesos: BV.pesos.map(x => ({ id: uid(), nombre: x.nombre.trim() || "Apartado", peso: clamp(num(x.peso), 0, 100), nota: null }))
  });
  if (BV.reemplazar) {
    const viejos = S.modulos.map(m => m.id);
    S.modulos = marcadas.map(nuevo);
    viejos.forEach(id => { delete S.horas[id]; });
  } else {
    marcadas.forEach(a => {
      const ya = S.modulos.find(m => m.nombre.toLowerCase() === a.nombre.toLowerCase() || m.cod.toLowerCase() === a.cod.toLowerCase());
      if (ya) { if (!ya.temario && a.temario) ya.temario = a.temario; } else S.modulos.push(nuevo(a));
    });
  }
  /* a cada una su color, sin repetir dos veces el mismo en la lista */
  S.modulos.forEach((m, i) => { if (!m.colorHex) m.color = i % 7; });
  repartirMetas(p.horasSemana);
  guardar("perfil"); guardar("ajustes"); guardar("horas");
  tutorPresentarse();
  BV = null; $("#entrada").hidden = true; document.body.classList.remove("en-entrada");
  seccion = "escritorio"; pinta();
  aviso("Listo. Tu curso ya está montado.");
}

/* ── clics y campos de la entrada ── */
document.addEventListener("click", e => {
  if (!BV) return;
  const t = e.target;
  const et = t.closest("[data-bv-etapa]");
  if (et) { bvLeerCampos(); BV.p.etapa = et.dataset.bvEtapa; BV.asigs = []; BV.pesos = null; BV.p.horasSemana = horasPropuestas(BV.p.etapa, BV.p.trabaja); pintaEntrada(); return; }
  const cu = t.closest("[data-bv-curso]"); if (cu) { bvLeerCampos(); BV.p.curso = cu.dataset.bvCurso; BV.asigs = []; pintaEntrada(); return; }
  const ra = t.closest("[data-bv-rama]"); if (ra) { bvLeerCampos(); BV.p.rama = ra.dataset.bvRama; BV.asigs = []; pintaEntrada(); return; }
  const ci = t.closest("[data-bv-ciclo]"); if (ci) { bvLeerCampos(); BV.p.ciclo = ci.dataset.bvCiclo; BV.asigs = []; pintaEntrada(); return; }
  const tr = t.closest("[data-bv-trabaja]");
  if (tr) { bvLeerCampos(); BV.p.trabaja = tr.dataset.bvTrabaja; BV.p.horasSemana = horasPropuestas(BV.p.etapa, BV.p.trabaja); pintaEntrada(); return; }
  const di = t.closest("[data-bv-dia]");
  if (di) { const d = di.dataset.bvDia, f = BV.p.diasFuertes; bvLeerCampos(); const i = f.indexOf(d); i < 0 ? f.push(d) : f.splice(i, 1); pintaEntrada(); return; }
  const me = t.closest("[data-bv-meta]");
  if (me) { bvLeerCampos(); BV.p.meta = me.dataset.bvMeta; if (BV.p.meta === "matricula") BV.p.objetivoNota = 9; else if (BV.p.meta === "buena") BV.p.objetivoNota = 7; pintaEntrada(); return; }
  const to = t.closest("[data-bv-tono]"); if (to) { bvLeerCampos(); BV.p.profe.tono = to.dataset.bvTono; pintaEntrada(); return; }
  const ca = t.closest("[data-bv-cana]"); if (ca) { bvLeerCampos(); BV.p.profe.cana = ca.dataset.bvCana; pintaEntrada(); return; }
  const av = t.closest("[data-bv-avisos]"); if (av) { bvLeerCampos(); BV.p.profe.avisos = num(av.dataset.bvAvisos); pintaEntrada(); return; }
  const on = t.closest("[data-bv-on]");
  if (on) { const a = BV.asigs.find(x => x.id === on.dataset.bvOn); if (a) a.on = !a.on; pintaEntrada(); return; }
  const qu = t.closest("[data-bv-quitar]"); if (qu) { BV.asigs = BV.asigs.filter(x => x.id !== qu.dataset.bvQuitar); pintaEntrada(); return; }
  if (t.closest("#bvAddAsig")) { BV.asigs.push({ id: uid(), cod: "", nombre: "", horas: porSemana(BV.p.etapa) ? 3 : 100, temario: "", on: true }); pintaEntrada(); setTimeout(() => { const c = document.querySelectorAll(".ent-nom"); if (c.length) c[c.length - 1].focus(); }, 30); return; }
  if (t.closest("#bvCat")) { BV.asigs = []; bvCargarCatalogo(); BV.aviso = ""; pintaEntrada(); return; }
  if (t.closest("#bvIA")) { bvPedirAClaude(); return; }
  const qp = t.closest("[data-bv-quitapeso]"); if (qp) { BV.pesos.splice(num(qp.dataset.bvQuitapeso), 1); pintaEntrada(); return; }
  if (t.closest("#bvAddPeso")) { BV.pesos.push({ nombre: "", peso: 0 }); pintaEntrada(); return; }
  if (t.closest("#bvAtras")) { bvIr(-1); return; }
  if (t.closest("#bvSalir")) { bvCerrar(); return; }
  if (t.closest("#bvSiguiente")) { BV.paso === bvPasos().length - 1 ? bvAplicar() : bvIr(1); return; }
});
document.addEventListener("input", e => {
  if (!BV) return;
  const t = e.target, campo = t.dataset.bvCampo;
  if (campo) {
    const a = BV.asigs.find(x => x.id === t.dataset.id); if (!a) return;
    a[campo] = campo === "horas" ? num(t.value) : campo === "cod" ? t.value.toUpperCase().slice(0, 6) : t.value;
    if (campo === "cod" && t.value !== a.cod) t.value = a.cod;
    return;
  }
  if (t.dataset.bvPeso) {
    const x = BV.pesos[num(t.dataset.i)]; if (!x) return;
    x[t.dataset.bvPeso] = t.dataset.bvPeso === "peso" ? num(t.value) : t.value;
  }
});
document.addEventListener("keydown", e => {
  if (!BV || e.key !== "Enter" || e.target.tagName === "TEXTAREA") return;
  if (e.target.tagName === "INPUT" && e.target.type === "checkbox") return;
  e.preventDefault();
  if (bvPuedeSeguir()) BV.paso === bvPasos().length - 1 ? bvAplicar() : bvIr(1);
});

/* ══════════════════ agenda ══════════════════
   Una sola base de datos —entregas y exámenes— con tres formas de verla:
   calendario, tablero y lista. Se añade escribiendo normal («Examen de BD el
   jueves»), se mueve arrastrando y cada cosa se abre en un panel lateral donde

   la semana, que sale solo. */
let agTab = "calendario", agMes = "", agPeek = null, agFiltro = { modId: "", tipo: "" };
const DIAS_ORDEN = ["lun", "mar", "mie", "jue", "vie", "sab", "dom"];
const DIAS_NOMBRE = { lun: "Lunes", mar: "Martes", mie: "Miércoles", jue: "Jueves", vie: "Viernes", sab: "Sábado", dom: "Domingo" };
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const ESTADOS = [["pendiente", "Pendiente"], ["curso", "En curso"], ["hecha", "Hecho"]];
const diaDe = iso => DIAS_ORDEN[(new Date(iso + "T12:00:00").getDay() + 6) % 7];
const sumaDias = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return hoyISO(d); };
const lunesDe = iso => sumaDias(iso, -DIAS_ORDEN.indexOf(diaDe(iso)));
const fechaCorta = iso => mayus(new Date(iso + "T12:00:00").toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" }));
const cuandoTxt = dd => dd < 0 ? "hace " + (-dd) + " d" : dd === 0 ? "hoy" : dd === 1 ? "mañana" : "en " + dd + " días";

function normalizarAgenda() {
  if (!Array.isArray(S.examenes)) S.examenes = [];
  if (!Array.isArray(S.horario)) S.horario = [];
  S.examenes.forEach(x => { if (!Array.isArray(x.plan)) x.plan = []; });

}
/* el estado de cada cosa: una entrega hecha es la marcada; un examen, el que ya tiene nota o marcaste */
function estadoDe(ref, tipo) {
  if (tipo === "entrega") return ref.hecha ? "hecha" : ref.estado === "curso" ? "curso" : "pendiente";
  if (ref.estado === "hecha" || (ref.nota !== null && ref.nota !== undefined && ref.nota !== "")) return "hecha";
  return ref.estado === "curso" ? "curso" : "pendiente";

function elementos() {

    .concat(S.examenes.map(x => ({ tipo: "examen", id: x.id, ref: x, titulo: x.titulo, modId: x.modId, fecha: x.fecha || "", hora: x.hora || "", estado: estadoDe(x, "examen") })));
}
const elemento = (tipo, id) => elementos().find(e => e.tipo === tipo && e.id === id);
const filtrados = () => elementos().filter(e => (!agFiltro.modId || e.modId === agFiltro.modId) && (!agFiltro.tipo || e.tipo === agFiltro.tipo));
const examenesPendientes = () => { const hoy = hoyISO(); return elementos().filter(e => e.tipo === "examen" && e.fecha >= hoy && e.estado !== "hecha").map(e => e.ref).sort((a, b) => a.fecha.localeCompare(b.fecha)); };
const clasesDe = dia => { normalizarAgenda(); return S.horario.filter(b => b.dia === dia).sort((a, b) => a.ini.localeCompare(b.ini)); };
function ponEstado(el, est) {

function ponFecha(el, fecha) { el.ref.fecha = fecha; guardar("agenda"); }

/* ── añadir escribiendo normal ──
   «Examen de BD el jueves a las 10», «entregar práctica 3 de programación
   mañana», «trabajo de LMSGI en 5 días». Se reconoce si es examen, de qué
   asignatura, el día y la hora; el resto se queda como título. */
const reVoz = s => new RegExp("(?<![\\p{L}\\d])(?:" + s + ")(?![\\p{L}\\d])", "iu");
const sinTildes = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const DIA_TXT = { lunes: 0, martes: 1, miercoles: 2, jueves: 3, viernes: 4, sabado: 5, domingo: 6 };
function entenderFrase(txt, base) {
  const hoy = base || hoyISO();
  let t = " " + String(txt || "") + " ", fecha = "", hora = "", tipo = "entrega", modId = "";
  const tomar = (re, fn) => { const m = t.match(re); if (!m) return false; const r = fn(m); if (r === false) return false; t = t.replace(m[0], " "); return true; };
  /* la hora, antes que las fechas para no confundir «10:30» con un día */
  tomar(reVoz("a las (\\d{1,2})(?:[:.](\\d{2}))?(?:\\s*h)?"), m => { hora = String(clamp(num(m[1]), 0, 23)).padStart(2, "0") + ":" + (m[2] || "00"); }) ||
  tomar(reVoz("(\\d{1,2})[:.](\\d{2})\\s*h?"), m => { if (num(m[1]) > 23 || num(m[2]) > 59) return false; hora = m[1].padStart(2, "0") + ":" + m[2]; });
  const conAño = (d, mes, año) => {
    let y = año ? (String(año).length === 2 ? 2000 + num(año) : num(año)) : new Date(hoy + "T12:00:00").getFullYear();
    let f = y + "-" + String(mes).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    if (!año && f < hoy) f = (y + 1) + f.slice(4);
    return isNaN(new Date(f + "T12:00:00")) ? "" : f;
  };
  const mesesRe = MESES.join("|") + "|ene|feb|mar|abr|may|jun|jul|ago|sep|sept|oct|nov|dic";
  tomar(reVoz("(?:el |para el )?(\\d{1,2})\\s+de\\s+(" + mesesRe + ")(?:\\s+de\\s+(\\d{4}))?"), m => {
    const i = MESES.findIndex(x => x.startsWith(sinTildes(m[2]).slice(0, 3)));
    fecha = i < 0 ? "" : conAño(num(m[1]), i + 1, m[3]);
  }) ||
  tomar(reVoz("(?:el |para el )?(\\d{1,2})[/-](\\d{1,2})(?:[/-](\\d{2,4}))?"), m => {
    if (num(m[2]) < 1 || num(m[2]) > 12 || num(m[1]) < 1 || num(m[1]) > 31) return false;
    fecha = conAño(num(m[1]), num(m[2]), m[3]);
  }) ||
  tomar(reVoz("(?:para )?pasado mañana"), () => { fecha = sumaDias(hoy, 2); }) ||
  tomar(reVoz("(?:para )?mañana"), () => { fecha = sumaDias(hoy, 1); }) ||
  tomar(reVoz("(?:para )?hoy"), () => { fecha = hoy; }) ||
  tomar(reVoz("(?:en|dentro de) (\\d{1,3}) d[ií]as"), m => { fecha = sumaDias(hoy, clamp(num(m[1]), 0, 365)); }) ||
  tomar(reVoz("(?:en|dentro de) una semana|la semana que viene|la pr[oó]xima semana"), () => { fecha = sumaDias(hoy, 7); }) ||
  tomar(reVoz("(?:para )?(?:el |este |el pr[oó]ximo |pr[oó]ximo )?(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)"), m => {
    const quiero = DIA_TXT[sinTildes(m[1])], hoyN = DIAS_ORDEN.indexOf(diaDe(hoy));
    let d = (quiero - hoyN + 7) % 7; if (d === 0) d = 7;
    fecha = sumaDias(hoy, d);
  });
  if (reVoz("examen|parcial|control|test|prueba|final|recuperaci[oó]n|global").test(t)) tipo = "examen";
  /* la asignatura: por su código o por su nombre, y se queda en el título */
  const plano = sinTildes(t);
  let mejor = 0;
  S.modulos.forEach(m => {
    const cands = [m.cod, m.nombre].concat(m.nombre.split(/\s+/).filter(w => w.length >= 6));
    cands.forEach(c => {
      const cc = sinTildes(c).trim(); if (cc.length < 2) return;
      if (reVoz(cc.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(plano) && cc.length > mejor) { mejor = cc.length; modId = m.id; }
    });
  });
  /* lo que sobra es el título, sin las palabras sueltas que unían la fecha */
  let titulo = t.replace(/\s+/g, " ").trim();
  for (let i = 0; i < 3; i++) titulo = titulo.replace(/\s+(el|para el|para|de|del|a|en|y)$/i, "").trim();
  titulo = titulo.charAt(0).toUpperCase() + titulo.slice(1);
  return { titulo, tipo, modId, fecha, hora };
}
function crearElemento(e) {

    const ex = { id: uid(), modId, titulo: (e.titulo || "Examen").slice(0, 120), fecha: e.fecha || "", hora: e.hora || "", peso: null, temas: "", nota: null, estado: e.estado || "pendiente", plan: [] };
    if (ex.fecha) ex.plan = planExamenLocal(ex);

  }
  const t = { id: uid(), titulo: (e.titulo || "Sin título").slice(0, 120), modId, fecha: e.fecha || "", hora: e.hora || "", peso: null,
    hecha: e.estado === "hecha", hechaEn: e.estado === "hecha" ? hoyISO() : "", estado: e.estado || "pendiente", notas: "", sub: [] };

/* ── el plan de la semana ── */
function planSemana(desde) {

  const total = Math.max(bloque, num(p.horasSemana, 0) * 60 || S.modulos.reduce((s, m) => s + num(m.metaSemanal) * 60, 0));

    if (dd <= 3) { w *= 2.5; motivo = "Examen " + cuandoTxt(dd); }
    else if (dd <= 7) { w *= 1.8; motivo = "Examen " + cuandoTxt(dd); }
    else if (dd <= 14) { w *= 1.3; motivo = "Examen " + cuandoTxt(dd); }
    if (c.est === "riesgo") { w *= 1.5; motivo = motivo || "Vas justo"; }
    else if (c.est === "aviso") { w *= 1.2; motivo = motivo || "Hay que apretar"; }
    if (c.yaEsta) { w *= .5; motivo = motivo || "Ya lo tienes, repaso suave"; }
    return { m, w, motivo: motivo || "Lo que toca", examen: ex && dd <= 14 ? ex : null };
  });
  const sumaW = pesos.reduce((s, x) => s + x.w, 0) || 1, cola = [];
  pesos.forEach(x => { const n = Math.max(x.w > .4 ? 1 : 0, Math.round(total * x.w / sumaW / bloque)); for (let i = 0; i < n; i++) cola.push(x); });
  cola.sort((a, b) => b.w - a.w);
  const semana = DIAS_ORDEN.map((d, i) => ({ dia: d, fecha: sumaDias(lunes, i), libre: dias.includes(d), bloques: [] }));
  const libres = semana.filter(d => d.libre);
  if (!libres.length) return semana;
  let k = 0;
  cola.forEach(x => {
    for (let intento = 0; intento < libres.length; intento++) {
      const d = libres[(k + intento) % libres.length];
      if (x.examen && d.fecha >= x.examen.fecha) continue;
      if (d.bloques.filter(b => b.modId === x.m.id).length >= 3) continue;
      const clase = clasesDe(d.dia).some(c => c.modId === x.m.id);
      d.bloques.push({ modId: x.m.id, min: bloque, motivo: clase && !x.examen ? "Tienes clase: repasa lo de hoy" : x.motivo });
      k = (k + intento + 1) % libres.length;
      return;
    }
  });
  semana.forEach(d => {
    const hechos = {};
    d.bloques.forEach(b => {
      const estudiado = ((S.horas[b.modId] || {})[d.fecha] || 0) - (hechos[b.modId] || 0);
      b.hecho = estudiado >= b.min;
      hechos[b.modId] = (hechos[b.modId] || 0) + (b.hecho ? b.min : 0);
    });
  });
  return semana;
}

/* ── el plan hacia atrás de un examen ── */
function planExamenLocal(ex) {
  const p = normalizarPerfil(), hoy = hoyISO();
  if (!ex.fecha) return [];
  const dias = p.diasFuertes.length ? p.diasFuertes : DIAS_ORDEN.slice(0, 6);
  const fechas = [];
  for (let f = hoy; f < ex.fecha && fechas.length < 30; f = sumaDias(f, 1)) if (dias.includes(diaDe(f))) fechas.push(f);
  if (!fechas.length) return [{ id: uid(), fecha: hoy, txt: "Repaso general y un simulacro", hecho: false }];
  const temas = String(ex.temas || "").split(/\n|;/).map(t => t.trim()).filter(Boolean);
  const tareas = temas.length ? temas.map(t => "Estudiar y hacer ejercicios: " + t) : ["Leer y subrayar la teoría", "Esquema de todo el temario", "Ejercicios del tema más largo", "Ejercicios del resto"];
  if (fechas.length >= 3) { tareas.push("Resolver dudas con el profe"); tareas.push("Simulacro de examen con tiempo"); }
  else tareas.push("Repaso general y un simulacro");
  const plan = [], porDia = Math.max(1, Math.ceil(tareas.length / fechas.length));
  let i = 0;
  fechas.slice(-Math.ceil(tareas.length / porDia)).forEach(f => { tareas.slice(i, i + porDia).forEach(txt => plan.push({ id: uid(), fecha: f, txt, hecho: false })); i += porDia; });
  return plan;
}
async function planExamenIA(ex, boton) {
  if (!sample) { aviso("El plan del profe necesita abrir la app desde tu enlace de Claude.", "mal"); return; }
  const m = modPorId(ex.modId), p = normalizarPerfil(), hoy = hoyISO();
  const dias = (p.diasFuertes.length ? p.diasFuertes : DIAS_ORDEN.slice(0, 6)).join(", ");
  if (boton) { boton.disabled = true; boton.textContent = "Preparándolo…"; }
  const q = `Eres profesor particular. Prepara un plan de estudio para este examen.
Alumno: ${[etapaDe(p.etapa).nombre, p.ciclo, p.curso].filter(Boolean).join(" · ")}. ${p.trabaja === "completa" ? "Trabaja a jornada completa." : p.trabaja === "parcial" ? "Trabaja a media jornada." : ""}
Examen: "${ex.titulo}" de ${m ? m.nombre : "su asignatura"}, el ${ex.fecha}. Hoy es ${hoy}.
Qué entra: ${ex.temas || "no lo ha especificado"}.
${m && m.temario ? "Temario de la asignatura: " + m.temario : ""}
Solo puede estudiar estos días de la semana: ${dias}. Unos ${num(S.config.pomodoro, 25) * 2} minutos por día como mucho.
Devuelve SOLO este JSON: {"plan":[{"fecha":"AAAA-MM-DD","tarea":"qué hacer ese día, concreto, en una frase"}]}
Reglas: solo fechas entre hoy y el día antes del examen, solo en los días que puede; de menos a más difícil; el último día, repaso y simulacro; como mucho 2 tareas por día.`;
  try {
    const r = await sample.json(q, { modelTier: "default" });
    const plan = (r && Array.isArray(r.plan) ? r.plan : [])
      .filter(x => /^\d{4}-\d{2}-\d{2}$/.test(String(x.fecha)) && x.fecha >= hoy && x.fecha < ex.fecha && String(x.tarea || "").trim())
      .slice(0, 40).map(x => ({ id: uid(), fecha: x.fecha, txt: String(x.tarea).trim().slice(0, 160), hecho: false }));
    if (!plan.length) throw new Error("vacío");
    ex.plan = plan; guardar("agenda"); aviso("Plan del profe listo."); pinta();
  } catch (err) {
    aviso(err.code === "rate_limited" ? "Claude va saturado. Prueba en un minuto." : "No ha salido el plan. Usa el automático y lo ajustas.", "mal");
    if (boton) { boton.disabled = false; boton.textContent = "Plan del profe"; }
  }
}

/* ══════════════════ repaso: tarjetas y tests ══════════════════
   Tarjetas con repaso espaciado (cajas de Leitner: lo que sabes vuelve cada
   vez más tarde, lo que fallas vuelve mañana) y tests de examen. Las dos cosas
   se pueden hacer a mano o pedírselas al profe a partir de un apunte tuyo. */
const CAJAS = [0, 1, 3, 7, 14, 30];               /* días hasta volver a verla según la caja */
const TARJETAS_MAX = 1200;                          /* el documento tiene tope de tamaño */
let RP = { sesion: null, test: null, cargando: "" };

function normalizarTarjetas() { if (!Array.isArray(S.tarjetas)) S.tarjetas = []; return S.tarjetas; }
const tarjetasHoy = modId => normalizarTarjetas().filter(c => c.proximo <= hoyISO() && (!modId || c.modId === modId));
function nuevaTarjeta(modId, frente, dorso, apunteId) {
  const T2 = normalizarTarjetas();
  if (T2.length >= TARJETAS_MAX) { aviso("Has llegado a " + TARJETAS_MAX + " tarjetas: borra las que ya domines.", "mal"); return null; }
  const c = { id: uid(), modId: modId || "", apunteId: apunteId || "", frente: String(frente).trim().slice(0, 300), dorso: String(dorso).trim().slice(0, 600),
    caja: 0, proximo: hoyISO(), vistas: 0, aciertos: 0, creada: hoyISO() };
  T2.push(c); return c;
}
function responderTarjeta(c, como) {
  const hoy = hoyISO();
  c.vistas = num(c.vistas) + 1;
  if (como === "si") { c.caja = Math.min(5, num(c.caja) + 1); c.aciertos = num(c.aciertos) + 1; c.proximo = sumaDias(hoy, CAJAS[c.caja]); }
  else if (como === "duda") { c.caja = Math.max(1, num(c.caja)); c.proximo = sumaDias(hoy, 1); }
  else { c.caja = 1; c.proximo = sumaDias(hoy, 1); }
}

/* ── lo que se le pide al profe ── */
function textoParaIA(modId, apunteId) {
  const m = modPorId(modId), n = apunteId && S.apuntes[apunteId];
  const p = normalizarPerfil();
  const partes = ["Estudiante de " + [etapaDe(p.etapa).nombre, p.ciclo, p.curso].filter(Boolean).join(" · ") + ".",
    "Asignatura: " + (m ? m.nombre : "general") + "."];
  if (m && m.temario) partes.push("Temario: " + m.temario);
  const ex = examenesPendientes().find(x => x.modId === modId);
  if (ex && ex.temas) partes.push("Su próximo examen (" + ex.fecha + ") entra: " + ex.temas);
  if (n && (n.cuerpo || "").trim()) partes.push("Sus apuntes, «" + (n.titulo || "sin título") + "»:\n\"\"\"\n" + n.cuerpo.slice(0, 6000) + "\n\"\"\"");
  return partes.join("\n");
}
async function tarjetasDeIA(modId, apunteId, boton) {
  if (!sample) { aviso("Esto necesita abrir la app desde tu enlace de Claude.", "mal"); return; }
  RP.cargando = "tarjetas"; pinta();
  const q = textoParaIA(modId, apunteId) + `

Haz tarjetas de estudio (pregunta por delante, respuesta por detrás) con lo más importante${apunteId ? " de esos apuntes" : " de esa asignatura"}.
Devuelve SOLO este JSON: {"tarjetas":[{"frente":"pregunta corta y concreta","dorso":"respuesta clara en una o dos frases"}]}
Entre 6 y 15 tarjetas. Nada que no esté en ${apunteId ? "los apuntes" : "el temario"}. Español de España.`;
  try {
    const r = await sample.json(q, { modelTier: "default" });
    const lista = (r && Array.isArray(r.tarjetas) ? r.tarjetas : []).filter(x => x && String(x.frente || "").trim() && String(x.dorso || "").trim()).slice(0, 20);
    if (!lista.length) throw new Error("vacío");
    let n = 0; lista.forEach(x => { if (nuevaTarjeta(modId, x.frente, x.dorso, apunteId)) n++; });
    guardar("repaso"); aviso(n + " tarjetas nuevas. Te tocan hoy.");
  } catch (err) { aviso(err.code === "rate_limited" ? "Claude va saturado. Prueba en un minuto." : "No han salido las tarjetas. Prueba otra vez.", "mal"); }
  RP.cargando = ""; pinta();
}
async function testDeIA(modId, apunteId) {
  if (!sample) { aviso("El test necesita abrir la app desde tu enlace de Claude.", "mal"); return; }
  RP.cargando = "test"; pinta();
  const q = textoParaIA(modId, apunteId) + `

Ponle un test tipo examen.
Devuelve SOLO este JSON: {"preguntas":[{"pregunta":"...","opciones":["a","b","c","d"],"correcta":0,"explicacion":"por qué esa es la buena, en una frase"}]}
Entre 6 y 10 preguntas, 4 opciones cada una, una sola correcta ("correcta" es su posición, de 0 a 3), opciones creíbles y de longitud parecida, de fácil a difícil. Nada que no esté en ${apunteId ? "los apuntes" : "el temario"}. Español de España.`;
  try {
    const r = await sample.json(q, { modelTier: "default" });
    const pr = (r && Array.isArray(r.preguntas) ? r.preguntas : []).filter(x => x && String(x.pregunta || "").trim() && Array.isArray(x.opciones) && x.opciones.length >= 2)
      .slice(0, 12).map(x => ({ p: String(x.pregunta).slice(0, 400), o: x.opciones.slice(0, 5).map(o => String(o).slice(0, 200)),
        c: clamp(Math.round(num(x.correcta)), 0, Math.min(4, x.opciones.length - 1)), e: String(x.explicacion || "").slice(0, 400) }));
    if (!pr.length) throw new Error("vacío");
    RP.test = { modId, preguntas: pr, i: 0, elegida: null, bien: 0, fallos: [] };
  } catch (err) { aviso(err.code === "rate_limited" ? "Claude va saturado. Prueba en un minuto." : "No ha salido el test. Prueba otra vez.", "mal"); }
  RP.cargando = ""; pinta();
}

/* ── botones y teclas ── */
function rpEmpezar(modId) {
  const cola = tarjetasHoy(modId).sort((a, b) => num(a.caja) - num(b.caja) || a.proximo.localeCompare(b.proximo)).slice(0, 40);
  if (!cola.length) return;
  RP.sesion = { cola, hechas: 0, bien: 0, volteada: false, falladas: new Set() };
  irASeccion("repaso");
}
function rpResponder(como) {
  const s = RP.sesion; if (!s || !s.volteada) return;
  const c = s.cola.shift(); if (!c) return;
  if (!s.falladas.has(c.id)) { responderTarjeta(c, como); if (como === "si") s.bien++; }
  if (como === "no" && !s.falladas.has(c.id)) { s.falladas.add(c.id); s.cola.push(c); }   /* vuelve una vez al final de esta tanda */
  else s.hechas++;
  s.volteada = false;
  if (!s.cola.length) { const d = diaObj(); d.tarjetas = true; guardar("objetivos"); }
  guardar("repaso"); pinta();
}
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("#rpEmpezar")) { rpEmpezar(); return; }
  const rm = t.closest("[data-rp-mod]"); if (rm) { rpEmpezar(rm.dataset.rpMod); return; }
  if (t.closest("#rpVoltear")) { RP.sesion.volteada = true; pinta(); return; }
  const rr = t.closest("[data-rp-resp]"); if (rr) { rpResponder(rr.dataset.rpResp); return; }
  if (t.closest("#rpSalir")) { RP.sesion = null; RP.test = null; pinta(); return; }
  if (t.closest("#rpTarjetasIA")) { tarjetasDeIA($("#rpMod").value, $("#rpApunte").value); return; }
  if (t.closest("#rpTestIA")) { testDeIA($("#rpMod").value, $("#rpApunte").value); return; }
  if (t.closest("#rpAddTarjeta")) {
    const f = $("#rpFrente").value.trim(), d = $("#rpDorso").value.trim();
    if (!f || !d) { aviso("Pon la pregunta y la respuesta.", "mal"); return; }
    if (nuevaTarjeta($("#rpManMod").value, f, d)) { guardar("repaso"); aviso("Tarjeta añadida."); pinta(); }
    return;
  }
  const op = t.closest("[data-rp-op]");
  if (op && RP.test && RP.test.elegida === null) {
    const tt = RP.test, q = tt.preguntas[tt.i]; tt.elegida = num(op.dataset.rpOp);
    if (tt.elegida === q.c) tt.bien++; else tt.fallos.push(q);
    pinta(); return;
  }
  if (t.closest("#rpSiguiente")) { RP.test.i++; RP.test.elegida = null; pinta(); return; }
  if (t.closest("#rpFallosATarjetas")) {
    RP.test.fallos.forEach(q => nuevaTarjeta(RP.test.modId, q.p, q.o[q.c] + (q.e ? ". " + q.e : "")));
    guardar("repaso"); aviso(RP.test.fallos.length + " tarjetas nuevas con lo que fallaste."); RP.test = null; pinta(); return;
  }
  const ap = t.closest("[data-tarjetas-apunte]");
  if (ap) { const n = S.apuntes[ap.dataset.tarjetasApunte]; if (n) { irASeccion("repaso"); tarjetasDeIA(n.modId, n.id); } return; }
});
document.addEventListener("keydown", e => {
  if (seccion !== "repaso" || !RP.sesion || editando()) return;
  if (e.key === " " && !RP.sesion.volteada) { e.preventDefault(); RP.sesion.volteada = true; pinta(); }

/* ══════════════════ progreso ══════════════════
   Cómo va el curso: horas por semana y por asignatura, la nota de cada una
   contra su objetivo y cómo ha ido cambiando, y los exámenes hechos. Las notas
   se van apuntando desde que existe esta sección; las horas vienen de siempre. */
function normalizarProgreso() { if (!Array.isArray(S.progreso)) S.progreso = []; return S.progreso; }
/* guarda la media de cada asignatura cuando cambia: con eso se dibuja su evolución */
function registrarProgreso() {
  const H = normalizarProgreso(), hoy = hoyISO();
  let cambio = false;
  S.modulos.forEach(m => {
    const c = calcModulo(m); if (c.media === null) return;
    const ult = H.filter(x => x.modId === m.id).pop();
    if (ult && Math.abs(ult.media - c.media) < .005) return;
    if (ult && ult.fecha === hoy) ult.media = +c.media.toFixed(2); else H.push({ fecha: hoy, modId: m.id, media: +c.media.toFixed(2) });
    cambio = true;
  });
  if (H.length > 600) H.splice(0, H.length - 600);
  if (cambio) guardar("progreso");
}
function horasPorSemana(semanas) {
  const hoy = hoyISO(), lunes = lunesDe(hoy), filas = [];
  for (let i = semanas - 1; i >= 0; i--) {
    const ini = sumaDias(lunes, -7 * i), fila = { ini, porMod: {}, total: 0 };
    S.modulos.forEach(m => {
      let min = 0; for (let d = 0; d < 7; d++) min += (S.horas[m.id] || {})[sumaDias(ini, d)] || 0;
      if (min) { fila.porMod[m.id] = min; fila.total += min; }
    });
    filas.push(fila);
  }
  return filas;
}
function vistaProgreso() {
  const filas = horasPorSemana(8), maxMin = Math.max(60, ...filas.map(f => f.total));
  const totalCurso = Object.values(S.horas || {}).reduce((s, o) => s + Object.values(o || {}).reduce((a, b) => a + num(b), 0), 0);
  const medias = S.modulos.map(m => ({ m, c: calcModulo(m) })), conNota = medias.filter(x => x.c.media !== null);
  const mediaGeneral = conNota.length ? conNota.reduce((s, x) => s + x.c.media, 0) / conNota.length : null;
  const exHechos = (S.examenes || []).filter(x => x.nota !== null && x.nota !== undefined);
  const T2 = normalizarTarjetas(), H = normalizarProgreso();
  /* el gráfico de horas: barras apiladas por asignatura, 2 px de hueco entre tramos */
  const alto = 150, ancho = 560, hueco = 18, barra = (ancho - hueco * (filas.length - 1)) / filas.length;
  const barras = filas.map((f, i) => {
    const x = i * (barra + hueco); let y = alto;
    const tramos = S.modulos.filter(m => f.porMod[m.id]).map(m => {
      const h = Math.max(2, f.porMod[m.id] / maxMin * (alto - 8)); y -= h;
      const r = `<rect x="${x.toFixed(1)}" y="${(y + 1).toFixed(1)}" width="${barra.toFixed(1)}" height="${Math.max(1, h - 2).toFixed(1)}" rx="2" fill="var(--c)" style="${colorMod(m)}"
        data-tip="${esc(m.cod + " · " + horasTxt(f.porMod[m.id]) + " · semana del " + fechaCorta(f.ini).toLowerCase())}"></rect>`;
      return r;
    }).join("");
    return tramos + `<text x="${(x + barra / 2).toFixed(1)}" y="${alto + 16}" text-anchor="middle" class="pg-eje">${new Date(f.ini + "T12:00:00").getDate()}/${new Date(f.ini + "T12:00:00").getMonth() + 1}</text>`;
  }).join("");
  return `
  <header class="cab">
    <div>
      <div class="eyebrow">Tu curso</div>
      <h1 class="titulo">Progreso</h1>
      <p class="lead">Las horas que le echas, cómo van tus notas contra tu objetivo y lo que ya has dejado atrás.</p>
    </div>
  </header>
  <div class="pg-datos">
    <div class="panel"><span class="cifra">${horasTxt(totalCurso)}</span><span class="meta">Estudiadas en total</span></div>
    <div class="panel"><span class="cifra">${mediaGeneral === null ? "—" : nota(mediaGeneral)}</span><span class="meta">Media de lo que tiene nota</span></div>
    <div class="panel"><span class="cifra">${racha()}</span><span class="meta">Días seguidos</span></div>
    <div class="panel"><span class="cifra">${exHechos.length}</span><span class="meta">Exámenes hechos</span></div>
    <div class="panel"><span class="cifra">${T2.filter(c => c.caja >= 4).length}</span><span class="meta">Tarjetas dominadas</span></div>
  </div>
  <div class="rejilla-12">
    <section class="panel c-7">
      <div class="panel-cab"><h2 class="etq">Horas por semana</h2><span class="meta">Últimas 8</span></div>
      ${filas.some(f => f.total) ? `<div class="pg-grafico" id="pgGrafico"><svg viewBox="0 0 ${ancho} ${alto + 22}" role="img" aria-label="Horas de estudio por semana y ${esc(voc())}">${barras}</svg><div class="pg-tip" id="pgTip" hidden></div></div>
      <div class="pg-leyenda">${S.modulos.filter(m => filas.some(f => f.porMod[m.id])).map(m => `<span style="${colorMod(m)}"><i></i>${esc(m.cod)}</span>`).join("")}</div>
      <details class="pg-tabla"><summary class="meta">Ver como tabla</summary><table><thead><tr><th>Semana</th>${S.modulos.map(m => `<th>${esc(m.cod)}</th>`).join("")}<th>Total</th></tr></thead>
        <tbody>${filas.map(f => `<tr><td>${fechaCorta(f.ini)}</td>${S.modulos.map(m => `<td class="num">${f.porMod[m.id] ? horasTxt(f.porMod[m.id]) : "—"}</td>`).join("")}<td class="num">${horasTxt(f.total)}</td></tr>`).join("")}</tbody></table></details>`
        : `<p class="vacio">Cuando estudies con el cronómetro, aquí verás tus semanas.</p>`}
    </section>
    <section class="panel c-5">
      <div class="panel-cab"><h2 class="etq">Notas contra tu objetivo</h2></div>
      ${medias.map(({ m, c }) => {
        const pts = H.filter(x => x.modId === m.id).slice(-12);
        const spark = pts.length >= 2 ? `<svg class="pg-spark" viewBox="0 0 60 20" aria-hidden="true"><polyline fill="none" stroke="var(--c)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
          points="${pts.map((x, i) => (i / (pts.length - 1) * 58 + 1).toFixed(1) + "," + (19 - x.media / 10 * 18).toFixed(1)).join(" ")}"/></svg>` : "";
        return `<div class="pg-nota" style="${colorMod(m)}">
          <span class="codigo" style="${colorMod(m)}">${esc(m.cod)}</span>
          <div class="pg-barra"><i style="width:${c.media === null ? 0 : c.media * 10}%"></i><b style="left:${num(m.objetivo, 5) * 10}%" title="Objetivo ${nota(num(m.objetivo, 5))}"></b></div>
          <span class="num pg-v">${c.media === null ? "—" : nota(c.media)}</span>${spark}</div>`;
      }).join("")}
      <p class="meta" style="margin-top:10px">La raya marca tu objetivo. La línea pequeña es cómo ha ido cambiando la nota desde que la apuntas.</p>
    </section>
    ${exHechos.length ? `<section class="panel c-12">
      <div class="panel-cab"><h2 class="etq">Exámenes</h2></div>
      ${exHechos.sort((a, b) => b.fecha.localeCompare(a.fecha)).map(x => { const m = modPorId(x.modId); return `<div class="fila"><span class="codigo" style="${colorMod(m)}">${m ? esc(m.cod) : "—"}</span>
        <span class="principal-fila"><span class="t">${esc(x.titulo)}</span><span class="meta">${fechaCorta(x.fecha)}</span></span>
        <span class="cifra pg-exnota">${nota(x.nota)}</span></div>`; }).join("")}
    </section>` : ""}
  </div>`;
}
/* el dato de cada tramo al pasar por encima; con teclado, la tabla de debajo */
document.addEventListener("mousemove", e => {

/* ══════════════════ instalable ══════════════════
   Fuera de Claude (GitHub Pages o en local) la app se instala en el móvil como
   una más y funciona sin conexión. Dentro de Claude no: allí no se pueden
   registrar service workers, y tampoco hace falta. */
(function instalable() {
  if (!("serviceWorker" in navigator) || !/^(localhost|127\.0\.0\.1|[\w-]+\.github\.io)$/.test(location.hostname)) return;
  const pon = (tag, attrs) => { const el = document.createElement(tag); Object.assign(el, attrs); document.head.appendChild(el); };
  pon("link", { rel: "manifest", href: "manifest.webmanifest" });
  pon("link", { rel: "apple-touch-icon", href: "iconos/icono-180.png" });
  pon("meta", { name: "theme-color", content: "#161826" });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();

function pintaRiel(c) {

  const item = (id, txt, dentro, extra) => `<button type="button" class="riel-item${extra || ""}" data-sec="${id}"
    aria-current="${seccion === id ? "page" : "false"}" tabindex="${seccion === id ? 0 : -1}"
    aria-label="${esc(txt + (c[id] ? ", " + c[id] + " " + (TITULO_CUENTA[id] || "").toLowerCase() : ""))}">${dentro}<span class="rt" aria-hidden="true">${esc(txt)}</span>${c[id] ? `<b class="riel-cuenta${id === "tutor" ? " verde" : ""}" aria-hidden="true">${c[id]}</b>` : ""}</button>`;
  const cr = $("#cursoRiel"); if (cr) { cr.textContent = etiquetaCorta(); cr.title = S.config.curso + " · curso " + cursoAcademico(); }

    + `<span class="riel-hueco"></span>`
