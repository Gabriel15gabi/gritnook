function vistaEntregas() {
  const hoy = hoyISO();
  const pend = S.tareas.filter(t => !t.hecha), hechas = S.tareas.filter(t => t.hecha);
  const grupos = [
    { t: "Atrasadas", f: x => x.fecha && diasEntre(x.fecha, hoy) < 0 },
    { t: "Esta semana", f: x => x.fecha && diasEntre(x.fecha, hoy) >= 0 && diasEntre(x.fecha, hoy) <= 7 },
    { t: "Más adelante", f: x => x.fecha && diasEntre(x.fecha, hoy) > 7 },
    { t: "Sin fecha", f: x => !x.fecha }
  ];
  const fila = t => {
    const m = modPorId(t.modId), dd = t.fecha ? diasEntre(t.fecha, hoy) : null;
    const cl = dd === null ? "" : dd < 0 ? "riesgo" : dd <= 2 ? "aviso" : "ok";
    const rel = dd === null ? "" : dd < 0 ? "Atrasada " + (-dd) + " d" : dd === 0 ? "Hoy" : dd === 1 ? "Mañana" : "En " + dd + " días";
    return `<div class="fila${t.hecha ? " tachada" : ""}">
      <input type="checkbox" data-hecha="${t.id}" ${t.hecha ? "checked" : ""} aria-label="Marcar ${esc(t.titulo)} como entregada">
      <span class="codigo" style="${colorMod(m)}">${m ? esc(m.cod) : "—"}</span>
      <span class="principal-fila"><span class="t">${esc(t.titulo)}</span>
        ${t.peso ? `<span class="meta">Vale el ${num(t.peso)} % de la nota</span>` : ""}</span>
      ${t.fecha ? `<span class="fecha">${t.fecha}</span>` : ""}
      ${!t.hecha && rel ? `<span class="estado ${cl}"><span class="dot"></span>${rel}</span>` : ""}
      <button class="btn borrar mini cuadrado" data-borrar-tarea="${t.id}" aria-label="Borrar entrega">×</button></div>`;
  };
  return `
  <header class="cab">
    <div>
      <div class="eyebrow">Actividades</div>
      <h1 class="titulo">Entregas</h1>
      <p class="lead">Todo lo que hay que entregar, con su fecha y lo que pesa en la nota.</p>
    </div>
  </header>
  <section class="panel">
    <div class="form-entrega">
      <label class="campo">Qué hay que entregar<input type="text" id="tTitulo" placeholder="Ejercicio 4: bucles anidados"></label>
      <label class="campo">Módulo<select id="tModulo">${S.modulos.map(m => `<option value="${m.id}">${esc(m.cod)} · ${esc(m.nombre)}</option>`).join("")}</select></label>
      <label class="campo">Fecha límite<input type="date" id="tFecha"></label>
      <label class="campo">Peso %<input type="number" id="tPeso" min="0" max="100" placeholder="Opcional"></label>
      <button class="btn primario" id="btnAddTarea">Apuntar</button>
    </div>
  </section>
  ${pend.length ? grupos.map(g => { const items = pend.filter(g.f); return items.length ? `
    <div class="grupo"><div class="grupo-cab"><h2>${g.t}</h2><span class="meta num">${items.length}</span></div>
      <div class="lista">${items.sort((a, b) => (a.fecha || "9").localeCompare(b.fecha || "9")).map(fila).join("")}</div></div>` : ""; }).join("")
    : `<p class="vacio" style="margin-top:24px">No tienes nada pendiente apuntado.</p>`}
  ${hechas.length ? `<details class="grupo"><summary class="etq" style="cursor:pointer">Entregadas · ${hechas.length}</summary>
    <div class="lista" style="margin-top:10px">${hechas.map(fila).join("")}</div></details>` : ""}`;

async function comprimirImagen(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
    for (const [ancho, q] of [[1500, .72], [1200, .62], [900, .5], [700, .42]]) {
      const escala = Math.min(1, ancho / img.width);
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * escala); cv.height = Math.round(img.height * escala);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      const data = cv.toDataURL("image/jpeg", q);
      if (data.length < LIMITE_ARCHIVO * 1.34) return data;
    }
    return null;
  } finally { URL.revokeObjectURL(url); }
}
async function guardarArchivo(file) {
  const modId = ($("#dModulo") && $("#dModulo").value) || (S.modulos[0] && S.modulos[0].id);
  let contenido = null, mime = file.type || "application/octet-stream";
  if (file.type.startsWith("image/")) {
    contenido = await comprimirImagen(file); mime = "image/jpeg";
    if (!contenido) { aviso("Esa imagen es enorme incluso comprimida. Súbela a Drive y guarda el enlace.", "mal"); return; }
  } else if (file.size <= LIMITE_ARCHIVO) {
    contenido = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(file); });
  } else {
    aviso("«" + file.name + "» pesa " + Math.round(file.size / 1024) + " KB (el máximo son 180 KB). Súbelo a Drive o Classroom y guarda aquí el enlace.", "mal");
    if ($("#dTitulo")) { $("#dTitulo").value = file.name.replace(/\.[^.]+$/, ""); $("#dUrl").focus(); }
    return;
  }
  const id = uid();
  const doc = { id, titulo: file.name, modId, tipo: "archivo", mime, tam: contenido.length, creado: new Date().toISOString(), datos: contenido };
  S.casillero[id] = doc; guardarLocal();
  if (db) db.doc("casillero/" + id).set(doc).catch(e => aviso("No se pudo sincronizar el archivo: " + e.code, "mal"));
  aviso("Guardado: " + file.name); pinta();
}

/* ══════════════════ tema ══════════════════
   Por defecto se sigue el tema del sistema; el botón fija uno a mano. */
function temaActual() {
  const s = document.documentElement.getAttribute("data-theme");
  if (s) return s;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function pintaBotonTema() {
  const oscuro = temaActual() === "dark", b = $("#btnTema");
  b.innerHTML = icono(oscuro ? "sol" : "luna");
  b.setAttribute("aria-label", oscuro ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
  b.title = oscuro ? "Modo claro" : "Modo oscuro";
}
function cambiarTema() {
  document.documentElement.setAttribute("data-theme", temaActual() === "dark" ? "light" : "dark");
  guardaLS("tema", temaActual()); pintaBotonTema();
}


/* ══════════════════ el profe ══════════════════
   Un tutor que se porta como un profesor de verdad: si el tema ya lo tienes
   en apuntes te da pistas y te hace pensar antes de soltarte la respuesta; si
   es nuevo, te lo explica de cero. Te escribe él cuando algo se acerca —una
   entrega, un repaso, un módulo flojo— y esos mensajes salen sin leer en el
   menú. Puede ponerte repasos, entregas y objetivos él solo, y cada cosa que
   toca queda escrita en la conversación. */
function tutorDef() { return { nombre: "Profe", chat: [], repasos: [], temas: [], avisos: {} }; }
const TUTOR_MAX = 60;      /* mensajes guardados: el documento tiene un tope de tamaño */
const TUTOR_SUG = ["¿Qué estudio hoy?", "Pregúntame de lo último que vimos", "No lo entiendo", "Ponme un ejercicio", "Dímelo ya"];
let tutorMod = "", tutorVivo = null, tutorCorta = null, tutorTools = null, tutorLim = null, tutorAdj = [], tutorBorrador = "";
/* lo que adjuntas se guarda entero solo mientras la página está abierta; a la conversación va una versión ligera */
const tutorCache = new Map();
const tutorElige = a => a[Math.floor(Math.random() * a.length)];

function normalizarTutor() {
  if (!S.tutor || typeof S.tutor !== "object") S.tutor = tutorDef();
  const P = S.tutor;
  if (typeof P.nombre !== "string" || !P.nombre.trim()) P.nombre = "Profe";
  ["chat", "repasos", "temas"].forEach(k => { if (!Array.isArray(P[k])) P[k] = []; });
  if (!P.avisos || typeof P.avisos !== "object") P.avisos = {};
  const av = Object.keys(P.avisos);
  if (av.length > 80) av.slice(0, av.length - 80).forEach(k => delete P.avisos[k]);
  return P;
}
const tutorNoLeidos = () => normalizarTutor().chat.filter(m => m.r === "profe" && m.nuevo).length;
function tutorApunta(m) {
  const P = normalizarTutor();
  P.chat.push(m);
  if (P.chat.length > TUTOR_MAX) P.chat.splice(0, P.chat.length - TUTOR_MAX);
  /* el documento tiene tope: si pesa mucho, las miniaturas y los archivos más viejos se quedan solo con su nombre */
  let tam = JSON.stringify(P).length;
  for (const v of P.chat) {
    if (tam < 190000) break;
    (v.adj || []).forEach(a => { delete a.mini; delete a.texto; });
    tam = JSON.stringify(P).length;
  }
  return m;
}
function tutorDice(txt, clave) {
  const P = normalizarTutor();
  tutorApunta({ id: uid(), r: "profe", t: txt, h: new Date().toISOString(), nuevo: seccion !== "tutor" });
  if (clave) P.avisos[clave] = hoyISO();
  guardar("tutor");
}

/* lo que le hace escribirte solo. Como mucho dos cosas al día y cada una una
   sola vez: un profesor pesado se acaba ignorando. */
function tutorMirar() {
  const P = normalizarTutor(), p = normalizarPerfil(), hoy = hoyISO();
  if (!p.listo) return;          /* antes de montar el curso no tiene nada que decir */
  let sitio = num(p.profe.avisos, 2) - Object.values(P.avisos).filter(f => f === hoy).length;
  if (sitio <= 0) return;
  const suelta = (clave, txt) => { if (sitio > 0 && !P.avisos[clave]) { tutorDice(txt, clave); sitio--; } };

  if (!P.chat.length) suelta("hola", "Hola" + (p.nombre ? ", " + p.nombre : "") + ". Soy " + p.profe.nombre + ", tu profe. Estoy aquí para cuando te atasques: te doy pistas antes que respuestas, porque así se queda. Cuéntame qué llevas entre manos o pregúntame de cualquier " + voc() + ".");

  P.repasos.filter(r => !r.hecho && r.fecha <= hoy).forEach(r => {
    const m = modPorId(r.modId);
    suelta("rep:" + r.id, tutorElige([
      "Toca repasar " + r.tema + (m ? " de " + m.cod : "") + ". ¿Te hago un par de preguntas, a ver qué queda?",
      "Acuérdate de " + r.tema + (m ? " (" + m.cod + ")" : "") + ": lo dejamos para hoy. ¿Lo miramos cinco minutos?"
    ]));
  });

  S.tareas.filter(t => !t.hecha && t.fecha).forEach(t => {
    const dd = diasEntre(t.fecha, hoy); if (dd < 0 || dd > 2) return;
    const m = modPorId(t.modId), cuando = dd === 0 ? "es para hoy" : dd === 1 ? "es para mañana" : "es pasado mañana";
    suelta("ent:" + t.id, "«" + t.titulo + "»" + (m ? " de " + m.cod : "") + " " + cuando + ". ¿Cómo lo llevas? Si te has atascado, dime en qué punto y lo vemos.");
  });

  S.modulos.forEach(m => {
    const c = calcModulo(m); if (c.est !== "riesgo") return;
    suelta("rie:" + m.id + ":" + hoy, m.nombre + " va justa" +
      (c.necesita !== null && c.necesita !== undefined && !c.imposible ? ": necesitas un " + nota(c.necesita) + " en lo que queda" : "") +
      ". ¿Le metemos media hora hoy? Dime por dónde vais en clase.");
  });

  const dias = Object.values(S.horas || {}).flatMap(o => Object.keys(o || {}).filter(k => num(o[k]) > 0)).sort();
  const sin = dias.length ? -diasEntre(dias[dias.length - 1], hoy) : -1;
  if (sin >= 3) suelta("vuelta:" + hoy, "Llevas " + sin + " días sin estudiar por aquí. No pasa nada: empezamos suave, quince minutos de lo que menos pereza te dé. ¿Con qué módulo?");
}

/* ── lo que puede hacer él solo ── */
function tutorHerramientas(acc) {
  /* si le has quitado el permiso, no tiene con qué tocar tus cosas */
  if (!normalizarPerfil().profe.puedeCrear) return [];
  const modPorTexto = s => {
    const q = String(s || "").trim().toLowerCase(); if (!q) return null;
    return S.modulos.find(m => m.cod.toLowerCase() === q) || S.modulos.find(m => m.nombre.toLowerCase().includes(q)) ||
           S.modulos.find(m => q.includes(m.cod.toLowerCase())) || null;
  };
  const dentroDe = d => hoyISO(new Date(Date.now() + clamp(num(d, 3), 1, 60) * 86400000));
  return [
    {
      name: "poner_repaso",
      description: "Programa un repaso de un tema para dentro de unos días: le sale como objetivo ese día y se lo recuerdas tú. Úsalo cuando acabéis de trabajar un tema. Devuelve la fecha del repaso.",
      inputSchema: { type: "object", properties: {
        tema: { type: "string", description: "El tema, en pocas palabras" },
        modulo: { type: "string", description: "Código de " + voc() + ", uno de estos: " + S.modulos.map(m => m.cod).join(", ") },
        dias: { type: "number", description: "Dentro de cuántos días (1-30); tres o cuatro es lo normal" } }, required: ["tema"] },
      execute: i => {
        const P = normalizarTutor(), m = modPorTexto(i.modulo), tema = String(i.tema || "").trim().slice(0, 80);
        if (!tema) throw new Error("Dime de qué tema es el repaso.");
        const r = { id: uid(), tema, modId: m ? m.id : "", fecha: dentroDe(i.dias), hecho: false };
        P.repasos.push(r);
        if (!P.temas.some(x => x.tema.toLowerCase() === tema.toLowerCase())) P.temas.push({ tema, modId: r.modId, fecha: hoyISO() });
        if (P.temas.length > 30) P.temas.splice(0, P.temas.length - 30);
        acc.push("Repaso de " + tema + " para el " + r.fecha);
        guardar("tutor");
        return "Repaso puesto para el " + r.fecha + ".";
      }
    },
    {
      name: "apuntar_entrega",
      description: "Apunta una entrega o un examen en su lista de Entregas, con fecha límite y lo que pesa. Úsalo cuando te cuente que le han mandado algo. Devuelve lo que queda apuntado.",
      inputSchema: { type: "object", properties: {
        titulo: { type: "string", description: "Qué hay que entregar" },
        modulo: { type: "string", description: "Código de " + voc() + ", uno de estos: " + S.modulos.map(m => m.cod).join(", ") },
        fecha: { type: "string", description: "Fecha límite en formato AAAA-MM-DD" },
        peso: { type: "number", description: "Porcentaje de la nota, si lo sabes" } }, required: ["titulo"] },
      execute: i => {
        const m = modPorTexto(i.modulo), titulo = String(i.titulo || "").trim().slice(0, 120);
        if (!titulo) throw new Error("Dime qué hay que entregar.");
        const f = /^\d{4}-\d{2}-\d{2}$/.test(String(i.fecha || "")) ? String(i.fecha) : "";
        S.tareas.push({ id: uid(), titulo, modId: m ? m.id : (S.modulos[0] ? S.modulos[0].id : ""),
          fecha: f, peso: i.peso ? clamp(num(i.peso), 0, 100) : null, hecha: false });
        acc.push("Entrega apuntada: " + titulo + (f ? " · " + f : ""));
        guardar("agenda"); pintaNav();
        return "Apuntada en Entregas" + (f ? " para el " + f : " sin fecha") + ".";
      }
    },
    {
      name: "poner_objetivo",
      description: "Añade un objetivo suyo del día, de los que marca a mano en el Escritorio. Para un propósito pequeño y concreto. Devuelve el objetivo puesto.",
      inputSchema: { type: "object", properties: { texto: { type: "string", description: "El objetivo, en pocas palabras" } }, required: ["texto"] },
      execute: i => {
        const txt = String(i.texto || "").trim().slice(0, 60);
        if (!txt) throw new Error("Dime qué objetivo le pongo.");
        const O = normalizarObjetivos();
        if (O.propios.length >= 8) throw new Error("Ya tiene muchos objetivos propios, mejor no añadir otro.");
        O.propios.push({ id: uid(), texto: txt });
        acc.push("Objetivo del día: " + txt);
        guardar("objetivos");
        return "Objetivo añadido a los de hoy.";
      }
    }
  ];
}

/* ── lo que sabe de ti cada vez que le escribes ──
   Sale entero de tu perfil: qué estudias, con qué asignaturas y su temario, si
   trabajas, a qué nota vas, qué te cuesta, y con qué tono y cuánta caña le has
   pedido que te trate. */
function tutorInstrucciones() {
  const p = normalizarPerfil(), f = p.profe, e = etapaDe(p.etapa);
  const quien = [e.nombre, p.ciclo, p.rama, p.curso].filter(Boolean).join(" · ") || "sus estudios";
  const tono = f.tono === "exigente" ? "Exigente pero justo: le aprietas, le señalas sin rodeos lo que está mal y no le das coba."
    : f.tono === "neutro" ? "Directo y sin adornos: al grano, sin palmaditas."
    : "Cercano y tranquilo, de tú, como un profesor que se lleva bien con su alumno.";
  const cana = f.cana === "directo"
    ? "Te ha pedido ir DIRECTO: explica y resuelve, y como mucho deja una pregunta corta al final para comprobar que lo ha entendido."
    : f.cana === "mixto"
    ? "Una pista primero y, si no sale a la primera, la explicación entera. No lo estires más de eso."
    : "Pistas antes que respuestas: primero una pista o una pregunta que le haga pensar, luego otra más concreta, luego un ejemplo parecido resuelto y, al final, la explicación entera.";
  const trabajo = p.trabaja === "completa"

/* la conversación entera viaja en cada llamada: Claude no recuerda nada entre una y otra.
   La plataforma admite unos 64 KB de texto por llamada: si no cabe, se cae lo más
   antiguo de la conversación antes que tu último mensaje, y solo si ni así cabe
   se recorta el final de este. */
const TUTOR_BYTES = 60000, TUTOR_TXT_GUARDA = 24000;
const bytesUtf8 = s => new TextEncoder().encode(s).length;
function cortarBytes(s, max) {
  const b = new TextEncoder().encode(s);
  return b.length <= max ? s : new TextDecoder().decode(b.slice(0, Math.max(0, max))).replace(/\uFFFD+$/, "");

/* lo que le llega a Claude de un mensaje tuyo: el texto y, debajo, los archivos que adjuntaste */
function tutorContenido(m) {
  const cache = tutorCache.get(m.id), partes = [m.t || ""];
  (m.adj || []).forEach(a => {
    if (a.tipo !== "txt") return;
    const lleno = cache && cache.txt.find(x => x.nombre === a.nombre);
    const texto = lleno ? lleno.texto : a.texto;
    partes.push(texto
      ? "Archivo «" + a.nombre + "»" + (!lleno && a.cortado ? " (solo el principio)" : "") + ":\n\"\"\"\n" + texto + "\n\"\"\""
      : "[Te pasó el archivo «" + a.nombre + "», que ya no se conserva.]");
  });
  const n = (m.adj || []).filter(a => a.tipo === "img").length;
  if (n) partes.push("[Adjuntó " + (n === 1 ? "una captura" : n + " capturas") + ".]");
  return partes.filter(Boolean).join("\n\n") || "(Te pasa esto.)";
}
function tutorTurnos(nota) {
  const P = normalizarTutor(), cabecera = tutorInstrucciones() + "\n\n" + tutorContexto();
  const hist = P.chat.slice(-16).map(m => ({ role: m.r === "tu" ? "user" : "assistant", content: m.r === "tu" ? tutorContenido(m) : m.t }));
  if (nota && hist.length) hist[hist.length - 1].content += "\n\n" + nota;
  const montar = () => {
    const out = [];
    [{ role: "user", content: cabecera }, { role: "assistant", content: "Entendido. Sigo hablando con él." }].concat(hist).forEach(t => {
      const u = out[out.length - 1];
      if (u && u.role === t.role) u.content += "\n\n" + t.content; else out.push({ role: t.role, content: t.content });
    });
    if (out[out.length - 1].role !== "user") out.push({ role: "user", content: "(Sigue tú.)" });
    return out;
  };
  const peso = ts => ts.reduce((s, t) => s + bytesUtf8(t.content), 0);
  let turnos = montar();
  while (peso(turnos) > TUTOR_BYTES && hist.length > 1) { hist.shift(); turnos = montar(); }
  let recortado = false;
  if (peso(turnos) > TUTOR_BYTES) {
    const ult = turnos[turnos.length - 1];
    ult.content = cortarBytes(ult.content, bytesUtf8(ult.content) - (peso(turnos) - TUTOR_BYTES) - 120) + "\n\n[…recortado: no cabía entero en un mensaje]";
    recortado = true;
  }
  return { turnos, recortado };
}

async function tutorEnviar(texto) {

  const ahora = () => new Date().toISOString(), msg = { id: uid(), r: "tu", t: txt, h: ahora() };
  if (adj.length) {
    msg.adj = adj.map(a => a.tipo === "img" ? { tipo: "img", nombre: a.nombre, mini: a.mini }
      : { tipo: "txt", nombre: a.nombre, lineas: a.lineas, texto: a.texto.slice(0, TUTOR_TXT_GUARDA), cortado: a.texto.length > TUTOR_TXT_GUARDA });
    tutorCache.set(msg.id, { imgs: adj.filter(a => a.tipo === "img").map(a => a.blob),
      txt: adj.filter(a => a.tipo === "txt").map(a => ({ nombre: a.nombre, texto: a.texto })) });

    onText: ({ text }) => { if (!tutorVivo) return; tutorVivo.t = text; const el = $("#chatVivo"); if (el) { el.textContent = text; chatAbajo(); } }
  };

  let nota = "";
  const conImg = normalizarTutor().chat.filter(m => m.r === "tu").slice(-4).reverse()
    .find(m => tutorCache.has(m.id) && tutorCache.get(m.id).imgs.length);
  if (conImg && lim.images) {
    opciones.images = tutorCache.get(conImg.id).imgs.slice(0, lim.images.maxCount || 1);

    const { turnos, recortado } = tutorTurnos(nota);
    if (recortado && !avisado) { avisado = true; aviso("Tu mensaje no cabía entero y al profe le llega recortado. Pásale el código por partes."); }

    let r;

      else if ((e.code === "images_unavailable" || e.code === "image_rejected") && opciones.images) {
        delete opciones.images;
        nota = "[Intentó pasarte una captura, pero no se ha podido enviar. Pídele que te pegue el código como texto.]";
        aviso(e.code === "image_rejected" ? "Esa captura no se ha podido mandar (formato o tamaño)." : "En esta vista no se pueden mandar capturas.", "mal");

    else if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) {

    tutorVivo = null; tutorCorta = null; guardar("tutor"); pinta();
    const ta = $("#chatTexto"); if (ta) ta.focus();
  }

/* ── adjuntar al profe: clip, pegar con Ctrl+V o arrastrar ──
   Las capturas se mandan tal cual (Claude las reduce a ~1,2 megapíxeles) y en
   la conversación se queda una miniatura. El código en archivo se lee entero y
   se guarda con la conversación hasta un tamaño razonable. */
const TUTOR_CODIGO = /\.(java|js|mjs|cjs|ts|jsx|tsx|html?|css|scss|sql|xml|xsd|dtd|xslt?|json|txt|md|py|c|h|cpp|cs|php|sh|bat|ps1|ya?ml|properties|kt|csv|log|ini)$/i;
async function tutorMiniatura(blob) {
  try {
    const bm = await createImageBitmap(blob), k = Math.min(1, 320 / bm.width);
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(bm.width * k)); c.height = Math.max(1, Math.round(bm.height * k));
    c.getContext("2d").drawImage(bm, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", .72);
  } catch (e) { return ""; }
}
async function tutorAnadir(lista) {
  const lim = sample ? await tutorLimites() : {};
  for (const f of Array.from(lista || [])) {
    const tipo = f.type || "";
    if (tipo.startsWith("image/")) {
      if (!lim.images) { aviso("Aquí no se pueden mandar capturas. Pega el código como texto.", "mal"); continue; }
      if (lim.images.mediaTypes && !lim.images.mediaTypes.includes(tipo)) { aviso("Ese formato de imagen no vale: PNG, JPG, WebP o GIF.", "mal"); continue; }
      if (lim.images.maxInputBytes && f.size > lim.images.maxInputBytes) { aviso("«" + (f.name || "La captura") + "» pesa demasiado.", "mal"); continue; }
      if (tutorAdj.filter(a => a.tipo === "img").length >= (lim.images.maxCount || 1)) { aviso("Como mucho " + (lim.images.maxCount || 1) + " capturas por mensaje.", "mal"); continue; }
      tutorAdj.push({ id: uid(), tipo: "img", nombre: f.name || "captura.png", blob: f, mini: await tutorMiniatura(f) });
    } else if (TUTOR_CODIGO.test(f.name || "") || tipo.startsWith("text/")) {
      if (f.size > 2000000) { aviso("«" + f.name + "» es demasiado grande para leerlo entero.", "mal"); continue; }
      const texto = await f.text();
      tutorAdj.push({ id: uid(), tipo: "txt", nombre: f.name, texto, lineas: texto.split("\n").length });
    } else aviso("«" + (f.name || "Ese archivo") + "»: solo capturas y archivos de código o de texto.", "mal");
  }
  pintaAdj();
}

  const e = p.etapa;
  if (e === "eso") return CAT_ESO[p.curso] || CAT_ESO["1.º"];
  if (e === "bach") return CAT_BACH[p.curso + "·" + p.rama] || CAT_BACH["1.º·Ciencias y Tecnología"];
  if (e === "ciclo-sup" || e === "ciclo-medio") {

  if (e === "idioma") return CAT_IDIOMA;

  if (e === "uni") return CAT_UNI;

function normalizarPerfil() {
  if (!S.perfil || typeof S.perfil !== "object") S.perfil = perfilDef();
  const p = S.perfil, d = perfilDef();
  for (const k in d) if (typeof p[k] === "undefined" || p[k] === null) p[k] = d[k];
  if (!p.profe || typeof p.profe !== "object") p.profe = d.profe;
  for (const k in d.profe) if (typeof p.profe[k] === "undefined") p.profe[k] = d.profe[k];
  if (!Array.isArray(p.diasFuertes)) p.diasFuertes = [];
  return p;
}
/* quien ya estaba usando la app no pasa por la pantalla de entrada: se le
   rellena el perfil con lo que ya tenía */
function migrarPerfil() {
  const p = normalizarPerfil();
  if (p.listo || p.etapa) return;
  const usada = Object.keys(S.apuntes || {}).length || (S.tareas || []).length ||
    (S.modulos || []).some(m => (m.pesos || []).some(x => x.nota !== null && x.nota !== undefined && x.nota !== "")) ||
    Object.keys(S.horas || {}).length;
  if (!usada) return;                      /* instalación nueva: que pase por la entrada */
  const curso = String(S.config.curso || "");
  p.etapa = /DAW|DAM|ASIR|superior/i.test(curso) ? "ciclo-sup" : "otro";
  p.curso = /2/.test(curso) ? "2.º" : "1.º";
  p.ciclo = /DAW/i.test(curso) ? "DAW · Desarrollo de Aplicaciones Web" : "";
  p.objetivoNota = num(S.config.objetivo, 5);
  p.horasSemana = Math.max(4, Math.round((S.modulos || []).reduce((s, m) => s + num(m.metaSemanal), 0)) || 12);
  p.listo = true; p.creado = hoyISO();
  guardar("perfil");
}
/* las horas de estudio que se proponen, según si trabajas */
const horasPropuestas = (etapa, trabaja) => {
  const base = etapaDe(etapa).horas;
  return trabaja === "completa" ? Math.max(3, Math.round(base * .4)) : trabaja === "parcial" ? Math.max(4, Math.round(base * .65)) : base;
};
/* reparte esas horas entre las asignaturas, a más horas de clase más estudio */
function repartirMetas(horasSemana) {
  const mods = S.modulos || []; if (!mods.length) return;
  const total = mods.reduce((s, m) => s + Math.max(1, num(m.horas)), 0);
  mods.forEach(m => { m.metaSemanal = Math.max(1, Math.round(horasSemana * Math.max(1, num(m.horas)) / total)); });
}

/* y si tienes Claude, la lista de verdad de tu curso, con su temario */
async function bvPedirAClaude() {
  if (!sample) { BV.aviso = "Para esto hace falta abrir la página desde tu cuenta de Claude."; pintaEntrada(); return; }
  const p = BV.p, e = etapaDe(p.etapa);
  BV.cargando = true; BV.aviso = ""; pintaEntrada();
  const donde = [e.nombre, p.curso, p.rama, p.ciclo, p.centro].filter(Boolean).join(" · ");
  const unidad = porSemana(p.etapa) ? "horas de clase por semana (entre 1 y 8)" : "horas del curso completo (entre 40 y 300)";
  const q = `Eres orientador académico en España y conoces los planes de estudio.
Un estudiante te dice que cursa: ${donde}.
Devuelve SOLO este JSON, sin texto alrededor:
{"asignaturas":[{"cod":"ABC","nombre":"Nombre oficial de la asignatura","horas":4,"temario":"Los contenidos principales en una frase"}]}
Reglas: entre 4 y 14 asignaturas, las reales de ese curso en España; "cod" de 2 a 6 letras mayúsculas; "horas" son ${unidad}; "temario" en una sola frase con los bloques de contenido más importantes. Si no conoces el plan exacto, pon las asignaturas habituales de ese curso.`;
  try {
    const r = await sample.json(q, { modelTier: "default" });
    const lista = (r && Array.isArray(r.asignaturas) ? r.asignaturas : []).slice(0, 14)
      .map(a => ({ id: uid(), cod: String(a.cod || "").toUpperCase().replace(/[^A-ZÑ0-9]/g, "").slice(0, 6) || "ASI",
        nombre: String(a.nombre || "").trim().slice(0, 70), horas: clamp(num(a.horas, 3), 1, 400), temario: String(a.temario || "").trim().slice(0, 300), on: true }))
      .filter(a => a.nombre);
    if (!lista.length) throw new Error("vacío");
    BV.asigs = lista;
    BV.aviso = "Lista traída por el profe. Repásala: quita, añade o renombra lo que no cuadre.";
  } catch (err) {
    BV.aviso = err.code === "rate_limited" ? "Claude está saturado ahora mismo. Prueba en un minuto o sigue a mano."
      : "No he podido traer la lista. Sigue con la propuesta de abajo y la ajustas a mano.";
  }
  BV.cargando = false; pintaEntrada();
}

function bvPuedeSeguir() {
  const p = BV.p;
  if (BV.paso === 0) return !!p.etapa;
  if (BV.paso === 1) {
    if (p.etapa === "bach") return !!p.rama && !!p.curso;
    if (p.etapa === "ciclo-sup" || p.etapa === "ciclo-medio") return !!p.ciclo;
    if (["uni", "oposicion", "idioma", "otro"].includes(p.etapa)) return !!String(p.ciclo || "").trim();
    return !!p.curso;
  }
  if (BV.paso === 2) return BV.asigs.some(a => a.on);
  if (BV.paso === 4) return BV.pesos.length > 0;
  return true;
}
/* guarda lo que hay escrito en los campos antes de cambiar de paso */

  const p = BV.p, v = id => { const el = $("#" + id); return el ? el.value : undefined; };

  if (v("bvCurso") !== undefined) p.curso = v("bvCurso").trim().slice(0, 30);
  if (v("bvCentro") !== undefined) p.centro = v("bvCentro").trim().slice(0, 60);
  if (v("bvRama") !== undefined && BV.paso === 1 && p.etapa === "uni") p.rama = v("bvRama").trim().slice(0, 40);
  if (v("bvHoras") !== undefined) p.horasSemana = clamp(num(v("bvHoras"), 10), 1, 60);

function bvIr(d) {
  bvLeerCampos();

  /* al entrar en las asignaturas se carga la propuesta que toca */

  if (BV.paso === 3 && antes < 3) BV.p.horasSemana = horasPropuestas(BV.p.etapa, BV.p.trabaja);

function bvAplicar() {
  bvLeerCampos();
  const p = normalizarPerfil(), d = BV.p, marcadas = BV.asigs.filter(a => a.on);
  ["nombre", "etapa", "curso", "rama", "ciclo", "centro", "trabaja", "horasSemana", "diasFuertes", "meta", "objetivoNota", "motivo", "cuestaMas"]
    .forEach(k => { p[k] = d[k]; });
  p.profe = clonar(d.profe);
  p.listo = true; p.creado = p.creado || hoyISO();
  S.config.curso = [etapaDe(p.etapa).nombre, p.ciclo || p.rama, p.curso].filter(Boolean).join(" · ").slice(0, 60);
  S.config.objetivo = p.objetivoNota;
  const nuevo = a => ({
    id: uid(), cod: a.cod, nombre: a.nombre, color: 0,
    horas: porSemana(p.etapa) ? Math.round(clamp(num(a.horas, 3), 1, 12) * SEMANAS_CURSO) : clamp(num(a.horas, 100), 10, 600),
    faltas: 0, objetivo: p.objetivoNota, metaSemanal: 2, temario: a.temario || "",
    pesos: BV.pesos.map(x => ({ id: uid(), nombre: x.nombre.trim() || "Apartado", peso: clamp(num(x.peso), 0, 100), nota: null }))
  });
  if (BV.reemplazar) {
    const viejos = S.modulos.map(m => m.id);
    S.modulos = marcadas.map(nuevo);
    viejos.forEach(id => { delete S.horas[id]; });
  } else {
    marcadas.forEach(a => {
      const ya = S.modulos.find(m => m.nombre.toLowerCase() === a.nombre.toLowerCase() || m.cod.toLowerCase() === a.cod.toLowerCase());
      if (ya) { if (!ya.temario && a.temario) ya.temario = a.temario; } else S.modulos.push(nuevo(a));
    });
  }
  /* a cada una su color, sin repetir dos veces el mismo en la lista */
  S.modulos.forEach((m, i) => { if (!m.colorHex) m.color = i % 7; });
  repartirMetas(p.horasSemana);
  guardar("perfil"); guardar("ajustes"); guardar("horas");
  tutorPresentarse();
  BV = null; $("#entrada").hidden = true; document.body.classList.remove("en-entrada");
  seccion = "escritorio"; pinta();
  aviso("Listo. Tu curso ya está montado.");
}

document.addEventListener("click", e => {
  if (!BV) return;
  const t = e.target;
  const et = t.closest("[data-bv-etapa]");
  if (et) { bvLeerCampos(); BV.p.etapa = et.dataset.bvEtapa; BV.asigs = []; BV.pesos = null; BV.p.horasSemana = horasPropuestas(BV.p.etapa, BV.p.trabaja); pintaEntrada(); return; }
  const cu = t.closest("[data-bv-curso]"); if (cu) { bvLeerCampos(); BV.p.curso = cu.dataset.bvCurso; BV.asigs = []; pintaEntrada(); return; }
  const ra = t.closest("[data-bv-rama]"); if (ra) { bvLeerCampos(); BV.p.rama = ra.dataset.bvRama; BV.asigs = []; pintaEntrada(); return; }
  const ci = t.closest("[data-bv-ciclo]"); if (ci) { bvLeerCampos(); BV.p.ciclo = ci.dataset.bvCiclo; BV.asigs = []; pintaEntrada(); return; }
  const tr = t.closest("[data-bv-trabaja]");
  if (tr) { bvLeerCampos(); BV.p.trabaja = tr.dataset.bvTrabaja; BV.p.horasSemana = horasPropuestas(BV.p.etapa, BV.p.trabaja); pintaEntrada(); return; }
  const di = t.closest("[data-bv-dia]");
  if (di) { const d = di.dataset.bvDia, f = BV.p.diasFuertes; bvLeerCampos(); const i = f.indexOf(d); i < 0 ? f.push(d) : f.splice(i, 1); pintaEntrada(); return; }
  const me = t.closest("[data-bv-meta]");
  if (me) { bvLeerCampos(); BV.p.meta = me.dataset.bvMeta; if (BV.p.meta === "matricula") BV.p.objetivoNota = 9; else if (BV.p.meta === "buena") BV.p.objetivoNota = 7; pintaEntrada(); return; }
  const to = t.closest("[data-bv-tono]"); if (to) { bvLeerCampos(); BV.p.profe.tono = to.dataset.bvTono; pintaEntrada(); return; }
  const ca = t.closest("[data-bv-cana]"); if (ca) { bvLeerCampos(); BV.p.profe.cana = ca.dataset.bvCana; pintaEntrada(); return; }
  const av = t.closest("[data-bv-avisos]"); if (av) { bvLeerCampos(); BV.p.profe.avisos = num(av.dataset.bvAvisos); pintaEntrada(); return; }
  const on = t.closest("[data-bv-on]");
  if (on) { const a = BV.asigs.find(x => x.id === on.dataset.bvOn); if (a) a.on = !a.on; pintaEntrada(); return; }
  const qu = t.closest("[data-bv-quitar]"); if (qu) { BV.asigs = BV.asigs.filter(x => x.id !== qu.dataset.bvQuitar); pintaEntrada(); return; }
  if (t.closest("#bvAddAsig")) { BV.asigs.push({ id: uid(), cod: "", nombre: "", horas: porSemana(BV.p.etapa) ? 3 : 100, temario: "", on: true }); pintaEntrada(); setTimeout(() => { const c = document.querySelectorAll(".ent-nom"); if (c.length) c[c.length - 1].focus(); }, 30); return; }
  if (t.closest("#bvCat")) { BV.asigs = []; bvCargarCatalogo(); BV.aviso = ""; pintaEntrada(); return; }
  if (t.closest("#bvIA")) { bvPedirAClaude(); return; }
  const qp = t.closest("[data-bv-quitapeso]"); if (qp) { BV.pesos.splice(num(qp.dataset.bvQuitapeso), 1); pintaEntrada(); return; }
  if (t.closest("#bvAddPeso")) { BV.pesos.push({ nombre: "", peso: 0 }); pintaEntrada(); return; }
  if (t.closest("#bvAtras")) { bvIr(-1); return; }
  if (t.closest("#bvSalir")) { bvCerrar(); return; }
  if (t.closest("#bvSiguiente")) { BV.paso === bvPasos().length - 1 ? bvAplicar() : bvIr(1); return; }
});
document.addEventListener("input", e => {
  if (!BV) return;
  const t = e.target, campo = t.dataset.bvCampo;
  if (campo) {
    const a = BV.asigs.find(x => x.id === t.dataset.id); if (!a) return;
    a[campo] = campo === "horas" ? num(t.value) : campo === "cod" ? t.value.toUpperCase().slice(0, 6) : t.value;
    if (campo === "cod" && t.value !== a.cod) t.value = a.cod;
    return;
  }
  if (t.dataset.bvPeso) {
    const x = BV.pesos[num(t.dataset.i)]; if (!x) return;
    x[t.dataset.bvPeso] = t.dataset.bvPeso === "peso" ? num(t.value) : t.value;
  }
});
document.addEventListener("keydown", e => {
  if (!BV || e.key !== "Enter" || e.target.tagName === "TEXTAREA") return;
  if (e.target.tagName === "INPUT" && e.target.type === "checkbox") return;
  e.preventDefault();
  if (bvPuedeSeguir()) BV.paso === bvPasos().length - 1 ? bvAplicar() : bvIr(1);
});

  if (v("apCiclo") !== undefined) p.ciclo = v("apCiclo").trim().slice(0, 80);
  if (v("apCurso") !== undefined) p.curso = v("apCurso").trim().slice(0, 30);

  if (v("apCentro") !== undefined) p.centro = v("apCentro").trim().slice(0, 60);
  if (v("apHoras") !== undefined) p.horasSemana = clamp(num(v("apHoras"), 10), 1, 60);
  if (v("apNota") !== undefined) p.objetivoNota = clamp(num(v("apNota"), 5), 1, 10);
  if (v("apCuesta") !== undefined) p.cuestaMas = v("apCuesta").trim().slice(0, 120);

}

  const t = e.target;
  const tab = t.closest("[data-aj]"); if (tab) { ajTab = tab.dataset.aj; pinta(); return; }
  if (seccion !== "ajustes") return;

  const tr = t.closest("[data-aj-trabaja]");

  const di = t.closest("[data-aj-dia]");
  if (di) { ajLeerPerfil(); const f = normalizarPerfil().diasFuertes, d = di.dataset.ajDia, i = f.indexOf(d); i < 0 ? f.push(d) : f.splice(i, 1); guardar("perfil"); pinta(); return; }
  if (t.closest("#apGuardarPerfil")) { ajLeerPerfil(); guardar("perfil"); guardar("ajustes"); aviso("Perfil guardado."); pinta(); return; }
  if (t.closest("#apRepartir")) { ajLeerPerfil(); repartirMetas(normalizarPerfil().horasSemana); guardar("perfil"); guardar("ajustes"); aviso("Horas repartidas entre tus " + voc(true) + "."); pinta(); return; }
  if (t.closest("#apReconfig")) { bvAbrir(true); return; }

  const col = t.closest("[data-aj-color]");
  if (col) { const m = modPorId(col.dataset.id); if (m) { m.color = num(col.dataset.ajColor); delete m.colorHex; guardar("ajustes"); pinta(); } return; }
  const aj = t.closest("[data-aj-ajustar]"); if (aj) { dlgModulo(aj.dataset.ajAjustar); return; }
  if (t.closest("#apGuardarAsigs")) { guardar("ajustes"); aviso("Guardado."); pinta(); return; }
  if (t.closest("#apAddMod")) {
    const p = normalizarPerfil();
    S.modulos.push({ id: uid(), cod: "NUEVA", nombre: "Sin nombre", color: S.modulos.length % 7,
      horas: porSemana(p.etapa) ? 3 * SEMANAS_CURSO : 100, faltas: 0, objetivo: p.objetivoNota, metaSemanal: 2, temario: "",
      pesos: pesosDePlantilla(plantillaDe(p)) });
    guardar("ajustes"); pinta(); return;
  }
  const tem = t.closest("[data-aj-temario]");
  if (tem) {
    const m = modPorId(tem.dataset.ajTemario); if (!m || !sample) return;
    tem.disabled = true; tem.textContent = "Preguntando…";
    const p = normalizarPerfil();
    try {
      const r = await sample(`Eres profesor en España. Resume en UNA frase (máximo 40 palabras) los contenidos principales de la asignatura "${m.nombre}" en ${[etapaDe(p.etapa).nombre, p.ciclo, p.curso].filter(Boolean).join(" · ")}. Solo la frase, sin introducción.`, { modelTier: "quick" });
      m.temario = (r.text || "").trim().slice(0, 300);
      guardar("ajustes"); aviso("Temario guardado: el profe ya lo tiene en cuenta."); pinta();
    } catch (err) { aviso("No se ha podido (" + (err.code || "error") + ").", "mal"); tem.disabled = false; tem.textContent = "Temario"; }
    return;
  }

  const pl = t.closest("[data-aj-plantilla]");
  if (pl) { normalizarPerfil().plantilla = pl.dataset.ajPlantilla; guardar("perfil"); pinta(); return; }
  if (t.closest("#apAplicarPlantilla")) {
    const clave = plantillaDe(normalizarPerfil());
    if (!confirm("Esto pone los apartados de «" + clave + "» en todas tus " + voc(true) + " y borra las notas ya puestas. ¿Sigo?")) return;
    S.modulos.forEach(m => { m.pesos = pesosDePlantilla(clave); });
    guardar("ajustes"); aviso("Plantilla aplicada."); pinta(); return;
  }
  if (t.closest("#apGuardarEval")) {
    S.config.pctFaltas = clamp(num($("#apPct").value, 15), 0, 100);
    S.config.objetivo = clamp(num($("#apMin").value, 5), 1, 10);
    guardar("ajustes"); aviso("Guardado."); pinta(); return;
  }
  if (t.closest("#apGuardarCrono")) {
    S.config.pomodoro = clamp(num($("#apPom").value, 25), 5, 90);
    S.config.descanso = clamp(num($("#apDes").value, 15), 1, 45);
    guardar("ajustes"); aviso("Guardado."); pinta(); return;
  }

  const to = t.closest("[data-aj-tono]"); if (to) { normalizarPerfil().profe.tono = to.dataset.ajTono; guardar("perfil"); pinta(); return; }
  const ca = t.closest("[data-aj-cana]"); if (ca) { normalizarPerfil().profe.cana = ca.dataset.ajCana; guardar("perfil"); pinta(); return; }
  const av = t.closest("[data-aj-avisos]"); if (av) { normalizarPerfil().profe.avisos = num(av.dataset.ajAvisos); guardar("perfil"); pinta(); return; }
  if (t.closest("#apGuardarProfe")) {
    const p = normalizarPerfil();
    p.profe.nombre = ($("#apProfeNombre").value || "Profe").trim().slice(0, 20) || "Profe";
    p.profe.puedeCrear = $("#apPuedeCrear").checked;
    guardar("perfil"); aviso("Guardado."); pinta(); return;
  }
  if (t.closest("#apBorrarChat")) {
    if (!confirm("¿Borrar la conversación con el profe? Los repasos que te puso se quedan.")) return;
    const P = normalizarTutor(); P.chat = []; P.avisos = {}; guardar("tutor"); aviso("Conversación borrada."); pinta(); return;
  }

  const te = t.closest("[data-aj-tema]");
  if (te) { const v = te.dataset.ajTema; if (v === "auto") { document.documentElement.removeAttribute("data-theme"); guardaLS("tema", "auto"); } else { document.documentElement.setAttribute("data-theme", v); guardaLS("tema", v); } pintaBotonTema(); pinta(); return; }

  if (t.closest("#apExportar")) {
    if (!descargas) { aviso("Las descargas no están disponibles en esta vista.", "mal"); return; }
    try { await descargas.save({ filename: "el-escritorio-" + hoyISO() + ".json", data: JSON.stringify(S, null, 2) }); aviso("Copia descargada."); }
    catch (err) { if (err.code !== "declined") aviso("No se pudo descargar (" + err.code + ").", "mal"); }
    return;
  }
  if (t.closest("#apImportar")) { $("#apInputImportar").click(); return; }
  if (t.closest("#apBorrarTodo")) {
    if (!confirm("Se borra TODO: perfil, " + voc(true) + ", notas, horas, entregas, apuntes, documentos y la conversación. ¿Seguro?")) return;
    if (!confirm("Última vez: esto no se puede deshacer.")) return;
    S = estadoInicial(); guardarLocal();
    ["ajustes", "agenda", "ingles", "horas", "objetivos", "tutor", "perfil"].forEach(nd => guardar(nd));
    Object.keys(S.apuntes).forEach(k => delete S.apuntes[k]);
    aviso("Todo borrado.");
    bvAbrir(false); return;
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.ajHex) { const m = modPorId(t.dataset.ajHex); if (m) { m.colorHex = t.value; guardar("ajustes"); pinta(); } return; }
  if (t.id === "apEtapa") { ajLeerPerfil(); guardar("perfil"); pinta(); return; }
  if (t.id === "apInputImportar") {
    const f = t.files[0]; if (!f) return;
    try {
      const datos = JSON.parse(await f.text());
      if (!datos || typeof datos !== "object" || !Array.isArray(datos.modulos)) throw new Error("formato");
      if (!confirm("Esto reemplaza lo que tengas ahora por el contenido de la copia. ¿Sigo?")) { t.value = ""; return; }
      S = datos; normalizarPerfil(); normalizarObjetivos(); normalizarTutor(); guardarLocal();
      ["ajustes", "agenda", "ingles", "horas", "objetivos", "tutor", "perfil"].forEach(nd => guardar(nd));
      Object.values(S.apuntes || {}).forEach(n => guardarApunte(n));
      aviso("Copia cargada."); pinta();
    } catch (err) { aviso("Ese archivo no parece una copia de El Escritorio.", "mal"); }
    t.value = ""; return;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (!t.dataset.ajMod) return;
  const m = modPorId(t.dataset.id); if (!m) return;
  m[t.dataset.ajMod] = t.dataset.ajMod === "cod" ? t.value.toUpperCase().slice(0, 6) : t.value;
  if (t.dataset.ajMod === "cod" && t.value !== m.cod) t.value = m.cod;
  clearTimeout(pendientes._aj); pendientes._aj = setTimeout(() => guardar("ajustes"), 700);
});

/* ══════════════════ arranque ══════════════════ */
(function inicio() {
  const tg = leeLS("tema");
  if (tg === "dark" || tg === "light") document.documentElement.setAttribute("data-theme", tg);
  $("#btnAjustes").innerHTML = icono("ajustes");
  pintaBotonTema();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", pintaBotonTema);
  cargarLocal(); cargarTimer(); migrarConfig(); migrarPerfil();
  if (!T.modId && S.modulos[0]) T.modId = S.modulos[0].id;
  tutorMirar();
  pinta();
  if (T.pendienteFin) { T.pendienteFin = false; terminarFase(); }
  /* primera vez: se monta el curso antes de nada */
  if (!normalizarPerfil().listo) bvAbrir(false);
  setInterval(() => { if (seccion === "escritorio" && !T.activo) pintaReloj(); }, 30000);
  if (window.claude && typeof claude.use === "function") conectar();
  else marcaSync("Este dispositivo", false);
})();
</script>
