}

/* ── módulos, de un vistazo ──
   Arriba, cómo va el curso entero en tres datos. Debajo, una tarjeta por
   asignatura con lo único que importa: la nota que llevas en un anillo (con la
   marca de tu objetivo) y una frase que dice qué te toca. Las faltas y las horas
   de la semana, en pequeño. La lógica de riesgo no cambia: solo cómo se enseña. */
function anilloNota(c) {
  const R = 30, L = 2 * Math.PI * R, v = c.media === null ? 0 : clamp(c.media / 10, 0, 1);
  const a = (clamp(c.obj / 10, 0, 1) * 360 - 90) * Math.PI / 180;
  const p = r => (40 + r * Math.cos(a)).toFixed(1) + " " + (40 + r * Math.sin(a)).toFixed(1);
  const etq = (c.media === null ? "Sin notas todavía" : "Llevas un " + nota(c.media) + " de 10") + "; tu objetivo es un " + nota(c.obj);
  return `<div class="m2-anillo" role="img" aria-label="${esc(etq)}">
    <svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="${R}" class="an-fondo"/>
      ${c.media === null ? "" : `<circle cx="40" cy="40" r="${R}" class="an-valor" stroke-dasharray="${(v * L).toFixed(1)} ${L.toFixed(1)}" transform="rotate(-90 40 40)"/>`}
      <path d="M${p(R - 7.5)}L${p(R + 7.5)}" class="an-obj"/></svg>
    <span class="an-num${c.media === null ? " sin" : ""}">${c.media === null ? "—" : nota(c.media)}</span>
  </div>`;
}
function fraseModulo(c) {
  const f = (t, r) => `<strong>${t}</strong>${r}`;
  if (c.imposible) return f("Toca recuperación.", `Con lo que queda no llegas al ${nota(c.obj)}: habla con tu profesor y prepárala con tiempo.`);
  if (c.yaEsta && c.restante <= 0.001) return f(`Cerrado con un ${nota(c.acumulado)}.`, "Buen trabajo.");
  if (c.yaEsta) return f("¡Aprobado asegurado!", `Ya tienes el ${nota(c.obj)} aunque lo que queda salga mal.`);
  if (c.necesita === null) return f("Falta saber cómo te evalúan.", "Añádelo en «Notas y pesos» y te digo lo que necesitas.");
  if (c.media === null) return f("Todo por jugar.", `Con un ${nota(c.necesita)} de media llegas a tu ${nota(c.obj)}.`);
  const resto = ` de media en el ${nota(c.restante)} % que queda.`;
  if (c.necesita <= 5) return f("Vas bien.", `Te basta un ${nota(c.necesita)}${resto}`);
  if (c.necesita > 7) return f("Toca apretar.", `Necesitas un ${nota(c.necesita)}${resto}`);
  return f("A por ello.", `Necesitas un ${nota(c.necesita)}${resto}`);
}
const estadoModulo = c => c.media === null && !c.imposible && c.faltasPct < 0.7
  ? `<span class="estado neutro"><span class="dot"></span>Sin notas aún</span>` : estadoHTML(c);

function vistaModulos() {
  const abierta = modAbierto && modPorId(modAbierto);
  if (abierta) return vistaFichaModulo(abierta);
  const filas = S.modulos.map(m => ({ m, c: calcModulo(m), semana: minutosSemana(m.id), meta: num(m.metaSemanal) * 60 }));
  const conNota = filas.filter(f => f.c.media !== null);
  const media = conNota.length ? conNota.reduce((s, f) => s + f.c.media, 0) / conNota.length : null;
  const cuenta = est => filas.filter(f => f.c.media !== null && f.c.est === est).length;
  const n = { ok: cuenta("ok"), aviso: cuenta("aviso"), riesgo: filas.filter(f => f.c.est === "riesgo").length };
  n.vacio = filas.length - n.ok - n.aviso - n.riesgo;
  const hecho = filas.reduce((s, f) => s + f.semana, 0), metaT = filas.reduce((s, f) => s + f.meta, 0);
  const cods = l => l.map(f => f.m.cod).join(", ").replace(/, ([^,]*)$/, " y $1");

  let lead;
  if (!filas.length) lead = `Añade tus ${voc(true)} para empezar.`;
  else if (!conNota.length) lead = `Aún no hay notas. En cuanto pongas la primera, aquí verás lo que te hace falta para aprobar cada ${voc()}.`;
  else if (n.riesgo) lead = `Vas bien en ${n.ok} de ${filas.length}. Esta semana, prioridad: <strong>${esc(cods(filas.filter(f => f.c.est === "riesgo")))}</strong>.`;
  else if (n.aviso) lead = `Vas bien en ${n.ok} de ${filas.length}. Ojo con <strong>${esc(cods(filas.filter(f => f.c.media !== null && f.c.est === "aviso")))}</strong>.`;
  else lead = `Todo en verde. Sigue así.`;

  const trozo = (k, v) => v ? `<i class="rm-${k}" style="flex:${v}"></i>` : "";
  const leyenda = [["ok", n.ok, "bien"], ["aviso", n.aviso, "ojo"], ["riesgo", n.riesgo, "en riesgo"], ["vacio", n.vacio, "sin notas"]]
    .filter(x => x[1]).map(([k, v, t]) => `<span><i class="rm-${k}"></i>${v} ${t}</span>`).join("");

  return `
  <header class="cab">
    <div>
      <div class="eyebrow">${esc(S.config.curso)}</div>
      <h1 class="titulo">${voc(true, true)}</h1>
      <p class="lead">${lead}</p>
    </div>
    <button class="btn primario" id="btnNuevoMod">${icono("mas")}Añadir ${voc()}</button>
  </header>
  ${filas.length ? `<div class="resumen-mod">
    <div class="panel rm-tile"><div class="rm-etq">Media de tus notas</div>
      <div class="rm-cifra${media === null ? " vacia" : ""}">${media === null ? "—" : nota(media)}</div>
      <div class="rm-sub">${conNota.length ? conNota.length + " de " + filas.length + " con notas" : "Todavía sin notas"}</div></div>
    <div class="panel rm-tile"><div class="rm-etq">Cómo vas</div>
      <div class="rm-cifra">${n.ok}<small>de ${filas.length} van bien</small></div>
      <div class="rm-barra" aria-hidden="true">${trozo("ok", n.ok)}${trozo("aviso", n.aviso)}${trozo("riesgo", n.riesgo)}${trozo("vacio", n.vacio)}</div>
      <div class="rm-leyenda">${leyenda}</div></div>
    <div class="panel rm-tile"><div class="rm-etq">Estudio esta semana</div>
      <div class="rm-cifra">${horasTxt(hecho)}${metaT ? `<small>de ${horasTxt(metaT)}</small>` : ""}</div>
      ${metaT ? `<div class="medidor rm-medidor"><i style="width:${clamp(hecho / metaT * 100, 0, 100)}%"></i></div>` : ""}
      <div class="rm-sub">${!metaT ? "Ponte una meta en cada " + voc() : hecho >= metaT ? "¡Meta de la semana cumplida!" : "Te faltan " + horasTxt(metaT - hecho) + " para tu meta"}</div></div>
  </div>` : ""}
  <div class="rejilla-modulos">
  ${filas.map(({ m, c, semana, meta }) => {
    const faltas = c.faltasPct >= 1 ? ["limite", "Límite de faltas superado"] : c.faltasPct >= 0.7 ? ["ojo", "Faltas cerca del límite"]
      : ["", "Faltas: " + num(m.faltas) + " de " + c.faltasMax + " h"];
    return `<article class="panel modulo mod2" style="${colorMod(m)}">
      <div class="m2-cab">
        <button type="button" class="m2-nombre" data-editar-mod="${m.id}" aria-label="Abrir ${esc(m.nombre)}"><span class="codigo" style="${colorMod(m)}">${esc(m.cod)}</span><span class="m2-t">${esc(m.nombre)}</span></button>
        ${estadoModulo(c)}
      </div>
      <div class="m2-centro">${anilloNota(c)}<p class="m2-frase">${fraseModulo(c)}</p></div>
      <div class="m2-semana"><span>Esta semana</span><span class="num">${horasTxt(semana)}${meta ? " de " + num(m.metaSemanal) + " h" : ""}</span>
        ${meta ? `<div class="medidor"><i style="width:${clamp(semana / meta * 100, 0, 100)}%"></i></div>` : ""}</div>
      <div class="m2-pie"><span class="m2-faltas ${faltas[0]}" title="Pierdes la evaluación continua al pasar de ${c.faltasMax} h (${nota(c.pct)} % de ${num(m.horas)} h).">${faltas[1]}</span>
        <span class="m2-abrir" aria-hidden="true">Ver ficha<svg class="i" viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5"/></svg></span></div>
    </article>`;
  }).join("")}
  </div>`;
}

/* ══════════════════ ficha de una asignatura ══════════════════
   Al entrar en un módulo ya no se abre una ventana con todo junto: se abre su
   ficha, a pantalla completa y por partes. Arriba, cómo vas; en el centro, las
   notas de cada apartado (lo que más se toca); a un lado, faltas y estudio de
   la semana; y los datos de la asignatura, plegados al final. Todo se guarda
   solo mientras escribes. */
let modAbierto = null, fichaNueva = false, fichaT = null;
const guardaFicha = () => { clearTimeout(fichaT); fichaT = setTimeout(() => guardar("ajustes"), 350); };
function abrirFicha(id, nueva) {
  if (!modPorId(id)) return;
  if (seccion !== "modulos") irASeccion("modulos");
  modAbierto = id; fichaNueva = !!nueva; pinta(); window.scrollTo({ top: 0 });
  if (nueva) setTimeout(() => { const n = $("#mdNombreIn"); if (n) { n.focus(); n.select(); } }, 40);
  else $("#principal").focus({ preventScroll: true });
}
function nuevoModulo() {
  const m = { id: uid(), cod: "NUEVO", nombre: mayus(voc()) + " sin nombre", color: S.modulos.length % 7, horas: 100,
              faltas: 0, objetivo: num(S.config.objetivo, 5), metaSemanal: 2, pesos: PESOS_DEF() };
  S.modulos.push(m); guardar("ajustes"); abrirFicha(m.id, true);
}
const delMod = () => voc() === "asignatura" ? "de la asignatura" : "del " + voc();
const puntosDe = p => p.nota === null || p.nota === undefined || p.nota === "" ? null : num(p.nota) * num(p.peso) / 100;
const ICO_X = '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>';
const ICO_ATRAS = '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>';

function mdHero(m, c) {
  return `${anilloNota(c)}
    <div class="md-hero-txt"><p class="m2-frase md-frase">${fraseModulo(c)}</p>
      <dl class="md-cifras">
        <div><dt>Nota actual</dt><dd class="num">${c.media === null ? "—" : nota(c.media)}</dd></div>
        <div><dt>Evaluado</dt><dd class="num">${nota(c.pesoEval)} %</dd></div>
        <div><dt>Necesitas en lo que queda</dt><dd class="num">${c.necesita === null || c.yaEsta || c.imposible ? "—" : nota(c.necesita)}</dd></div>

}
function mdTotal(m) {

  return `<span class="md-suma${ok ? "" : " mal"}">${ok ? "Los pesos suman 100 %" : "Los pesos suman " + nota(suma) + " %: deberían sumar 100 %"}</span>`;
}
function mdAporte(p) {
  const pt = puntosDe(p), max = num(p.peso) / 10;
  return `<div class="md-barra"><i style="width:${max && pt !== null ? clamp(pt / max * 100, 0, 100) : 0}%"></i></div>
    <span class="md-aporta">${pt === null ? "Vale " + nota(max) + (max === 1 ? " punto" : " puntos") : "Aporta " + nota(pt) + " de " + nota(max)}</span>`;
}
const mdFila = p => `<div class="md-fila" data-p="${p.id}">
    <input type="text" class="md-apartado" value="${esc(p.nombre)}" data-campo="nombre" aria-label="Nombre del apartado">
    <label class="md-peso" title="Cuánto cuenta en la nota final"><input type="number" min="0" max="100" step="1" inputmode="numeric" value="${num(p.peso)}" data-campo="peso" aria-label="Peso de ${esc(p.nombre)} en porcentaje"><span aria-hidden="true">%</span></label>
    <input type="number" class="md-nota" min="0" max="10" step="0.01" inputmode="decimal" value="${p.nota === null || p.nota === undefined ? "" : p.nota}" data-campo="nota" placeholder="—" aria-label="Nota de ${esc(p.nombre)}">
    <button type="button" class="md-quitar" data-md-quitar="${p.id}" aria-label="Quitar ${esc(p.nombre)}" title="Quitar apartado">${ICO_X}</button>
    <div class="md-aporte">${mdAporte(p)}</div>
  </div>`;
function mdFaltasHTML(m, c) {
  const est = c.faltasPct >= 1 ? ["limite", "Límite superado"] : c.faltasPct >= 0.7 ? ["ojo", "Cerca del límite"] : ["", "Vas bien"];
  return `<div class="md-caja-cab"><h2>Asistencia</h2><span class="m2-faltas ${est[0]}">${est[1]}</span></div>
    <div class="md-grande"><b class="num">${num(m.faltas)} h</b><span>de ${c.faltasMax} h de faltas permitidas</span></div>
    <div class="medidor faltas${c.faltasPct >= 1 ? " lleno" : ""}"><i style="width:${clamp(c.faltasPct * 100, 0, 100)}%"></i></div>
    <div class="md-caja-pie">
      <span class="paso" role="group" aria-label="Faltas de ${esc(m.nombre)}">
        <button class="btn fantasma" data-quitar-falta="${m.id}" aria-label="Quitar una hora de falta">−</button>
        <span class="num">${num(m.faltas)} h</span>
        <button class="btn fantasma" data-falta="${m.id}" aria-label="Añadir una hora de falta">+</button>
      </span>
      <span class="meta">Límite: ${nota(c.pct)} % de ${num(m.horas)} h</span>
    </div>`;
}
function mdSemanaHTML(m) {
  const semana = minutosSemana(m.id), meta = num(m.metaSemanal) * 60;
  return `<div class="md-caja-cab"><h2>Estudio esta semana</h2>${meta && semana >= meta ? `<span class="m2-faltas bien">Meta cumplida</span>` : ""}</div>
    <div class="md-grande"><b class="num">${horasTxt(semana)}</b><span>${meta ? "de " + horasTxt(meta) + " que te propusiste" : "Sin meta semanal"}</span></div>
    ${meta ? `<div class="medidor"><i style="width:${clamp(semana / meta * 100, 0, 100)}%"></i></div>` : ""}
    <div class="md-caja-pie"><button type="button" class="btn mini" data-plan-empezar="${m.id}">${icono("play")}Empezar a estudiar</button></div>`;
}
const mdCampo = (k, txt, tipo, v, extra) => `<label class="campo">${txt}<input type="${tipo}" data-md-dato="${k}" value="${esc(String(v))}"${k === "nombre" ? ' id="mdNombreIn"' : ""}${extra || ""}></label>`;

function vistaFichaModulo(m) {
  const c = calcModulo(m);
  return `<div class="ficha-mod" style="${colorMod(m)}">
  <nav class="md-migas" aria-label="Estás en">
    <button type="button" class="md-volver" data-md-volver>${ICO_ATRAS}${esc(voc(true, true))}</button>

  <section class="panel md-hero" id="mdHero" aria-label="Cómo vas">${mdHero(m, c)}</section>

      <div class="md-filas-cab" aria-hidden="true"><span>Apartado</span><span>Peso</span><span>Nota</span></div>

      <div class="md-notas-pie"><button type="button" class="btn mini fantasma" data-md-add>${icono("mas")}Añadir apartado</button><span id="mdTotal">${mdTotal(m)}</span></div>

    <div class="md-lado">
      <section class="panel md-caja" id="mdFaltas" aria-label="Asistencia">${mdFaltasHTML(m, c)}</section>
      <section class="panel md-caja" id="mdSemana" aria-label="Estudio esta semana">${mdSemanaHTML(m)}</section>
    </div>
  </div>
  <details class="panel md-datos"${fichaNueva ? " open" : ""}>
    <summary><span class="md-datos-tit">Datos ${delMod()}</span><span class="meta">Nombre, código, horas, objetivo y color</span></summary>
    <div class="md-datos-cuerpo">
      <div class="rejilla-campos md-campos">
        ${mdCampo("nombre", "Nombre", "text", m.nombre, ' autocomplete="off"')}

function refrescaFicha(m) {
  const c = calcModulo(m);
  const pon = (id, html) => { const el = $("#" + id); if (el) el.innerHTML = html; };
  pon("mdHero", mdHero(m, c)); pon("mdEstado", estadoModulo(c)); pon("mdTotal", mdTotal(m)); pon("mdFaltas", mdFaltasHTML(m, c)); pon("mdSemana", mdSemanaHTML(m));
  m.pesos.forEach(p => { const a = document.querySelector('.md-fila[data-p="' + p.id + '"] .md-aporte'); if (a) a.innerHTML = mdAporte(p); });
}

/* escribir en la ficha: se actualiza lo calculado sin tocar lo que estás escribiendo */
alEvento("input", e => {
  const t = e.target, m = modAbierto && modPorId(modAbierto); if (!m || !t.closest(".ficha-mod")) return;
  if (t.dataset.campo) {
    const p = m.pesos.find(x => x.id === t.closest(".md-fila").dataset.p); if (!p) return;
    if (t.dataset.campo === "nombre") p.nombre = t.value;
    else if (t.dataset.campo === "peso") p.peso = clamp(num(t.value, 0), 0, 100);
    else p.nota = t.value === "" ? null : clamp(num(t.value, 0), 0, 10);
  } else if (t.dataset.mdDato) {
    const k = t.dataset.mdDato, v = t.value;
    if (k === "nombre") { m.nombre = v.trim() || m.nombre; $("#mdTit").textContent = m.nombre; $("#mdMiga").textContent = m.nombre; }
    else if (k === "cod") { m.cod = v.trim().toUpperCase() || m.cod; $("#mdCod").textContent = m.cod; }
    else if (k === "horas") m.horas = Math.max(0, num(v, m.horas));
    else if (k === "objetivo") m.objetivo = clamp(num(v, 5), 0, 10);
    else if (k === "metaSemanal") m.metaSemanal = Math.max(0, num(v, 0));
    else if (k === "pctFaltas") m.pctFaltas = clamp(num(v, 15), 0, 100);
  } else return;
  refrescaFicha(m); guardaFicha();
});
/* al soltar un campo: lo guardado queda firme y el menú se pone al día */
alEvento("change", e => {

  clearTimeout(fichaT); guardar("ajustes"); registrarProgreso(); pintaNav();
});
alEvento("click", async e => {
  const t = e.target, m = modAbierto && modPorId(modAbierto);
  if (t.closest("[data-md-nuevo]")) { nuevoModulo(); return; }
  if (!m || !t.closest(".ficha-mod")) return;
  if (t.closest("[data-md-volver]")) { modAbierto = null; pinta(); window.scrollTo({ top: 0 }); return; }
  if (t.closest("[data-md-add]")) {
    const p = { id: uid(), nombre: "Nuevo apartado", peso: 0, nota: null }; m.pesos.push(p); guardar("ajustes"); pinta();
    const f = document.querySelector('.md-fila[data-p="' + p.id + '"] .md-apartado'); if (f) { f.focus(); f.select(); }
    return;

  const q = t.closest("[data-md-quitar]");
  if (q) { m.pesos = m.pesos.filter(x => x.id !== q.dataset.mdQuitar); guardar("ajustes"); pinta(); return; }
  const col = t.closest("[data-md-color]");
  if (col) { m.color = +col.dataset.mdColor; delete m.colorHex; guardar("ajustes"); fichaNueva = !!t.closest("details[open]"); pinta(); return; }
  if (t.closest("[data-md-borrar]")) {
    const ok = await confirmar("Se borra «" + m.nombre + "» con sus notas y las horas que llevas registradas.",
      { titulo: "¿Borrar " + (voc() === "asignatura" ? "esta " : "este ") + voc() + "?", si: "Borrar" });
    if (!ok) return;
    S.modulos = S.modulos.filter(x => x.id !== m.id); delete S.horas[m.id];
    modAbierto = null; guardar("ajustes"); guardar("horas"); pinta(); aviso("Borrado."); return;
  }
});

function vistaEntregas() {
  const hoy = hoyISO();
  const pend = S.tareas.filter(t => !t.hecha), hechas = S.tareas.filter(t => t.hecha);
  const grupos = [
    { t: "Atrasadas", f: x => x.fecha && diasEntre(x.fecha, hoy) < 0 },
    { t: "Esta semana", f: x => x.fecha && diasEntre(x.fecha, hoy) >= 0 && diasEntre(x.fecha, hoy) <= 7 },
    { t: "Más adelante", f: x => x.fecha && diasEntre(x.fecha, hoy) > 7 },
    { t: "Sin fecha", f: x => !x.fecha }
  ];
  const fila = t => {
    const m = modPorId(t.modId), dd = t.fecha ? diasEntre(t.fecha, hoy) : null;
    const cl = dd === null ? "" : dd < 0 ? "riesgo" : dd <= 2 ? "aviso" : "ok";
    const rel = dd === null ? "" : dd < 0 ? "Atrasada " + (-dd) + " d" : dd === 0 ? "Hoy" : dd === 1 ? "Mañana" : "En " + dd + " días";
    return `<div class="fila${t.hecha ? " tachada" : ""}">
      <input type="checkbox" data-hecha="${t.id}" ${t.hecha ? "checked" : ""} aria-label="Marcar ${esc(t.titulo)} como entregada">
      <span class="codigo" style="${colorMod(m)}">${m ? esc(m.cod) : "—"}</span>
      <span class="principal-fila"><span class="t">${esc(t.titulo)}</span>
        ${t.peso ? `<span class="meta">Vale el ${num(t.peso)} % de la nota</span>` : ""}</span>
      ${t.fecha ? `<span class="fecha">${t.fecha}</span>` : ""}
      ${!t.hecha && rel ? `<span class="estado ${cl}"><span class="dot"></span>${rel}</span>` : ""}
      <button class="btn borrar mini cuadrado" data-borrar-tarea="${t.id}" aria-label="Borrar entrega">×</button></div>`;
  };
  return `
  <header class="cab">
    <div>
      <div class="eyebrow">Actividades</div>
      <h1 class="titulo">Entregas</h1>
      <p class="lead">Todo lo que hay que entregar, con su fecha y lo que pesa en la nota.</p>
    </div>
  </header>
  <section class="panel">
    <div class="form-entrega">
      <label class="campo">Qué hay que entregar<input type="text" id="tTitulo" placeholder="Ejercicio 4: bucles anidados"></label>
      <label class="campo">Módulo<select id="tModulo">${S.modulos.map(m => `<option value="${m.id}">${esc(m.cod)} · ${esc(m.nombre)}</option>`).join("")}</select></label>
      <label class="campo">Fecha límite<input type="date" id="tFecha"></label>
      <label class="campo">Peso %<input type="number" id="tPeso" min="0" max="100" placeholder="Opcional"></label>
      <button class="btn primario" id="btnAddTarea">Apuntar</button>
    </div>
  </section>
  ${pend.length ? grupos.map(g => { const items = pend.filter(g.f); return items.length ? `
    <div class="grupo"><div class="grupo-cab"><h2>${g.t}</h2><span class="meta num">${items.length}</span></div>
      <div class="lista">${items.sort((a, b) => (a.fecha || "9").localeCompare(b.fecha || "9")).map(fila).join("")}</div></div>` : ""; }).join("")
    : `<p class="vacio" style="margin-top:24px">No tienes nada pendiente apuntado.</p>`}
  ${hechas.length ? `<details class="grupo"><summary class="etq" style="cursor:pointer">Entregadas · ${hechas.length}</summary>
    <div class="lista" style="margin-top:10px">${hechas.map(fila).join("")}</div></details>` : ""}`;
}

async function comprimirImagen(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
    for (const [ancho, q] of [[1500, .72], [1200, .62], [900, .5], [700, .42]]) {
      const escala = Math.min(1, ancho / img.width);
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * escala); cv.height = Math.round(img.height * escala);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);

/* ── confirmar dentro de la app ──
   Nada de la ventanita del navegador: una tarjeta propia, con el botón de
   borrar en rojo y «Cancelar» como opción segura por defecto. Devuelve una
   promesa que se resuelve a true solo si se pulsa el botón de aceptar; Esc,
   «Cancelar» o un clic fuera de la tarjeta la resuelven a false. */
function confirmar(texto, { titulo = "¿Seguro?", si = "Aceptar", no = "Cancelar", peligro = true } = {}) {
  return new Promise(resolver => {
    const d = $("#dlgConfirmar");
    let hecho = false;

    const icon = peligro
      ? '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.6 4.5l.7 8.3a1 1 0 0 0 1 .9h3.4a1 1 0 0 0 1-.9l.7-8.3"/>'
      : '<circle cx="8" cy="8" r="6"/><path d="M8 7.3v3.6M8 5.2v.1"/>';
    d.innerHTML = `<div class="cf">
      <div class="cf-icono${peligro ? " peligro" : ""}" aria-hidden="true"><svg class="i" viewBox="0 0 16 16">${icon}</svg></div>
      <h3 class="cf-tit" id="cfTit">${esc(titulo)}</h3>

    </div>`;
    d.onclick = e => { const b = e.target.closest("[data-cf]"); if (b) fin(b.dataset.cf === "si"); else if (e.target === d) fin(false); };
    d.oncancel = e => { e.preventDefault(); fin(false); };

}

   Dentro de Claude, con su permiso de descargas. Fuera (GitHub Pages, un

/* una celda para Excel: punto y coma y comillas se protegen, y lo que empieza
   por = + - @ lleva un apóstrofo delante para que no se tome por una fórmula */
function celdaCSV(v) {
  let s = v === null || v === undefined ? "" : String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

    if (!e || e.code !== "declined") aviso("No se pudo descargar" + (e && e.code ? " (" + e.code + ")." : "."), "mal");

/* ══════════════════ oposiciones ══════════════════
   Sirve para cualquier oposición sin saber cuál es: la mecánica es la misma
   para todas —temas numerados, vueltas al temario, un test con
   penalización, simulacros y una fecha— y lo que cambia (el temario, las
   reglas) lo pone cada uno. La app no trae temarios ni preguntas: eso es
   el negocio de las academias y tiene sus derechos.

   Los temas cuelgan de los bloques de siempre (S.modulos), así que las
   horas, los apuntes, las tarjetas y el casillero siguen funcionando igual
   y no hay que tocarlos. Lo nuevo vive en S.opo. */

function OPO_DEF() {
  return {
    v: 1,
    temas: [],
    examen: { fecha: "", preguntas: 100, opciones: 4, penalizacion: null, corte: null, minutos: 90, reserva: 0, bolas: null },
    plan: { vueltas: 3, diasSemana: 6, diasSimulacro: 14 },
    simulacros: [],
    convocatoria: { plazas: null, aspirantes: null, enlace: "", cortes: [], plazoFin: "", presentada: false },
    crono: null
  };
}
const esOpositor = () => normalizarPerfil().etapa === "oposicion";
const TEMA_DEF = [["titulo", ""], ["modId", ""], ["grupo", ""], ["dominado", false], ["dificultad", "normal"], ["notas", ""], ["ley", ""], ["minutos", 0]];
const esFecha = v => /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(new Date(v + "T12:00:00"));

/* lo que llegue —de otra versión, de una copia a medias, de la sincronización—
   se deja con su forma, sin perder lo que ya tuviera. Se arregla en el sitio
   y sin copiar: quien tenga un tema en la mano (la ficha abierta, por
   ejemplo) sigue teniendo el mismo objeto que está en el estado */
function normalizarOpo() {
  if (!S.opo || typeof S.opo !== "object" || Array.isArray(S.opo)) S.opo = OPO_DEF();
  const O = S.opo, d = OPO_DEF();
  ["examen", "plan", "convocatoria"].forEach(k => {
    if (!O[k] || typeof O[k] !== "object" || Array.isArray(O[k])) O[k] = d[k];
    for (const c in d[k]) if (O[k][c] === undefined) O[k][c] = d[k][c];
  });
  if (!Array.isArray(O.temas)) O.temas = [];
  if (!Array.isArray(O.simulacros)) O.simulacros = [];
  if (!Array.isArray(O.convocatoria.cortes)) O.convocatoria.cortes = [];
  const esObj = x => x && typeof x === "object" && !Array.isArray(x);
  if (!O.temas.every(esObj)) O.temas = O.temas.filter(esObj);
  /* los identificadores acaban en atributos del HTML: solo letras, números y guiones */
  const idBueno = id => typeof id === "string" && /^[A-Za-z0-9_-]{1,60}$/.test(id);
  O.temas.forEach((t, i) => {
    if (!idBueno(t.id)) t.id = uid();
    t.n = Math.max(1, Math.round(num(t.n, i + 1)));
    for (const [k, v] of TEMA_DEF) if (t[k] === undefined || t[k] === null) t[k] = v;
    if (typeof t.titulo !== "string") t.titulo = String(t.titulo);
    if (!["facil", "normal", "dificil"].includes(t.dificultad)) t.dificultad = "normal";
    t.dominado = t.dominado === true;
    t.minutos = clamp(num(t.minutos), 0, 1e7);
    const v = Array.isArray(t.vueltas) ? t.vueltas.filter(esFecha).sort() : [];
    if (!Array.isArray(t.vueltas) || v.length !== t.vueltas.length || v.some((f, j) => f !== t.vueltas[j])) t.vueltas = v;
  });
  if (!O.simulacros.every(esObj)) O.simulacros = O.simulacros.filter(esObj);
  O.simulacros.forEach(s => {
    if (!idBueno(s.id)) s.id = uid();
    if (s.fecha !== undefined && !esFecha(s.fecha)) s.fecha = "";
  });
  const c = O.crono;
  if (c !== null && !(esObj(c) && num(c.inicio) > 0 && num(c.minutos) > 0 && num(c.preguntas) > 0)) O.crono = null;
  else if (c) { c.minutos = clamp(Math.round(num(c.minutos)), 1, 600); c.preguntas = clamp(Math.round(num(c.preguntas)), 1, 500); }
  return O;
}
const temaPorId = id => id ? normalizarOpo().temas.find(t => t.id === id) : undefined;

/* ── las reglas del examen ──
   Lo normal es que cada fallo reste lo que vale acertar entre las opciones
   que quedan: con 4 opciones, 1/3; con 3, 1/2. Así contestar al azar sale,
   de media, a cero. Si una convocatoria usa otra cosa, se escribe a mano. */
function penalizacionDe(ex) {
  const e = ex || {};
  if (e.penalizacion !== null && e.penalizacion !== undefined && e.penalizacion !== "") return clamp(num(e.penalizacion, 0), 0, 5);
  const o = Math.round(num(e.opciones, 4));
  return o >= 2 ? 1 / (o - 1) : 0;
}
/* «1/3», «1/2», «0,25»: como se dice en las bases de la convocatoria */
function textoPenalizacion(pen) {
  if (!pen) return "sin penalización";
  for (let k = 2; k <= 10; k++) if (Math.abs(pen - 1 / k) < 1e-6) return "1/" + k;
  if (Math.abs(pen - 1) < 1e-6) return "1";
  return nota(pen);
}
const netaDe = (aciertos, fallos, pen) => num(aciertos) - num(fallos) * pen;
const nota10De = (neta, preguntas) => num(preguntas) > 0 ? clamp(neta / num(preguntas) * 10, 0, 10) : 0;

/* cuántas hay que acertar para llegar al corte, dejando tantas en blanco.
   Si A son aciertos y R las respondidas: A − (R − A)·p ≥ corte, así que
   A ≥ (corte + p·R) / (1 + p). */
function aciertosParaCorte(preguntas, blancos, corte, pen) {
  const n = Math.round(num(preguntas)), b = Math.round(num(blancos)), c = num(corte), p = Math.max(0, num(pen));
  if (!(n > 0) || b < 0 || b >= n) return { valido: false };
  const resp = n - b;
  const a = Math.max(0, Math.ceil((c + p * resp) / (1 + p) - 1e-9));
  if (a > resp) return { valido: true, imposible: true, respondidas: resp };
  const f = resp - a;
  return { valido: true, imposible: false, respondidas: resp, aciertos: a, fallos: f, neta: netaDe(a, f, p) };
}

/* ¿Contesto o la dejo en blanco? Lo que se gana de media contestando al azar
   entre las opciones que no hayas descartado. Por encima de cero, compensa. */
function valorDeArriesgar(opciones, descartadas, pen) {
  const quedan = Math.round(num(opciones)) - Math.round(num(descartadas));
  if (quedan < 1) return 0;
  const p = 1 / quedan;
  return p - (1 - p) * Math.max(0, num(pen));
}

/* ── el tema a desarrollar ──
   En muchas oposiciones sacan unas bolas y eliges uno de los temas que
   salen. Que no salga ninguno de los que llevas es que todas caigan en los
   otros: C(n−k, b) / C(n, b), que es el producto de (n−k−i)/(n−i) por cada
   bola. Lo que interesa es lo contrario: que salga al menos uno. */
function probAlMenosUno(n, k, b) {
  /* ningún temario pasa de unos cientos de temas ni se sacan más de diez
     bolas: los topes son para que un número absurdo no cuelgue la página */
  n = Math.min(5000, Math.round(num(n))); b = Math.round(num(b));
  if (!(n > 0) || !(b > 0)) return 0;
  k = clamp(Math.round(num(k)), 0, n); b = Math.min(b, n, 100);
  let ninguno = 1;
  for (let i = 0; i < b; i++) ninguno *= Math.max(0, n - k - i) / (n - i);
  return clamp(1 - ninguno, 0, 1);
}
/* cuántos temas hay que llevar para llegar a esa probabilidad */
function temasParaProb(n, b, p) {
  n = clamp(Math.round(num(n)), 0, 5000);
  for (let k = 0; k <= n; k++) if (probAlMenosUno(n, k, b) >= num(p) - 1e-12) return k;
  return n;
}
/* los que cuentan como preparados: dominados o con todas las vueltas del plan */
function temasPreparados() {
  const O = normalizarOpo(), obj = clamp(Math.round(num(O.plan.vueltas, 3)), 1, 8);
  return O.temas.filter(t => t.dominado || vueltasDe(t) >= obj);
}
/* azar de verdad para el sorteo, del generador criptográfico */
function azarEntero(n) {
  if (!(n > 0)) return 0;
  if (self.crypto && self.crypto.getRandomValues) { const a = new Uint32Array(1); self.crypto.getRandomValues(a); return a[0] % n; }
  return Math.floor(Math.random() * n);
}
function sacarBolas(b, lista = normalizarOpo().temas) {
  const bolsa = Array.isArray(lista) ? lista.slice() : [], r = [];
  const cuantas = clamp(Math.round(num(b)), 0, bolsa.length);
  while (r.length < cuantas) r.push(bolsa.splice(azarEntero(bolsa.length), 1)[0]);
  return r;
}
const pctTxt = p => p >= 1 ? "100" : !(p > 0) ? "0" : (Math.floor(p * 1000) / 10).toLocaleString("es-ES", { maximumFractionDigits: 1 });

/* ── pegar el índice del temario ──
   Se pega tal cual sale de la convocatoria o del PDF de la academia. Cada
   línea con número es un tema; las líneas en mayúsculas o que empiezan por
   «Bloque», «Parte», «Título»… son los grupos; y si el PDF partió un título
   en dos líneas, la segunda se pega a la primera. */
const RE_GRUPO = /^(bloque|parte|t[ií]tulo|materia|grupo|m[oó]dulo|secci[oó]n|programa)\b/i;
const RE_TEMA = /^\s*(?:tema|t\.?|unidad|lecci[oó]n)?\s*(\d{1,3})\s*(?:[.:)\-–—º°]+|\s)\s*(.*)$/i;
function leerIndice(texto) {
  const lineas = String(texto || "").replace(/\r/g, "").split("\n").map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean);
  const hayNumeros = lineas.some(l => RE_TEMA.test(l) && !RE_GRUPO.test(l));
  const temas = [], grupos = [];
  let grupo = "";
  const esGrupo = l => RE_GRUPO.test(l) || (l.length > 3 && l === l.toUpperCase() && /[A-ZÁÉÍÓÚÑ]{3}/.test(l) && !RE_TEMA.test(l));
  for (const l of lineas) {
    if (esGrupo(l)) { grupo = l.replace(/[.:]+$/, "").slice(0, 120); if (!grupos.includes(grupo)) grupos.push(grupo); continue; }
    const m = l.match(RE_TEMA);
    if (hayNumeros && m && m[2]) { temas.push({ n: +m[1], titulo: m[2].replace(/^[.:\-–—]\s*/, "").slice(0, 300), grupo }); continue; }
    if (hayNumeros && m && !m[2]) { temas.push({ n: +m[1], titulo: "", grupo }); continue; }
    if (hayNumeros && temas.length) { const u = temas[temas.length - 1]; u.titulo = (u.titulo + " " + l).trim().slice(0, 300); continue; }
    temas.push({ n: temas.length + 1, titulo: l.slice(0, 300), grupo });
  }
  temas.forEach((t, i) => { if (!t.titulo) t.titulo = "Tema " + t.n; if (!t.n) t.n = i + 1; });
  return { temas, grupos };
}
/* a qué bloque va cada grupo: «general» al general, «específic» al específico,
   y si no dice, por orden */
function bloqueDeGrupo(grupo, indice) {
  const m = S.modulos, g = sinTildes(grupo || "");
  const por = re => (m.find(x => re.test(sinTildes(x.nombre))) || {}).id;
  if (/especific/.test(g)) return por(/especific/) || (m[1] || m[0] || {}).id || "";
  if (/general|comun/.test(g)) return por(/general/) || (m[0] || {}).id || "";
  const temarios = m.filter(x => /temario/.test(sinTildes(x.nombre)));
  const lista = temarios.length ? temarios : m;
  return (lista[Math.min(indice, lista.length - 1)] || m[0] || {}).id || "";
}
function crearTemas(indice, sustituir) {
  const O = normalizarOpo();
  const base = sustituir ? 0 : O.temas.length;
  const nuevos = indice.temas.map((t, i) => ({
    id: uid(), n: base ? base + i + 1 : t.n, titulo: t.titulo, grupo: t.grupo,
    modId: bloqueDeGrupo(t.grupo, Math.max(0, indice.grupos.indexOf(t.grupo))),
    vueltas: [], dominado: false, dificultad: "normal", notas: "", ley: "", minutos: 0
  }));
  O.temas = sustituir ? nuevos : O.temas.concat(nuevos);
  return nuevos.length;
}

/* muchas convocatorias numeran cada parte desde el 1, y al pegarlas salen
   dos temas 1, dos temas 2… Se puede dejar así, pero entonces «el tema 5»
   ya no dice cuál es */
function numeracionRara() {
  const ns = normalizarOpo().temas.map(t => t.n).sort((a, b) => a - b);
  return ns.some((n, i) => n !== i + 1);
}
/* del 1 al final, respetando el orden de los grupos tal y como se pegaron */
function renumerar() {
  const O = normalizarOpo(), orden = [];
  O.temas.forEach(t => { if (!orden.includes(t.grupo || "")) orden.push(t.grupo || ""); });
  O.temas.sort((a, b) => orden.indexOf(a.grupo || "") - orden.indexOf(b.grupo || "") || a.n - b.n);
  O.temas.forEach((t, i) => { t.n = i + 1; });
  return O.temas.length;
}

/* ── el temario ── */
const vueltasDe = t => (t && Array.isArray(t.vueltas) ? t.vueltas.length : 0);
const ultimaVuelta = t => vueltasDe(t) ? t.vueltas[t.vueltas.length - 1] : "";
const txtVueltas = t => vueltasDe(t) ? vueltasDe(t) + (vueltasDe(t) === 1 ? " vuelta" : " vueltas") : "sin empezar";
/* cuánto aguanta un tema sin volver a él antes de empezar a olvidarse: cuantas
   más vueltas lleva, más tiempo. Es la misma idea que las tarjetas de repaso */
const INTERVALO_VUELTA = [0, 10, 21, 35, 50];
const intervaloDe = t => INTERVALO_VUELTA[Math.min(vueltasDe(t), INTERVALO_VUELTA.length - 1)];
function diasSinTocar(t, hoy = hoyISO()) { const u = ultimaVuelta(t); return u ? diasEntre(hoy, u) : null; }
function retrasoTema(t, hoy = hoyISO()) {
  if (!vueltasDe(t) || t.dominado) return 0;
  return Math.max(0, diasSinTocar(t, hoy) - intervaloDe(t));
}
function estadoTema(t) {
  if (t.dominado) return "dom";
  const v = vueltasDe(t);
  return v === 0 ? "nada" : v === 1 ? "v1" : v === 2 ? "v2" : "v3";
}
const NOMBRE_ESTADO = { nada: "Sin empezar", v1: "1.ª vuelta", v2: "2.ª vuelta", v3: "3.ª vuelta o más", dom: "Dominado" };
function temasFrios(hoy = hoyISO()) {
  return normalizarOpo().temas.map(t => ({ t, retraso: retrasoTema(t, hoy) })).filter(x => x.retraso > 0)
    .sort((a, b) => b.retraso - a.retraso).map(x => x.t);
}
/* los fallos de los simulacros completos, repartidos por tema, si los apuntaste */
function fallosSimDe() {
  const r = {};
  normalizarOpo().simulacros.forEach(s => {
    const f = s.fallosTema;
    if (!f || typeof f !== "object" || Array.isArray(f)) return;
    Object.keys(f).forEach(id => { const n = Math.max(0, Math.round(num(f[id]))); if (n) r[id] = (r[id] || 0) + n; });
  });
  return r;
}
/* los que más se fallan —en los tests de un tema y en los simulacros
   completos— y los que tú marcas como difíciles. Cada fallo apuntado en un
   simulacro completo suma una décima: con dos ya sale */
function temasFlojos() {
  const O = normalizarOpo(), cuenta = {}, sim = fallosSimDe();
  O.simulacros.filter(s => s.tipo === "tema" && s.ref).forEach(s => {
    const c = cuenta[s.ref] || (cuenta[s.ref] = { pregs: 0, fallos: 0 });
    c.pregs += num(s.preguntas); c.fallos += num(s.fallos);
  });
  return O.temas.map(t => {
    const c = cuenta[t.id], tasa = c && c.pregs ? c.fallos / c.pregs : null, fallosSim = sim[t.id] || 0;
    const peso = (tasa === null ? 0 : tasa) + (t.dificultad === "dificil" ? .25 : 0) + Math.min(.6, fallosSim / 10);
    return { t, tasa, fallosSim, peso };
  }).filter(x => !x.t.dominado && x.peso >= .2).sort((a, b) => b.peso - a.peso);
}
function vueltaActual() {
  const T = normalizarOpo().temas; if (!T.length) return 0;
  return Math.min(...T.map(t => t.dominado ? Infinity : vueltasDe(t))) + 1;
}

/* quien ya llevaba meses estudiando no va a pulsar sesenta botones: dice de
   qué tema a qué tema lleva cuántas vueltas y cuándo fue la última. Las
   vueltas de antes se reparten hacia atrás de dos en dos semanas, para que
   los temas se enfríen cuando toca. Nunca quita vueltas que ya estuvieran */
function marcarRango({ desde, hasta, vueltas, haceDias = 7, dominar = false } = {}, hoy = hoyISO()) {
  const a = Math.round(num(desde)), b = Math.round(num(hasta)), v = clamp(Math.round(num(vueltas)), 0, 8);
  const h = clamp(Math.round(num(haceDias, 7)), 0, 3650), ultima = sumaDias(hoy, -h);
  if (!(a >= 1) || !(b >= a) || !ultima || (!v && !dominar)) return 0;
  let n = 0;
  normalizarOpo().temas.forEach(t => {
    if (t.n < a || t.n > b) return;
    let cambia = false;
    if (vueltasDe(t) < v) {
      const f = new Set(t.vueltas);
      for (let k = 0; f.size < v && k < 400; k++) { const x = sumaDias(ultima, -14 * k); if (x) f.add(x); }
      t.vueltas = [...f].sort(); cambia = true;
    }
    if (dominar && !t.dominado) { t.dominado = true; cambia = true; }
    if (cambia) n++;
  });
  return n;
}

/* ── el plan de vueltas ──
   Con la fecha del examen, las vueltas que quieres dar y los días que
   estudias a la semana sale cuántos temas tocan al día. Las últimas semanas
   se reservan para simulacros. Y comparándolo con tu ritmo de verdad de las
   dos últimas semanas, se ve si llegas o no. */
function planOpo(hoy = hoyISO()) {
  const O = normalizarOpo(), ex = O.examen, pl = O.plan;
  const objetivo = clamp(Math.round(num(pl.vueltas, 3)), 1, 8);
  const pendiente = O.temas.reduce((s, t) => s + (t.dominado ? 0 : Math.max(0, objetivo - vueltasDe(t))), 0);
  const hechas14 = O.temas.reduce((s, t) => s + t.vueltas.filter(f => f > sumaDias(hoy, -14) && f <= hoy).length, 0);
  const porSemana = clamp(num(pl.diasSemana, 6), 1, 7);
  /* el ritmo, por día de estudio, que es como lo cuenta un opositor y como se
     cuenta lo que hace falta: si estudias seis días de siete, dos semanas son doce */
  const ritmo = hechas14 / (14 * porSemana / 7);
  const r = { objetivo, pendiente, ritmo, sinFecha: !ex.fecha, temas: O.temas.length };
  if (!ex.fecha) return r;
  const dias = diasEntre(ex.fecha, hoy);
  r.dias = dias;
  if (dias < 0) { r.pasado = true; return r; }
  const reserva = clamp(Math.round(num(pl.diasSimulacro, 14)), 0, 120);
  const utiles = Math.max(0, dias - reserva);
  r.utiles = utiles; r.reserva = reserva;
  r.diasEstudio = Math.max(0, Math.floor(utiles * porSemana / 7));
  r.porDia = r.diasEstudio ? pendiente / r.diasEstudio : (pendiente ? Infinity : 0);
  if (ritmo > 0) {
    /* a tu ritmo, cuántos días de calendario te quedan para acabar */
    /* multiplicando antes de dividir: con 17 temas pendientes y 17 vueltas
       en dos semanas, 17 / (17 / 14) da 14,000000000000002 y el redondeo
       hacia arriba lo convertía en 15, así que quien iba justo a tiempo salía
       como que no llegaba */
    const faltanDias = Math.ceil(pendiente * 14 / hechas14 - 1e-9);
    r.acabas = sumaDias(hoy, faltanDias);
    r.llegas = faltanDias <= utiles;
  }
  r.fase = dias <= reserva ? "final" : "vueltas";
  return r;
}
/* «uno más»: si has acabado lo de hoy y te queda cuerda. Vale solo para hoy */
let opoMas = { fecha: "", n: 0 };
/* lo de hoy: primero lo que se está enfriando, luego lo que lleva menos vueltas */
function temasDeHoy(hoy = hoyISO()) {
  const O = normalizarOpo(), pl = planOpo(hoy);
  const extra = opoMas.fecha === hoy ? opoMas.n : 0;
  const cupo = clamp(Math.ceil(isFinite(pl.porDia) && pl.porDia > 0 ? pl.porDia : 2), 1, 8) + extra;
  const hechosHoy = new Set(O.temas.filter(t => t.vueltas.includes(hoy)).map(t => t.id));
  const frios = temasFrios(hoy).filter(t => !hechosHoy.has(t.id));
  const resto = O.temas.filter(t => !t.dominado && !hechosHoy.has(t.id) && !frios.includes(t) && vueltasDe(t) < pl.objetivo)
    .sort((a, b) => vueltasDe(a) - vueltasDe(b) || (ultimaVuelta(a) || "").localeCompare(ultimaVuelta(b) || "") || a.n - b.n);
  return { lista: frios.concat(resto).slice(0, Math.max(0, cupo - hechosHoy.size)), hechos: hechosHoy.size, cupo };
}
function darVuelta(t, dia = hoyISO()) {
  if (!t) return;
  if (!Array.isArray(t.vueltas)) t.vueltas = [];
  if (!t.vueltas.includes(dia)) { t.vueltas.push(dia); t.vueltas.sort(); }
  guardar("oposicion");
}

/* ── las horas de cada tema ──
   El cronómetro de siempre, con un tema elegido: los minutos van a su bloque,
   como siempre, y además al tema */
function registrarMinutosTema(id, mins) {
  const t = temaPorId(id), m = Math.round(num(mins));
  if (!t || !(m > 0 && m <= 1440)) return;
  t.minutos = Math.max(0, num(t.minutos)) + m;
  guardar("oposicion");
}
function estudiarTema(id) {
  const t = temaPorId(id); if (!t) return;
  if (T.activo || (T.fase === "trabajo" && T.restante > 0)) { aviso("Ya tienes una sesión a medias. Termínala o reiníciala antes de empezar otra."); return; }
  T.temaId = t.id;
  T.modId = modPorId(t.modId) ? t.modId : (T.modId || (S.modulos[0] || {}).id || null);
  T.fase = "trabajo"; T.restante = 0; T.aviso = "";
  iniciarTimer();
  if (T.activo) aviso(num(S.config.pomodoro, 25) + " minutos con el tema " + t.n + ". A por ello.");
}

/* ── los simulacros ── */
function calcSimulacro(s, pen) {
  const n = Math.max(0, Math.round(num(s.preguntas))), a = clamp(Math.round(num(s.aciertos)), 0, n);
  const f = clamp(Math.round(num(s.fallos)), 0, n - a), b = n - a - f;
  const neta = netaDe(a, f, pen);
  return { preguntas: n, aciertos: a, fallos: f, blancos: b, neta, nota10: nota10De(neta, n),
    acierto: a + f ? a / (a + f) : 0, riesgo: n ? (a + f) / n : 0 };
}
function resumenSimulacros() {
  const O = normalizarOpo(), pen = penalizacionDe(O.examen);
  const lista = O.simulacros.filter(s => (s.tipo || "completo") === "completo")
    .slice().sort((a, b) => (a.fecha || "").localeCompare(b.fecha || "")).map(s => Object.assign({ s }, calcSimulacro(s, pen)));
  if (!lista.length) return { n: 0, lista };
  const ult5 = lista.slice(-5), media5 = ult5.reduce((x, y) => x + y.nota10, 0) / ult5.length;
  const prev = lista.slice(-10, -5), mediaPrev = prev.length ? prev.reduce((x, y) => x + y.nota10, 0) / prev.length : null;
  return { n: lista.length, lista, ultima: lista[lista.length - 1], mejor: lista.reduce((a, b) => b.nota10 > a.nota10 ? b : a),
    media5, tendencia: mediaPrev === null ? null : media5 - mediaPrev };
}
/* el corte, escrito en netas; si no hay, el de otros años como referencia */
function corteDe() {
  const O = normalizarOpo();
  if (O.examen.corte !== null && O.examen.corte !== "" && O.examen.corte !== undefined) return { valor: num(O.examen.corte), de: "tuyo" };
  const c = O.convocatoria.cortes.filter(x => x && x.corte !== null && x.corte !== "").sort((a, b) => num(b.anio) - num(a.anio));
  return c.length ? { valor: num(c[0].corte), de: "de " + c[0].anio } : null;
}

/* «3, 7, 7, 12» o «7x2, 12»: de qué temas eran los fallos de un simulacro.
   Devuelve { número de tema: fallos } */
function leerFallosTema(texto) {
  const r = {}, re = /(\d{1,3})(?:\s*[x×*]\s*(\d{1,3}))?/gi;
  let m;
  while ((m = re.exec(String(texto || "")))) {
    const n = +m[1], c = m[2] === undefined ? 1 : +m[2];
    if (n >= 1 && c >= 1) r[n] = (r[n] || 0) + c;
  }
  return r;
}
/* y lo mismo con los temas de verdad: si hay dos temas con el mismo número,
   va al primero; los números que no están en el temario se devuelven aparte */
function fallosPorTema(texto) {
  const O = normalizarOpo(), porN = leerFallosTema(texto), ids = {}, sueltos = [];
  Object.keys(porN).forEach(n => {
    const t = O.temas.find(x => x.n === +n);
    if (t) ids[t.id] = (ids[t.id] || 0) + porN[n]; else sueltos.push(+n);
  });
  return { ids, total: Object.values(ids).reduce((a, b) => a + b, 0), sueltos };
}

/* ── el simulacro con reloj ──
   Como el de verdad: los minutos del examen y sin pausa. Vive en S.opo, así
   que aguanta una recarga y se ve igual desde el móvil. */
function empezarSimulacro(ref = "", ahora = Date.now()) {
  const O = normalizarOpo();
  O.crono = { inicio: ahora, minutos: clamp(Math.round(num(O.examen.minutos, 90)), 1, 600),
    preguntas: clamp(Math.round(num(O.examen.preguntas, 100)), 1, 500), ref: String(ref || "").slice(0, 80), fin: 0 };
  guardar("oposicion"); arrancarCronoOpo();
  return O.crono;
}
const finCrono = c => num(c.inicio) + num(c.minutos) * 60000;
function segsSimulacro(c, ahora = Date.now()) {
  if (!c) return 0;
  const s = Math.ceil((finCrono(c) - num(c.fin || ahora, Date.now())) / 1000 - 1e-9);
  return Number.isFinite(s) ? clamp(s, 0, 36000) : 0;
}
/* los minutos que has tardado de verdad, hacia arriba y sin pasar del límite */
function minutosSimulacro(c, ahora = Date.now()) {
  if (!c) return 0;
  const m = Math.ceil((num(c.fin || ahora, Date.now()) - num(c.inicio)) / 60000 - 1e-9);
  return Number.isFinite(m) ? clamp(m, 1, clamp(Math.round(num(c.minutos, 90)), 1, 600)) : 1;
}
function entregarSimulacro(ahora = Date.now()) {
  const c = normalizarOpo().crono; if (!c || c.fin) return c;
  c.fin = clamp(ahora, num(c.inicio), finCrono(c)); guardar("oposicion");
  return c;
}
function cancelarSimulacro() { normalizarOpo().crono = null; guardar("oposicion"); }
const relojTxt = s => {
  s = Math.max(0, Math.round(num(s)));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0");
  return h ? h + ":" + String(m).padStart(2, "0") + ":" + x : String(m).padStart(2, "0") + ":" + x;
};
const horaDe = ms => new Date(ms).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
/* las horas del simulacro van al bloque de tests, si lo hay */
const bloqueTest = () => ((S.modulos.find(m => /test|simulacro/.test(sinTildes(String(m.nombre || "")))) || S.modulos[0] || {}).id) || "";
let cronoOpoTick = null;
function arrancarCronoOpo() {
  clearInterval(cronoOpoTick); cronoOpoTick = null;
  const c = S.opo && S.opo.crono; if (!c || c.fin) return;
  cronoOpoTick = setInterval(() => {
    const c2 = S.opo && S.opo.crono;
    if (!c2 || c2.fin) { clearInterval(cronoOpoTick); cronoOpoTick = null; return; }
    const s = segsSimulacro(c2);
    document.querySelectorAll("[data-opo-crono]").forEach(el => { el.textContent = relojTxt(s); });
    if (s > 0) return;
    /* si acabó con la página cerrada, se cierra sin pitar: el pitido es para el que está delante */
    const enDirecto = Date.now() - finCrono(c2) < 60000;
    entregarSimulacro(); clearInterval(cronoOpoTick); cronoOpoTick = null;
    if (enDirecto) { pitido(); aviso("¡Tiempo! Corrígelo y apunta cómo te ha ido."); }
    opoTab = "simulacros";
    if (!editando()) pinta();
  }, 1000);
}

/* ── tarjetas y profe para un tema ── */
const tarjetasDeTema = id => normalizarTarjetas().filter(c => c.temaId === id);
function preguntarTema(t) {
  if (!t) return;
  const ex = normalizarOpo().examen;
  /* va al borrador del chat y no solo al cuadro de texto: al cerrarse la ficha
     la app repinta, y el cuadro se vuelve a dibujar con lo que haya en el borrador */
  tutorBorrador = "Hazme 5 preguntas tipo test del tema " + t.n + ", «" + t.titulo + "», con " + ex.opciones + " opciones. De una en una: espera a que conteste antes de corregirme.";
  tutorMod = t.modId || ""; irASeccion("tutor");
  setTimeout(() => {
    const ta = $("#chatTexto"); if (!ta || seccion !== "tutor") return;
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    ta.dispatchEvent(new Event("input", { bubbles: true }));   /* para que crezca a su tamaño */
  }, 80);
}

/* ── el plazo de la solicitud: el despiste que más plazas cuesta ── */
function avisoPlazo(hoy = hoyISO()) {
  const cv = normalizarOpo().convocatoria;
  if (!esFecha(cv.plazoFin) || cv.presentada) return null;
  const d = diasEntre(cv.plazoFin, hoy);
  if (!isFinite(d)) return null;
  if (d < 0) return { d, tipo: "pasado", txt: "El plazo de solicitud terminó el " + fechaCorta(cv.plazoFin) + ". Si la presentaste, márcalo." };
  if (d > 20) return null;
  return { d, tipo: d <= 5 ? "urgente" : "pronto",
    txt: d === 0 ? "Hoy acaba el plazo para presentar la solicitud y pagar la tasa."
      : "Te quedan " + d + (d === 1 ? " día" : " días") + " para presentar la solicitud y pagar la tasa." };
}

/* ── la semana: los últimos siete días contra los siete de antes ── */
function semanaOpo(hoy = hoyISO()) {
  const O = normalizarOpo();
  const cuenta = fin => {
    const ini = sumaDias(fin, -6), en = f => !!f && f >= ini && f <= fin;
    let minutos = 0;
    for (let i = 0; i < 7; i++) minutos += totalDia(sumaDias(fin, -i));
    return {
      vueltas: O.temas.reduce((s, t) => s + t.vueltas.filter(en).length, 0),
      nuevos: O.temas.filter(t => en(t.vueltas[0])).length,
      simulacros: O.simulacros.filter(s => en(s.fecha)).length,
      minutos
    };
  };
  return { esta: cuenta(hoy), antes: cuenta(sumaDias(hoy, -7)) };
}

/* ── el temario en una hoja de cálculo ──
   Punto y coma y marca BOM, que es lo que el Excel en español abre bien. Lo
   que empieza por = + - @ se protege con un apóstrofo: si no, la hoja lo
   toma por una fórmula, y una fórmula pegada en un título puede hacer cosas */
function csvTemario() {
  const O = normalizarOpo(), sim = fallosSimDe();
  const dif = { facil: "fácil", normal: "normal", dificil: "difícil" };
  const filas = [["Nº", "Tema", "Grupo", "Bloque", "Vueltas", "Primera vuelta", "Última vuelta", "Dominado", "Dificultad", "Minutos estudiados", "Fallos en simulacros"]];
  O.temas.slice().sort((a, b) => a.n - b.n).forEach(t => filas.push([t.n, t.titulo, t.grupo, (modPorId(t.modId) || {}).nombre || "",
    vueltasDe(t), t.vueltas[0] || "", ultimaVuelta(t), t.dominado ? "sí" : "no", dif[t.dificultad] || "normal", Math.round(num(t.minutos)), sim[t.id] || 0]));
  return "\uFEFF" + filas.map(f => f.map(celdaCSV).join(";")).join("\r\n") + "\r\n";
}

/* el aviso del simulacro en marcha, que se ve desde cualquier pestaña */

function vistaOposicion() {
  const O = normalizarOpo(), p = normalizarPerfil();
  const nombre = p.ciclo || "Tu oposición";
  const pl = planOpo();
  let lead;
  if (!O.temas.length) lead = "Monta tu oposición en tres pasos. Cuando esté, aquí verás cada día qué temas te tocan.";
  else if (pl.sinFecha) lead = "Aún no hay fecha de examen. Ponla en «Examen y plan» cuando salga y te digo a qué ritmo ir.";
  else if (pl.pasado) lead = "El examen ya pasó. Cambia la fecha si hay una convocatoria nueva.";
  else if (pl.fase === "final") lead = "Recta final: toca simulacros y repasar lo que se enfría, no temas nuevos.";
  else if (pl.llegas === false) lead = isFinite(pl.porDia)
    ? `Llevas ${nota(pl.ritmo)} temas por día de estudio y para llegar a las ${pl.objetivo} vueltas hacen falta <strong>${nota(pl.porDia)}</strong>. A este ritmo no llegas.`
    : `Ya no quedan días de estudio antes de los simulacros para dar las ${pl.objetivo} vueltas. Repasa lo que se enfría y céntrate en los tests.`;
  else if (pl.llegas) lead = `A tu ritmo llegas a las ${pl.objetivo} vueltas con margen. Sigue así.`;
  else lead = `Para dar ${pl.objetivo} vueltas antes del examen, ${pl.porDia ? nota(pl.porDia) + " temas por día de estudio" : "ya las tienes dadas"}.`;

function opoMontar() {

      ${paso(2, !!O.examen.fecha, "La fecha del examen", "Si aún no ha salido, déjalo para luego: lo demás funciona igual.", `<button type="button" class="btn" data-opo-tab="examen">Ponerla</button>`)}
      ${paso(3, corteDe() !== null, "Las reglas del test", "Cuántas preguntas, cuántas opciones y cuánto resta cada fallo. Con eso sale cuántas tienes que acertar.", `<button type="button" class="btn" data-opo-tab="examen">Ponerlas</button>`)}

}

function opoResumen() {
  const O = normalizarOpo();

  const faltanVuelta = va === Infinity ? 0 : O.temas.filter(t => !t.dominado && vueltasDe(t) < va).length;

      <div class="rm-sub">${dom} dominados · ${conteo.nada} sin empezar</div></div>
    <div class="panel rm-tile"><div class="rm-etq">Vuelta</div>
      <div class="rm-cifra">${va === Infinity ? "—" : Math.min(va, pl.objetivo)}<small>de ${pl.objetivo}</small></div>
      <div class="rm-sub">${va === Infinity ? "Todo el temario dominado" : faltanVuelta ? "Te faltan " + faltanVuelta + (faltanVuelta === 1 ? " tema" : " temas") + " para cerrarla" : "Vuelta cerrada"}</div></div>
    <div class="panel rm-tile"><div class="rm-etq">Último simulacro</div>
      ${rs.n ? `<div class="rm-cifra">${nota(rs.ultima.neta)}<small>netas · ${nota(rs.ultima.nota10)}/10</small></div>
        <div class="rm-sub">${corte ? (rs.ultima.neta >= corte.valor ? "Por encima del corte (" + nota(corte.valor) + ")" : "Te faltan " + nota(corte.valor - rs.ultima.neta) + " netas para el corte") : "Pon una nota de corte para compararte"}</div>`
      : `<div class="rm-cifra vacia">—</div><div class="rm-sub">Apunta tu primer simulacro</div>`}</div>
    <div class="panel rm-tile"><div class="rm-etq">Hacen falta</div>
      ${pl.sinFecha ? `<div class="rm-cifra vacia">—</div><div class="rm-sub">Sin fecha de examen</div>`
      : `<div class="rm-cifra">${isFinite(pl.porDia) ? nota(pl.porDia) : "—"}<small>temas al día</small></div>
        <div class="rm-sub">${pl.ritmo ? "Tú llevas " + nota(pl.ritmo) + (isFinite(pl.porDia) && pl.ritmo >= pl.porDia ? ": vas bien" : ": te falta ritmo") : "Aún sin ritmo medido"}</div>`}</div>

    ${hoy.lista.length ? `<div class="opo-lista">${hoy.lista.map(t => filaTema(t, txtVueltas(t))).join("")}</div>`
      : `<div class="opo-hecho"><p class="meta">${hoy.hechos ? (frios.length ? "Plan de hoy hecho. Si te queda cuerda, repasa alguno de los que se enfrían, aquí abajo." : "Plan de hoy hecho. Si te queda cuerda, adelanta uno.") : "No queda nada pendiente para hoy."}</p>
        ${hoy.hechos && !frios.length ? `<button type="button" class="btn mini" id="opoUnoMas">${icono("mas")}Uno más</button>` : ""}</div>`}

function opoSemanaHTML() {
  const s = semanaOpo(), e = s.esta, a = s.antes;
  if (![e.vueltas, e.simulacros, e.minutos, a.vueltas, a.simulacros, a.minutos].some(Boolean)) return "";
  const dif = (x, y, fmt = v => v) => x === y ? "Igual que la anterior" : (x > y ? "+" : "−") + fmt(Math.abs(x - y)) + " que la anterior";
  const item = (cifra, etq, sub) => `<div class="opo-sem"><b>${cifra}</b><span>${etq}</span><em>${sub}</em></div>`;
  return `<section class="panel">
    <div class="opo-cab-sec"><div class="etq">Tus últimos siete días</div><span class="meta">Comparados con los siete de antes</span></div>
    <div class="opo-semana">
      ${item(e.vueltas, e.vueltas === 1 ? "vuelta dada" : "vueltas dadas", dif(e.vueltas, a.vueltas))}
      ${item(e.nuevos, e.nuevos === 1 ? "tema empezado" : "temas empezados", dif(e.nuevos, a.nuevos))}
      ${item(e.simulacros, e.simulacros === 1 ? "simulacro" : "simulacros", dif(e.simulacros, a.simulacros))}
      ${item(horasTxt(e.minutos), "estudiadas", dif(e.minutos, a.minutos, horasTxt))}
    </div>
  </section>`;
}

function opoTemario() {

  const cuenta = k => O.temas.filter(t => estadoTema(t) === k).length;
  return `<section class="panel">

      ${["dom", "v3", "v2", "v1", "nada"].map(k => `<span><i class="opo-e-${k}"></i>${NOMBRE_ESTADO[k]} · ${cuenta(k)}</span>`).join("")}

  /* lo que haya en la ficha se guarda igual al pulsar Guardar que al irte al profe */
  const guardarFicha = () => {
    t.titulo = ($("#otTitulo").value.trim() || t.titulo).slice(0, 300);
    t.n = clamp(Math.round(num($("#otN").value, t.n)), 1, 999);
    t.modId = $("#otBloque").value || t.modId;
    t.dificultad = dificultad;
    t.dominado = $("#otDominado").checked;
    const ley = $("#otLey").value.trim();
    t.ley = /^https?:\/\//i.test(ley) || !ley ? ley.slice(0, 500) : "https://" + ley.slice(0, 490);
    t.notas = $("#otNotas").value.slice(0, 4000);
    guardar("oposicion");
  };
  abrirDlg("Tema " + t.n, cuerpo, [
    { txt: "Borrar el tema", clase: "btn borrar fantasma", izquierda: true, accion: () => {
      confirmar("Se borra «" + t.titulo + "» con sus vueltas y sus notas. Sus tarjetas de repaso se quedan.", { titulo: "¿Borrar el tema?", si: "Borrar" }).then(ok => {
        if (!ok) return; O.temas = O.temas.filter(x => x.id !== t.id); guardar("oposicion"); pinta(); aviso("Tema borrado.");
      });
    } },
    { txt: "Cancelar", clase: "btn fantasma" },
    { txt: "Guardar", clase: "btn primario", accion: () => { guardarFicha(); pinta(); } }
  ]);
  const cuerpoDlg = $("#dlgCuerpo");
  cuerpoDlg.onclick = e => {
    const d = e.target.closest("[data-ot-dif]");
    if (d) { dificultad = d.dataset.otDif; cuerpoDlg.querySelectorAll("[data-ot-dif]").forEach(b => b.classList.toggle("sel", b === d)); return; }
    if (e.target.closest("#otVuelta")) { darVuelta(t); $("#otVueltas").innerHTML = vueltasHTML(); aviso("Vuelta apuntada."); return; }
    if (e.target.closest("#otQuitarVuelta")) { t.vueltas.pop(); guardar("oposicion"); $("#otVueltas").innerHTML = vueltasHTML(); return; }
    if (e.target.closest("#otAddTarj")) {
      const p = $("#otPreg").value.trim(), r = $("#otResp").value.trim();
      if (!p || !r) { aviso("Escribe la pregunta y la respuesta.", "mal"); ( p ? $("#otResp") : $("#otPreg") ).focus(); return; }
      const c = nuevaTarjeta(t.modId, p, r); if (!c) return;
      c.temaId = t.id; guardar("repaso");
      $("#otPreg").value = ""; $("#otResp").value = ""; $("#otNTarj").textContent = tarjTxt(); $("#otPreg").focus();
      aviso("Tarjeta añadida: te sale hoy en Repaso.");
      return;
    }
    if (e.target.closest("#otProfe")) { guardarFicha(); $("#dlg").close(); preguntarTema(t); }
  };
}

function graficaSimulacros(rs, corte, preguntas) {
  if (!rs.n) return "";
  const L = rs.lista.slice(-20), W = 640, H = 170, pad = 28, tope = Math.max(1, num(preguntas, 100));
  /* el eje va de un poco por debajo de lo peor a un poco por encima de lo mejor,
     con el corte dentro: si fuera de 0 a 100 la línea ocuparía un tercio */
  const vals = L.map(s => s.neta).concat(corte ? [corte.valor] : []);
  const min = clamp(Math.floor((Math.min(...vals) - 8) / 5) * 5, 0, tope), max = clamp(Math.ceil((Math.max(...vals) + 8) / 5) * 5, min + 5, tope);
  const x = i => pad + 34 + (L.length === 1 ? (W - 2 * pad - 34) / 2 : i * (W - 2 * pad - 34) / (L.length - 1));
  const y = v => H - pad - (clamp(v, min, max) - min) / (max - min) * (H - 2 * pad);
  const puntos = L.map((s, i) => x(i).toFixed(1) + "," + y(s.neta).toFixed(1)).join(" ");
  return `<svg class="opo-graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Netas de tus últimos ${L.length} simulacros${corte ? ", con el corte en " + nota(corte.valor) : ""}">
    <line x1="${pad + 34}" y1="${H - pad}" x2="${W - pad}" y2="${H - pad}" class="opo-graf-eje"/>
    <text x="${pad + 26}" y="${H - pad + 4}" text-anchor="end" class="opo-graf-eje-txt">${min}</text>
    <text x="${pad + 26}" y="${pad + 4}" text-anchor="end" class="opo-graf-eje-txt">${max}</text>
    ${corte ? `<line x1="${pad + 34}" y1="${y(corte.valor)}" x2="${W - pad}" y2="${y(corte.valor)}" class="opo-graf-corte"/>
      <text x="${pad + 38}" y="${y(corte.valor) - 7}" class="opo-graf-txt">corte ${esc(nota(corte.valor))}</text>` : ""}
    <polyline points="${puntos}" class="opo-graf-linea"/>
    ${L.map((s, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(s.neta).toFixed(1)}" r="4" class="opo-graf-punto${corte && s.neta >= corte.valor ? " arriba" : ""}"><title>${esc(fechaCorta(s.s.fecha || hoyISO()) + ": " + nota(s.neta) + " netas")}</title></circle>`).join("")}
  </svg>`;
}

/* el cálculo de «cuántas tengo que acertar», en vivo, sin repintar */
function opoCalcularCorte() {
  const sal = $("#ocSalida"); if (!sal) return;
  const O = normalizarOpo(), pen = penalizacionDe(O.examen);
  const r = aciertosParaCorte(O.examen.preguntas, $("#ocBlanco").value, $("#ocCorte").value, pen);
  if (!r.valido) { sal.innerHTML = `<span class="opo-err">Las que dejas en blanco tienen que ser menos que el total de preguntas.</span>`; return; }
  sal.innerHTML = r.imposible
    ? `Dejando ${num($("#ocBlanco").value)} en blanco <b>no llegas</b> ni acertando todas las ${r.respondidas}. Te toca arriesgar alguna más.`
    : `Necesitas <b>${r.aciertos} aciertos</b> de ${r.respondidas} contestadas (${r.fallos} fallos como mucho). Te quedarían ${nota(r.neta)} netas.`;
}
function opoCalcularSim() {
  const out = $("#osCalc"); if (!out) return;
  if ($("#osAc").value === "" && $("#osFa").value === "") { out.textContent = "Escribe aciertos y fallos: los blancos salen solos."; return; }
  const O = normalizarOpo(), n = num($("#osPreg").value), a = num($("#osAc").value), f = num($("#osFa").value);
  if (a + f > n) { out.innerHTML = `<span class="opo-err">Aciertos y fallos suman más que las preguntas.</span>`; return; }
  const c = calcSimulacro({ preguntas: n, aciertos: a, fallos: f }, penalizacionDe(O.examen));
  out.innerHTML = `${c.blancos} en blanco · <b>${nota(c.neta)} netas</b> · ${nota(c.nota10)} sobre 10`;
}
/* lo que se ha entendido de «de qué temas eran los fallos» */
function opoCalcularFT() {
  const out = $("#osFTInfo"), inp = $("#osFT"); if (!out || !inp) return;
  if (!inp.value.trim()) { out.textContent = ""; return; }
  const r = fallosPorTema(inp.value), nt = Object.keys(r.ids).length;
  let h = r.total ? r.total + (r.total === 1 ? " fallo" : " fallos") + " en " + nt + (nt === 1 ? " tema." : " temas.") : "No reconozco ningún tema de tu temario.";
  if (r.sueltos.length) h += " No tienes " + (r.sueltos.length === 1 ? "el tema " : "los temas ") + r.sueltos.join(", ") + ".";
  if ($("#osFa").value !== "" && r.total > num($("#osFa").value)) h += ` <span class="opo-err">Son más que los fallos del simulacro (${num($("#osFa").value)}).</span>`;
  out.innerHTML = h;
}
function opoCalcularBolas() {
  const out = $("#obSalida"), inp = $("#obSe"); if (!out || !inp) return;
  const O = normalizarOpo(), n = O.temas.length, b = Math.round(num(O.examen.bolas)), k = clamp(Math.round(num(inp.value)), 0, n);
  out.innerHTML = `Llevando ${k} de ${n} temas y sacando ${b} ${b === 1 ? "bola" : "bolas"}: <b>${pctTxt(probAlMenosUno(n, k, b))} %</b> de que te salga al menos uno que llevas.`;
}

/* guardar un campo del examen, del plan o de la convocatoria */
const LIM_OPO = { preguntas: [1, 500], opciones: [2, 5], penalizacion: [0, 5], corte: [0, 500], minutos: [1, 600], reserva: [0, 50], bolas: [1, 10],
  vueltas: [1, 8], diasSemana: [1, 7], diasSimulacro: [0, 120], plazas: [0, 1e6], aspirantes: [0, 1e7] };
const OPO_VACIABLES = ["penalizacion", "corte", "plazas", "aspirantes", "bolas"];
function ponCampoOpo(ruta, valor) {
  const O = normalizarOpo(), [grupo, clave] = String(ruta).split("."), def = OPO_DEF()[grupo];
  if (!def || typeof def !== "object" || Array.isArray(def) || !O[grupo] || !Object.prototype.hasOwnProperty.call(def, clave)) return;
  const v = valor === null || valor === undefined ? "" : String(valor).trim();
  if (typeof def[clave] === "boolean") O[grupo][clave] = valor === true || valor === "true";
  else if (clave === "fecha" || clave === "plazoFin") O[grupo][clave] = esFecha(v) ? v : "";
  else if (clave === "enlace") O[grupo][clave] = v.slice(0, 500);
  else if (LIM_OPO[clave]) {
    if (v === "" && OPO_VACIABLES.includes(clave)) O[grupo][clave] = null;
    else {
      const lim = LIM_OPO[clave], n = num(v, def[clave] === null ? lim[0] : def[clave]);
      O[grupo][clave] = clamp(["penalizacion", "corte"].includes(clave) ? n : Math.round(n), lim[0], lim[1]);
    }
  }
  guardar("oposicion");
}

alEvento("click", async e => {
  const t = e.target;
  if (seccion !== "oposicion" && !t.closest("[data-opo-vuelta], [data-opo-estudiar], [data-opo-ir], [data-opo-tema], [data-opo-presentada]")) return;
  const tab = t.closest("[data-opo-tab]"); if (tab) { opoTab = tab.dataset.opoTab; pinta(); window.scrollTo({ top: 0 }); return; }
  const ir = t.closest("[data-opo-ir]"); if (ir) { opoTab = ir.dataset.opoIr; irASeccion("oposicion"); return; }
  if (t.closest("#opoPegar")) { abrirPegarIndice(); return; }
  if (t.closest("#opoYaLlevo")) { abrirYaLlevo(); return; }
  if (t.closest("#opoNuevoTema")) {
    const O = normalizarOpo(), n = O.temas.reduce((m, x) => Math.max(m, x.n), 0) + 1;
    const nuevo = { id: uid(), n, titulo: "Tema " + n, grupo: "", modId: (S.modulos[0] || {}).id || "", vueltas: [], dominado: false, dificultad: "normal", notas: "", ley: "", minutos: 0 };
    O.temas.push(nuevo); guardar("oposicion"); pinta(); abrirTema(nuevo.id); return;
  }
  if (t.closest("#opoBajarTemario")) {
    if (await bajarArchivo("temario-" + hoyISO() + ".csv", csvTemario(), "text/csv;charset=utf-8")) aviso("Temario descargado. Ábrelo con Excel o con Hojas de cálculo.");
    return;
  }
  if (t.closest("#opoRenumerar")) {
    const O = normalizarOpo();
    if (!(await confirmar("Los temas se numeran del 1 al " + O.temas.length + " en el orden en que están. Si tu convocatoria numera cada parte desde el 1, quizá prefieras dejarlos como están.", { titulo: "¿Numerar seguido?", si: "Numerar", peligro: false }))) return;
    renumerar(); guardar("oposicion"); pinta(); aviso("Temas numerados del 1 al " + O.temas.length + "."); return;
  }
  const tema = t.closest("[data-opo-tema]"); if (tema) { abrirTema(tema.dataset.opoTema); return; }
  const est = t.closest("[data-opo-estudiar]"); if (est) { estudiarTema(est.dataset.opoEstudiar); return; }
  const vuelta = t.closest("[data-opo-vuelta]");
  if (vuelta) {
    const x = temaPorId(vuelta.dataset.opoVuelta);
    if (x) { darVuelta(x); pinta(); aviso("Vuelta apuntada: tema " + x.n + " · " + txtVueltas(x) + "."); }
    return;
  }
  if (t.closest("[data-opo-presentada]")) { ponCampoOpo("convocatoria.presentada", true); pinta(); aviso("Apuntado: solicitud presentada."); return; }
  if (t.closest("#opoUnoMas")) {
    const hoy = hoyISO();
    opoMas = { fecha: hoy, n: (opoMas.fecha === hoy ? opoMas.n : 0) + 1 };
    if (!temasDeHoy().lista.length) { opoMas.n--; aviso("No queda ningún tema por adelantar: lo tienes todo al día."); return; }
    pinta(); return;
  }
  if (t.closest("#opoEmpezarSim")) {
    empezarSimulacro($("#osRef") ? $("#osRef").value : ""); pinta(); window.scrollTo({ top: 0 });
    aviso("Simulacro en marcha. Suerte."); return;
  }
  if (t.closest("#opoEntregarSim")) {
    entregarSimulacro(); pinta();
    const a = $("#osAc"); if (a) { a.focus(); a.scrollIntoView({ block: "center" }); }
    return;
  }
  if (t.closest("#opoCancelarSim")) {
    const c = normalizarOpo().crono; if (!c) return;
    if (!(await confirmar(c.fin ? "Se descarta el tiempo de este simulacro." : "Se pierde el tiempo que llevas.", { titulo: c.fin ? "¿Descartar el simulacro?" : "¿Cancelar el simulacro?", si: c.fin ? "Descartar" : "Cancelar simulacro", no: "Volver" }))) return;
    cancelarSimulacro(); pinta(); return;
  }
  if (t.closest("#opoSacarBolas")) {
    const O = normalizarOpo(), prep = new Set(temasPreparados().map(x => x.id)), bolas = sacarBolas(O.examen.bolas), bien = bolas.filter(x => prep.has(x.id)).length;
    const out = $("#obBolas"); if (!out) return;
    out.innerHTML = bolas.map(x => `<span class="opo-bola${prep.has(x.id) ? " si" : ""}" title="${esc(x.titulo)}"><b>${x.n}</b>${esc(x.titulo.slice(0, 48))}</span>`).join("")
      + `<p class="meta">${bien ? "Te sale" + (bien === 1 ? " uno que llevas" : "n " + bien + " que llevas") + ": elige el que mejor te sepas." : "Ninguno de los que llevas. En el examen, el que mejor conozcas: siempre hay algo que escribir."}</p>`;
    return;
  }
  if (t.closest("#opoNuevoSim")) {
    const O = normalizarOpo(), n = Math.round(num($("#osPreg").value)), a = Math.round(num($("#osAc").value)), f = Math.round(num($("#osFa").value));
    if (!(n > 0)) { aviso("Pon cuántas preguntas tenía.", "mal"); return; }
    if ($("#osAc").value === "" && $("#osFa").value === "") { aviso("Faltan los aciertos y los fallos.", "mal"); return; }
    if (a < 0 || f < 0 || a + f > n) { aviso("Aciertos y fallos no cuadran con el número de preguntas.", "mal"); return; }
    const ref = $("#osRef").value, [tipo, id] = ref ? ref.split(":") : ["completo", ""];
    const ft = tipo === "tema" ? { total: 0 } : fallosPorTema($("#osFT") ? $("#osFT").value : "");
    if (ft.total > f) { aviso("Has repartido " + ft.total + " fallos por temas y el simulacro tiene " + f + ".", "mal"); return; }
    const mins = Math.round(num($("#osMin").value, 0));
    const s = { id: uid(), fecha: esFecha($("#osFecha").value) ? $("#osFecha").value : hoyISO(), tipo, ref: id || "", preguntas: n, aciertos: a, fallos: f, minutos: mins };
    if (ft.total) s.fallosTema = ft.ids;
    O.simulacros.push(s);
    /* si venía del reloj, ese tiempo es estudio de verdad y de hoy */
    if (O.crono && O.crono.fin) { registrarMinutos(bloqueTest(), clamp(mins, 1, 600)); O.crono = null; }
    guardar("oposicion"); pinta(); aviso("Simulacro apuntado."); return;
  }
  const bs = t.closest("[data-opo-borrar-sim]");
  if (bs) {
    if (!(await confirmar("Se borra este simulacro de la lista y de la gráfica.", { titulo: "¿Borrar el simulacro?", si: "Borrar" }))) return;
    const O = normalizarOpo(); O.simulacros = O.simulacros.filter(s => s.id !== bs.dataset.opoBorrarSim); guardar("oposicion"); pinta(); return;
  }
  if (t.closest("#opoAddCorte")) {
    const O = normalizarOpo(), anio = Math.round(num($("#ocAnio").value)), v = $("#ocValor").value;
    if (anio < 1990 || anio > 2100 || v === "") { aviso("Pon el año y la nota de corte.", "mal"); return; }
    O.convocatoria.cortes = O.convocatoria.cortes.filter(x => num(x.anio) !== anio).concat([{ anio, corte: clamp(num(v), 0, 500) }]);
    guardar("oposicion"); pinta(); return;
  }
  const qc = t.closest("[data-opo-quitar-corte]");
  if (qc) { const O = normalizarOpo(); O.convocatoria.cortes = O.convocatoria.cortes.filter(x => String(x.anio) !== qc.dataset.opoQuitarCorte); guardar("oposicion"); pinta(); }
});
alEvento("change", e => {
  if (seccion !== "oposicion") return;
  const c = e.target.closest("[data-opo-campo]");
  if (c) { ponCampoOpo(c.dataset.opoCampo, c.type === "checkbox" ? c.checked : c.value); pinta(); return; }

/* lo que se le cuenta al profe si opositas. Las notas de cada tema y los
   enlaces no se mandan: solo títulos, números y resultados */
function opoContextoTutor() {
  const O = normalizarOpo();
  if (!O.temas.length && !O.examen.fecha && !O.simulacros.length && !O.convocatoria.plazoFin) return [];
  const ex = O.examen, pen = penalizacionDe(ex), pl = planOpo(), rs = resumenSimulacros(), corte = corteDe();
  const tema = t => t.n + " «" + t.titulo.slice(0, 90) + "»";
  const L = ["LA OPOSICIÓN"];
  L.push("Examen: " + (ex.fecha ? ex.fecha + " (" + cuandoTxt(pl.dias) + ")" : "sin fecha todavía") + "; " + ex.preguntas + " preguntas de "
    + ex.opciones + " opciones, cada fallo resta " + textoPenalizacion(pen) + (corte ? "; corte de " + nota(corte.valor) + " netas" : "") + ".");
  if (num(ex.bolas) > 0 && O.temas.length) {
    const k = temasPreparados().length;
    L.push("Hay tema a desarrollar: sacan " + ex.bolas + " bolas de " + O.temas.length + " temas. Con los " + k + " que lleva preparados, "
      + pctTxt(probAlMenosUno(O.temas.length, k, ex.bolas)) + " % de que le salga al menos uno.");
  }
  const cv = O.convocatoria;
  if (esFecha(cv.plazoFin)) L.push("Plazo de solicitud hasta el " + cv.plazoFin + (cv.presentada ? ": ya la ha presentado." : ": todavía NO la ha presentado."));

  const frios = temasFrios().slice(0, 6); if (frios.length) L.push("Temas que se le enfrían: " + frios.map(tema).join("; ") + ".");
  const flojos = temasFlojos().slice(0, 6); if (flojos.length) L.push("Temas flojos: " + flojos.map(x => tema(x.t)).join("; ") + ".");

const VERSION = "1.0";

/* ── que el navegador no tire tus datos ──
   Sin esto, el navegador puede vaciar el almacenamiento cuando le falta
   espacio. Se pide una sola vez y en silencio: si dice que no, todo sigue
   igual. En el iPhone no existe, y de ahí el aviso de abajo. */
async function pedirPersistencia() {
  try {
    if (!navigator.storage || !navigator.storage.persist) return false;
    if (await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  } catch (e) { return false; }
}

/* ── las otras pestañas ──
   Todo se guarda en una sola clave, así que dos pestañas abiertas se pisaban:
   la última en guardar borraba lo que hubiera escrito la otra. Ahora, cuando
   otra pestaña guarda, esta se entera y se pone al día. Es lo mismo que hace
   la sincronización de Claude entre dispositivos. */
function estadoDeOtraPestana(txt) {
  let nuevo;
  try { nuevo = JSON.parse(txt); } catch (e) { return false; }
  if (!nuevo || typeof nuevo !== "object" || !Array.isArray(nuevo.modulos)) return false;
  /* lo que estés escribiendo ahora mismo manda: ese apunte no se toca */
  const escribiendo = editando() && apunteActivo && S.apuntes && S.apuntes[apunteActivo];
  const mio = escribiendo ? clonar(S.apuntes[apunteActivo]) : null;
  S = nuevo;
  normalizarPerfil(); normalizarObjetivos(); normalizarTutor();
  if (mio) { if (!S.apuntes || typeof S.apuntes !== "object") S.apuntes = {}; S.apuntes[mio.id] = mio; }
  if (editando()) pintaNav(); else pinta();
  return true;
}
function escucharOtrasPestanas() {
  alEvento("storage", e => {

    if (e.key === "desk-daw:estado") estadoDeOtraPestana(e.newValue);

/* ── las copias de seguridad ──
   Fuera de Claude los datos viven solo en este navegador. Si no hay copia
   desde hace semanas, se avisa. El iPhone además borra lo guardado si pasas
   siete días sin abrir la web, salvo que la tengas en la pantalla de inicio. */
const DIAS_COPIA = 21;
const copiaInfo = () => { const c = leeLS("copia"); return c && typeof c === "object" ? c : {}; };
function marcarCopia(dia = hoyISO()) { const c = copiaInfo(); c.fecha = dia; delete c.pospuesta; guardaLS("copia", c); }
function posponerCopia(dia = hoyISO()) { const c = copiaInfo(); c.pospuesta = dia; guardaLS("copia", c); }
function diasSinCopia(hoy = hoyISO()) {
  const c = copiaInfo();
  if (!esFecha(c.fecha)) return null;
  const d = diasEntre(hoy, c.fecha);
  return isFinite(d) ? Math.max(0, d) : null;
}
/* hay algo que perder: un perfil hecho y datos escritos */
function hayCosasQuePerder() {
  const p = normalizarPerfil();
  if (!p.listo) return false;
  return Object.keys(S.apuntes || {}).length > 0 || (S.tareas || []).length > 0 || (S.examenes || []).length > 0
    || Object.keys(S.horas || {}).length > 0 || (normalizarOpo().temas.length > 0);
}
function tocaRecordarCopia(hoy = hoyISO()) {
  if (db || !hayCosasQuePerder()) return false;          /* con la cuenta de Claude, ya hay copia */
  const c = copiaInfo();
  if (esFecha(c.pospuesta) && diasEntre(hoy, c.pospuesta) < 7) return false;
  const d = diasSinCopia(hoy);
  if (d === null) {
    /* nunca ha hecho una: se espera a que lleve una semana usándola */
    const p = normalizarPerfil();
    const desde = String(p.creado || "").slice(0, 10);
    return esFecha(desde) ? diasEntre(hoy, desde) >= 7 : false;
  }
  return d >= DIAS_COPIA;
}

/* ── el calendario del móvil ──
   Un archivo .ics con los exámenes, las entregas y, si opositas, la fecha del
   examen y el plazo de la solicitud. Se abre en el calendario del teléfono y
   ahí sí avisa, que es de lo que se trata: la app no puede avisarte si no la
   abres. */
const escapaICS = s => String(s === null || s === undefined ? "" : s)
  .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
/* el formato manda líneas de 75 octetos como mucho; las largas se parten y
   siguen con un espacio delante */
function plegarICS(linea) {
  const trozos = [];
  let actual = "", bytes = 0, tope = 73;
  for (const ch of String(linea)) {
    const b = new Blob([ch]).size;
    if (bytes + b > tope) { trozos.push(actual); actual = " "; bytes = 1; tope = 74; }
    actual += ch; bytes += b;
  }
  trozos.push(actual);
  return trozos.join("\r\n");
}
const dosDig = n => String(n).padStart(2, "0");
const selloICS = (d = new Date()) => d.getUTCFullYear() + dosDig(d.getUTCMonth() + 1) + dosDig(d.getUTCDate())
  + "T" + dosDig(d.getUTCHours()) + dosDig(d.getUTCMinutes()) + dosDig(d.getUTCSeconds()) + "Z";
const fechaICS = iso => String(iso).replace(/-/g, "");
const horaICS = h => { const [hh, mm] = String(h || "").split(":"); return dosDig(num(hh, 0)) + dosDig(num(mm, 0)) + "00"; };

/* todo lo que tiene fecha de hoy en adelante */
function eventosCalendario(hoy = hoyISO()) {
  const ev = [];

  (S.examenes || []).forEach(x => {

    ev.push({ uid: "ex-" + x.id, titulo: "Examen: " + (x.titulo || "Examen"), fecha: x.fecha, hora: /^\d{1,2}:\d{2}$/.test(x.hora || "") ? x.hora : "",
      minutos: 90, desc: [mod(x.modId), x.temas ? "Entra: " + x.temas : ""].filter(Boolean).join("\n") });
  });
  (S.tareas || []).forEach(t => {
    if (t.hecha || !esFecha(t.fecha) || t.fecha < hoy) return;
    ev.push({ uid: "en-" + t.id, titulo: "Entregar: " + (t.titulo || "Entrega"), fecha: t.fecha, hora: /^\d{1,2}:\d{2}$/.test(t.hora || "") ? t.hora : "",
      minutos: 30, desc: [mod(t.modId), t.peso ? "Vale el " + num(t.peso) + " % de la nota" : ""].filter(Boolean).join("\n") });
  });
  if (esOpositor()) {
    const O = normalizarOpo(), p = normalizarPerfil();
    if (esFecha(O.examen.fecha) && O.examen.fecha >= hoy)
      ev.push({ uid: "opo-examen", titulo: "Examen de la oposición" + (p.ciclo ? ": " + p.ciclo : ""), fecha: O.examen.fecha, hora: "",
        minutos: 0, desc: O.examen.preguntas + " preguntas · " + O.examen.minutos + " minutos" });
    const cv = O.convocatoria;
    if (esFecha(cv.plazoFin) && cv.plazoFin >= hoy && !cv.presentada)

        desc: "Presentar la instancia y pagar la tasa" + (cv.enlace ? "\n" + cv.enlace : "") });
  }

}
function textoICS(eventos, ahora = new Date()) {
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//GritNook//ES", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:GritNook"];
  (eventos || []).forEach(e => {
    if (!esFecha(e.fecha)) return;
    const conHora = /^\d{1,2}:\d{2}$/.test(e.hora || "");
    L.push("BEGIN:VEVENT", "UID:" + escapaICS(e.uid) + "@gritnook", "DTSTAMP:" + selloICS(ahora));
    if (conHora) {
      const ini = new Date(e.fecha + "T" + e.hora + ":00");
      const fin = new Date(ini.getTime() + Math.max(15, num(e.minutos, 60)) * 60000);
      const local = d => d.getFullYear() + dosDig(d.getMonth() + 1) + dosDig(d.getDate()) + "T" + dosDig(d.getHours()) + dosDig(d.getMinutes()) + "00";
      L.push("DTSTART:" + local(ini), "DTEND:" + local(fin));
    } else {
      L.push("DTSTART;VALUE=DATE:" + fechaICS(e.fecha), "DTEND;VALUE=DATE:" + fechaICS(sumaDias(e.fecha, 1)));
    }
    L.push("SUMMARY:" + escapaICS(e.titulo));
    if (e.desc) L.push("DESCRIPTION:" + escapaICS(e.desc));
    /* el aviso: el día antes, y una hora antes si tiene hora */
    L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + escapaICS(e.titulo), "TRIGGER:" + (conHora ? "-P1D" : "-PT15H"), "END:VALARM");
    if (conHora) L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + escapaICS(e.titulo), "TRIGGER:-PT1H", "END:VALARM");
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.map(plegarICS).join("\r\n") + "\r\n";
}
async function bajarCalendario() {
