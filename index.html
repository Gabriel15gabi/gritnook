    <p class="meta">También puedes leer ${siProfe(`<button type="button" class="lg-enlace" data-lg-dlg="ia">cómo funciona el profe</button> y `)}el <button type="button" class="lg-enlace" data-lg-dlg="aviso-legal">aviso legal</button>. Si aún no tienes 14, GritNook no es para ti todavía: que lo use contigo tu padre, tu madre o tu tutor. Si tienes menos de 18, cuéntaselo en casa.</p>
  </div>`;
}

function pintaEntrada() {
  const caja = $("#entrada"); if (!caja || !BV) return;
  const p = BV.p, ultimo = bvPasos().length - 1;
  const puede = bvPuedeSeguir();
  caja.hidden = false;
  document.body.classList.add("en-entrada");
  caja.innerHTML = `
  <div class="ent-caja">${bandaDeApp()}
    <div class="ent-cab">
      <div class="marca">${document.querySelector(".lateral .marca-palabra").outerHTML}</div>
      <div class="ent-pasos">${bvVisibles().map(i => `<span class="ent-punto${i === BV.paso ? " ahora" : i < BV.paso ? " hecho" : ""}" title="${esc(bvPasos()[i])}"></span>`).join("")}</div>
      ${BV.reconfig ? `<button type="button" class="btn mini fantasma" id="bvSalir">Dejarlo como estaba</button>` : `<span class="meta">${bvVisibles().indexOf(BV.paso) + 1} de ${bvVisibles().length}</span>`}
    </div>
    <div class="ent-cuerpo">${[bvPaso0, bvPaso1, bvPaso2, bvPaso3, bvPaso4, bvPaso5, bvPaso6][BV.paso]()}</div>
    <div class="ent-pie">
      ${BV.paso > 0 ? `<button type="button" class="btn fantasma" id="bvAtras">Atrás</button>` : `<span></span>`}
      <button type="button" class="btn primario" id="bvSiguiente"${puede ? "" : " disabled"}>${BV.paso === ultimo ? "Empezar" : "Seguir"}</button>
    </div>
  </div>`;
}
function bvPuedeSeguir() {
  const p = BV.p;
  if (BV.paso === 0) return !!p.etapa;
  if (BV.paso === 1) {
    if (p.etapa === "bach") return !!p.rama && !!p.curso;
    if (p.etapa === "ciclo-sup" || p.etapa === "ciclo-medio") return !!p.ciclo;
    if (["uni", "oposicion", "idioma", "otro"].includes(p.etapa)) return !!String(p.ciclo || "").trim();
    return !!p.curso;
  }
  if (BV.paso === 2) return BV.asigs.some(a => a.on && String(a.nombre || "").trim());
  if (BV.paso === 4) return BV.pesos.length > 0;
  if (BV.paso === bvPasos().length - 1) return !!BV.edadOk && !!BV.legalOk;   /* 14 años y papeles aceptados */
  return true;
}
/* guarda lo que hay escrito en los campos antes de cambiar de paso */
function bvLeerCampos() {
  const p = BV.p, v = id => { const el = $("#" + id); return el ? el.value : undefined; };
  if (v("bvNombre") !== undefined) p.nombre = v("bvNombre").trim().slice(0, 40);
  if (v("bvCiclo") !== undefined && v("bvCiclo").trim()) p.ciclo = v("bvCiclo").trim().slice(0, 80);
  if (v("bvCurso") !== undefined) p.curso = v("bvCurso").trim().slice(0, 30);
  if (v("bvCentro") !== undefined) p.centro = v("bvCentro").trim().slice(0, 60);
  if (v("bvRama") !== undefined && BV.paso === 1 && p.etapa === "uni") p.rama = v("bvRama").trim().slice(0, 40);
  if (v("bvHoras") !== undefined) p.horasSemana = clamp(num(v("bvHoras"), 10), 1, 60);
  if (v("bvNota") !== undefined) p.objetivoNota = clamp(num(v("bvNota"), 5), 1, 10);
  if (v("bvCuesta") !== undefined) p.cuestaMas = v("bvCuesta").trim().slice(0, 120);
  if (v("bvMotivo") !== undefined) p.motivo = v("bvMotivo").trim().slice(0, 120);
  if (v("bvProfeNombre") !== undefined) p.profe.nombre = v("bvProfeNombre").trim().slice(0, 20) || "Profe";
  const pc = $("#bvPuedeCrear"); if (pc) p.profe.puedeCrear = pc.checked;
  const rp = $("#bvReemplazar"); if (rp) BV.reemplazar = rp.checked;
}
/* los pasos que se ven: sin profe, el suyo (el 5) no está */
const bvVisibles = () => bvPasos().map((t, i) => i).filter(i => i !== 5 || profeActivo());
function bvIr(d) {
  bvLeerCampos();
  const antes = BV.paso;
  BV.paso = clamp(BV.paso + d, 0, bvPasos().length - 1);
  if (!bvVisibles().includes(BV.paso)) BV.paso = clamp(BV.paso + (d < 0 ? -1 : 1), 0, bvPasos().length - 1);
  /* al entrar en las asignaturas se carga la propuesta que toca */
  if (BV.paso === 2 && antes < 2 && !BV.asigs.length) bvCargarCatalogo();
  if (BV.paso === 3 && antes < 3) BV.p.horasSemana = horasPropuestas(BV.p.etapa, BV.p.trabaja);
  BV.aviso = "";
  pintaEntrada();
  const caja = $("#entrada"); if (caja) caja.scrollTop = 0;
}
function bvAplicar() {
  bvLeerCampos();
  const p = normalizarPerfil(), d = BV.p, marcadas = BV.asigs.filter(a => a.on);
  ["nombre", "etapa", "curso", "rama", "ciclo", "centro", "trabaja", "horasSemana", "diasFuertes", "meta", "objetivoNota", "motivo", "cuestaMas"]
    .forEach(k => { p[k] = d[k]; });
  p.profe = clonar(d.profe);
  p.listo = true; p.creado = p.creado || hoyISO();
  /* queda constancia de cuándo y qué versión de los papeles se aceptó */
  p.edadOk = true;
  p.aceptado = { fecha: new Date().toISOString(), v: LEGAL_V };
  S.config.curso = [etapaDe(p.etapa).nombre, p.ciclo || p.rama, p.curso].filter(Boolean).join(" · ").slice(0, 60);
  S.config.objetivo = p.objetivoNota;
  const nuevo = a => ({
    id: uid(), cod: a.cod, nombre: a.nombre, color: 0,
    horas: porSemana(p.etapa) ? Math.round(clamp(num(a.horas, 3), 1, 12) * SEMANAS_CURSO) : clamp(num(a.horas, 100), 10, 600),
    faltas: 0, objetivo: p.objetivoNota, metaSemanal: 2, temario: a.temario || "",
    pesos: BV.pesos.map(x => ({ id: uid(), nombre: x.nombre.trim() || "Apartado", peso: clamp(num(x.peso), 0, 100), nota: null }))
  });
  if (BV.reemplazar) {
    const viejos = S.modulos.map(m => m.id);
    S.modulos = marcadas.map(nuevo);
    viejos.forEach(id => { delete S.horas[id]; });
  } else {
    marcadas.forEach(a => {
      const ya = S.modulos.find(m => m.nombre.toLowerCase() === a.nombre.toLowerCase() || m.cod.toLowerCase() === a.cod.toLowerCase());
      if (ya) { if (!ya.temario && a.temario) ya.temario = a.temario; } else S.modulos.push(nuevo(a));
    });
  }
  /* a cada una su color, sin repetir dos veces el mismo en la lista */
  S.modulos.forEach((m, i) => { if (!m.colorHex) m.color = i % 7; });
  repartirMetas(p.horasSemana);
  guardar("perfil"); guardar("ajustes"); guardar("horas");
  tutorPresentarse();
  BV = null; $("#entrada").hidden = true; document.body.classList.remove("en-entrada");
  seccion = esOpositor() ? "oposicion" : "escritorio"; pinta();
  aviso("Listo. Tu curso ya está montado.");
}

/* ── clics y campos de la entrada ── */
alEvento("click", e => {
  if (!BV) return;
  const t = e.target;
  const et = t.closest("[data-bv-etapa]");
  if (et) { bvLeerCampos(); BV.p.etapa = et.dataset.bvEtapa; BV.asigs = []; BV.pesos = null; BV.p.horasSemana = horasPropuestas(BV.p.etapa, BV.p.trabaja); pintaEntrada(); return; }
  const cu = t.closest("[data-bv-curso]"); if (cu) { bvLeerCampos(); BV.p.curso = cu.dataset.bvCurso; BV.asigs = []; pintaEntrada(); return; }
  const ra = t.closest("[data-bv-rama]"); if (ra) { bvLeerCampos(); BV.p.rama = ra.dataset.bvRama; BV.asigs = []; pintaEntrada(); return; }
  const ci = t.closest("[data-bv-ciclo]"); if (ci) { bvLeerCampos(); BV.p.ciclo = ci.dataset.bvCiclo; BV.asigs = []; pintaEntrada(); return; }
  const tr = t.closest("[data-bv-trabaja]");
  if (tr) { bvLeerCampos(); BV.p.trabaja = tr.dataset.bvTrabaja; BV.p.horasSemana = horasPropuestas(BV.p.etapa, BV.p.trabaja); pintaEntrada(); return; }
  const di = t.closest("[data-bv-dia]");
  if (di) { const d = di.dataset.bvDia, f = BV.p.diasFuertes; bvLeerCampos(); const i = f.indexOf(d); i < 0 ? f.push(d) : f.splice(i, 1); pintaEntrada(); return; }
  const me = t.closest("[data-bv-meta]");
  if (me) { bvLeerCampos(); BV.p.meta = me.dataset.bvMeta; if (BV.p.meta === "matricula") BV.p.objetivoNota = 9; else if (BV.p.meta === "buena") BV.p.objetivoNota = 7; pintaEntrada(); return; }
  const to = t.closest("[data-bv-tono]"); if (to) { bvLeerCampos(); BV.p.profe.tono = to.dataset.bvTono; pintaEntrada(); return; }
  const ca = t.closest("[data-bv-cana]"); if (ca) { bvLeerCampos(); BV.p.profe.cana = ca.dataset.bvCana; pintaEntrada(); return; }
  const av = t.closest("[data-bv-avisos]"); if (av) { bvLeerCampos(); BV.p.profe.avisos = num(av.dataset.bvAvisos); pintaEntrada(); return; }
  const on = t.closest("[data-bv-on]");
  if (on) { const a = BV.asigs.find(x => x.id === on.dataset.bvOn); if (a) a.on = !a.on; pintaEntrada(); return; }
  const qu = t.closest("[data-bv-quitar]"); if (qu) { BV.asigs = BV.asigs.filter(x => x.id !== qu.dataset.bvQuitar); pintaEntrada(); return; }
  if (t.closest("#bvAddAsig")) { BV.asigs.push({ id: uid(), cod: "", nombre: "", horas: porSemana(BV.p.etapa) ? 3 : 100, temario: "", on: true }); pintaEntrada(); setTimeout(() => { const c = document.querySelectorAll(".ent-nom"); if (c.length) c[c.length - 1].focus(); }, 30); return; }
  if (t.closest("#bvCat")) { BV.asigs = []; bvCargarCatalogo(); BV.aviso = ""; pintaEntrada(); return; }
  if (t.closest("#bvIA")) { bvPedirAClaude(); return; }
  const qp = t.closest("[data-bv-quitapeso]"); if (qp) { BV.pesos.splice(num(qp.dataset.bvQuitapeso), 1); pintaEntrada(); return; }
  if (t.closest("#bvAddPeso")) { BV.pesos.push({ nombre: "", peso: 0 }); pintaEntrada(); return; }
  if (t.closest("#bvAtras")) { bvIr(-1); return; }
  if (t.closest("#bvSalir")) { bvCerrar(); return; }
  const cas = t.closest("#bvEdad, #bvLegal");
  if (cas) { BV[cas.id === "bvEdad" ? "edadOk" : "legalOk"] = cas.checked; pintaEntrada(); return; }
  if (t.closest("#bvSiguiente")) { BV.paso === bvPasos().length - 1 ? bvAplicar() : bvIr(1); return; }
});
alEvento("input", e => {
  if (!BV) return;
  const t = e.target, campo = t.dataset.bvCampo;
  if (campo) {
    const a = BV.asigs.find(x => x.id === t.dataset.id); if (!a) return;
    a[campo] = campo === "horas" ? num(t.value) : campo === "cod" ? t.value.toUpperCase().slice(0, 6) : t.value;
    if (campo === "cod" && t.value !== a.cod) t.value = a.cod;
    return;
  }
  if (t.dataset.bvPeso) {
    const x = BV.pesos[num(t.dataset.i)]; if (!x) return;
    x[t.dataset.bvPeso] = t.dataset.bvPeso === "peso" ? num(t.value) : t.value;
    return;
  }
  /* Cualquier otro campo escrito a mano: el ciclo, el grado, la plaza de la
     oposición… Antes solo se leían al cambiar de paso, así que quien escribía
     su ciclo en vez de pulsar una sugerencia se encontraba el botón "Seguir"
     apagado para siempre y no pasaba de la segunda pantalla. Se apunta lo
     escrito y se mira si ya se puede seguir, sin repintar: repintar aquí
     dejaría el cursor a mitad de la palabra. */
  if (t.closest("#entrada")) {
    bvLeerCampos();
    /* En los ciclos, la casilla de texto se pinta vacía cuando lo elegido es
       una de las sugerencias, y por eso bvLeerCampos no la deja borrar nada.
       Pero si estás escribiendo en ella, mandas tú: escribir o borrar cambia
       el ciclo, aunque antes hubieras pulsado una sugerencia. */
    if (t.id === "bvCiclo") BV.p.ciclo = t.value.trim().slice(0, 80);
    const seguir = $("#bvSiguiente");
    if (seguir) seguir.disabled = !bvPuedeSeguir();
  }
});
alEvento("keydown", e => {
  if (!BV || e.key !== "Enter" || e.target.tagName === "TEXTAREA") return;
  if (e.target.tagName === "INPUT" && e.target.type === "checkbox") return;
  e.preventDefault();
  if (bvPuedeSeguir()) BV.paso === bvPasos().length - 1 ? bvAplicar() : bvIr(1);
});

const LEGAL = [{"id":"privacidad","nombre":"Privacidad","resumen":"Qué datos se guardan, dónde viven y cómo borrarlos","titulo":"Política de privacidad","html":"<p>En vigor desde el 24 de septiembre de 2026.</p><h3>Lo importante, en pocas líneas</h3><p>Para usar GritNook te haces una <strong>cuenta con tu correo y una contraseña</strong>. No se pide teléfono, ni dirección, ni datos de pago. Lo que escribes —tus asignaturas, tus notas, tus apuntes y tus archivos— se guarda <strong>en tu cuenta, en un servidor de la Unión Europea (Frankfurt, Alemania)</strong>, y en tu navegador, para que funcione también sin conexión. Si abres la app desde Claude, se guarda en tu cuenta de Claude en su lugar.</p><p>El responsable de la app ve <strong>tu correo y cuánto la usas, nunca lo que escribes</strong>, y cuenta <strong>de forma anónima</strong> cuántas veces se abre la app. <strong>No hay publicidad, ni analítica de terceros, y no se vende nada a nadie.</strong> El profe con inteligencia artificial está <strong>apagado por ahora</strong>, así que la app no envía nada a ninguna IA. Puedes descargarte todo o borrar tu cuenta entera cuando quieras, desde Ajustes → Datos.</p><h3>1. Quién responde de tus datos</h3><ul><li><strong>Responsable:</strong> Gabriel Rodríguez Blanco</li><li><strong>NIF:</strong> 09215128V</li><li><strong>Correo para todo lo relacionado con tus datos:</strong> gabriel_gabiz@hotmail.com</li></ul><p>No hace falta delegado de protección de datos. El correo es el canal oficial: por ahí se atienden todas las peticiones, y se responden en un mes como máximo.</p><h3>2. Qué datos se tratan</h3><p>Los que tú escribes o subes a la aplicación: tu nombre o apodo, tu foto de perfil si pones una (es opcional y no hace falta que sea tu cara), qué estudias, tus asignaturas con sus notas y sus faltas, tu agenda, tus apuntes y dibujos, los archivos que subes al casillero, tus tarjetas de repaso, tu vocabulario de inglés, tus minutos de estudio y tus conversaciones con el profe.</p><p>Para tu cuenta: tu <strong>correo electrónico</strong> y tu <strong>contraseña</strong>, que no se guarda tal cual sino cifrada de forma que no se puede leer (nadie puede verla, tampoco el responsable). Y, para saber cuánto se usa la app, <strong>qué días entras</strong> (el día y cuántas veces), cuándo te diste de alta, la última vez que entraste y <strong>de dónde llegaste</strong> al crear la cuenta (por ejemplo, desde Instagram o desde un enlace de WhatsApp).</p><p><strong>Las aperturas, sin saber quién eres.</strong> Cada vez que se abre la app se suma 1 a un contador: el día y la hora, de dónde llega el enlace, si es un móvil, una tableta o un ordenador y si la tienes instalada. No lleva tu nombre, ni tu cuenta, ni tu dirección IP, ni ningún identificador, y no se guarda nada en tu dispositivo para reconocerte: con esos contadores no se puede saber quién es nadie. Puedes apagarlo en <strong>Ajustes → Datos → Estadísticas anónimas</strong>, y si tu navegador pide «no rastrear» no se cuenta nada.</p><p>Como cualquier servidor, el de las cuentas apunta durante un tiempo corto la dirección IP y el navegador de cada conexión, por seguridad.</p><p><strong>Si quieres ver el tiempo en el Inicio</strong>, eliges tu ciudad o dejas que el navegador diga dónde estás. Esa ubicación se redondea a unos 10 km y <strong>se guarda solo en tu dispositivo</strong>: ni en tu cuenta ni en ningún servidor de GritNook. Es opcional, y sin ella la app funciona igual. No hace falta saber dónde está nadie: por eso no se guarda.</p><p>El detalle completo, campo por campo, está en el <span class=\"lg-ref\">inventario de datos</span>, que se actualiza cada vez que la aplicación cambia.</p><p><strong>No se tratan</strong> ni datos de pago, ni ubicación, ni identificadores publicitarios, ni nada que tú no escribas.</p><p>Ten en cuenta que entre tus datos puede haber <strong>datos de salud</strong> si tú los escribes (por ejemplo, un apunte que diga por qué faltaste a clase). La app no te los pide y no los necesita; si los escribes, quedan guardados como cualquier otro apunte. Te recomendamos no escribirlos.</p><h3>3. Para qué se usan y con qué base legal</h3><div class=\"lg-tabla\"><table><thead><tr><th>Para qué</th><th>Base legal</th></tr></thead><tbody><tr><td>Que la app funcione: guardar tu perfil, tus notas, tu agenda y tus apuntes, y calcular lo que te falta para aprobar</td><td>Ejecutar el contrato que aceptas al usarla (art. 6.1.b RGPD)</td></tr><tr><td>Que el profe pueda responderte, explicarte y preguntarte</td><td>Ejecutar el contrato (art. 6.1.b RGPD)</td></tr><tr><td>Crear y mantener tu cuenta, y guardar ahí tus datos para que los veas desde cualquier dispositivo</td><td>Ejecutar el contrato (art. 6.1.b RGPD)</td></tr><tr><td>Mandarte los correos del servicio: cambiar la contraseña o avisarte de un cambio importante</td><td>Ejecutar el contrato (art. 6.1.b RGPD)</td></tr><tr><td>Saber cuánta gente usa la app y cuánto: qué días entra cada cuenta y de dónde llegó, y cuántas veces se abre la app (de forma anónima), para mejorarla</td><td>Interés legítimo en conocer el uso de un servicio que está empezando (art. 6.1.f RGPD). Nunca se apunta lo que haces dentro. Puedes oponerte en Ajustes → Datos o escribiendo al correo de contacto</td></tr><tr><td>Sincronizar entre tus dispositivos, si abres la app desde Claude</td><td>Ejecutar el contrato (art. 6.1.b RGPD)</td></tr><tr><td>Enseñarte el tiempo de tu zona en el Inicio, si lo pides</td><td>Tu consentimiento, que das al elegir tu ciudad o tu ubicación y retiras quitándola (art. 6.1.a RGPD)</td></tr><tr><td>Recordar el tema claro u oscuro y tus preferencias de la libreta</td><td>Interés legítimo en que la app se vea como la dejaste (art. 6.1.f RGPD)</td></tr><tr><td>Atender tus derechos y responder a lo que preguntes</td><td>Obligación legal (art. 6.1.c RGPD)</td></tr></tbody></table></div><p><strong>No se usan</strong> para publicidad, ni para perfilarte, ni para entrenar modelos de inteligencia artificial.</p><p><strong>No hay decisiones automatizadas</strong> con efectos jurídicos sobre ti. Cuando la app dice que una asignatura está «en riesgo» o que un examen es urgente, es una cuenta hecha con los datos que tú has metido, para ayudarte a decidir: no decide nada por ti y no la ve nadie más.</p><h3>4. Cookies y almacenamiento en tu dispositivo</h3><p><strong>No se usan cookies.</strong> La app guarda sus datos en el almacenamiento local del navegador porque es lo que la hace funcionar sin conexión. Si tienes cuenta, ahí se guarda también la sesión (lo que te mantiene dentro sin volver a poner la contraseña) y la lista de cambios que faltan por subir. Para contar las aperturas de la app <strong>no se guarda nada</strong> en tu dispositivo. Es almacenamiento técnico imprescindible para prestar el servicio que pides, así que está exento de pedir consentimiento (art. 22.2 LSSI). No se usa para seguirte ni para medir nada, y se borra entero desde Ajustes → Datos o borrando los datos del sitio en tu navegador.</p><p>Ahí se guardan también tres cosas pequeñas de la propia app: la fecha de tu última copia de seguridad (para recordártela), qué avisos ya has visto (para no repetirlos) y los últimos fallos que haya dado, que no salen de tu dispositivo. Si tu navegador lo permite, la app le pide que <strong>no borre estos datos</strong> cuando ande justo de espacio.</p><h3>5. Quién más ve tus datos</h3><div class=\"lg-tabla\"><table><thead><tr><th>Quién</th><th>Qué ve</th><th>Dónde está</th></tr></thead><tbody><tr><td>Anthropic (proveedor del profe con IA)</td><td><strong>Ahora mismo, nada: el profe está apagado.</strong> Cuando se encienda, solo lo que se le envíe en cada pregunta. El detalle exacto, campo por campo, está en cómo funciona el profe: en resumen, tu nombre o apodo, tu curso, tus asignaturas con sus notas, tus entregas y exámenes, tu horario, los títulos de tus apuntes, el contenido del que tengas abierto, los últimos mensajes y los archivos que adjuntes</td><td>Estados Unidos</td></tr><tr><td>Anthropic (almacenamiento de Claude), solo si abres la app desde allí</td><td>Tus datos sincronizados y tus archivos del casillero</td><td>Estados Unidos</td></tr><tr><td>Supabase, Inc. (el servidor de las cuentas), como encargado de tratamiento</td><td>Tu correo, tu contraseña cifrada, tus datos (también tu foto de perfil, si pones una), tus archivos y los días que entras, para guardarlos. No los usa para nada más</td><td>Unión Europea (Frankfurt, Alemania)</td></tr><tr><td>Open-Meteo (Suiza), solo si pones tu ciudad para ver el tiempo</td><td>La zona aproximada (redondeada a unos 10 km) y, como cualquier web, tu dirección IP. <strong>Nada más: ni tu nombre, ni tu cuenta, ni tus datos de estudio</strong></td><td>Suiza (con decisión de adecuación de la Comisión Europea)</td></tr><tr><td>GitHub Pages (GitHub, Inc.)</td><td>Solo sirve los archivos de la app. Como cualquier servidor web, registra la dirección IP y el navegador de quien la abre, por seguridad. <strong>No recibe ninguno de tus datos de estudio</strong></td><td>Estados Unidos</td></tr></tbody></table></div><p><strong>Lo que ve el responsable de la app.</strong> Tiene un panel con, de cada cuenta: el correo, cuándo se dio de alta, la última vez que entró, cuántos días ha entrado en la última semana y en el último mes, qué estudia (ESO, Bachillerato, FP, universidad, oposición…), de dónde llegó y cuánto espacio ocupa. Y cifras de conjunto: cuántas veces se abre la app y a qué horas, desde dónde, con qué dispositivo y cuánta gente vuelve. <strong>No ve tu foto, ni tus apuntes, ni tus notas, ni tus archivos, ni nada de lo que escribes</strong>: el panel no los lee. Si algún día hiciera falta mirar algo tuyo para arreglar un fallo, se te pedirá que mandes tú una copia.</p><p>A eso se suma una cosa que decides tú: si usas <strong>Ajustes → Datos → Contar un fallo</strong> y le das a enviar, se abre tu programa de correo con un mensaje ya escrito para el responsable de la app. Lleva lo que tú cuentes y unos datos técnicos —versión, navegador, tamaño de pantalla, idioma, cuántos apuntes y documentos tienes y los últimos fallos que la app haya apuntado—, pero <strong>ni tu nombre, ni tus notas, ni tus apuntes</strong>. Puedes leerlo entero antes de mandarlo, y no se envía nada si no le das tú a enviar.</p><p><strong>TutorIA y ChatClase salen como «Próximamente»</strong>: todavía no funcionan y no tratan ningún dato. Antes de encender cualquiera de los dos se actualizará esta política y se avisará dentro de la app.</p><p>No hay nadie más. No se ceden datos a terceros, ni se venden, ni hay anunciantes. Solo se entregarían a jueces, fuerzas de seguridad o administraciones si una ley lo obligara.</p><h3>6. Datos que salen de la Unión Europea</h3><p><strong>Tu cuenta</strong> se guarda en Frankfurt (Alemania). Supabase es una empresa de Estados Unidos: si su personal tuviera que entrar desde fuera de Europa para dar soporte o mantenimiento, lo cubre su contrato de encargado de tratamiento, con las <strong>cláusulas contractuales tipo</strong> de la Comisión Europea.</p><p><strong>Mientras el profe esté apagado, no sale ningún dato tuyo hacia ninguna IA.</strong> Lo que sigue es lo que pasará cuando se encienda.</p><p>El profe con IA se procesa en Estados Unidos. Esa transferencia está amparada en las <strong>cláusulas contractuales tipo</strong> aprobadas por la Comisión Europea y, en su caso, en el <strong>marco de privacidad UE-EE. UU.</strong> al que esté adherido el proveedor. Puedes pedirnos copia de las garantías escribiendo al correo de contacto.</p><p><mark class=\"lg-falta\">RELLENAR: confirmar el mecanismo exacto al firmar el contrato de encargado de tratamiento con el proveedor, y actualizar este párrafo.</mark></p><p>Si no quieres que nada salga de Europa, no uses el profe: el resto de la aplicación funciona sin él.</p><h3>7. Cuánto tiempo se guardan</h3><p>Mientras tú quieras. No hay borrado automático ni caducidad.</p><ul><li>Si borras un apunte o un documento, se borra en ese momento, también de tu cuenta.</li><li>Si pulsas «Borrar todo», se borran tus datos: lo de este dispositivo, lo de tu cuenta y los archivos que hayas subido. La cuenta sigue, vacía.</li><li>Si pulsas <strong>«Borrar mi cuenta»</strong>, se borra al momento del servidor: tu correo, tu contraseña, todos tus datos, tus archivos y los días que entraste. No se puede deshacer.</li><li>Si cierras sesión, se borra lo de ese navegador; lo tuyo sigue en tu cuenta.</li><li>Si la app cierra algún día, se avisará con tiempo para que te descargues lo tuyo, y después se borrarán todas las cuentas.</li></ul><p>El correo que nos escribas para ejercer tus derechos se guarda mientras haga falta para atenderlo y, después, el tiempo que obliguen las leyes de prescripción.</p><h3>8. Tus derechos</h3><p>Puedes pedir, gratis y en cualquier momento:</p><ul><li><strong>Acceso</strong>: saber qué datos hay sobre ti. De hecho, los tienes tú: están en tu cuenta y te los puedes descargar en un clic.</li><li><strong>Rectificación</strong>: corregir lo que esté mal. Se edita directamente en la app.</li><li><strong>Supresión</strong>: que se borre todo. Ajustes → Datos → Borrar mi cuenta.</li><li><strong>Portabilidad</strong>: llevarte tus datos. Ajustes → Datos → Descargar copia, que te da un archivo JSON con absolutamente todo.</li><li><strong>Limitación y oposición</strong> al tratamiento, también a que se cuenten los días que entras o tus aperturas (esto último, en Ajustes → Datos).</li></ul><p>Casi todos los puedes ejercer tú solo desde la app, sin pedir permiso a nadie. Si prefieres escribir, el correo es gabriel_gabiz@hotmail.com. Se responde en un mes como máximo.</p><p>Si crees que no se han respetado tus derechos, puedes reclamar ante la <strong>Agencia Española de Protección de Datos</strong> (www.aepd.es, C/ Jorge Juan 6, 28001 Madrid).</p><h3>9. Menores de edad</h3><p>Para usar GritNook hay que tener <strong>14 años cumplidos</strong>. Es la edad que fija la ley española (art. 7 de la Ley Orgánica 3/2018) para que alguien pueda decidir por sí mismo sobre sus datos en un servicio como este.</p><p>Si tienes menos de 14 años, necesitas que tu padre, tu madre o tu tutor lo autoricen y usen la app contigo.</p><p>Si tienes entre 14 y 18, puedes usarla tú solo, pero es buena idea contárselo en casa, sobre todo porque el profe funciona con inteligencia artificial.</p><p>Padres y tutores: podéis escribir al correo de contacto para preguntar qué datos hay, corregirlos o pedir que se borren.</p><h3>10. Seguridad</h3><p>La app se sirve siempre por conexión cifrada (HTTPS), y todo lo que va y viene de tu cuenta viaja cifrado también. En el servidor, <strong>cada cuenta solo puede leer y escribir lo suyo</strong>: no lo decide la app, que es código que cualquiera puede tocar, sino la propia base de datos. Las contraseñas se guardan cifradas de forma que no se pueden leer.</p><p>Aun así, <strong>quien tenga acceso a tu dispositivo desbloqueado puede ver tus apuntes</strong>, igual que puede ver tus fotos. Si compartes ordenador, <strong>cierra sesión</strong> al terminar (Ajustes → Datos → Cerrar sesión): se borra lo de ese navegador y lo tuyo sigue en tu cuenta.</p><p>Si un día hubiera un problema de seguridad que afectara a tus datos, se avisará a la Agencia Española de Protección de Datos en 72 horas y, si te afecta, también a ti.</p><h3>11. Cambios en esta política</h3><p>Si cambia algo —que se añada una función que guarde datos nuevos, o que cambie el proveedor de IA o el del servidor— se actualiza este texto, se cambia la fecha de arriba y se avisa dentro de la aplicación.</p>"},{"id":"ia","nombre":"Cómo funciona el profe","resumen":"Que es una máquina, qué se le manda y en qué se equivoca","titulo":"Cómo funciona el profe","html":"<p>En vigor desde el 24 de septiembre de 2026.</p><h3>Estás hablando con una máquina</h3><p>El profe de GritNook es un programa de inteligencia artificial. <strong>No es una persona</strong>, aunque escriba como si lo fuera, te anime o se acuerde de lo que hablasteis. Te lo decimos claramente porque lo exige el artículo 50 del Reglamento (UE) 2024/1689 de inteligencia artificial, y porque es de justicia saberlo.</p><p>El modelo lo pone <strong>Anthropic</strong>, y las respuestas se generan en servidores de <strong>Estados Unidos</strong>.</p><h3>Qué se le manda cuando le preguntas</h3><p>Para poder responderte con sentido, se le envía:</p><ul><li>tu nombre o apodo, qué estudias y en qué curso;</li><li>si trabajas, cuántas horas de estudio te has propuesto a la semana, qué días dices que puedes ponerte, qué nota buscas, <strong>qué te cuesta más y para qué estudias</strong> (esas dos las escribes tú y son opcionales: si las dejas en blanco, no hay nada que mandar);</li><li>tus asignaturas con sus notas, lo que te falta para aprobar y, cuando las faltas ya aprietan, cuántas llevas;</li><li>las entregas y exámenes que tengas cerca, con sus fechas y su plan;</li><li>tu horario de clases de hoy y de mañana, solo las horas y la asignatura;</li><li><strong>los títulos</strong> de tus apuntes, para que sepa qué has visto ya;</li><li><strong>el contenido del apunte que tengas abierto en ese momento</strong>, hasta unas 1.200 letras, para que pueda hablar de lo que estás mirando. Si no tienes ninguno abierto, no se manda ningún apunte;</li><li>cuántas tarjetas de repaso te tocan hoy y tus objetivos del día;</li><li>los últimos mensajes de vuestra conversación;</li><li>los archivos o capturas que tú le adjuntes;</li><li><strong>si opositas</strong>: el nombre de tu oposición, la fecha y las reglas del examen (preguntas, opciones, lo que resta cada fallo y la nota de corte), cuántos temas tiene tu temario y por qué vuelta vas, el número y el título de los temas que te tocan hoy, de los que se te enfrían y de los que llevas flojos, y los resultados de tus simulacros. Si hay tema a desarrollar, cuántas bolas se sacan y la probabilidad de que te salga uno que llevas. Y si has puesto el plazo de la solicitud, hasta cuándo es y si ya la has presentado.</li></ul><p><strong>No se le manda</strong> nada que no esté en esa lista. En concreto, <strong>no</strong> se le envían tu foto de perfil, ni los archivos de tu casillero, ni tu vocabulario de inglés, ni lo que hay escrito en tus tarjetas de repaso, ni el nombre de tu centro, ni el de tu aula, ni el texto de los apuntes que no tengas abiertos, ni las notas que escribas en cada tema de la oposición, ni los enlaces que guardes a leyes o a las bases, ni las horas que llevas en cada tema, ni de qué temas eran tus fallos.</p><p>Cuando pulsas «Que el profe me pregunte este tema», la app te deja escrita la petición con el número y el título del tema, pero <strong>no la envía</strong>: la mandas tú.</p><h3>En qué se equivoca</h3><p>Se equivoca. No de vez en cuando: forma parte de cómo funcionan estas máquinas.</p><ul><li>Puede <strong>inventarse</strong> datos, fechas, artículos de ley o funciones de un lenguaje de programación, y contártelo con total seguridad.</li><li>Puede estar <strong>desactualizado</strong> sobre el temario, la convocatoria o la normativa de tu ciclo.</li><li>No conoce las normas de tu centro. <strong>Quien decide cómo te evalúan y cuántas faltas te dejan es tu centro, no la app.</strong></li></ul><p>Regla sencilla: si te lo juegas —una fecha de entrega, una fórmula de un examen, un trámite— <strong>compruébalo en la fuente oficial</strong>.</p><h3>Para qué no sirve</h3><ul><li><strong>No es un médico ni un psicólogo.</strong> Si lo estás pasando mal, habla con alguien de verdad. Teléfono de atención a la conducta suicida: <strong>024</strong>. Emergencias: <strong>112</strong>.</li><li><strong>No es un abogado ni un asesor financiero.</strong></li><li><strong>No atiende emergencias</strong> de ningún tipo.</li><li><strong>No es para copiar.</strong> Está para que entiendas y apruebes. Entregar como tuyo lo que te ha escrito una máquina puede ser una falta académica en tu centro, y el responsable de lo que entregues eres tú.</li></ul><h3>De qué no habla</h3><p>El profe está programado para hablar <strong>solo de tus estudios</strong>: tu ciclo, tus asignaturas y tus dudas profesionales. Si le preguntas por su vida, por la tuya o por cualquier otra cosa, te lo dirá y volverá al tema. No es antipatía: es que un profe de verdad tampoco entra ahí.</p><h3>Qué pasa con lo que le cuentas</h3><ul><li>La conversación se guarda <strong>contigo</strong>, igual que tus apuntes, y se borra con ellos desde Ajustes → Datos.</li><li><strong>No se usa para entrenar modelos.</strong></li><li>El proveedor la procesa para generarte una respuesta y la conserva el tiempo que diga su propia política, en los términos del contrato firmado con él.</li></ul><p><mark class=\"lg-falta\">RELLENAR: confirmar el plazo y las condiciones exactas al firmar el contrato de encargado de tratamiento con el proveedor.</mark></p><h3>Si no lo quieres usar</h3><p>El resto de GritNook —notas, faltas, agenda, apuntes, casillero, repaso— funciona sin el profe.</p><p>Puedes apagarlo del todo en <strong>Ajustes → El profe</strong>, quitando la marca de «Usar el profe con inteligencia artificial». Mientras esté apagado <strong>no sale nada</strong> de la aplicación hacia ninguna IA: ni tu nombre, ni tus notas, ni tus apuntes. Lo que le escribas se guarda en tu dispositivo, pero no se envía a nadie. Se vuelve a encender en el mismo sitio.</p>"},{"id":"terminos","nombre":"Términos de uso","resumen":"Las reglas entre tú y GritNook","titulo":"Términos de uso","html":"<p>En vigor desde el 23 de septiembre de 2026.</p><h3>1. Qué es esto</h3><p>Estas son las reglas entre <strong>Gabriel Rodríguez Blanco</strong>, NIF 09215128V («el titular»), y tú, que usas GritNook. Al usar la aplicación las aceptas. Si no estás de acuerdo con alguna, no la uses.</p><p>Van con ellas la <button type=\"button\" class=\"lg-enlace\" data-lg=\"privacidad\">política de privacidad</button>, el <button type=\"button\" class=\"lg-enlace\" data-lg=\"aviso-legal\">aviso legal</button> y el <button type=\"button\" class=\"lg-enlace\" data-lg=\"ia\">aviso sobre la IA</button>.</p><h3>2. Qué hace la aplicación</h3><p>GritNook te ayuda a organizar los estudios: apuntar asignaturas, notas y faltas, ver qué te falta para aprobar, llevar la agenda de entregas y exámenes, tomar apuntes, guardar documentos y estudiar con un profe que funciona con inteligencia artificial.</p><p>Es una herramienta de apoyo. <strong>No sustituye a tu centro, a tu profesorado ni a las normas de tu ciclo.</strong></p><h3>3. Quién puede usarla</h3><p>Hay que tener <strong>14 años cumplidos</strong>. Con menos, hace falta que tu padre, tu madre o tu tutor lo autoricen y la usen contigo.</p><p>Si tienes entre 14 y 18 años puedes usarla, pero al aceptar estos términos estás diciendo que en casa lo saben.</p><h3>4. Tu cuenta</h3><ul><li>Una cuenta es de <strong>una sola persona</strong>. Usa un correo tuyo y una contraseña que no uses en otro sitio, y no se la dejes a nadie.</li><li>Tú respondes de lo que se haga con tu cuenta. Si crees que alguien ha entrado en ella, cambia la contraseña y escribe al correo de contacto.</li><li>Puedes borrarla cuando quieras desde Ajustes → Datos → Borrar mi cuenta.</li><li>El titular puede suspender o borrar una cuenta que se use para romper estos términos (por ejemplo, para subir contenido ilegal o para atacar la aplicación), avisándote antes salvo que haya un motivo grave.</li></ul><h3>5. Cuánto cuesta</h3><p>Hoy la aplicación es <strong>gratuita</strong>. Si en el futuro hay una versión de pago, se avisará con antelación dentro de la app, y lo que ya tengas guardado seguirá siendo tuyo y descargable en cualquier caso.</p><p><mark class=\"lg-falta\">RELLENAR cuando haya cobro: precio, forma de pago, duración, renovación, cancelación y derecho de desistimiento de 14 días.</mark></p><h3>6. Lo que te damos</h3><p>Un permiso personal para usar la aplicación: no exclusivo, no transferible, revocable y solo para estudiar tú. No incluye poder:</p><ul><li>copiar, distribuir o vender el código, ni entero ni a trozos;</li><li>quitar el nombre, el logotipo o los avisos de autoría;</li><li>usarla para montar un servicio parecido;</li><li>entrar por donde no toca, saltarte límites o hacerle ingeniería inversa más allá de lo que la ley permita.</li></ul><p>Las condiciones completas del código están en el <span class=\"lg-ref\">archivo de licencia</span>.</p><h3>7. Lo que escribes es tuyo</h3><p>Tus apuntes, tus notas, tus archivos y tus conversaciones <strong>son tuyos</strong>. El titular no adquiere ningún derecho sobre ellos: solo los guarda donde tú decides y los envía al proveedor de IA cuando le preguntas, porque si no, no podría responderte.</p><p>No se usan para entrenar modelos, ni para publicidad, ni se enseñan a nadie.</p><h3>8. Lo que no puedes subir</h3><p>Ni contenido ilegal, ni material protegido de otros sin permiso, ni datos personales de terceros (fotos de compañeros, exámenes con nombres, informes médicos de nadie), ni nada que pueda dañar la aplicación o a quien la use.</p><p>Tú respondes de lo que subes.</p><h3>9. El profe con inteligencia artificial</h3><p>Léete el <button type=\"button\" class=\"lg-enlace\" data-lg=\"ia\">aviso sobre la IA</button>. En resumen:</p><ul><li>Es una máquina, no una persona.</li><li><strong>Puede equivocarse.</strong> Comprueba siempre las fechas, las fórmulas y cualquier cosa que te juegues.</li><li>No es asesoramiento médico, legal ni financiero, y no atiende emergencias.</li><li>Está para que aprendas y apruebes, no para hacerte los trabajos. Copiar lo que te dé y entregarlo como tuyo puede ser una falta académica en tu centro: eso es cosa tuya y de las normas de tu escuela.</li></ul><h3>10. Que funcione</h3><p>Se hace lo posible para que la aplicación esté disponible y no falle, pero no se promete que esté siempre ni que no tenga errores. Puede haber cortes por mantenimiento, por cambios o porque falle un proveedor.</p><p><strong>Haz copias.</strong> Ajustes → Datos → Descargar copia. Si borras los datos del navegador, cambias de dispositivo o se estropea, sin copia no hay vuelta atrás.</p><h3>11. Hasta cuándo</h3><p>Puedes dejar de usarla cuando quieras: borrando tu cuenta desde Ajustes → Datos o simplemente dejando de entrar. El titular puede retirar la aplicación o dejar de prestar el servicio avisando con antelación razonable dentro de la app, para que te dé tiempo a descargarte tus cosas.</p><h3>12. Responsabilidad</h3><p>El titular responde de los daños que cause por dolo o por negligencia grave, y de todo lo que la ley no permita excluir. Fuera de eso, y en la medida en que la ley lo permita, no responde de:</p><ul><li>la pérdida de datos por borrar el navegador, perder el dispositivo o no hacer copias;</li><li>las consecuencias de fiarse de un cálculo o de una respuesta del profe sin comprobarla;</li><li>los fallos de servicios de terceros de los que depende la aplicación.</li></ul><p><strong>Si eres consumidor, nada de esto te quita los derechos que te da la ley.</strong></p><h3>13. Cambios</h3><p>Estos términos se pueden cambiar. Los cambios importantes se avisan dentro de la aplicación antes de que entren en vigor. Seguir usándola después es aceptarlos.</p><h3>14. Ley y conflictos</h3><p>Se aplica la ley española. Si algo se tuerce, escribe primero al correo de contacto: casi todo se arregla así. Si no, los tribunales competentes serán los que diga la ley y, si eres consumidor, los de tu domicilio. También puedes acudir a las juntas arbitrales de consumo.</p>"},{"id":"aviso-legal","nombre":"Aviso legal","resumen":"Quién está detrás de la aplicación","titulo":"Aviso legal","html":"<p>En vigor desde el 24 de septiembre de 2026.</p><h3>Quién está detrás de GritNook</h3><ul><li><strong>Titular:</strong> Gabriel Rodríguez Blanco</li><li><strong>NIF:</strong> 09215128V</li><li><strong>Correo de contacto:</strong> gabriel_gabiz@hotmail.com</li><li><strong>Dirección de la aplicación:</strong> https://gritnook.com/</li></ul><p>Esta información se publica para cumplir el artículo 10 de la Ley 34/2002, de servicios de la sociedad de la información y de comercio electrónico.</p><p>GritNook se ofrece <strong>gratis y sin actividad comercial</strong>: no se cobra por ella, no hay publicidad y no se vende nada. Por eso aquí no figura una dirección postal. El día que la aplicación pase a ser de pago se publicará también el domicilio del titular, que es lo que exige ese artículo 10 cuando hay actividad económica. Mientras tanto, para cualquier notificación sirve el correo de contacto, que se lee y se responde.</p><h3>Qué es GritNook</h3><p>GritNook es una aplicación web para organizar los estudios: asignaturas, notas, faltas, entregas, apuntes, documentos y un profe con inteligencia artificial que explica y pregunta. Funciona dentro del navegador, sin instalar nada.</p><h3>Condiciones de uso</h3><p>El uso de la aplicación implica aceptar este aviso, los <button type=\"button\" class=\"lg-enlace\" data-lg=\"terminos\">términos de uso</button>, la <button type=\"button\" class=\"lg-enlace\" data-lg=\"privacidad\">política de privacidad</button> y el <button type=\"button\" class=\"lg-enlace\" data-lg=\"ia\">aviso sobre la inteligencia artificial</button>. Quien no esté de acuerdo, que no la use.</p><p>El titular puede cambiar, suspender o retirar la aplicación o cualquiera de sus partes, y modificar estos textos. Los cambios se publican en esta misma dirección con su fecha.</p><h3>De quién es lo que ves</h3><p>El código, el diseño, los textos, el nombre «GritNook» y su logotipo son del titular. Están publicados para poder leerlos y estudiarlos, no para copiarlos: las condiciones están en el <span class=\"lg-ref\">archivo de licencia</span> del repositorio.</p><p>La aplicación incluye piezas de otros autores —tipografías, iconos y la librería que abre los PDF— que mantienen sus propias licencias libres, detalladas en los <span class=\"lg-ref\">créditos</span>.</p><p><strong>Lo que escribe cada persona sigue siendo suyo.</strong> Los apuntes, las notas y los archivos que se suben pertenecen a quien los crea; el titular no se queda con ningún derecho sobre ellos.</p><h3>Responsabilidad</h3><p>El titular pone todo el cuidado razonable en que la aplicación funcione y en que los cálculos de notas y de faltas sean correctos, pero la aplicación se ofrece «tal cual». En concreto:</p><ul><li>Lo que calcula y lo que responde el profe es <strong>orientativo</strong>. Las normas de evaluación y de asistencia las pone cada centro, y son las que mandan.</li><li>No se garantiza que la aplicación esté disponible sin interrupciones ni que esté libre de errores.</li><li>Cada persona es responsable de guardar una copia de sus datos. La aplicación tiene un botón para descargarla en Ajustes → Datos.</li></ul><p>Nada de lo anterior limita los derechos que la ley reconoce a los consumidores.</p><h3>Enlaces a otros sitios</h3><p>Si la aplicación enlaza a páginas de terceros, el titular no responde de su contenido ni de lo que esas páginas hagan con los datos de quien las visite.</p><h3>Ley aplicable</h3><p>Se aplica la ley española. Para cualquier conflicto, las partes se someten a los juzgados que correspondan según la ley; cuando quien usa la aplicación es consumidor, los de su propio domicilio.</p><p>Quien sea consumidor y tenga una queja puede dirigirse antes al correo de contacto y, si no queda resuelta, a las juntas arbitrales de consumo.</p>"}];
const LEGAL_V = "24 de septiembre de 2026";
let lgAbierto = null;
/* la fecha en la que se aceptaron los papeles, escrita en largo */
const fechaLarga = iso => { const d = new Date(iso); return isNaN(d) ? "—" : d.toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" }); };
/* abre uno de los papeles en una ventana; funciona también en la pantalla de entrada */
function verPapel(id) {
  const d = LEGAL.find(x => x.id === id); if (!d) return;
  const dlg = $("#dlgLegal"); if (!dlg) return;
  dlg.innerHTML = `
    <div class="dlgl-cab">
      <h3>${esc(d.titulo)}</h3>
      <button type="button" class="icono-btn" data-papel-cerrar aria-label="Cerrar"><svg class="i" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <article class="lg-texto dlgl-cuerpo">${d.html}</article>`;
  dlg.onclick = e => {
    /* los enlaces de dentro de un papel llevan a otro papel, sin salir de la ventana */
    const otro = e.target.closest("[data-lg-dlg], [data-lg]");
    if (otro) { e.preventDefault(); e.stopPropagation(); verPapel(otro.dataset.lgDlg || otro.dataset.lg); return; }
    if (e.target.closest("[data-papel-cerrar]") || e.target === dlg) dlg.close();
  };
  if (!dlg.open) dlg.showModal();
  dlg.querySelector(".dlgl-cuerpo").scrollTop = 0;
}

function ajLegal() {
  const d = LEGAL.find(x => x.id === lgAbierto);
  if (d) return `
  <section class="panel lg-doc">
    <button type="button" class="btn fantasma lg-volver" data-lg-volver><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5 5 8l4.5 4.5"/></svg>Todos los papeles</button>
    <h2 class="lg-titulo">${esc(d.titulo)}</h2>
    <article class="lg-texto">${d.html}</article>
  </section>`;
  return `
  <section class="panel">
    <div class="etq">Los papeles</div>
    <p class="meta" style="margin:6px 0 16px">Lo que la ley obliga a contarte, escrito para que se entienda. Aquí está qué se guarda, qué sale fuera y con qué reglas se juega.</p>
    <div class="lg-lista">
      ${LEGAL.filter(x => x.id !== "ia" || profeActivo()).map(x => `<button type="button" class="lg-item" data-lg="${x.id}">
        <span class="lg-item-txt"><span class="lg-nombre">${esc(x.nombre)}</span><span class="lg-res">${esc(x.resumen)}</span></span>
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5 11 8l-4.5 4.5"/></svg>
      </button>`).join("")}
    </div>
    <p class="meta" style="margin:16px 0 0">Tus datos no se venden, no hay publicidad y no hay cookies. Lo puedes descargar o borrar todo en la pestaña de Datos.</p>
    ${normalizarPerfil().aceptado ? `<p class="meta" style="margin:8px 0 0">Aceptaste los términos y la privacidad el ${esc(fechaLarga(normalizarPerfil().aceptado.fecha))}, en la versión del ${esc(normalizarPerfil().aceptado.v || "—")}.</p>` : ""}
  </section>`;
}

function verErrores() {
  const dlg = $("#dlgLegal"); if (!dlg) return;
  const lista = ERRORES.slice().reverse();
  dlg.innerHTML = `
    <div class="dlgl-cab">
      <h3>Fallos apuntados</h3>
      <button type="button" class="icono-btn" data-papel-cerrar aria-label="Cerrar"><svg class="i" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="dlgl-cuerpo">
      <p class="meta" style="margin:0 0 14px">${lista.length === 1 ? "El único que hay" : "Los " + lista.length + " últimos, del más reciente al más viejo"}. Se borran al vaciar los datos del navegador.</p>
      ${lista.map(e => `<div class="err-fila">

/* ══════════════════ agenda ══════════════════
   Una sola base de datos —entregas y exámenes— con tres formas de verla:
   calendario, tablero y lista. Se añade escribiendo normal («Examen de BD el
   jueves»), se mueve arrastrando y cada cosa se abre en un panel lateral donde
   se edita todo sin botón de guardar. Además, el horario de clases y el plan de
   la semana, que sale solo. */
let agTab = "calendario", agMes = "", agPeek = null, agFiltro = { modId: "", tipo: "" };
const DIAS_ORDEN = ["lun", "mar", "mie", "jue", "vie", "sab", "dom"];
const DIAS_NOMBRE = { lun: "Lunes", mar: "Martes", mie: "Miércoles", jue: "Jueves", vie: "Viernes", sab: "Sábado", dom: "Domingo" };
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const ESTADOS = [["pendiente", "Pendiente"], ["curso", "En curso"], ["hecha", "Hecho"]];
const diaDe = iso => DIAS_ORDEN[(new Date(iso + "T12:00:00").getDay() + 6) % 7];
const sumaDias = (iso, n) => {
  const d = new Date(iso + "T12:00:00");
  if (isNaN(d.getTime())) return "";              /* sin fecha de partida no hay fecha de llegada */
  d.setDate(d.getDate() + num(n, 0));
  return hoyISO(d);
};
const lunesDe = iso => sumaDias(iso, -DIAS_ORDEN.indexOf(diaDe(iso)));
const fechaCorta = iso => mayus(new Date(iso + "T12:00:00").toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" }));
const cuandoTxt = dd => dd < 0 ? "hace " + (-dd) + " d" : dd === 0 ? "hoy" : dd === 1 ? "mañana" : "en " + dd + " días";

function normalizarAgenda() {
  if (!Array.isArray(S.examenes)) S.examenes = [];
  if (!Array.isArray(S.horario)) S.horario = [];
  S.examenes.forEach(x => { if (!Array.isArray(x.plan)) x.plan = []; });
  S.tareas.forEach(t => { if (!Array.isArray(t.sub)) t.sub = []; });
}
/* el estado de cada cosa: una entrega hecha es la marcada; un examen, el que ya tiene nota o marcaste */
function estadoDe(ref, tipo) {
  if (tipo === "entrega") return ref.hecha ? "hecha" : ref.estado === "curso" ? "curso" : "pendiente";
  if (ref.estado === "hecha" || (ref.nota !== null && ref.nota !== undefined && ref.nota !== "")) return "hecha";
  return ref.estado === "curso" ? "curso" : "pendiente";
}
function elementos() {
  normalizarAgenda();
  return S.tareas.map(t => ({ tipo: "entrega", id: t.id, ref: t, titulo: t.titulo, modId: t.modId, fecha: t.fecha || "", hora: t.hora || "", estado: estadoDe(t, "entrega") }))
    .concat(S.examenes.map(x => ({ tipo: "examen", id: x.id, ref: x, titulo: x.titulo, modId: x.modId, fecha: x.fecha || "", hora: x.hora || "", estado: estadoDe(x, "examen") })));
}
const elemento = (tipo, id) => elementos().find(e => e.tipo === tipo && e.id === id);
const filtrados = () => elementos().filter(e => (!agFiltro.modId || e.modId === agFiltro.modId) && (!agFiltro.tipo || e.tipo === agFiltro.tipo));
const examenesPendientes = () => { const hoy = hoyISO(); return elementos().filter(e => e.tipo === "examen" && e.fecha >= hoy && e.estado !== "hecha").map(e => e.ref).sort((a, b) => a.fecha.localeCompare(b.fecha)); };
const clasesDe = dia => { normalizarAgenda(); return S.horario.filter(b => b.dia === dia).sort((a, b) => a.ini.localeCompare(b.ini)); };
function ponEstado(el, est) {
  el.ref.estado = est;
  if (el.tipo === "entrega") { el.ref.hecha = est === "hecha"; el.ref.hechaEn = el.ref.hecha ? hoyISO() : ""; }
  guardar("agenda");
}
function ponFecha(el, fecha) { el.ref.fecha = fecha; guardar("agenda"); }

/* ── añadir escribiendo normal ──
   «Examen de BD el jueves a las 10», «entregar práctica 3 de programación
   mañana», «trabajo de LMSGI en 5 días». Se reconoce si es examen, de qué
   asignatura, el día y la hora; el resto se queda como título. */
const reVoz = s => new RegExp("(?<![\\p{L}\\d])(?:" + s + ")(?![\\p{L}\\d])", "iu");
const sinTildes = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const DIA_TXT = { lunes: 0, martes: 1, miercoles: 2, jueves: 3, viernes: 4, sabado: 5, domingo: 6 };
function entenderFrase(txt, base) {
  const hoy = base || hoyISO();
  let t = " " + String(txt || "") + " ", fecha = "", hora = "", tipo = "entrega", modId = "";
  const tomar = (re, fn) => { const m = t.match(re); if (!m) return false; const r = fn(m); if (r === false) return false; t = t.replace(m[0], " "); return true; };
  /* la hora, antes que las fechas para no confundir «10:30» con un día */
  tomar(reVoz("a las (\\d{1,2})(?:[:.](\\d{2}))?(?:\\s*h)?"), m => { hora = String(clamp(num(m[1]), 0, 23)).padStart(2, "0") + ":" + (m[2] || "00"); }) ||
  tomar(reVoz("(\\d{1,2})[:.](\\d{2})\\s*h?"), m => { if (num(m[1]) > 23 || num(m[2]) > 59) return false; hora = m[1].padStart(2, "0") + ":" + m[2]; });
  const conAño = (d, mes, año) => {
    let y = año ? (String(año).length === 2 ? 2000 + num(año) : num(año)) : new Date(hoy + "T12:00:00").getFullYear();
    let f = y + "-" + String(mes).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    if (!año && f < hoy) f = (y + 1) + f.slice(4);
    return isNaN(new Date(f + "T12:00:00")) ? "" : f;
  };
  const mesesRe = MESES.join("|") + "|ene|feb|mar|abr|may|jun|jul|ago|sep|sept|oct|nov|dic";
  tomar(reVoz("(?:el |para el )?(\\d{1,2})\\s+de\\s+(" + mesesRe + ")(?:\\s+de\\s+(\\d{4}))?"), m => {
    const i = MESES.findIndex(x => x.startsWith(sinTildes(m[2]).slice(0, 3)));
    fecha = i < 0 ? "" : conAño(num(m[1]), i + 1, m[3]);
  }) ||
  tomar(reVoz("(?:el |para el )?(\\d{1,2})[/-](\\d{1,2})(?:[/-](\\d{2,4}))?"), m => {
    if (num(m[2]) < 1 || num(m[2]) > 12 || num(m[1]) < 1 || num(m[1]) > 31) return false;
    fecha = conAño(num(m[1]), num(m[2]), m[3]);
  }) ||
  tomar(reVoz("(?:para )?pasado mañana"), () => { fecha = sumaDias(hoy, 2); }) ||
  tomar(reVoz("(?:para )?mañana"), () => { fecha = sumaDias(hoy, 1); }) ||
  tomar(reVoz("(?:para )?hoy"), () => { fecha = hoy; }) ||

  tomar(reVoz("(?:en|dentro de) una semana|la semana que viene|la pr[oó]xima semana"), () => { fecha = sumaDias(hoy, 7); }) ||
  tomar(reVoz("(?:para )?(?:el |este |el pr[oó]ximo |pr[oó]ximo )?(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)"), m => {

/* ── el plan de la semana ── */
function planSemana(desde) {
  normalizarAgenda();
  const p = normalizarPerfil(), hoy = hoyISO(), lunes = lunesDe(desde || hoy);
  const bloque = num(S.config.pomodoro, 25);
  const dias = (p.diasFuertes.length ? p.diasFuertes : ["lun", "mar", "mie", "jue", "vie"]).slice().sort((a, b) => DIAS_ORDEN.indexOf(a) - DIAS_ORDEN.indexOf(b));
  const total = Math.max(bloque, num(p.horasSemana, 0) * 60 || S.modulos.reduce((s, m) => s + num(m.metaSemanal) * 60, 0));
  const exs = examenesPendientes();
  const pesos = S.modulos.map(m => {
    const c = calcModulo(m), ex = exs.find(x => x.modId === m.id);
    const dd = ex ? diasEntre(ex.fecha, hoy) : 99;
    let w = Math.max(.5, num(m.metaSemanal, 1)), motivo = "";
    if (dd <= 3) { w *= 2.5; motivo = "Examen " + cuandoTxt(dd); }
    else if (dd <= 7) { w *= 1.8; motivo = "Examen " + cuandoTxt(dd); }
    else if (dd <= 14) { w *= 1.3; motivo = "Examen " + cuandoTxt(dd); }
    if (c.est === "riesgo") { w *= 1.5; motivo = motivo || "Vas justo"; }
    else if (c.est === "aviso") { w *= 1.2; motivo = motivo || "Hay que apretar"; }
    if (c.yaEsta) { w *= .5; motivo = motivo || "Ya lo tienes, repaso suave"; }
    return { m, w, motivo: motivo || "Lo que toca", examen: ex && dd <= 14 ? ex : null };
  });
  const sumaW = pesos.reduce((s, x) => s + x.w, 0) || 1, cola = [];
  pesos.forEach(x => { const n = Math.max(x.w > .4 ? 1 : 0, Math.round(total * x.w / sumaW / bloque)); for (let i = 0; i < n; i++) cola.push(x); });
  cola.sort((a, b) => b.w - a.w);
  const semana = DIAS_ORDEN.map((d, i) => ({ dia: d, fecha: sumaDias(lunes, i), libre: dias.includes(d), bloques: [] }));
  const libres = semana.filter(d => d.libre);
  if (!libres.length) return semana;
  let k = 0;
  cola.forEach(x => {
    for (let intento = 0; intento < libres.length; intento++) {
      const d = libres[(k + intento) % libres.length];
      if (x.examen && d.fecha >= x.examen.fecha) continue;
      if (d.bloques.filter(b => b.modId === x.m.id).length >= 3) continue;
      const clase = clasesDe(d.dia).some(c => c.modId === x.m.id);
      d.bloques.push({ modId: x.m.id, min: bloque, motivo: clase && !x.examen ? "Tienes clase: repasa lo de hoy" : x.motivo });
      k = (k + intento + 1) % libres.length;
      return;
    }
  });
  semana.forEach(d => {
    const hechos = {};
    d.bloques.forEach(b => {
      const estudiado = ((S.horas[b.modId] || {})[d.fecha] || 0) - (hechos[b.modId] || 0);
      b.hecho = estudiado >= b.min;
      hechos[b.modId] = (hechos[b.modId] || 0) + (b.hecho ? b.min : 0);
    });
  });
  return semana;
}
const planDeHoy = () => { const hoy = hoyISO(); return (planSemana(hoy).find(d => d.fecha === hoy) || { bloques: [] }).bloques; };

/* ── el plan hacia atrás de un examen ── */
function planExamenLocal(ex) {
  const p = normalizarPerfil(), hoy = hoyISO();
  if (!ex.fecha) return [];
  const dias = p.diasFuertes.length ? p.diasFuertes : DIAS_ORDEN.slice(0, 6);
  const fechas = [];
  for (let f = hoy; f < ex.fecha && fechas.length < 30; f = sumaDias(f, 1)) if (dias.includes(diaDe(f))) fechas.push(f);
  if (!fechas.length) return [{ id: uid(), fecha: hoy, txt: "Repaso general y un simulacro", hecho: false }];
  const temas = String(ex.temas || "").split(/\n|;/).map(t => t.trim()).filter(Boolean);
  const tareas = temas.length ? temas.map(t => "Estudiar y hacer ejercicios: " + t) : ["Leer y subrayar la teoría", "Esquema de todo el temario", "Ejercicios del tema más largo", "Ejercicios del resto"];
  if (fechas.length >= 3) { tareas.push(siProfe("Resolver dudas con el profe", "Resolver las dudas que te queden")); tareas.push("Simulacro de examen con tiempo"); }
  else tareas.push("Repaso general y un simulacro");
  const plan = [], porDia = Math.max(1, Math.ceil(tareas.length / fechas.length));
  let i = 0;
  fechas.slice(-Math.ceil(tareas.length / porDia)).forEach(f => { tareas.slice(i, i + porDia).forEach(txt => plan.push({ id: uid(), fecha: f, txt, hecho: false })); i += porDia; });
  return plan;
}
async function planExamenIA(ex, boton) {
  if (!sample) { aviso(avisoIA("El plan de examen lo puedes montar a mano en la agenda."), "mal"); return; }
  const m = modPorId(ex.modId), p = normalizarPerfil(), hoy = hoyISO();
  const dias = (p.diasFuertes.length ? p.diasFuertes : DIAS_ORDEN.slice(0, 6)).join(", ");
  if (boton) { boton.disabled = true; boton.textContent = "Preparándolo…"; }
  const q = `Eres profesor particular. Prepara un plan de estudio para este examen.
Alumno: ${[etapaDe(p.etapa).nombre, p.ciclo, p.curso].filter(Boolean).join(" · ")}. ${p.trabaja === "completa" ? "Trabaja a jornada completa." : p.trabaja === "parcial" ? "Trabaja a media jornada." : ""}
Examen: "${ex.titulo}" de ${m ? m.nombre : "su asignatura"}, el ${ex.fecha}. Hoy es ${hoy}.
Qué entra: ${ex.temas || "no lo ha especificado"}.
${m && m.temario ? "Temario de la asignatura: " + m.temario : ""}
Solo puede estudiar estos días de la semana: ${dias}. Unos ${num(S.config.pomodoro, 25) * 2} minutos por día como mucho.
Devuelve SOLO este JSON: {"plan":[{"fecha":"AAAA-MM-DD","tarea":"qué hacer ese día, concreto, en una frase"}]}
Reglas: solo fechas entre hoy y el día antes del examen, solo en los días que puede; de menos a más difícil; el último día, repaso y simulacro; como mucho 2 tareas por día.`;
  try {

      .filter(x => /^\d{4}-\d{2}-\d{2}$/.test(String(x.fecha)) && x.fecha >= hoy && x.fecha < ex.fecha && String(x.tarea || "").trim())
      .slice(0, 40).map(x => ({ id: uid(), fecha: x.fecha, txt: String(x.tarea).trim().slice(0, 160), hecho: false }));

/* ── lo que se entiende mientras escribes ── */

}
function editarPeekCampo(id, v) {

  const r = e.ref;

/* cambiar una entrega en examen o al revés: se mueve de lista conservando lo común */
function cambiarTipo(e, nuevo) {
  if (e.tipo === nuevo) return;
  const r = e.ref, comun = { titulo: r.titulo, modId: r.modId, fecha: r.fecha, hora: r.hora, estado: e.estado };
  if (nuevo === "examen") { S.tareas = S.tareas.filter(t => t.id !== r.id); agPeek = crearElemento(Object.assign(comun, { tipo: "examen" })); const ex = S.examenes.find(x => x.id === agPeek.id); ex.temas = r.notas || ""; ex.peso = r.peso; }
  else { S.examenes = S.examenes.filter(x => x.id !== r.id); agPeek = crearElemento(Object.assign(comun, { tipo: "entrega" })); const t = S.tareas.find(x => x.id === agPeek.id); t.notas = r.temas || ""; t.peso = r.peso; }
  guardar("agenda");
}

/* ── botones, teclado y arrastrar ── */
alEvento("click", async e => {

  if (t.closest("[data-cal-hoy]")) { agMes = hoyISO().slice(0, 7) + "-01"; pinta(); return; }
  const add = t.closest("[data-cal-add]");

  const cl = t.closest("[data-cal-lista]"); if (cl) { agTab = "lista"; pinta(); return; }
  const nv = t.closest("[data-tb-nuevo]");

  const pe = t.closest("[data-pk-estado]"); if (pe && agPeek) { const el = elemento(agPeek.tipo, agPeek.id); if (el) { ponEstado(el, pe.dataset.pkEstado); pinta(); } return; }
  const pp = t.closest("[data-pk-plan]");
  if (pp && agPeek) { const ex = S.examenes.find(x => x.id === agPeek.id), tt = ex && ex.plan.find(x => x.id === pp.dataset.pkPlan); if (tt) { tt.hecho = !tt.hecho; guardar("agenda"); pinta(); } return; }
  if (t.closest("[data-pk-auto]") && agPeek) { const ex = S.examenes.find(x => x.id === agPeek.id); if (ex) { ex.plan = planExamenLocal(ex); guardar("agenda"); pinta(); } return; }
  const ia = t.closest("[data-pk-ia]"); if (ia && agPeek) { const ex = S.examenes.find(x => x.id === agPeek.id); if (ex) planExamenIA(ex, ia); return; }

alEvento("input", e => {

    aviso((d.tipo === "examen" ? "Examen apuntado" : "Entrega apuntada") + (m ? " en " + m.cod : "") +
      (dd === null ? "" : dd === 0 ? " para hoy" : dd === 1 ? " para mañana" : " para el " + fechaCorta(d.fecha).toLowerCase()) + ".");
    if (d.fecha && agTab === "calendario") agMes = d.fecha.slice(0, 7) + "-01";

  if (!editando() && (e.key === "n" || e.key === "N") && !e.ctrlKey && !e.metaKey && !e.altKey) {

  const dato = e.dataTransfer.getData("text/x-agenda"), d = destinoAg(e.target); if (!dato || !d) return;

  const [tipo, id] = dato.split("|"), el = elemento(tipo, id); if (!el) return;
  if (d.dataset.tbCol) ponEstado(el, d.dataset.tbCol);
  else if (d.dataset.calDia) { ponFecha(el, d.dataset.calDia); if (el.tipo === "examen" && !el.ref.plan.some(x => x.hecho)) el.ref.plan = planExamenLocal(el.ref); }
  pinta();
});

/* ══════════════════ repaso: tarjetas y tests ══════════════════
   Tarjetas con repaso espaciado (cajas de Leitner: lo que sabes vuelve cada
   vez más tarde, lo que fallas vuelve mañana) y tests de examen. Las dos cosas
   se pueden hacer a mano o pedírselas al profe a partir de un apunte tuyo. */
const CAJAS = [0, 1, 3, 7, 14, 30];               /* días hasta volver a verla según la caja */
const TARJETAS_MAX = 1200;                          /* el documento tiene tope de tamaño */
let RP = { sesion: null, test: null, cargando: "" };

function normalizarTarjetas() { if (!Array.isArray(S.tarjetas)) S.tarjetas = []; return S.tarjetas; }
const tarjetasHoy = modId => normalizarTarjetas().filter(c => c.proximo <= hoyISO() && (!modId || c.modId === modId));
function nuevaTarjeta(modId, frente, dorso, apunteId) {
  const T2 = normalizarTarjetas();
  if (T2.length >= TARJETAS_MAX) { aviso("Has llegado a " + TARJETAS_MAX + " tarjetas: borra las que ya domines.", "mal"); return null; }
  const c = { id: uid(), modId: modId || "", apunteId: apunteId || "", frente: String(frente).trim().slice(0, 300), dorso: String(dorso).trim().slice(0, 600),
    caja: 0, proximo: hoyISO(), vistas: 0, aciertos: 0, creada: hoyISO() };
  T2.push(c); return c;
}
function responderTarjeta(c, como) {
  const hoy = hoyISO();
  c.vistas = num(c.vistas) + 1;
  if (como === "si") { c.caja = Math.min(5, num(c.caja) + 1); c.aciertos = num(c.aciertos) + 1; c.proximo = sumaDias(hoy, CAJAS[c.caja]); }
  else if (como === "duda") { c.caja = Math.max(1, num(c.caja)); c.proximo = sumaDias(hoy, 1); }
  else { c.caja = 1; c.proximo = sumaDias(hoy, 1); }
}

/* ── lo que se le pide al profe ── */
function textoParaIA(modId, apunteId) {
  const m = modPorId(modId), n = apunteId && S.apuntes[apunteId];
  const p = normalizarPerfil();
  const partes = ["Estudiante de " + [etapaDe(p.etapa).nombre, p.ciclo, p.curso].filter(Boolean).join(" · ") + ".",
    "Asignatura: " + (m ? m.nombre : "general") + "."];
  if (m && m.temario) partes.push("Temario: " + m.temario);
  const ex = examenesPendientes().find(x => x.modId === modId);
  if (ex && ex.temas) partes.push("Su próximo examen (" + ex.fecha + ") entra: " + ex.temas);
  if (n && (n.cuerpo || "").trim()) partes.push("Sus apuntes, «" + (n.titulo || "sin título") + "»:\n\"\"\"\n" + n.cuerpo.slice(0, 6000) + "\n\"\"\"");
  return partes.join("\n");
}
async function tarjetasDeIA(modId, apunteId, boton) {
  if (!sample) { aviso(avisoIA("Las tarjetas a mano funcionan igual."), "mal"); return; }
  RP.cargando = "tarjetas"; pinta();
  const q = textoParaIA(modId, apunteId) + `

Haz tarjetas de estudio (pregunta por delante, respuesta por detrás) con lo más importante${apunteId ? " de esos apuntes" : " de esa asignatura"}.
Devuelve SOLO este JSON: {"tarjetas":[{"frente":"pregunta corta y concreta","dorso":"respuesta clara en una o dos frases"}]}
Entre 6 y 15 tarjetas. Nada que no esté en ${apunteId ? "los apuntes" : "el temario"}. Español de España.`;
  try {
    const r = await sample.json(q, { modelTier: "default" });
    const lista = (r && Array.isArray(r.tarjetas) ? r.tarjetas : []).filter(x => x && String(x.frente || "").trim() && String(x.dorso || "").trim()).slice(0, 20);
    if (!lista.length) throw new Error("vacío");
    let n = 0; lista.forEach(x => { if (nuevaTarjeta(modId, x.frente, x.dorso, apunteId)) n++; });
    guardar("repaso"); aviso(n + " tarjetas nuevas. Te tocan hoy.");

async function testDeIA(modId, apunteId) {
  if (!sample) { aviso(avisoIA("Puedes repasar con tus propias tarjetas."), "mal"); return; }
  RP.cargando = "test"; pinta();
  const q = textoParaIA(modId, apunteId) + `

Ponle un test tipo examen.
Devuelve SOLO este JSON: {"preguntas":[{"pregunta":"...","opciones":["a","b","c","d"],"correcta":0,"explicacion":"por qué esa es la buena, en una frase"}]}
Entre 6 y 10 preguntas, 4 opciones cada una, una sola correcta ("correcta" es su posición, de 0 a 3), opciones creíbles y de longitud parecida, de fácil a difícil. Nada que no esté en ${apunteId ? "los apuntes" : "el temario"}. Español de España.`;
  try {
    const r = await sample.json(q, { modelTier: "default" });
    const pr = (r && Array.isArray(r.preguntas) ? r.preguntas : []).filter(x => x && String(x.pregunta || "").trim() && Array.isArray(x.opciones) && x.opciones.length >= 2)
      .slice(0, 12).map(x => ({ p: String(x.pregunta).slice(0, 400), o: x.opciones.slice(0, 5).map(o => String(o).slice(0, 200)),
        c: clamp(Math.round(num(x.correcta)), 0, Math.min(4, x.opciones.length - 1)), e: String(x.explicacion || "").slice(0, 400) }));
    if (!pr.length) throw new Error("vacío");
    RP.test = { modId, preguntas: pr, i: 0, elegida: null, bien: 0, fallos: [] };
  } catch (err) { aviso(err.code === "rate_limited" ? "Claude va saturado. Prueba en un minuto." : "No ha salido el test. Prueba otra vez.", "mal"); }
  RP.cargando = ""; pinta();
}

function rpEmpezar(modId) {
  const cola = tarjetasHoy(modId).sort((a, b) => num(a.caja) - num(b.caja) || a.proximo.localeCompare(b.proximo)).slice(0, 40);

  RP.sesion = { cola, hechas: 0, bien: 0, volteada: false, falladas: new Set() };
  irASeccion("repaso");
}
function rpResponder(como) {
  const s = RP.sesion; if (!s || !s.volteada) return;
  const c = s.cola.shift(); if (!c) return;
  if (!s.falladas.has(c.id)) { responderTarjeta(c, como); if (como === "si") s.bien++; }
  if (como === "no" && !s.falladas.has(c.id)) { s.falladas.add(c.id); s.cola.push(c); }   /* vuelve una vez al final de esta tanda */
  else s.hechas++;
  s.volteada = false;
  if (!s.cola.length) { const d = diaObj(); d.tarjetas = true; guardar("objetivos"); }
  guardar("repaso"); pinta();
}

/* ══════════════════ progreso ══════════════════
   Cómo va el curso: horas por semana y por asignatura, la nota de cada una
   contra su objetivo y cómo ha ido cambiando, y los exámenes hechos. Las notas
   se van apuntando desde que existe esta sección; las horas vienen de siempre. */
function normalizarProgreso() { if (!Array.isArray(S.progreso)) S.progreso = []; return S.progreso; }
/* guarda la media de cada asignatura cuando cambia: con eso se dibuja su evolución */
function registrarProgreso() {
  const H = normalizarProgreso(), hoy = hoyISO();
  let cambio = false;
  S.modulos.forEach(m => {
    const c = calcModulo(m); if (c.media === null) return;
    const ult = H.filter(x => x.modId === m.id).pop();
    if (ult && Math.abs(ult.media - c.media) < .005) return;
    if (ult && ult.fecha === hoy) ult.media = +c.media.toFixed(2); else H.push({ fecha: hoy, modId: m.id, media: +c.media.toFixed(2) });
    cambio = true;
  });
  if (H.length > 600) H.splice(0, H.length - 600);
  if (cambio) guardar("progreso");
}
function horasPorSemana(semanas) {
  const hoy = hoyISO(), lunes = lunesDe(hoy), filas = [];
  for (let i = semanas - 1; i >= 0; i--) {
    const ini = sumaDias(lunes, -7 * i), fila = { ini, porMod: {}, total: 0 };
    S.modulos.forEach(m => {
      let min = 0; for (let d = 0; d < 7; d++) min += (S.horas[m.id] || {})[sumaDias(ini, d)] || 0;
      if (min) { fila.porMod[m.id] = min; fila.total += min; }
    });
    filas.push(fila);
  }
  return filas;
}
function vistaProgreso() {
  const filas = horasPorSemana(8), maxMin = Math.max(60, ...filas.map(f => f.total));
  const totalCurso = Object.values(S.horas || {}).reduce((s, o) => s + Object.values(o || {}).reduce((a, b) => a + num(b), 0), 0);
  const medias = S.modulos.map(m => ({ m, c: calcModulo(m) })), conNota = medias.filter(x => x.c.media !== null);
  const mediaGeneral = conNota.length ? conNota.reduce((s, x) => s + x.c.media, 0) / conNota.length : null;
  const exHechos = (S.examenes || []).filter(x => x.nota !== null && x.nota !== undefined);
  const T2 = normalizarTarjetas(), H = normalizarProgreso();
  /* el gráfico de horas: barras apiladas por asignatura, 2 px de hueco entre tramos */
  const alto = 150, ancho = 560, hueco = 18, barra = (ancho - hueco * (filas.length - 1)) / filas.length;
  const barras = filas.map((f, i) => {
    const x = i * (barra + hueco); let y = alto;
    const tramos = S.modulos.filter(m => f.porMod[m.id]).map(m => {
      const h = Math.max(2, f.porMod[m.id] / maxMin * (alto - 8)); y -= h;
      const r = `<rect x="${x.toFixed(1)}" y="${(y + 1).toFixed(1)}" width="${barra.toFixed(1)}" height="${Math.max(1, h - 2).toFixed(1)}" rx="2" fill="var(--c)" style="${colorMod(m)}"
        data-tip="${esc(m.cod + " · " + horasTxt(f.porMod[m.id]) + " · semana del " + fechaCorta(f.ini).toLowerCase())}"></rect>`;
      return r;
    }).join("");
    return tramos + `<text x="${(x + barra / 2).toFixed(1)}" y="${alto + 16}" text-anchor="middle" class="pg-eje">${new Date(f.ini + "T12:00:00").getDate()}/${new Date(f.ini + "T12:00:00").getMonth() + 1}</text>`;
  }).join("");
  return `
  <header class="cab">
    <div>
      <div class="eyebrow">Tu curso</div>
      <h1 class="titulo">Progreso</h1>
      <p class="lead">Las horas que le echas, cómo van tus notas contra tu objetivo y lo que ya has dejado atrás.</p>
    </div>
  </header>
  <div class="pg-datos">
    <div class="panel"><span class="cifra">${horasTxt(totalCurso)}</span><span class="meta">Estudiadas en total</span></div>
    <div class="panel"><span class="cifra">${mediaGeneral === null ? "—" : nota(mediaGeneral)}</span><span class="meta">Media de lo que tiene nota</span></div>
    <div class="panel"><span class="cifra">${racha()}</span><span class="meta">Días seguidos</span></div>
    <div class="panel"><span class="cifra">${exHechos.length}</span><span class="meta">Exámenes hechos</span></div>
    <div class="panel"><span class="cifra">${T2.filter(c => c.caja >= 4).length}</span><span class="meta">Tarjetas dominadas</span></div>
  </div>
  <div class="rejilla-12">
    <section class="panel c-7">
      <div class="panel-cab"><h2 class="etq">Horas por semana</h2><span class="meta">Últimas 8</span></div>
      ${filas.some(f => f.total) ? `<div class="pg-grafico" id="pgGrafico"><svg viewBox="0 0 ${ancho} ${alto + 22}" role="img" aria-label="Horas de estudio por semana y ${esc(voc())}">${barras}</svg><div class="pg-tip" id="pgTip" hidden></div></div>
      <div class="pg-leyenda">${S.modulos.filter(m => filas.some(f => f.porMod[m.id])).map(m => `<span style="${colorMod(m)}"><i></i>${esc(m.cod)}</span>`).join("")}</div>

        : `<p class="vacio">Cuando estudies con el cronómetro, aquí verás tus semanas.</p>`}
    </section>
    <section class="panel c-5">
      <div class="panel-cab"><h2 class="etq">Notas contra tu objetivo</h2></div>
      ${medias.map(({ m, c }) => {
        const pts = H.filter(x => x.modId === m.id).slice(-12);
        const spark = pts.length >= 2 ? `<svg class="pg-spark" viewBox="0 0 60 20" aria-hidden="true"><polyline fill="none" stroke="var(--c)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
          points="${pts.map((x, i) => (i / (pts.length - 1) * 58 + 1).toFixed(1) + "," + (19 - x.media / 10 * 18).toFixed(1)).join(" ")}"/></svg>` : "";
        return `<div class="pg-nota" style="${colorMod(m)}">
          <span class="codigo" style="${colorMod(m)}">${esc(m.cod)}</span>
          <div class="pg-barra"><i style="width:${c.media === null ? 0 : c.media * 10}%"></i><b style="left:${num(m.objetivo, 5) * 10}%" title="Objetivo ${nota(num(m.objetivo, 5))}"></b></div>
          <span class="num pg-v">${c.media === null ? "—" : nota(c.media)}</span>${spark}</div>`;
      }).join("")}
      <p class="meta" style="margin-top:10px">La raya marca tu objetivo. La línea pequeña es cómo ha ido cambiando la nota desde que la apuntas.</p>
    </section>
    ${exHechos.length ? `<section class="panel c-12">
      <div class="panel-cab"><h2 class="etq">Exámenes</h2></div>

        <span class="principal-fila"><span class="t">${esc(x.titulo)}</span><span class="meta">${fechaCorta(x.fecha)}</span></span>
        <span class="cifra pg-exnota">${nota(x.nota)}</span></div>`; }).join("")}
    </section>` : ""}
  </div>`;
}

alEvento("mousemove", e => {
  const tip = $("#pgTip"); if (!tip) return;
  const r = e.target.closest && e.target.closest("rect[data-tip]");
  if (!r) { tip.hidden = true; return; }
  const caja = $("#pgGrafico").getBoundingClientRect();
  tip.textContent = r.dataset.tip; tip.hidden = false;
  tip.style.left = Math.min(caja.width - 180, Math.max(0, e.clientX - caja.left + 12)) + "px";
  tip.style.top = Math.max(0, e.clientY - caja.top - 34) + "px";
});

/* ══════════════════ instalable ══════════════════
   Fuera de Claude (GitHub Pages o en local) la app se instala en el móvil como
   una más y funciona sin conexión. Dentro de Claude no: allí no se pueden
   registrar service workers, y tampoco hace falta. */
(function instalable() {
  if (!("serviceWorker" in navigator) || !/^(localhost|127\.0\.0\.1|[\w-]+\.github\.io|(www\.)?gritnook\.com)$/.test(location.hostname)) return;
  const pon = (tag, attrs) => { const el = document.createElement(tag); Object.assign(el, attrs); document.head.appendChild(el); };
  pon("link", { rel: "manifest", href: "manifest.webmanifest" });
  pon("link", { rel: "apple-touch-icon", href: "iconos/icono-180.png" });
  pon("meta", { name: "theme-color", content: "#161826" });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
