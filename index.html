    + item("ajustes", "Ajustes", iconoRiel("ajustes", seccion === "ajustes"));
}

/* ── móvil: la hoja de «Más» en filas, con su dato al día como el panel ── */
const CHEVRON = '<svg class="i hm-chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>';
function metaMas(id, c) {
  const hoy = hoyISO();
  if (id === "modulos") return S.modulos.length + " este curso" + (c.modulos ? " · " + c.modulos + " en riesgo" : "");
  if (id === "repaso") return (S.tarjetas || []).length ? (c.repaso || 0) + " para hoy" : "Sin tarjetas todavía";
  if (id === "progreso") return horasTxt(S.modulos.reduce((t, m) => t + minutosSemana(m.id), 0)) + " esta semana · racha de " + racha() + (racha() === 1 ? " día" : " días");
  if (id === "casillero") { const n = Object.keys(S.casillero).length; return n ? n + (n === 1 ? " documento" : " documentos") : "Nada guardado todavía"; }
  if (id === "ingles") { const v = S.vocab || []; return v.length ? v.filter(x => !x.proximo || x.proximo <= hoy).length + " palabras para hoy" : "Sin palabras todavía"; }
  if (id === "ajustes") return "Perfil, colores, profe y datos";
  return "";
}
const filaMas = (id, c) => `<button type="button" class="hm-fila" data-sec="${id}" aria-current="${seccion === id ? "page" : "false"}">
  ${iconoRiel(id, seccion === id)}<span class="hm-txt"><span class="hm-t">${esc(nombreSec(id))}</span><span class="hm-m">${esc(metaMas(id, c))}</span></span>
  ${c[id] ? `<b class="hm-cuenta">${c[id]}</b>` : ""}${CHEVRON}</button>`;

/* piezas del panel */
const pnCab = (tit, sub, accion) => `<div class="pn-cab"><div><h2 class="pn-tit">${esc(tit)}</h2>${sub ? `<div class="pn-sub">${esc(sub)}</div>` : ""}</div>${accion || ""}</div>`;
const pnAccion = (sel, txt) => `<button type="button" class="pn-accion" data-pn-clic="${sel}" aria-label="${esc(txt)}" title="${esc(txt)}">${icono("mas")}</button>`;
const pnGrupo = t => `<div class="pn-grupo">${esc(t)}</div>`;
const pnVacio = t => `<p class="pn-vacio">${esc(t)}</p>`;
const pnDot = m => `<span class="pn-dot" style="${m ? colorMod(m) : "--c:var(--ink-4)"}" aria-hidden="true"></span>`;
const pnFila = (attrs, izq, t, m, activo, texto) => `<button type="button" class="pn-fila"${attrs}${activo ? ' aria-current="true"' : ""}${texto ? ` data-pn-texto="${esc(sinTildes(texto))}"` : ""}>${izq}<span class="pn-txt"><span class="pn-t">${esc(t)}</span>${m ? `<span class="pn-m">${esc(m)}</span>` : ""}</span></button>`;
const pnDato = (k, v) => `<div class="pn-dato"><span>${esc(k)}</span><b>${esc(v)}</b></div>`;
const pnCuando = e => e.fecha ? cuandoTxt(diasEntre(e.fecha, hoyISO())) : "Sin fecha";
function pnElemento(e) {
  const m = modPorId(e.modId);
  const meta = [e.tipo === "examen" ? "Examen" : "Entrega", m && m.cod, mayus(pnCuando(e)) + (e.hora ? " a las " + e.hora : "")].filter(Boolean).join(" · ");
  return pnFila(` data-pn-peek="${e.tipo}:${e.id}"`, pnDot(m), e.titulo || (e.tipo === "examen" ? "Examen" : "Sin título"), meta);
}

function panelHTML(c) {
  const hoy = hoyISO();
  const pend = () => elementos().filter(e => e.estado !== "hecha")
    .sort((a, b) => (a.fecha || "9999").localeCompare(b.fecha || "9999") || (a.hora || "").localeCompare(b.hora || ""));

  if (seccion === "escritorio") {
    const prox = pend().filter(e => e.fecha).slice(0, 5);
    const clases = clasesDe(diaDe(hoy));
    return pnCab("Inicio", fechaCorta(hoy))
      + pnGrupo("Lo próximo") + (prox.length ? prox.map(pnElemento).join("") : pnVacio("Nada a la vista. Apunta entregas y exámenes en la Agenda."))
      + (clases.length ? pnGrupo("Clases de hoy") + clases.map(b => { const m = modPorId(b.modId); return pnFila(' data-sec="entregas"', pnDot(m), m ? m.nombre : (b.titulo || "Clase"), b.ini + (b.fin ? " – " + b.fin : "")); }).join("") : "")
      + pnGrupo("Tu tutor") + tutorCarta(c);
  }
  if (seccion === "modulos") {
    return pnCab(voc(true, true), S.modulos.length + " este curso" + (c.modulos ? " · " + c.modulos + " en riesgo" : ""),
        `<button type="button" class="pn-accion" data-md-nuevo aria-label="Añadir ${voc()}" title="Añadir ${voc()}">${icono("mas")}</button>`)
      + (modAbierto ? pnFila(" data-md-lista", "", "Todas", "Resumen del curso") : "")
      + (S.modulos.length ? S.modulos.map(m => { const k = calcModulo(m);
          return pnFila(` data-editar-mod="${m.id}"`, pnDot(m), m.nombre, [m.cod, k.media === null ? "" : "Media " + nota(k.media), k.txt].filter(Boolean).join(" · "), m.id === modAbierto); }).join("")
        : pnVacio("Aún no hay " + voc(true) + "."));
  }
  if (seccion === "entregas") {
    const p = pend(), en7 = sumaDias(hoy, 6);
    const grupos = [["Atrasado", p.filter(e => e.fecha && e.fecha < hoy)], ["Esta semana", p.filter(e => e.fecha >= hoy && e.fecha <= en7)],
      ["Más adelante", p.filter(e => e.fecha > en7)], ["Sin fecha", p.filter(e => !e.fecha)]].filter(g => g[1].length);
    return pnCab("Agenda", p.length ? p.length + (p.length === 1 ? " cosa pendiente" : " cosas pendientes") : "Todo al día", pnAccion("#agRapido", "Añadir a la agenda"))
      + (grupos.length ? grupos.map(([t, l]) => pnGrupo(t) + l.slice(0, 8).map(pnElemento).join("")).join("") : pnVacio("No tienes nada pendiente."));
  }
  if (seccion === "apuntes") {
    const lista = Object.values(S.apuntes).sort((a, b) => (b.editado || "").localeCompare(a.editado || ""));
    return pnCab("Apuntes", lista.length + (lista.length === 1 ? " apunte" : " apuntes"), pnAccion("#btnNuevoApunte", "Nuevo apunte"))
      + (lista.length ? `<input type="search" class="pn-buscar" id="pnBuscar" placeholder="Buscar apunte" aria-label="Buscar apunte" autocomplete="off">` : "")
      + (lista.length ? lista.map(n => { const m = modPorId(n.modId);
          return pnFila(` data-apunte="${n.id}"`, pnDot(m), n.titulo || "Sin título", [m && m.cod, n.editado ? fechaCorta(n.editado.slice(0, 10)) : ""].filter(Boolean).join(" · "),
            n.id === apunteActivo, (n.titulo || "") + " " + (m ? m.cod + " " + m.nombre : "") + " " + (n.tags || []).join(" ")); }).join("")
          + `<p class="pn-vacio" id="pnSinResultados" hidden>Nada coincide con esa búsqueda.</p>`
        : pnVacio("Todavía no hay apuntes. Crea el primero con el botón +."));
  }
  if (seccion === "repaso") {
    const tj = S.tarjetas || [];
    const porMod = S.modulos.map(m => ({ m, total: tj.filter(t => t.modId === m.id).length, hoy: tj.filter(t => t.modId === m.id && t.proximo <= hoy).length })).filter(x => x.total);
    return pnCab("Repaso", tj.length ? (c.repaso || 0) + " para hoy · " + tj.length + " tarjetas" : "Sin tarjetas todavía")
      + (porMod.length ? pnGrupo("Por " + voc()) + porMod.map(x => pnFila(' data-sec="repaso"', pnDot(x.m), x.m.nombre, (x.hoy ? x.hoy + " para hoy · " : "") + x.total + (x.total === 1 ? " tarjeta" : " tarjetas"))).join("")
        : pnVacio("Crea tarjetas desde un apunte o pídeselas al profe: cada día te toca repasar solo las que estás a punto de olvidar."));
  }
  if (seccion === "progreso") {
    const filas = S.modulos.map(m => ({ m, hecho: minutosSemana(m.id), meta: num(m.metaSemanal) * 60 }));
    const hecho = filas.reduce((s, f) => s + f.hecho, 0), meta = filas.reduce((s, f) => s + f.meta, 0);
    return pnCab("Progreso", "Esta semana")
      + pnDato("Estudiado", horasTxt(hecho) + (meta ? " de " + horasTxt(meta) : "")) + pnDato("Racha", racha() + (racha() === 1 ? " día" : " días"))
      + pnGrupo("Por " + voc()) + filas.map(f => `<button type="button" class="pn-fila" data-sec="progreso">${pnDot(f.m)}<span class="pn-txt"><span class="pn-t">${esc(f.m.nombre)}</span>
          <span class="pn-m">${esc(horasTxt(f.hecho) + (f.meta ? " de " + horasTxt(f.meta) : ""))}</span>
          ${f.meta ? `<span class="pn-barra" style="${colorMod(f.m)}"><i style="width:${Math.min(100, Math.round(f.hecho / f.meta * 100))}%"></i></span>` : ""}</span></button>`).join("");
  }
  if (seccion === "casillero") {
    const docs = Object.values(S.casillero).sort((a, b) => (b.creado || "").localeCompare(a.creado || ""));
    const hoy = hoyISO(), en7 = sumaDias(hoy, 7), pronto = [];
    elementos().filter(e => e.estado !== "hecha" && e.fecha && e.fecha >= hoy && e.fecha <= en7 && modPorId(e.modId))
      .sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(e => { if (!pronto.some(p => p.modId === e.modId)) pronto.push(e); });
    const mini = d => { const s = hojaTipo(d) === "Foto" ? srcDoc(d) : d.mini;
      return s ? `<span class="pn-mini"><img src="${esc(s)}" alt=""></span>` : `<span class="pn-mini">${ICO_TIPO[hojaTipo(d)]}</span>`; };
    return pnCab("Casillero", docs.length ? docs.length + (docs.length === 1 ? " hoja guardada" : " hojas guardadas") : "Aún vacío")
      + (libroAbierto || casTipo ? pnFila(" data-cas-volver", "", "Todas las libretas", "La estantería") : "")
      + (docs.length ? `<input type="search" class="pn-buscar" id="pnBuscar" placeholder="Buscar en tus libretas" aria-label="Buscar en tus libretas" autocomplete="off">`
        + docs.map(d => { const m = modPorId(d.modId);
            return pnFila(` data-libro="${m ? m.id : SUELTOS}" data-doc="${d.id}" data-pn-resultado hidden`, pnDot(m), d.titulo || "Documento",
              [m && m.cod, hojaTipo(d)].filter(Boolean).join(" · "), false, (d.titulo || "") + " " + (m ? m.cod + " " + m.nombre : "") + " " + hojaTipo(d)); }).join("")
        + `<p class="pn-vacio" id="pnSinResultados" hidden>Nada coincide con esa búsqueda.</p>` : "")
      + pnGrupo("Por tipo") + `<div class="pn-tipos">${Object.keys(TIPOS_CAS).map(k => { const n = docs.filter(d => hojaTipo(d) === k).length;
          return `<button type="button" class="pn-tipo" data-cas-tipo="${k}" aria-pressed="${casTipo === k}"${n ? "" : " disabled"}>${ICO_TIPO[k]}<span>${TIPOS_CAS[k]}</span><b>${n}</b></button>`; }).join("")}</div>`
      + (pronto.length ? pnGrupo("Para esta semana") + pronto.slice(0, 4).map(e => { const m = modPorId(e.modId);
          return pnFila(` data-libro="${m.id}"`, pnDot(m), m.nombre, (e.tipo === "examen" ? "Examen " : "Entrega ") + pnCuando(e) + " · " + hojasTxt(docsDe(m.id).length).toLowerCase(), m.id === libroAbierto); }).join("") : "")
      + (docs.length ? pnGrupo("Lo último") + docs.slice(0, 3).map(d => { const m = modPorId(d.modId);
          return `<button type="button" class="pn-fila pn-ult" data-libro="${m ? m.id : SUELTOS}" data-doc="${d.id}">${mini(d)}<span class="pn-txt"><span class="pn-t">${esc(d.titulo || "Documento")}</span><span class="pn-m">${esc([m && m.cod, hojaTipo(d)].filter(Boolean).join(" · "))}</span></span></button>`; }).join("")
        : pnVacio("Guarda aquí lo que te dan en clase: fotos de la pizarra, PDF, ejercicios o enlaces."))
      + (casUso && casUso.maxBytes ? pnGrupo("Espacio") + `<div class="pn-espacio"><div class="pn-barra"><i style="width:${clamp(casUso.bytes / casUso.maxBytes * 100, 0, 100)}%"></i></div>
          <span class="pn-m">${mb(casUso.bytes)} de ${mb(casUso.maxBytes)}</span></div>` : "");
  }
  if (seccion === "ingles") {
    const v = S.vocab || [], rep = v.filter(x => !x.proximo || x.proximo <= hoy).length;
    return pnCab("Inglés", v.length + (v.length === 1 ? " palabra" : " palabras"))
      + pnDato("Para repasar hoy", String(rep))
      + (v.length ? pnGrupo("Las últimas") + v.slice(-8).reverse().map(x => pnFila(' data-sec="ingles"', "", x.en || "—", x.es || "")).join("") : pnVacio("Apunta las palabras técnicas que te encuentres y repásalas aquí."));
  }
  if (seccion === "tutor") {
    const pr = normalizarPerfil(), nombre = pr.profe.nombre || "Profe";
    const pedir = ["Explícame lo que dimos hoy", "Hazme un test rápido de lo que peor llevo", "Revisa mi código", "¿Qué me toca estudiar esta semana?"];
    return pnCab(nombre, "Tu tutor de " + (S.config.curso || "tu curso"))
      + pnVacio("Te da pistas antes que la respuesta, sabe lo que ya has visto y puede ponerte repasos y tareas.")
      + pnGrupo("Pídele") + pedir.map(t => pnFila(` data-pn-pedir="${esc(t)}"`, "", t, "")).join("");
  }
  if (seccion === "ajustes") {
    return pnCab("Ajustes", "")
      + ajTabs().map(([id, t]) => pnFila(` data-pn-aj="${id}"`, "", t, "", ajTab === id)).join("");
  }
  return "";
}

/* acciones del panel */
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest(".cm-logo")) { irASeccion("escritorio"); return; }
  const pk = t.closest("[data-pn-peek]"); if (pk) { const [tipo, id] = pk.dataset.pnPeek.split(":"); abrirPeek(tipo, id); return; }
  const cl = t.closest("[data-pn-clic]");
  if (cl) { const el = $(cl.dataset.pnClic); if (el) { if (el.matches("input, textarea")) { el.focus(); el.scrollIntoView({ block: "center" }); } else el.click(); } return; }
  if (t.closest("[data-md-lista]")) { modAbierto = null; pinta(); window.scrollTo({ top: 0 }); return; }
  const aj = t.closest("[data-pn-aj]"); if (aj) { ajTab = aj.dataset.pnAj; pinta(); return; }
  const pd = t.closest("[data-pn-pedir]");
  if (pd) { const ta = $("#chatTexto"); if (ta) { ta.value = pd.dataset.pnPedir; ta.focus(); ta.dispatchEvent(new Event("input", { bubbles: true })); } return; }
});
document.addEventListener("input", e => {
  if (e.target.id !== "pnBuscar") return;
  const q = sinTildes(e.target.value.trim());
  let vistos = 0;
  document.querySelectorAll("#nav [data-pn-texto]").forEach(f => {
    const res = f.hasAttribute("data-pn-resultado");
    f.hidden = res ? !q || !f.dataset.pnTexto.includes(q) : !!q && !f.dataset.pnTexto.includes(q);
    if (!f.hidden) vistos++;
  });
  const sr = $("#pnSinResultados"); if (sr) sr.hidden = vistos > 0 || !q;
});
$("#riel").addEventListener("click", e => { const b = e.target.closest("[data-sec]"); if (b) irASeccion(b.dataset.sec); });
/* en el riel, arriba y abajo recorren las secciones */
$("#riel").addEventListener("keydown", e => {
  const orden = SECCIONES.map(s => s.id);
  const mov = { ArrowDown: 1, ArrowUp: -1, Home: "inicio", End: "fin" }[e.key];
  if (mov === undefined) return;
  e.preventDefault();
  const i = Math.max(0, orden.indexOf(seccion));
  const d = mov === "inicio" ? 0 : mov === "fin" ? orden.length - 1 : clamp(i + mov, 0, orden.length - 1);
  irASeccion(orden[d], "nav");
});
/* enlaces directos: #sec=entregas abre esa sección y #mas la hoja de «Más» del móvil */
function irAlEnlace() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("sec=") && SECCIONES.some(x => x.id === h.slice(4))) irASeccion(h.slice(4));
  else if (h === "mas" && getComputedStyle($("#barraMovil")).display !== "none") setTimeout(abrirHojaMas, 60);
}
window.addEventListener("hashchange", irAlEnlace);
setTimeout(irAlEnlace, 0);

/* ══════════════════ arranque ══════════════════ */
(function inicio() {
  const tg = leeLS("tema");
  if (tg === "dark" || tg === "light") document.documentElement.setAttribute("data-theme", tg);
  pintaBotonTema();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", pintaBotonTema);
  cargarLocal(); cargarTimer(); migrarConfig(); migrarPerfil();
  if (!T.modId && S.modulos[0]) T.modId = S.modulos[0].id;
  tutorMirar();
  pinta();
  if (T.pendienteFin) { T.pendienteFin = false; terminarFase(); }
  /* primera vez: se monta el curso antes de nada */
  if (!normalizarPerfil().listo) bvAbrir(false);
  else registrarProgreso();
  setInterval(() => { if (seccion === "escritorio" && !T.activo) pintaReloj(); }, 30000);
  if (window.claude && typeof claude.use === "function") conectar();
  else marcaSync("Este dispositivo", false);
})();
</script>
